<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rune Realms</title>
<style>
:root{--ink:#3b2a5a;--card:#fffdf6;--pink:#ff6b8b;--blue:#4d9bff;--green:#35c46b;--gold:#ffb627;--bg1:#bfe9ff;--bg2:#fff3c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:manipulation}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));overflow:auto}
.screen.on{display:flex}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(59,42,90,.15),0 14px 30px rgba(59,42,90,.12);width:100%;max-width:460px;margin:auto 0}
h1{margin:0;font-size:clamp(34px,9vw,52px);text-align:center;line-height:1;color:#7a4dff;text-shadow:0 3px 0 #fff,0 6px 0 rgba(122,77,255,.25)}
h2{margin:0 0 10px;text-align:center;font-size:24px}
.tag{text-align:center;margin:8px 0 14px;font-weight:700;opacity:.8}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:16px;padding:12px 18px;color:#fff;background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.22);cursor:pointer;width:100%;margin:6px 0;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.g{background:var(--green)}.btn.p{background:var(--pink)}.btn.o{background:var(--gold);color:#3b2a5a}.btn.w{background:#fff;color:var(--ink);border:3px solid #e6dcff}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.av{width:46px;height:46px;border-radius:14px;border:3px solid #e6dcff;background:#fff;font-size:26px;cursor:pointer;position:relative;padding:0}
.av.sel{border-color:var(--pink);background:#ffeef3;transform:scale(1.08)}
.av.lock{opacity:.4}.av.lock::after{content:"🔒";position:absolute;right:-4px;bottom:-4px;font-size:15px}
input[type=text]{font:inherit;font-weight:700;font-size:18px;width:100%;padding:10px 14px;border-radius:14px;border:3px solid #e6dcff;background:#fff;color:var(--ink);text-align:center}
.xp{height:14px;border-radius:9px;background:#e9e1ff;overflow:hidden;margin:6px 0 2px}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));width:0}
.small{font-size:13px;opacity:.75;text-align:center}
select{font:inherit;font-weight:700;border-radius:12px;border:3px solid #e6dcff;padding:6px 10px;background:#fff;color:var(--ink)}
.seg{display:flex;gap:6px;justify-content:center}.seg button{font:inherit;font-weight:800;flex:1;border:3px solid #e6dcff;background:#fff;border-radius:12px;padding:8px 4px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}.seg button:disabled{opacity:.5}
.lbl{font-weight:800;margin:12px 0 4px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;font-size:26px;font-weight:900}.stepper button{width:44px;height:44px;border-radius:14px;border:0;background:var(--pink);color:#fff;font-size:26px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}.stepper button:disabled{opacity:.4}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pl{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 10px;border-left:8px solid #ccc;font-weight:800}
.pl .e{font-size:26px}.pl small{margin-left:auto;opacity:.6}
.code{font-size:44px;font-weight:900;letter-spacing:6px;text-align:center;color:#7a4dff;background:#f3edff;border-radius:16px;padding:6px;margin:6px 0}
.msg{min-height:22px;text-align:center;font-weight:700;color:#d6336c}
/* game */
#sGame{padding:0;align-items:stretch}
#top{display:flex;gap:8px;align-items:center;padding:max(6px,env(safe-area-inset-top)) 8px 4px;background:rgba(255,253,246,.85);flex-wrap:wrap}
.pill{background:#fff;border-radius:14px;padding:4px 10px;font-weight:900;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
#chips{display:flex;gap:6px;overflow-x:auto;padding:4px 8px;background:rgba(255,253,246,.6)}
.chip{display:flex;align-items:center;gap:4px;border-radius:12px;padding:2px 8px;background:#fff;font-weight:800;font-size:13px;border-bottom:4px solid #ccc;white-space:nowrap}
.chip.dead{opacity:.35;text-decoration:line-through}.chip.me{outline:3px solid #fff;box-shadow:0 0 0 3px #7a4dff}
#cvw{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#info{display:none;background:rgba(255,253,246,.96);padding:8px 10px;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800;border-top:3px solid #e6dcff}
#info.on{display:flex}#info .grow{flex:1;min-width:150px}
#info button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:8px 12px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}
#bUp{background:var(--green)}#bSell{background:var(--pink)}#info button:disabled{opacity:.4}
#pal{display:flex;gap:6px;overflow-x:auto;padding:6px 8px max(8px,env(safe-area-inset-bottom));background:rgba(255,253,246,.96)}
.pb{flex:0 0 auto;min-width:62px;border:3px solid #e6dcff;background:#fff;border-radius:14px;padding:3px 4px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.pb .e{font-size:24px}.pb .n{font-size:10px}.pb .c{font-size:12px;color:#b57600}
.pb.sel{border-color:var(--pink);background:#ffeef3;transform:translateY(-3px)}.pb.poor{opacity:.45}
#toast{position:fixed;left:50%;top:max(70px,env(safe-area-inset-top));transform:translateX(-50%);background:#3b2a5a;color:#fff;padding:8px 16px;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;text-align:center;max-width:92vw}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(59,42,90,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.on{display:flex}
.modal .card{max-height:90vh;overflow:auto}
.modal li{margin:8px 0;font-weight:700}
.big{font-size:40px;font-weight:900;text-align:center;margin:6px 0}
table{width:100%;border-collapse:collapse;margin:8px 0}td{padding:5px 4px;font-weight:800;border-bottom:2px solid #f0eaff}td:last-child{text-align:right}
</style>
</head>
<body>
<div id="app">

<section id="sMenu" class="screen on">
  <div class="card">
    <h1>🏰 <span data-i="title"></span></h1>
    <div class="tag" data-i="tag"></div>
    <div class="small" data-i="pickAv"></div>
    <div class="avs" id="avs"></div>
    <input type="text" id="pname" maxlength="12" data-ph="yourName">
    <div class="xp"><i id="xpbar"></i></div>
    <div class="small" id="lvtxt"></div>
    <button class="btn g" id="bPlay" data-i="play"></button>
    <button class="btn p" id="bOnline" data-i="online"></button>
    <button class="btn w" id="bHow" data-i="howto"></button>
    <div class="row" style="margin-top:6px"><select id="selLang"></select><button class="btn w" id="bMute" style="width:auto;padding:6px 14px;font-size:20px"></button></div>
    <div class="small" id="stat" style="margin-top:6px"></div>
  </div>
</section>

<section id="sLobby" class="screen">
  <div class="card">
    <h2 data-i="online"></h2>
    <button class="btn g" id="bCreate" data-i="create"></button>
    <div class="lbl" data-i="enterCode"></div>
    <input type="text" id="joinCode" maxlength="5" style="text-transform:uppercase;letter-spacing:6px;font-size:26px">
    <button class="btn o" id="bJoin" data-i="join"></button>
    <div class="msg" id="lobMsg"></div>
    <button class="btn w" id="bLobBack" data-i="back"></button>
  </div>
</section>

<section id="sRoom" class="screen">
  <div class="card">
    <h2 data-i="setup"></h2>
    <div id="codeBox" hidden>
      <div class="small" data-i="roomCode"></div><div class="code" id="roomCode">-----</div>
      <button class="btn w" id="bCopy" data-i="copyLink" style="font-size:15px;padding:8px"></button>
    </div>
    <div class="lbl" data-i="players"></div>
    <div class="plist" id="plist"></div>
    <div class="lbl" data-i="bots"></div>
    <div class="stepper"><button id="botM">−</button><span id="botN">3</span><button id="botP">+</button></div>
    <div class="lbl" data-i="diff"></div>
    <div class="seg" id="segDiff"><button data-v="0" data-i="easy"></button><button data-v="1" data-i="medium"></button><button data-v="2" data-i="hard"></button></div>
    <div class="lbl" data-i="size"></div>
    <div class="seg" id="segSize"><button data-v="0" data-i="small"></button><button data-v="1" data-i="mid"></button><button data-v="2" data-i="large"></button></div>
    <div class="msg" id="roomMsg"></div>
    <button class="btn g" id="bStart" data-i="start"></button>
    <button class="btn w" id="bRoomBack" data-i="back"></button>
  </div>
</section>

<section id="sGame" class="screen">
  <div id="top">
    <button class="pill" id="bMenu" style="border:0;cursor:pointer">☰</button>
    <span class="pill">🪙 <b id="hGold">0</b> <small id="hInc"></small></span>
    <span class="pill">🗺️ <b id="hLand">0%</b></span>
    <span class="pill" id="hBoost" hidden></span>
  </div>
  <div id="chips"></div>
  <div id="cvw"><canvas id="cv"></canvas></div>
  <div id="info"><div class="grow" id="infoTxt"></div><button id="bUp"></button><button id="bSell"></button></div>
  <div id="pal"></div>
</section>

<section id="sEnd" class="screen">
  <div class="card">
    <div class="big" id="endTitle"></div>
    <table id="endTbl"></table>
    <div class="small" id="endXp"></div>
    <button class="btn g" id="bAgain" data-i="again"></button>
    <button class="btn w" id="bToMenu" data-i="toMenu"></button>
  </div>
</section>

<div class="modal" id="how"><div class="card"><h2 data-i="howto"></h2><ul id="howList" style="padding-left:20px"></ul><button class="btn g" id="bHowClose" data-i="close"></button></div></div>
<div id="toast"></div>
</div>

/* ================= map generation ================= */
function genMap(w,h,n){
 const N=w*h;
 for(let att=0;att<40;att++){
  const terr=new Uint8Array(N);
  const nb=Math.round(N/20);
  for(let k=0;k<nb;k++){const cx=rf()*w,cy=rf()*h,r=.7+rf()*1.5,ty=rf()<.55?1:2;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(Math.hypot(x-cx,y-cy)<r)terr[y*w+x]=ty}
  const starts=[],ccx=(w-1)/2,ccy=(h-1)/2,off=rf()*6.283;
  for(let i=0;i<n;i++){const a=n===2?i*Math.PI:off+i/n*6.283;
   const x=clamp(Math.round(ccx+Math.cos(a)*ccx*.78),1,w-2),y=clamp(Math.round(ccy+Math.sin(a)*ccy*.78),1,h-2);starts.push(y*w+x);
   for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++)if(Math.hypot(xx-x,yy-y)<2.2)terr[yy*w+xx]=0}
  if(new Set(starts).size<n)continue;
  const seen=new Uint8Array(N),q=[starts[0]];seen[starts[0]]=1;
  while(q.length){const c=q.pop(),x=c%w,y=(c/w)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=w||Y>=h)continue;const j=Y*w+X;if(!seen[j]&&terr[j]===0){seen[j]=1;q.push(j)}}}
  if(!starts.every(s=>seen[s]))continue;
  let walk=0;for(let i=0;i<N;i++){if(terr[i]===0&&!seen[i])terr[i]=1;if(terr[i]===0)walk++}
  if(walk<N*.55)continue;
  return{w,h,terr,starts}}
 return{w,h,terr:new Uint8Array(N),starts:Array.from({length:n},(_,i)=>{const a=n===2?i*Math.PI:i/n*6.283;return clamp(Math.round((h-1)/2+Math.sin(a)*(h-1)*.39),1,h-2)*w+clamp(Math.round((w-1)/2+Math.cos(a)*(w-1)*.39),1,w-2)})}}

function calcBuildable(w,h,terr,own,occ,mine,me){
 const N=w*h,ok=new Uint8Array(N),near=new Uint8Array(N);
 for(const tl of mine){const x=tl%w,y=(tl/w)|0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<w&&Y<h)near[Y*w+X]=1}}
 for(let i=0;i<N;i++){if(terr[i]||occ[i])continue;const o=own[i];if(o===me||(o<0&&near[i]))ok[i]=1}
 return ok}

let G=null,R={online:false,host:true,bots:3,diff:1,size:1,pl:[],you:0,code:''};
const Net={peer:null,role:null,conns:[],conn:null,last:0,hb:null,wd:null,
 send(c,o){try{if(c&&c.open)c.send(o)}catch(e){}},
 all(o){for(const x of this.conns)this.send(x.c,o)},

function newGame(plist,size){
 const n=plist.length;if(n>4&&size===0)size=1;
 const dims=[[11,8],[14,10],[18,12]][size];
 const map=genMap(dims[0],dims[1],n),w=map.w,h=map.h,N=w*h;
 G={w,h,N,terr:map.terr,own:new Int8Array(N).fill(-1),bAt:new Array(N).fill(0),mAt:new Array(N).fill(0),blds:new Map(),mons:new Map(),pups:[],storms:[],
  P:plist.map(p=>({name:p.name,av:p.av,ctrl:p.ctrl,conn:p.conn||null,diff:p.diff||1,gold:120,alive:true,haste:0,shield:0,kills:0,tiles:0,inc:3,think:2+rf()*2,last:0})),
  t:0,ev:[],id:1,nPu:8,nSt:30,acc:0,snapAcc:0,over:false,dirty:true,orec:0,chk:0,walk:0,idleEnd:0,starts:map.starts,last:performance.now()};
 for(let i=0;i<N;i++)if(!G.terr[i])G.walk++;
 map.starts.forEach((s,i)=>addB(s,'castle',i));
 // monsters
 const cand=[];for(let i=0;i<N;i++){if(G.terr[i])continue;let dm=99;for(const s of map.starts)dm=Math.min(dm,Math.hypot(i%w-s%w,((i/w)|0)-((s/w)|0)));if(dm>=3.5)cand.push([i,dm])}
 for(let i=cand.length-1;i>0;i--){const j=rand(i+1);[cand[i],cand[j]]=[cand[j],cand[i]]}
 const cnt=Math.round(G.walk*.07)+2;
 for(const[i,dm]of cand){if(G.mons.size>=cnt)break;
  let near=false;for(const m of G.mons.values())if(Math.hypot(m.tile%w-i%w,((m.tile/w)|0)-((i/w)|0))<2){near=true;break}
  if(near)continue;
  const tier=clamp(Math.floor(dm/3+rf()*1.3)-1,0,3),ty=MONT[tier],m={id:G.id++,tile:i,ty,hp:MON[ty].hp,cd:rf(),slow:0};
  G.mons.set(m.id,m);G.mAt[i]=m.id}
 recalc();
 return map}
function addB(tile,ty,o,l){const b={id:G.id++,tile,ty,o,l:l||1,hp:0,cd:rf()*.5,slow:0};b.hp=bHp(b);G.blds.set(b.id,b);G.bAt[tile]=b.id;G.dirty=true;return b}
function rmB(b){G.blds.delete(b.id);G.bAt[b.tile]=0;G.dirty=true}
function killB(b,src){rmB(b);G.ev.push(['dead',b.tile,0]);if(b.ty==='castle')eliminate(b.o,src)}
function eliminate(o,src){const p=G.P[o];if(!p||!p.alive)return;p.alive=false;G.ev.push(['elim',o]);if(src>=0&&G.P[src])G.P[src].gold+=60;for(const b of [...G.blds.values()])if(b.o===o){rmB(b);G.ev.push(['dead',b.tile,0])}}
function dmgB(b,d,src){const p=G.P[b.o];if(p.shield>0)return;b.hp-=d;if(b.hp<=0)killB(b,src)}
function dmgM(m,d,src){if(!G.mons.has(m.id))return;m.hp-=d;if(m.hp<=0){G.mons.delete(m.id);G.mAt[m.tile]=0;G.dirty=true;G.ev.push(['dead',m.tile,1]);if(src>=0){const p=G.P[src],rw=MON[m.ty].rw;p.gold+=rw;p.kills++;G.ev.push(['coin',m.tile,src,rw])}}}
const dist=(a,b)=>Math.hypot(a%G.w-b%G.w,((a/G.w)|0)-((b/G.w)|0));

function recalc(){
 const P=G.P.length,N=G.N,w=G.w,h=G.h,s=new Float32Array(N*P);
 const inc=new Array(P).fill(0);
 for(const b of G.blds.values()){const r=bR(b.ty,b.l),x=b.tile%w,y=(b.tile/w)|0;inc[b.o]+=bInc(b.ty,b.l);
  for(let dy=-r-1;dy<=r+1;dy++)for(let dx=-r-1;dx<=r+1;dx++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=w||Y>=h)continue;const j=Y*w+X;if(G.terr[j])continue;const d=Math.hypot(dx,dy);if(d<=r+.5)s[j*P+b.o]+=r+1-d}}
 const cnt=new Array(P).fill(0);
 for(let i=0;i<N;i++){let bv=0,best=-1;for(let p=0;p<P;p++){const v=s[i*P+p];if(v>bv)bv=v}
  if(bv>0){const prev=G.own[i];if(prev>=0&&s[i*P+prev]>=bv-1e-6)best=prev;else for(let p=0;p<P;p++)if(s[i*P+p]>=bv-1e-6){best=p;break}}
  G.own[i]=best;if(best>=0)cnt[best]++}
 for(let p=0;p<P;p++){const pl=G.P[p];pl.tiles=cnt[p];pl.inc=pl.alive?inc[p]+cnt[p]*.04:0}
 // power-up pickup
 for(let k=G.pups.length-1;k>=0;k--){const u=G.pups[k],o=G.own[u.tile];if(o>=0&&G.P[o].alive){
   const p=G.P[o];if(u.ty==='coin')p.gold+=60;else if(u.ty==='haste')p.haste=15;else if(u.ty==='shield')p.shield=12;else if(u.ty==='heal'){for(const b of G.blds.values())if(b.o===o)b.hp=bHp(b)}
   G.ev.push(['pick',u.tile,o,u.ty]);G.pups.splice(k,1)}}
 G.dirty=false}

function occArr(){const o=new Uint8Array(G.N);for(let i=0;i<G.N;i++)if(G.bAt[i]||G.mAt[i])o[i]=1;return o}
function err(pi,k){const p=G.P[pi];if(!p)return;if(p.ctrl==='me'){toast(t('e_'+k));Snd.play('err')}else if(p.ctrl==='net')Net.send(p.conn,{t:'err',k})}
function doCmd(pi,m){
 const p=G.P[pi];if(!p||!p.alive||G.over||!m)return;
 if(m.k==='b'){
  const tile=m.tile,ty=m.ty;if(!Number.isInteger(tile)||tile<0||tile>=G.N||!ORDER.includes(ty))return err(pi,'bad');
  if(p.gold<B[ty].c)return err(pi,'gold');
  const mine=[];for(const b of G.blds.values())if(b.o===pi)mine.push(b.tile);
  const ok=calcBuildable(G.w,G.h,G.terr,G.own,occArr(),mine,pi);
  if(!ok[tile])return err(pi,'land');
  p.gold-=B[ty].c;addB(tile,ty,pi);G.ev.push(['bd',tile,pi]);recalc()}
 else if(m.k==='u'){
  const b=G.blds.get(m.id);if(!b||b.o!==pi||b.l>=3)return;const c=upCostOf(b.ty,b.l);if(p.gold<c)return err(pi,'gold');
  p.gold-=c;const old=bHp(b);b.l++;b.hp+=bHp(b)-old;G.ev.push(['up',b.tile,pi]);recalc()}
 else if(m.k==='s'){
  const b=G.blds.get(m.id);if(!b||b.o!==pi||b.ty==='castle')return;
  p.gold+=Math.floor(invOf(b.ty,b.l)*.5);rmB(b);G.ev.push(['dead',b.tile,0]);recalc()}}

function findTarget(b,def){
 const w=G.w,bx=b.tile%w,by=(b.tile/w)|0;let best=null,bd=def.rng+.01,kind='';
 for(const e of G.blds.values()){if(e.o===b.o)continue;const d=Math.hypot(e.tile%w-bx,((e.tile/w)|0)-by);if(d<bd){bd=d;best=e;kind='b'}}
 if(!def.bonly)for(const m of G.mons.values()){const d=Math.hypot(m.tile%w-bx,((m.tile/w)|0)-by);if(d<bd){bd=d;best=m;kind='m'}}
 return best?{o:best,k:kind}:null}
function hurt(tg,d,src){if(tg.k==='b')dmgB(tg.o,d,src);else dmgM(tg.o,d,src)}
function fire(b,def,tg){
 const d=bDmg(b.ty,b.l),w=G.w;
 hurt(tg,d,b.o);G.ev.push(['sh',b.tile,tg.o.tile,b.ty]);
 if(def.slow){tg.o.slow=3}
 if(def.spl){const cx=tg.o.tile%w,cy=(tg.o.tile/w)|0;
  for(const e of [...G.blds.values()])if(e!==tg.o&&e.o!==b.o&&Math.hypot(e.tile%w-cx,((e.tile/w)|0)-cy)<=def.spl)dmgB(e,d*.6,b.o);
  for(const m of [...G.mons.values()])if(m!==tg.o&&Math.hypot(m.tile%w-cx,((m.tile/w)|0)-cy)<=def.spl)dmgM(m,d*.6,b.o)}
 if(def.chain){let cur=tg.o,used=new Set([cur.id]);
  for(let c=1;c<def.chain;c++){let best=null,bd=2.3,kind='';const cx=cur.tile%w,cy=(cur.tile/w)|0;
   for(const e of G.blds.values()){if(e.o===b.o||used.has(e.id))continue;const dd=Math.hypot(e.tile%w-cx,((e.tile/w)|0)-cy);if(dd<bd){bd=dd;best=e;kind='b'}}
   for(const m of G.mons.values()){if(used.has(m.id))continue;const dd=Math.hypot(m.tile%w-cx,((m.tile/w)|0)-cy);if(dd<bd){bd=dd;best=m;kind='m'}}
   if(!best)break;used.add(best.id);hurt({o:best,k:kind},d*.7,b.o);G.ev.push(['sh',cur.tile,best.tile,'bolt']);cur=best}}}

function step(dt){
 if(G.over)return;G.t+=dt;
 for(const p of G.P){if(!p.alive)continue;p.gold+=p.inc*dt;if(p.haste>0)p.haste-=dt;if(p.shield>0)p.shield-=dt}
 // towers
 for(const b of [...G.blds.values()]){
  if(!G.blds.has(b.id))continue;const def=B[b.ty];
  if(b.slow>0)b.slow-=dt;
  if(def.heal){const hv=def.heal*lm(b.l)*dt,w=G.w;for(const e of G.blds.values())if(e.o===b.o&&e!==b&&Math.hypot(e.tile%w-b.tile%w,((e.tile/w)|0)-((b.tile/w)|0))<=def.rng)e.hp=Math.min(bHp(e),e.hp+hv);continue}
  if(!def.dmg)continue;
  b.cd-=dt;if(b.cd>0)continue;
  const tg=findTarget(b,def);if(!tg){b.cd=.2;continue}
  b.cd=1/(def.rate*(b.slow>0?.5:1)*(G.P[b.o].haste>0?2:1));
  fire(b,def,tg)}
 // monsters
 for(const m of [...G.mons.values()]){
  if(!G.mons.has(m.id))continue;const def=MON[m.ty];if(m.slow>0)m.slow-=dt;m.cd-=dt;
  let best=null,bd=def.rng+.01;
  for(const e of G.blds.values()){const d=dist(e.tile,m.tile);if(d<bd){bd=d;best=e}}
  if(best){if(m.cd<=0){m.cd=1/(def.rate*(m.slow>0?.5:1));dmgB(best,def.dmg,-1);G.ev.push(['sh',m.tile,best.tile,'mon'])}}
  else m.hp=Math.min(def.hp,m.hp+3*dt)}
 // storms
 G.nSt-=dt;
 if(G.nSt<=0){G.nSt=35+rf()*25;let tl=0;for(let k=0;k<30;k++){tl=rand(G.N);if(!G.terr[tl])break}
  const ty=rf()<.6?'thunder':'bloom';G.storms.push({x:tl%G.w,y:(tl/G.w)|0,r:2.2,ty,tl:4.5});G.ev.push(['storm',ty])}
 for(let k=G.storms.length-1;k>=0;k--){const s=G.storms[k];s.tl-=dt;if(s.tl>0)continue;
  G.storms.splice(k,1);G.ev.push(['strike',s.x,s.y,s.r,s.ty]);
  const gain=new Map();
  for(const b of [...G.blds.values()]){if(Math.hypot(b.tile%G.w-s.x,((b.tile/G.w)|0)-s.y)>s.r+.3)continue;
   if(s.ty==='thunder')dmgB(b,bHp(b)*.35,-1);else{b.hp=Math.min(bHp(b),b.hp+bHp(b)*.5);gain.set(b.o,(gain.get(b.o)||0)+12)}}
  if(s.ty==='thunder'){for(const m of [...G.mons.values()])if(Math.hypot(m.tile%G.w-s.x,((m.tile/G.w)|0)-s.y)<=s.r+.3)dmgM(m,MON[m.ty].hp*.35,-1)}
  for(const[o,g]of gain){G.P[o].gold+=Math.min(60,g)}
  G.dirty=true}
 // power-ups
 G.nPu-=dt;
 if(G.nPu<=0){G.nPu=12+rf()*6;if(G.pups.length<5){for(let k=0;k<30;k++){const tl=rand(G.N);if(G.terr[tl]||G.bAt[tl]||G.mAt[tl]||G.pups.some(u=>u.tile===tl))continue;
   const r=rf(),ty=r<.45?'coin':r<.65?'haste':r<.8?'shield':'heal';G.pups.push({tile:tl,ty,life:45});break}}}
 for(let k=G.pups.length-1;k>=0;k--){G.pups[k].life-=dt;if(G.pups[k].life<=0)G.pups.splice(k,1)}
 // bots
 for(let i=0;i<G.P.length;i++){const p=G.P[i];if(p.ctrl!=='bot'||!p.alive)continue;p.think-=dt;if(p.think<=0){p.think=[3.2,1.8,1.0][p.diff]*(.7+rf()*.6);if(!(p.diff===0&&rf()<.25))botThink(i)}}
 // net watchdog
 for(let i=0;i<G.P.length;i++){const p=G.P[i];if(p.ctrl==='net'&&G.t-p.last>14&&p.last>0)dropToBot(i)}
 G.orec-=dt;if(G.dirty||G.orec<=0){G.orec=.5;recalc()}
 G.chk-=dt;if(G.chk<=0){G.chk=1;checkWin()}}

function dropToBot(i){const p=G.P[i];p.ctrl='bot';p.diff=1;p.conn=null}
function checkWin(){
 const alive=G.P.map((p,i)=>p.alive?i:-1).filter(i=>i>=0);
 if(alive.length<=1)return finish(alive.length?alive[0]:-1);
 for(const i of alive)if(G.P[i].tiles>=G.walk*.6)return finish(i);
 const humans=alive.filter(i=>G.P[i].ctrl!=='bot');
 if(!humans.length){G.idleEnd+=1;if(G.idleEnd>=6){let b=alive[0];for(const i of alive)if(G.P[i].tiles>G.P[b].tiles)b=i;finish(b)}}}
function finish(win){
 if(G.over)return;G.over=true;
 broadcastSnap();
 const msg={t:'end',win,st:G.P.map(p=>[p.tiles,p.kills,p.alive?1:0])};
 Net.all(msg);clearInterval(G.timer);showEnd(msg)}

/* ----- bot ai ----- */
function botThink(i){
 const p=G.P[i],w=G.w,df=p.diff,mine=[];
 for(const b of G.blds.values())if(b.o===i)mine.push(b);
 if(!mine.length)return;
 const ok=calcBuildable(w,G.h,G.terr,G.own,occArr(),mine.map(b=>b.tile),i),cand=[];
 for(let k=0;k<G.N;k++)if(ok[k])cand.push(k);
 if(!cand.length)return;
 const build=(tile,ty)=>doCmd(i,{k:'b',tile,ty});
 let eco=0;for(const b of mine)if(B[b.ty].inc&&b.ty!=='castle')eco++;
 const need=1+Math.floor(p.tiles/9);
 if(df>=1&&p.gold>160&&rf()<.35){const ups=mine.filter(b=>b.l<3&&b.ty!=='banner'&&b.ty!=='wall');if(ups.length){const b=ups[rand(ups.length)];if(p.gold>=upCostOf(b.ty,b.l)+40){doCmd(i,{k:'u',id:b.id});return}}}
 const sample=n=>{const a=[];for(let k=0;k<n;k++)a.push(cand[rand(cand.length)]);return a};
 const foes=(tl,r)=>{let n=0;for(const e of G.blds.values())if(e.o!==i&&dist(e.tile,tl)<=r)n+=e.ty==='castle'?3:1;for(const m of G.mons.values())if(dist(m.tile,tl)<=r)n+=1;return n};
 const minEnemy=tl=>{let d=99;for(const e of G.blds.values())if(e.o!==i)d=Math.min(d,dist(e.tile,tl));return d};
 const neutral=tl=>{let n=0,x=tl%w,y=(tl/w)|0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=w||Y>=G.h)continue;const j=Y*w+X;if(!G.terr[j]&&G.own[j]<0&&Math.hypot(dx,dy)<=3.2)n++}return n};
 const expand=()=>{let bt=-1,bs=-1e9;for(const tl of sample(14)){const s=neutral(tl)*2+rf()*2-dist(tl,G.starts[i])*.15;if(s>bs){bs=s;bt=tl}}
  let ty='banner';if(df===2&&p.gold>=100&&rf()<.35)ty='mage';build(bt,ty)};
 if(eco<need&&p.gold>=30){let bt=-1,bs=-1e9;for(const tl of sample(12)){const s=minEnemy(tl)+rf();if(s>bs){bs=s;bt=tl}}build(bt,(p.gold>=60&&rf()<.6)?'mine':'farm');return}
 if(rf()<.45){expand();return}
 let bt=-1,bs=0;for(const tl of sample(16)){const s=foes(tl,4.5)+rf()*.5;if(s>bs){bs=s;bt=tl}}
 if(bt<0||bs<1){expand();return}
 const pool=df===0?['arrow','cannon','wall']:df===1?['arrow','cannon','fire','frost','bolt','mage','shrine']:['arrow','cannon','fire','frost','bolt','mage','dragon','cata','shrine'];
 const aff=pool.filter(k=>B[k].c<=p.gold);if(!aff.length)return;
 aff.sort((a,b)=>B[b].c-B[a].c);
 build(bt,rf()<.6?aff[0]:aff[rand(aff.length)])}

/* ----- snapshots ----- */
function snap(){
 const ev=G.ev;G.ev=[];
 return{t:'s',tm:G.t,own:Array.from(G.own,v=>v+1).join(''),
  b:[...G.blds.values()].map(b=>[b.id,b.tile,b.ty,b.o,b.l,Math.round(b.hp)]),
  m:[...G.mons.values()].map(m=>[m.id,m.tile,m.ty,Math.round(m.hp)]),
  pu:G.pups.map(u=>[u.tile,u.ty]),st:G.storms.map(s=>[s.x,s.y,s.r,s.ty,+s.tl.toFixed(1)]),
  p:G.P.map(p=>[Math.floor(p.gold),+p.inc.toFixed(1),p.tiles,p.alive?1:0,Math.ceil(Math.max(0,p.haste)),Math.ceil(Math.max(0,p.shield))]),ev}}
function broadcastSnap(){const m=snap();Net.all(m);applySnap(m)}
function tick(){
 if(!G||G.over)return;
 const now=performance.now();let dt=Math.min(.25,(now-G.last)/1000);G.last=now;
 G.acc+=dt;while(G.acc>=.05){step(.05);G.acc-=.05;if(G.over)return}
 G.snapAcc+=dt;if(G.snapAcc>=.1){G.snapAcc=0;broadcastSnap()}}

function enterGame(map,pl,me){
 V={w:map.w,h:map.h,N:map.w*map.h,terr:Uint8Array.from(map.terr),pl,me,own:new Int8Array(map.w*map.h).fill(-1),b:[],bt:new Map(),m:[],mt:new Map(),pu:[],st:[],p:pl.map(()=>[0,0,0,1,0,0]),ok:null,tm:0,over:false,walk:0};
 for(let i=0;i<V.N;i++)if(!V.terr[i])V.walk++;
 sel={ty:null,bid:null};hover=-1;fx={shots:[],floats:[],rings:[]};

function applySnap(m){
 if(!V)return;
 V.tm=m.tm;
 for(let i=0;i<V.N;i++)V.own[i]=m.own.charCodeAt(i)-49;
 V.b=m.b;V.bt=new Map(m.b.map(b=>[b[1],b]));V.m=m.m;V.mt=new Map(m.m.map(x=>[x[1],x]));V.pu=m.pu;V.st=m.st;V.p=m.p;
 for(const e of m.ev)procEv(e);
 const occ=new Uint8Array(V.N),mine=[];
 for(const b of V.b){occ[b[1]]=1;if(b[3]===V.me)mine.push(b[1])}for(const x of V.m)occ[x[1]]=1;
 V.ok=V.p[V.me][3]?calcBuildable(V.w,V.h,V.terr,V.own,occ,mine,V.me):new Uint8Array(V.N);
 if(sel.bid&&!V.b.some(b=>b[0]===sel.bid))sel.bid=null;
 updHud()}

 else if(k==='strike'){fx.rings.push({x:e[1]+.5,y:e[2]+.5,r:e[3],ty:e[4],t:0});Snd.play('storm')}
 else if(k==='storm'){toast(t(e[1]==='thunder'?'storm_t':'storm_b'),2600)}

function draw(T,dt){

 // buildings

 // storms
 for(const[x,y,r,ty,tl]of V.st){const px=ox+(x+.5)*ts,py=oy+(y+.5)*ts,rad=r*ts,pulse=.5+.5*Math.sin(T*8);
  const g=ctx.createRadialGradient(px,py,rad*.1,px,py,rad);const c=ty==='thunder'?'122,77,255':'255,120,200';g.addColorStop(0,`rgba(${c},${.25+.2*pulse})`);g.addColorStop(1,`rgba(${c},.05)`);

 // rings

  ctx.strokeStyle=r.ty==='thunder'?`rgba(255,240,120,${1-f})`:`rgba(255,160,220,${1-f})`;ctx.lineWidth=6;ctx.beginPath();ctx.arc(ox+r.x*ts,oy+r.y*ts,r.r*ts*(.5+f*.6),0,6.283);ctx.stroke();

 // floats
 for(let k=fx.floats.length-1;k>=0;k--){const f=fx.floats[k];f.t+=dt;if(f.t>1){fx.floats.splice(k,1);continue}
  ctx.globalAlpha=1-f.t;ctx.fillStyle=f.col;ctx.strokeStyle='#3b2a5a';ctx.lineWidth=3;ctx.font=`900 ${ts*.4}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const yy=oy+(f.y-f.t*.8)*ts;ctx.strokeText(f.txt,ox+f.x*ts,yy);ctx.fillText(f.txt,ox+f.x*ts,yy);ctx.globalAlpha=1}
 // ghost + selection
 if(sel.ty&&hover>=0&&V.ok&&V.ok[hover]){const c=cen(hover);ctx.globalAlpha=.6;emo(B[sel.ty].e,ox+c.x*ts,oy+c.y*ts,ts*.55);ctx.globalAlpha=1;
  const rg=B[sel.ty].rng;if(rg){ctx.strokeStyle='#fff';ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(ox+c.x*ts,oy+c.y*ts,rg*ts,0,6.283);ctx.stroke();ctx.setLineDash([])}}
 if(sb){const c=cen(sb[1]);ctx.strokeStyle='#fff';ctx.lineWidth=4;rr(ox+(c.x-.5)*ts+2,oy+(c.y-.5)*ts+2,ts-4,ts-4,ts*.2);ctx.stroke()}}

function showEnd(msg){
 if(!V)return;V.over=true;
 const me=V.me,win=msg.win,st=msg.st,won=win===me;
 $('#endTitle').textContent=won?'🏆 '+t('win'):(st[me][2]?t('wonBy',{n:win>=0?V.pl[win].name:'-'}):'💔 '+t('lose'));
 const order=V.pl.map((p,i)=>i).sort((a,b)=>(b===win)-(a===win)||st[b][0]-st[a][0]);
 $('#endTbl').innerHTML=order.map(i=>`<tr><td style="color:${COLORS[i]}">${AVS[V.pl[i].av]||'🙂'} ${esc(V.pl[i].name)}${i===me?' ⭐':''}</td><td>${i===win?'🏆':st[i][2]?'':'💀'}</td><td>${t('tiles')} ${Math.round(st[i][0]/V.walk*100)}% · ⚔️${st[i][1]}</td></tr>`).join('');
 const pct=Math.round(st[me][0]/V.walk*100),xp=20+st[me][0]+st[me][1]*5+(won?100:0);
 const before=levelOf(prof.xp);prof.xp+=xp;prof.g++;if(won)prof.w++;prof.best=Math.max(prof.best,pct);saveProf();
 const after=levelOf(prof.xp);
 $('#endXp').textContent=t('xpGain',{n:xp})+(after>before?'  '+t('levelUp',{n:after}):'');
 Snd.play(won?'win':'lose');
 const hostOnline=R.online&&R.host;
 $('#bAgain').style.display=(R.host)?'':'none';
 $('#bAgain').textContent=hostOnline?t('toLobby'):t('again');
 show('sEnd')}

/* ================= room / launch ================= */
function humans(){return R.pl.length}
function openRoom(){
 if(R.host)roomBroadcast();
 R.bots=clamp(R.bots,R.online?0:1,8-humans());if(R.host&&R.online)roomBroadcast();
 renderRoom();show('sRoom')}
function renderRoom(){
 const hs=R.pl.length,total=hs+R.bots;
 let html=R.pl.map((p,i)=>`<div class="pl" style="border-left-color:${COLORS[i]}"><span class="e">${AVS[p.a]||'🙂'}</span>${esc(p.n)}<small>${i===R.you?t('you'):''}${i===0&&R.online?' ('+t('host')+')':''}</small></div>`).join('');
 for(let i=0;i<R.bots;i++)html+=`<div class="pl" style="border-left-color:${COLORS[hs+i]};opacity:.75"><span class="e">🤖</span>${t('bot')} ${i+1}</div>`;
 $('#plist').innerHTML=html;
 $('#botN').textContent=R.bots;$('#botM').disabled=!R.host||R.bots<=(R.online?0:1);$('#botP').disabled=!R.host||total>=8;
 $$('#segDiff button').forEach(b=>{b.classList.toggle('on',+b.dataset.v===R.diff);b.disabled=!R.host});
 $$('#segSize button').forEach(b=>{b.classList.toggle('on',+b.dataset.v===R.size);b.disabled=!R.host});
 $('#codeBox').hidden=!R.online;$('#roomCode').textContent=R.code;
 $('#bStart').style.display=R.host?'':'none';$('#bStart').disabled=total<2;
 $('#roomMsg').textContent=!R.host?t('waitHost'):total<2?t('needTwo'):''}
function roomBroadcast(){
 const guests=Net.conns.filter(x=>x.ready);
 R.pl=[{n:myName(),a:prof.av},...guests.map(x=>({n:x.name,a:x.av}))];
 R.you=0;
 guests.forEach((x,i)=>Net.send(x.c,{t:'room',pl:R.pl,bots:R.bots,diff:R.diff,size:R.size,you:i+1}))}
function changed(){if(R.online&&R.host)roomBroadcast();renderRoom()}
$('#botM').onclick=()=>{R.bots--;Snd.play('click');changed()};$('#botP').onclick=()=>{R.bots++;Snd.play('click');changed()};
$$('#segDiff button').forEach(b=>b.onclick=()=>{R.diff=+b.dataset.v;Snd.play('click');changed()});
$$('#segSize button').forEach(b=>b.onclick=()=>{R.size=+b.dataset.v;Snd.play('click');changed()});
$('#bPlay').onclick=()=>{Snd.play('click');R.online=false;R.host=true;R.code='';openRoom()};
$('#bRoomBack').onclick=()=>{Snd.play('click');if(R.online)Net.close();R.online=false;R.host=true;show('sMenu')};
$('#bStart').onclick=()=>{Snd.play('click');launch()};

function launch(){
 if(!R.host)return;
 const guests=R.online?Net.conns.filter(x=>x.ready):[];
 const plist=[{name:myName(),av:prof.av,ctrl:'me'}];
 guests.forEach(x=>plist.push({name:x.name,av:x.av,ctrl:'net',conn:x.c}));
 const usedAv=new Set(plist.map(p=>p.av));
 for(let i=0;i<R.bots&&plist.length<8;i++){let a=rand(AVS.length);for(let k=0;k<20&&usedAv.has(a);k++)a=rand(AVS.length);usedAv.add(a);plist.push({name:BOTNAMES[i%8],av:a,ctrl:'bot',diff:R.diff})}
 if(plist.length<2)return;
 if(G)clearInterval(G.timer);
 const map=newGame(plist,R.size);
 const pl=plist.map(p=>({name:p.name,av:p.av}));
 G.P.forEach((p,i)=>{if(p.ctrl==='net')Net.send(p.conn,{t:'start',map:{w:map.w,h:map.h,terr:Array.from(map.terr).join('')},pl,you:i})});
 enterGame({w:map.w,h:map.h,terr:map.terr},pl,0);
 G.last=performance.now();G.timer=setInterval(tick,50);
 broadcastSnap()}

/* ================= online ================= */
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function openPeer(id){return new Promise((res,rej)=>{const p=id?new Peer(id):new Peer();p.on('open',()=>res(p));p.on('error',rej);setTimeout(()=>rej({type:'timeout'}),12000)})}
const lobMsg=k=>$('#lobMsg').textContent=k?t(k):'';
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[rand(a.length)];return s};
$('#bOnline').onclick=()=>{Snd.play('click');Net.close();lobMsg();show('sLobby')};
$('#bLobBack').onclick=()=>{Net.close();show('sMenu')};
let cidN=1;
$('#bCreate').onclick=async()=>{Snd.play('click');lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let code,peer;for(let q=0;q<5;q++){code=genCode();try{peer=await openPeer('runerealms-'+code);break}catch(e){if(!(e&&e.type==='unavailable-id')){lobMsg('connErr');return}}}
 if(!peer){lobMsg('connErr');return}
 Net.peer=peer;Net.role='host';R.online=true;R.host=true;R.code=code;
 peer.on('connection',c=>{
  const x={c,cid:cidN++,ready:false,name:'',av:0};
  const reg=()=>{c.on('data',m=>hostData(x,m));c.on('close',()=>guestGone(x));c.on('error',()=>{})};
  if(c.open)reg();else c.on('open',reg)});
 peer.on('error',()=>{});
 openRoom()};
function guestGone(x){
 const i=Net.conns.indexOf(x);if(i<0)return;Net.conns.splice(i,1);
 if(G&&!G.over){const pi=G.P.findIndex(p=>p.conn===x.c);if(pi>=0)dropToBot(pi)}
 else if(screen==='sRoom'||screen==='sEnd'){roomBroadcast();if(screen==='sRoom')renderRoom()}}
function refuse(x){Net.send(x.c,{t:'full'});setTimeout(()=>{try{x.c.close()}catch(e){}},300)}
function hostData(x,m){
 if(!m||typeof m!=='object')return;
 if(m.t==='hello'){
  if((G&&!G.over)||screen==='sGame'||x.ready)return refuse(x);
  const cnt=Net.conns.filter(y=>y.ready).length+1;
  if(cnt+R.bots>=8){if(R.bots>0)R.bots--;else return refuse(x)}
  x.name=String(m.name||'Hero').slice(0,12);x.av=Number.isInteger(m.av)&&m.av>=0&&m.av<AVS.length?m.av:0;
  x.ready=true;Net.conns.push(x);roomBroadcast();renderRoom();return}
 if(!x.ready)return;
 if(m.t==='cmd'&&G&&!G.over){const pi=G.P.findIndex(p=>p.conn===x.c);if(pi<0)return;G.P[pi].last=G.t;
  const k=m.k;if(k==='b')doCmd(pi,{k,tile:m.tile,ty:m.ty});else if(k==='u'||k==='s')doCmd(pi,{k,id:m.id});return}
 if(m.t==='ping'&&G){const pi=G.P.findIndex(p=>p.conn===x.c);if(pi>=0)G.P[pi].last=G.t}}
async function joinRoom(code){
 code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){lobMsg('notFound');return}lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let peer;try{peer=await openPeer()}catch(e){lobMsg('connErr');return}
 Net.peer=peer;Net.role='guest';let opened=false;
 peer.on('error',e=>{if(!opened)lobMsg(e&&e.type==='peer-unavailable'?'notFound':'connErr')});
 const c=peer.connect('runerealms-'+code,{reliable:true});Net.conn=c;
 c.on('open',()=>{opened=true;R.online=true;R.host=false;R.code=code;Net.last=Date.now();
  c.send({t:'hello',name:myName(),av:prof.av});
  Net.hb=setInterval(()=>Net.send(c,{t:'ping'}),3000);
  Net.wd=setInterval(()=>{if(Date.now()-Net.last>15000)hostGone()},2000)});
 c.on('data',guestData);c.on('close',()=>{if(opened)hostGone()});c.on('error',()=>{});
 setTimeout(()=>{if(!opened&&Net.peer===peer){lobMsg('notFound');Net.close()}},12000)}
function hostGone(){if(!Net.peer)return;Net.close();toast(t('hostLeft'),3000);if(G){clearInterval(G.timer);G=null}V=null;R.online=false;R.host=true;renderMenu();show('sMenu')}
$('#bJoin').onclick=()=>{Snd.play('click');joinRoom($('#joinCode').value)};
$('#bCopy').onclick=async()=>{const url=location.origin+location.pathname+'?room='+R.code;try{await navigator.clipboard.writeText(url);toast(t('copied'))}catch(e){$('#roomMsg').textContent=url}};
function guestData(m){
 if(!m||typeof m!=='object')return;Net.last=Date.now();
 switch(m.t){
  case'room':R.pl=(m.pl||[]).slice(0,8).map(p=>({n:String(p.n).slice(0,12),a:p.a|0}));R.bots=clamp(m.bots|0,0,8);R.diff=clamp(m.diff|0,0,2);R.size=clamp(m.size|0,0,2);R.you=m.you|0;if(screen!=='sGame'){renderRoom();show('sRoom')}break;
  case'full':Net.close();lobMsg('full');show('sLobby');break;
  case'start':{const mp=m.map;if(!mp||!Number.isInteger(mp.w)||!Number.isInteger(mp.h)||mp.w*mp.h>400||typeof mp.terr!=='string'||mp.terr.length!==mp.w*mp.h||!Array.isArray(m.pl))break;
   const pl=m.pl.slice(0,8).map(p=>({name:String(p.name).slice(0,12),av:clamp(p.av|0,0,AVS.length-1)}));
   enterGame({w:mp.w,h:mp.h,terr:Array.from(mp.terr,c=>+c)},pl,clamp(m.you|0,0,pl.length-1));break}
  case's':if(V&&!V.over&&Array.isArray(m.b)&&typeof m.own==='string'&&m.own.length===V.N)applySnap(m);break;
  case'end':if(V&&!V.over&&Array.isArray(m.st))showEnd(m);break;
  case'lobby':if(screen==='sEnd'||screen==='sGame'){V=null;show('sRoom');renderRoom()}break;
  case'err':if(typeof m.k==='string'&&D['e_'+m.k]){toast(t('e_'+m.k));Snd.play('err')}break;
  case'bye':hostGone();break}}

/* ================= boot ================= */
R.pl=[{n:myName(),a:prof.av}];
renderMute();applyLang();
(function(){const q=new URLSearchParams(location.search).get('room');if(q){show('sLobby');$('#joinCode').value=q.toUpperCase().slice(0,5);setTimeout(()=>joinRoom(q),150)}})();
</script>
