<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bastion Ops</title>
<style>
:root{--bg:#10140d;--panel:#1a2015;--panel2:#232b1c;--line:#3a4630;--txt:#e7ecd8;--dim:#98a487;--acc:#c9d46a;--red:#d9534f;--blue:#5aa9e6;--gold:#f2c35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
button,select,input{font:inherit;color:inherit}
.scr{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 20%,#25301c,#0c0f09 70%)}
.scr.on{display:flex}
h1{margin:0;font-family:Impact,"Arial Black",sans-serif;letter-spacing:4px;font-size:clamp(36px,9vw,68px);color:var(--acc);text-shadow:0 3px 0 #3a4a1a,0 0 24px #7a9a2a55}
h2{margin:0;font-size:22px;color:var(--acc)}
.sub{color:var(--dim);margin:0;text-align:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 18px;cursor:pointer;min-width:200px;font-weight:700;transition:.15s}
.btn:hover:not(:disabled){background:#2f3a25;border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:linear-gradient(#7d9a2c,#566f1c);border-color:#a6c24a;color:#fff}
.btn.sm{min-width:0;padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
input,select{background:#0e130b;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(560px,100%)}
.msg{min-height:20px;color:var(--gold);text-align:center}
.code{font-family:Impact,monospace;font-size:38px;letter-spacing:8px;color:var(--gold)}
.pl{display:flex;justify-content:space-between;padding:6px 10px;background:#0e130b;border-radius:8px;margin:4px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
#sGame{padding:0;gap:0;justify-content:flex-start;align-items:stretch;background:#0b0e08}
#hud{display:flex;gap:14px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;font-weight:700;font-size:14px}
#hud .grow{flex:1;min-width:10px;color:var(--gold);text-align:center}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{background:#2e3a24;touch-action:none;display:block;border:1px solid #000;cursor:crosshair}
#bar{background:var(--panel);border-top:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:6px}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tb{flex:0 0 auto;min-width:64px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:4px 6px;cursor:pointer;text-align:center;line-height:1.15}
.tb .i{font-size:22px;display:block}.tb .n{font-size:10px;color:var(--dim);display:block}.tb .c{font-size:12px;color:var(--gold);font-weight:700}
.tb.sel{border-color:var(--acc);background:#33401f}.tb.no{opacity:.45}
.tb .cd{font-size:11px;color:var(--blue);font-weight:700}
#info{min-height:22px;font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#info b{color:var(--txt)}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:10px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .25s;z-index:20;text-align:center;max-width:90%}
#toast.on{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.sk{background:#0e130b;border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.sk.eq{border-color:var(--acc)}
.sw{height:26px;border-radius:6px;margin-bottom:6px}
.q{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #2a3322;font-size:14px}
.bar{height:6px;background:#0e130b;border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--acc)}
#modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal.on{display:flex}
#modal .card{max-height:90%;overflow:auto;line-height:1.5}
#modal li{margin:5px 0}
.lbr{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid #2a3322;font-size:14px}.lbr b{color:var(--gold)}
</style>
</head>
<body>

<div id="sMenu" class="scr on">
  <h1>BASTION OPS</h1>
  <p class="sub" data-i="sub"></p>
  <div class="row"><input id="inName" maxlength="12" style="width:170px"><select id="selLang"></select></div>
  <div class="col">
    <button class="btn pri" id="bPlay" data-i="play"></button>
    <button class="btn" id="bOnline" data-i="online"></button>
    <button class="btn" id="bArm" data-i="armory"></button>
    <button class="btn" id="bHow" data-i="how"></button>
  </div>
  <p class="sub" id="mStat"></p>
</div>

<div id="sLobby" class="scr">
  <h2 data-i="online"></h2>
  <div class="card col">
    <button class="btn pri" id="bCreate" data-i="create"></button>
    <div class="row"><input id="joinCode" maxlength="5" placeholder="ABCDE" style="width:120px;text-transform:uppercase;text-align:center;letter-spacing:4px"><button class="btn sm" id="bJoin" data-i="join"></button></div>
    <div class="msg" id="lobMsg"></div>
  </div>
  <button class="btn" id="bLobBack" data-i="back"></button>
</div>

<div id="sRoom" class="scr">
  <h2 data-i="code"></h2>
  <div class="code" id="roomCode"></div>
  <button class="btn sm" id="bCopy" data-i="copy"></button>
  <div class="card"><div id="plist"></div>
    <div class="row" style="margin-top:10px"><span data-i="diff"></span><select id="selDiff"></select></div>
  </div>
  <div class="msg" id="roomMsg"></div>
  <div class="row"><button class="btn pri" id="bStart" data-i="start"></button><button class="btn" id="bRoomBack" data-i="back"></button></div>
</div>

<div id="sGame" class="scr">
  <div id="hud">
    <span>🌊 <span id="hWave">1</span>/30</span>
    <span>🏠 <span id="hHp"></span></span>
    <span>💰 <span id="hCash"></span></span>
    <span class="grow" id="hMsg"></span>
    <button class="btn sm" id="bCall" data-i="callWave"></button>
    <button class="btn sm" id="bSpeed">1x</button>
    <button class="btn sm" id="bMute">🔊</button>
    <button class="btn sm" id="bQuit">✕</button>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><div id="toast"></div></div>
  <div id="bar"><div class="tools" id="tools"></div><div class="tools" id="pows"></div><div id="info"></div></div>
</div>

<div id="sEnd" class="scr">
  <h1 id="eTitle"></h1>
  <div class="card col" id="eBody"></div>
  <div class="row"><button class="btn pri" id="bAgain" data-i="again"></button><button class="btn" id="bEndMenu" data-i="menu"></button></div>
</div>

<div id="sArm" class="scr" style="justify-content:flex-start">
  <h2>🪖 <span data-i="armory"></span> · 💰 <span id="aCoins"></span></h2>
  <div class="card"><h2 data-i="quests" style="font-size:16px"></h2><div id="aQuests"></div></div>
  <div class="card"><h2 data-i="skins" style="font-size:16px;margin-bottom:8px"></h2><div class="grid" id="aSkins"></div></div>
  <div class="card"><h2 data-i="lb" style="font-size:16px;margin-bottom:6px"></h2><div id="aLb"></div></div>
  <button class="btn" id="bArmBack" data-i="back"></button>
</div>

<div id="modal"><div class="card"><h2 data-i="how"></h2><div id="howTxt"></div><div class="row" style="margin-top:10px"><button class="btn" id="bHowClose" data-i="back"></button></div></div></div>

const Snd={ctx:null,on:LS.get('bo_snd',true),last:{},
 init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
 tone(f,d,ty='square',v=.05,sl=0){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),c.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)},
 play(n){if(!this.on||!this.ctx)return;const now=performance.now();if(now-(this.last[n]||0)<(n==='shot'?60:n==='boom'?90:0))return;this.last[n]=now;
  switch(n){case'shot':this.tone(520,.06,'square',.025,-300);break;case'boom':this.tone(110,.3,'sawtooth',.07,-70);break;
  case'click':this.tone(700,.05,'triangle',.05);break;case'err':this.tone(160,.15,'square',.05);break;case'build':this.tone(300,.1,'triangle',.06,200);break;
  case'wave':this.tone(220,.3,'sawtooth',.06,120);break;case'win':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,.25,'triangle',.07),i*140));break;
  case'lose':[300,240,180,120].forEach((f,i)=>setTimeout(()=>this.tone(f,.3,'sawtooth',.07),i*180));break;case'leak':this.tone(90,.25,'square',.08)}}};

const CS=40,COLS=24,ROWS=15,W=COLS*CS,H=ROWS*CS;
const PATHC=[[-1,2],[6,2],[6,7],[2,7],[2,12],[12,12],[12,4],[18,4],[18,10],[22,10],[22,3]];
const BASE=PATHC[PATHC.length-1];
const SEG=[],PD={};let PL=0;
(function(){let cum=0;const pts=PATHC.map(p=>[(p[0]+.5)*CS,(p[1]+.5)*CS]);
 for(let i=0;i<pts.length-1;i++){const[x0,y0]=pts[i],[x1,y1]=pts[i+1],len=Math.hypot(x1-x0,y1-y0);
  SEG.push({x0,y0,x1,y1,len,cum,a:Math.atan2(y1-y0,x1-x0)});
  const ax=PATHC[i][0],ay=PATHC[i][1],bx=PATHC[i+1][0],by=PATHC[i+1][1],sx=Math.sign(bx-ax),sy=Math.sign(by-ay),n=Math.max(Math.abs(bx-ax),Math.abs(by-ay));
  for(let k=0;k<=n;k++){const cx=ax+sx*k,cy=ay+sy*k;if(cx>=0&&cy>=0&&cx<COLS&&cy<ROWS){const key=cx+','+cy;if(!(key in PD))PD[key]=cum+k*CS}}
  cum+=len}
 PL=cum})();
function posAt(d){for(let i=0;i<SEG.length;i++){const s=SEG[i];if(d<=s.cum+s.len||i===SEG.length-1){const f=clamp((d-s.cum)/s.len,0,1);return{x:s.x0+(s.x1-s.x0)*f,y:s.y0+(s.y1-s.y0)*f,a:s.a}}}}
const BX=(BASE[0]+.5)*CS,BY=(BASE[1]+.5)*CS;

 inf:{hp:42,s:42,rw:7,bd:1,r:7,wd:12},
 run:{hp:26,s:82,rw:6,bd:1,r:6,wd:8},
 hvy:{hp:150,s:34,rw:15,bd:2,r:9,wd:22},

function tstat(t){const d=TT[t.ty],l=t.lvl-1;return{dm:(d.d||0)*(1+.38*l),r:(d.r||0)*(1+.08*l)*(t.rb?1.2:1),f:(d.f||0)*(1+.12*l),sp:(d.sp||0)*(1+.1*l)}}
function validCell(T,ty,gx,gy){
 if(!TT[ty]||!Number.isInteger(gx)||!Number.isInteger(gy)||gx<0||gy<0||gx>=COLS||gy>=ROWS)return false;
 if(!!TT[ty].path!==((gx+','+gy) in PD))return false;
 if(gx===BASE[0]&&gy===BASE[1])return false;
 for(const o of T)if(o.gx===gx&&o.gy===gy)return false;
 return true}

function newGame(pl,diff){
 const df=DF[diff];
 G={P:pl.map(p=>({n:p.n,s:p.s,conn:p.conn,money:df.m,cd:{air:0,frz:0,sup:0},k:0,b:0})),T:[],E:[],PR:[],fx:[],ev:[],w:0,ph:'prep',cdn:30,q:[],sp:0,gap:.8,hp:df.h,mh:df.h,frz:0,time:0,idc:1,over:false,diff,np:pl.length,boss:0,kills:0,speed:1,multi:false,sendT:0};
 V=null}
function buildWave(w){
 const q=[],a=(ty,n)=>{for(let i=0;i<n;i++)q.push(ty)};
 a('inf',Math.round(6+w*1.4));if(w>=3)a('run',Math.round(w*.7));if(w>=6)a('hvy',Math.round((w-4)*.55));
 if(w>=4)a('jeep',Math.round((w-2)*.45));if(w>=8)a('heli',Math.round((w-6)*.3));
 q.sort(()=>Math.random()-.5);
 if(w%5===0){q.splice(Math.floor(q.length*.4),0,'boss');if(w===MAXW)q.push('boss')}
 return q}
function addFx(f){const g=G;g.fx.push(f);if(g.multi)g.ev.push(Object.assign({},f))}
function startWave(){
 const g=G;g.w++;g.q=buildWave(g.w);g.ph='wave';g.sp=0;g.gap=Math.max(.4,.85-g.w*.012);
 Snd.play('wave');
 if(g.w%5===0){toast(t('boss'),2500);if(g.multi)g.ev.push({k:'msg',m:'boss'})}}
function spawnEnemy(ty){
 const g=G,d=ET[ty],hm=(ty==='boss'?(1400+g.w*160)/1400:(1+.075*g.w))*DF[g.diff].hm*(1+.4*(g.np-1));
 const e={id:g.idc++,ty,d:0,x:-20,y:BY,a:0,hp:d.hp*hm,mhp:d.hp*hm,s:d.s,air:!!d.air,atk:0,slow:0,dead:false};
 if(e.air){e.x=-20;e.y=50+Math.random()*(H-100);e.a=Math.atan2(BY-e.y,BX-e.x)}else{const p=posAt(0);e.x=p.x;e.y=p.y;e.a=p.a}
 g.E.push(e)}
function pay(own,e){const g=G,p=g.P[own];const rw=Math.round(ET[e.ty].rw*(1+.03*g.w));if(p){p.money+=rw;p.k++}g.kills++;if(e.ty==='boss')g.boss++}
function hurt(e,dm,own){if(e.dead)return;e.hp-=dm;if(e.hp<=0){e.dead=true;pay(own,e);addFx({k:'ex',x:e.x,y:e.y,r:e.ty==='boss'?46:14,t:.4})}}
function area(x,y,r,dm,own,air,gnd){for(const e of G.E){if(e.dead)continue;if(e.air?!air:!gnd)continue;if(Math.hypot(e.x-x,e.y-y)<=r+ET[e.ty].r)hurt(e,dm,own)}}
function boom(x,y,r,dm,own,air,gnd){addFx({k:'ex',x,y,r,t:.45});area(x,y,r,dm,own,air,gnd)}
function step(dt){
 const g=G;g.time+=dt;
 for(const p of g.P)for(const k in p.cd)p.cd[k]=Math.max(0,p.cd[k]-dt);
 g.frz=Math.max(0,g.frz-dt);
 if(g.ph==='prep'){g.cdn-=dt;if(g.cdn<=0)startWave()}
 else{if(g.q.length&&(g.sp-=dt)<=0){spawnEnemy(g.q.shift());g.sp=g.gap}
  if(!g.q.length&&!g.E.length)endWave()}
 const rad=g.T.filter(o=>o.ty==='radar');
 for(const o of g.T){o.rb=false;if(TT[o.ty].r)for(const r of rad)if(Math.hypot(r.x-o.x,r.y-o.y)<=TT.radar.rd){o.rb=true;break}}
 const walls=g.T.filter(o=>o.ty==='wall');
 for(const e of g.E){if(e.dead)continue;const d=ET[e.ty],sp=e.s*(g.frz>0?(e.ty==='boss'?.6:.3):1);e.slow=g.frz>0;
  if(e.air){const dx=BX-e.x,dy=BY-e.y,dist=Math.hypot(dx,dy);if(dist<20){leak(e);continue}e.x+=dx/dist*sp*dt;e.y+=dy/dist*sp*dt;e.a=Math.atan2(dy,dx);continue}
  let wl=null;for(const w of walls){if(w.dead)continue;const df=PD[w.gx+','+w.gy]-e.d;if(df>=-6&&df<=d.r+12){wl=w;break}}
  if(wl){wl.hp-=d.wd*dt;if(wl.hp<=0)wl.dead=true}
  else{e.d+=sp*dt;const p=posAt(e.d);e.x=p.x;e.y=p.y;e.a=p.a;if(e.d>=PL){leak(e);continue}}
  if(d.rng){e.atk-=dt;if(e.atk<=0){let bt=null,bd=d.rng;for(const o of g.T){if(o.ty==='mine'||o.dead)continue;const dd=Math.hypot(o.x-e.x,o.y-e.y);if(dd<bd){bd=dd;bt=o}}
   if(bt){bt.hp-=d.dps*.5;if(bt.hp<=0)bt.dead=true;addFx({k:'tr',x1:e.x,y1:e.y,x2:bt.x,y2:bt.y,c:'#ff6a4a',ti:0,t:.1})}e.atk=.5}}}
 for(const m of g.T){if(m.ty!=='mine'||m.dead)continue;for(const e of g.E){if(!e.air&&!e.dead&&Math.hypot(e.x-m.x,e.y-m.y)<ET[e.ty].r+14){m.dead=true;boom(m.x,m.y,58,150+g.w*9,m.own,false,true);break}}}
 for(const o of g.T){const d=TT[o.ty];if(o.dead)continue;
  if(d.rr){for(const q of g.T)if(q!==o&&Math.hypot(q.x-o.x,q.y-o.y)<=d.rr&&q.hp<q.mhp&&q.ty!=='mine')q.hp=Math.min(q.mhp,q.hp+14*dt)}
  if(!d.d)continue;o.cd-=dt;if(o.cd>0)continue;
  const st=tstat(o);let bt=null,bs=-1;
  for(const e of g.E){if(e.dead)continue;if(e.air?!d.a:!d.g)continue;const dist=Math.hypot(e.x-o.x,e.y-o.y);if(dist>st.r)continue;if(d.min&&dist<d.min)continue;
   const sc=o.ty==='sniper'?e.hp:(e.air?5000-Math.hypot(BX-e.x,BY-e.y):e.d);if(sc>bs){bs=sc;bt=e}}
  if(!bt)continue;
  o.cd=1/st.f;o.ang=Math.atan2(bt.y-o.y,bt.x-o.x);
  if(d.shell){const T=Math.hypot(bt.x-o.x,bt.y-o.y)/230+.35;let lx=bt.x,ly=bt.y;if(!bt.air){const p=posAt(Math.min(PL,bt.d+bt.s*T));lx=p.x;ly=p.y}

 if(bSel){if(!validCell(s.T,bSel,c.gx,c.gy)){uiErr('badSpot');return}cmd({k:'b',ty:bSel,gx:c.gx,gy:c.gy});return}
 const o=s.T.find(x=>x.gx===c.gx&&x.gy===c.gy);selId=o?o.id:0;refreshInfo()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){bSel=null;pSel=null;selId=0;refreshInfo()}});
$('#bCall').onclick=()=>{Snd.init();cmd({k:'w'})};
$('#bSpeed').onclick=()=>{if(!G||G.multi)return;G.speed=G.speed===1?2:1;$('#bSpeed').textContent=G.speed+'x'};
$('#bQuit').onclick=()=>{if(confirm('Quit?'))leaveGame()};
function resize(){const w=$('#wrap');if(!w)return;const sc=Math.min(w.clientWidth/W,w.clientHeight/H);if(sc>0){cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px'}}
addEventListener('resize',resize);

/* ================= game flow ================= */
let last=0,hudT=0;
function enterGame(){bSel=pSel=null;selId=0;hov=null;show('sGame');$('#bSpeed').style.display=G&&!G.multi?'':'none';$('#bSpeed').textContent='1x';buildTools();refreshInfo();resize();toast(t('next',30),1500)}
function frame(ts){
 requestAnimationFrame(frame);const dt=Math.min(.1,(ts-last)/1000||0);last=ts;
 if(scr==='sGame'){
  if(G){const sp=G.over?0:G.speed;let rem=dt*sp;while(rem>0){const h=Math.min(rem,1/30);step(h);rem-=h}
   if(G.multi){G.sendT-=dt;if(G.sendT<=0){G.sendT=.085;const m=snap();for(const x of Net.conns)Net.send(x.c,m)}}else G.ev.length=0}
  else if(V)updateView(dt);
  render();hudT-=dt;if(hudT<=0){hudT=.15;hudTick()}}}
function leaveGame(){
 if(Net.role==='host')for(const x of Net.conns)Net.send(x.c,{t:'bye'});
 Net.close();G=null;V=null;R.online=false;R.host=true;show('sMenu');menuStat()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showEnd(m){
 if(scr!=='sGame')return;
 const win=!!m.win,s=S(),mine=(m.res||[])[me]||{k:0,b:0};
 const coins=Math.round(m.w*4+mine.k/8+(win?100:0)),xp=m.w*10+mine.k;
 prof.coins+=coins;prof.xp+=xp;fixQ();const q=prof.q.p;q.k+=mine.k;q.b+=mine.b;q.w=Math.max(q.w,m.w);q.bs+=m.boss||0;if(win)q.win++;
 prof.lb.push({n:myName(),w:m.w,sc:m.sc,df:s.diff|0,dt:today()});prof.lb.sort((a,b)=>b.sc-a.sc);prof.lb=prof.lb.slice(0,10);save();
 Snd.play(win?'win':'lose');
 $('#eTitle').textContent=t(win?'victory':'defeat');$('#eTitle').style.color=win?'#c9d46a':'#d9534f';
 $('#eBody').innerHTML=`<div>${t('reached')}: <b>${m.w}/${MAXW}</b> · ${t('score')}: <b>${m.sc}</b></div>`+(m.res||[]).map((r,i)=>`<div class="pl" style="width:100%"><span><span class="dot" style="background:${SK[(s.P[i]||{}).s|0].c}"></span>${esc(r.n)}${i===me?' ('+t('you')+')':''}</span><span>${t('kills')}: ${r.k} · 🏗 ${r.b}</span></div>`).join('')+`<div>${t('earned')}: <b>💰 ${coins}</b> · XP +${xp} · ${t('rank')} ${rankOf(prof.xp)}</div>`;
 show('sEnd')}
$('#bAgain').onclick=()=>{Snd.play('click');
 if(R.online){if(R.host){roomBroadcast();for(const x of Net.conns)Net.send(x.c,{t:'lobby'})}G=null;V=null;renderRoom();show('sRoom')}
 else{G=null;V=null;startSolo()}};
$('#bEndMenu').onclick=()=>{Snd.play('click');leaveGame()};

/* ================= menu / solo ================= */
function startSolo(){R.online=false;R.host=true;Net.close();newGame([{n:myName(),s:prof.skin,conn:null}],R.diff);me=0;enterGame()}
$('#bPlay').onclick=()=>{Snd.init();Snd.play('click');prof.name=myName();save();R.online=false;R.host=true;R.code='';R.you=0;R.pl=[{n:myName(),s:prof.skin}];renderRoom();show('sRoom')};
$('#bHow').onclick=()=>{Snd.play('click');$('#modal').classList.add('on')};
$('#bHowClose').onclick=()=>$('#modal').classList.remove('on');

/* ================= armory ================= */
function renderArm(){
 fixQ();$('#aCoins').textContent=prof.coins;
 $('#aQuests').innerHTML=QS.map(q=>{const p=Math.min(q.goal,prof.q.p[q.id]),done=p>=q.goal,cl=prof.q.cl[q.id];
  return`<div class="q"><div style="flex:1">${t('q_'+q.id,q.goal)} <span style="color:var(--dim)">(${p}/${q.goal})</span><div class="bar"><i style="width:${p/q.goal*100}%"></i></div></div><button class="btn sm" data-q="${q.id}" ${done&&!cl?'':'disabled'}>${cl?t('claimed'):'💰'+q.rw+' '+t('claim')}</button></div>`}).join('');
 $('#aQuests').querySelectorAll('button[data-q]').forEach(b=>b.onclick=()=>{const q=QS.find(x=>x.id===b.dataset.q);if(prof.q.p[q.id]>=q.goal&&!prof.q.cl[q.id]){prof.q.cl[q.id]=1;prof.coins+=q.rw;save();Snd.play('build');renderArm()}});
 $('#aSkins').innerHTML=SK.map((s,i)=>{const own=prof.own.includes(i),eq=prof.skin===i;
  return`<div class="sk ${eq?'eq':''}"><div class="sw" style="background:linear-gradient(90deg,${s.c} 60%,${s.a} 60%)"></div><div>${t('s'+i)}</div><button class="btn sm" data-s="${i}" style="margin-top:6px" ${eq||(!own&&prof.coins<SKC[i])?'disabled':''}>${eq?t('equipped'):own?t('equip'):t('buy')+' 💰'+SKC[i]}</button></div>`}).join('');
 $('#aSkins').querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;if(!prof.own.includes(i)){if(prof.coins<SKC[i])return;prof.coins-=SKC[i];prof.own.push(i)}prof.skin=i;save();Snd.play('build');renderArm()});
 $('#aLb').innerHTML=prof.lb.length?prof.lb.map((r,i)=>`<div class="lbr"><b>#${i+1}</b><span style="flex:1">${esc(r.n)}</span><span>🌊${r.w}/30</span><span>${t(['easy','normal','hard'][r.df]||'normal')}</span><b>${r.sc}</b></div>`).join(''):`<div class="sub">${t('lbEmpty')}</div>`}
$('#bArm').onclick=()=>{Snd.play('click');renderArm();show('sArm')};
$('#bArmBack').onclick=()=>{Snd.play('click');menuStat();show('sMenu')};

/* ================= room / online ================= */
const Net={peer:null,role:'',conns:[],conn:null,hb:null,wd:null,last:0,
 send(c,m){try{if(c&&c.open)c.send(m)}catch(e){}},
 close(){clearInterval(this.hb);clearInterval(this.wd);try{this.conns.forEach(x=>x.c.close())}catch(e){}try{this.conn&&this.conn.close()}catch(e){}try{this.peer&&this.peer.destroy()}catch(e){}this.peer=null;this.role='';this.conns=[];this.conn=null}};
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function openPeer(id){return new Promise((res,rej)=>{const p=id?new Peer(id):new Peer();p.on('open',()=>res(p));p.on('error',rej);setTimeout(()=>rej({type:'timeout'}),12000)})}
const lobMsg=k=>$('#lobMsg').textContent=k?t(k):'';
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[rnd(a.length)];return s};
$('#bOnline').onclick=()=>{Snd.init();Snd.play('click');prof.name=myName();save();Net.close();lobMsg();show('sLobby')};
$('#bLobBack').onclick=()=>{Net.close();show('sMenu')};
$('#bRoomBack').onclick=()=>{Snd.play('click');if(R.online)leaveGame();else show('sMenu')};
function renderRoom(){
 $('#roomCode').textContent=R.online?R.code:'—';$('#bCopy').style.display=R.online&&R.host?'':'none';
 $('#plist').innerHTML=R.pl.map((p,i)=>`<div class="pl"><span><span class="dot" style="background:${SK[p.s|0].c}"></span>${esc(p.n)}</span><span style="color:var(--dim)">${i===R.you?t('you'):''} ${i===0&&R.online?t('host'):''}</span></div>`).join('');
 $('#selDiff').value=R.diff;$('#selDiff').disabled=!R.host;$('#bStart').style.display=R.host?'':'none';
 $('#roomMsg').textContent=R.host?'':t('waitHost')}
$('#selDiff').onchange=e=>{if(R.host){R.diff=+e.target.value;if(R.online)roomBroadcast()}};
function roomBroadcast(){
 const pl=[{n:myName(),s:prof.skin}].concat(Net.conns.filter(x=>x.ready).map(x=>({n:x.name,s:x.skin})));R.pl=pl;R.you=0;
 Net.conns.forEach((x,i)=>Net.send(x.c,{t:'room',pl,diff:R.diff,you:i+1}))}
$('#bStart').onclick=()=>{Snd.init();Snd.play('click');
 if(!R.online){startSolo();return}
 const gs=Net.conns.filter(x=>x.ready).slice(0,3);
 const pl=[{n:myName(),s:prof.skin,conn:null}].concat(gs.map(x=>({n:x.name,s:x.skin,conn:x.c})));
 newGame(pl,R.diff);G.multi=true;me=0;
 gs.forEach((x,i)=>Net.send(x.c,{t:'start',pl:pl.map(p=>({n:p.n,s:p.s})),you:i+1,diff:R.diff}));
 enterGame()};
let cidN=1;
$('#bCreate').onclick=async()=>{
 Snd.play('click');lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let code,peer;
 for(let q=0;q<5;q++){code=genCode();try{peer=await openPeer('bastionops-'+code);break}catch(e){if(!(e&&e.type==='unavailable-id')){lobMsg('connErr');return}}}
 if(!peer){lobMsg('connErr');return}
 Net.peer=peer;Net.role='host';R.online=true;R.host=true;R.code=code;
 peer.on('connection',c=>{const x={c,cid:cidN++,ready:false,name:'',skin:0};
  const reg=()=>{c.on('data',m=>hostData(x,m));c.on('close',()=>guestGone(x));c.on('error',()=>{})};if(c.open)reg();else c.on('open',reg)});
 peer.on('error',()=>{});
 R.pl=[{n:myName(),s:prof.skin}];R.you=0;renderRoom();show('sRoom')};
function guestGone(x){
 const i=Net.conns.indexOf(x);if(i<0)return;Net.conns.splice(i,1);
 if(G&&!G.over){const p=G.P.find(q=>q.conn===x.c);if(p)p.conn=null}
 else if(scr==='sRoom'||scr==='sEnd'){roomBroadcast();if(scr==='sRoom')renderRoom()}}
function refuse(x){Net.send(x.c,{t:'full'});setTimeout(()=>{try{x.c.close()}catch(e){}},300)}
function hostData(x,m){
 if(!m||typeof m!=='object')return;
 if(m.t==='hello'){
  if((G&&!G.over)||scr==='sGame'||x.ready)return refuse(x);
  if(Net.conns.filter(y=>y.ready).length>=3)return refuse(x);
  x.name=String(m.name||'Cmdr').slice(0,12);x.skin=clamp(m.skin|0,0,SK.length-1);x.ready=true;Net.conns.push(x);roomBroadcast();renderRoom();return}
 if(!x.ready)return;
 if(m.t==='cmd'&&G&&!G.over){const pi=G.P.findIndex(p=>p.conn===x.c);if(pi<0)return;
  const k=m.k;if(k==='b')doCmd(pi,{k,ty:String(m.ty),gx:m.gx|0,gy:m.gy|0});else if(k==='u'||k==='s')doCmd(pi,{k,id:m.id|0});else if(k==='w')doCmd(pi,{k});else if(k==='p')doCmd(pi,{k,p:String(m.p),x:+m.x,y:+m.y})}}
async function joinRoom(code){
 code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){lobMsg('notFound');return}lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let peer;try{peer=await openPeer()}catch(e){lobMsg('connErr');return}
 Net.peer=peer;Net.role='guest';let opened=false;
 peer.on('error',e=>{if(!opened)lobMsg(e&&e.type==='peer-unavailable'?'notFound':'connErr')});
 const c=peer.connect('bastionops-'+code,{reliable:true});Net.conn=c;
 c.on('open',()=>{opened=true;R.online=true;R.host=false;R.code=code;Net.last=Date.now();
  c.send({t:'hello',name:myName(),skin:prof.skin});
  Net.hb=setInterval(()=>Net.send(c,{t:'ping'}),3000);
  Net.wd=setInterval(()=>{if(Date.now()-Net.last>15000)hostGone()},2000)});
 c.on('data',guestData);c.on('close',()=>{if(opened)hostGone()});c.on('error',()=>{});
 setTimeout(()=>{if(!opened&&Net.peer===peer){lobMsg('notFound');Net.close()}},12000)}
function hostGone(){if(!Net.peer)return;Net.close();toast(t('hostLeft'),3000);V=null;G=null;R.online=false;R.host=true;show('sMenu')}
$('#bJoin').onclick=()=>{Snd.init();Snd.play('click');prof.name=myName();save();joinRoom($('#joinCode').value)};
$('#bCopy').onclick=async()=>{const url=location.origin+location.pathname+'?room='+R.code;try{await navigator.clipboard.writeText(url);toast(t('copied'))}catch(e){$('#roomMsg').textContent=url}};
function guestData(m){
 if(!m||typeof m!=='object')return;Net.last=Date.now();
 switch(m.t){
  case'room':R.pl=(m.pl||[]).slice(0,4).map(p=>({n:String(p.n).slice(0,12),s:clamp(p.s|0,0,SK.length-1)}));R.diff=clamp(m.diff|0,0,2);R.you=m.you|0;
   if(scr!=='sGame'&&scr!=='sEnd'){renderRoom();show('sRoom')}break;
  case'full':Net.close();lobMsg('full');show('sLobby');break;
  case'start':{if(!Array.isArray(m.pl)||m.pl.length<2||m.pl.length>4)break;
   const dd=clamp(m.diff|0,0,2),df=DF[dd];G=null;me=clamp(m.you|0,0,m.pl.length-1);
   V={P:m.pl.map(p=>({n:String(p.n).slice(0,12),s:clamp(p.s|0,0,SK.length-1),money:df.m,cd:{air:0,frz:0,sup:0}})),T:[],E:[],Em:new Map(),PR:[],fx:[],w:0,ph:'prep',cdn:30,hp:df.h,mh:df.h,frz:0,en:0,diff:dd,over:false};
   enterGame();break}
  case's':if(V&&!V.over&&Array.isArray(m.T)&&Array.isArray(m.E))applySnap(m);break;
  case'end':if(V&&!V.over){V.over=true;setTimeout(()=>showEnd(m),900)}break;
  case'lobby':if(scr==='sEnd'||scr==='sGame'){V=null;renderRoom();show('sRoom')}break;
  case'err':if(typeof m.k==='string'&&D[m.k])uiErr(m.k);break;
  case'bye':hostGone();break}}

/* ================= boot ================= */
applyLang();menuStat();
window.__bo={G:()=>G,V:()=>V,step,doCmd};
requestAnimationFrame(frame);
(function(){const q=new URLSearchParams(location.search).get('room');if(q){show('sLobby');$('#joinCode').value=q.toUpperCase().slice(0,5);setTimeout(()=>joinRoom(q),150)}})();
</script>
</body>
