<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supreme Group</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root { --bg:#120a24; --card:#1f1440; --gold:#ffcc33; --text:#f4efff; --muted:#a99cc9; --bad:#ff5c7a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(circle at top, #2c1a5c, var(--bg)); color:var(--text);
         font-family:system-ui, sans-serif; padding:16px; }
  .card { background:var(--card); border:2px solid var(--gold); border-radius:20px; padding:32px 24px;
          width:100%; max-width:380px; text-align:center; box-shadow:0 0 40px #ffcc3333; }
  h1 { margin:0 0 4px; color:var(--gold); font-size:2.4rem; letter-spacing:4px; }
  p { color:var(--muted); }
  input { width:100%; font-size:2rem; text-align:center; letter-spacing:12px; padding:12px;
          border-radius:12px; border:2px solid var(--muted); background:#0e0820; color:var(--text); }
  button { margin-top:16px; width:100%; padding:14px; font-size:1.2rem; font-weight:700; border:none;
           border-radius:12px; background:var(--gold); color:#1a1030; cursor:pointer; }
  .msg { min-height:1.4em; margin-top:12px; color:var(--bad); font-weight:600; }
  .shake { animation:shake .35s; }
  @keyframes shake { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  #inside { display:none; }
  #inside ul { list-style:none; padding:0; text-align:left; }
  #inside li { background:#0e0820; margin:8px 0; padding:10px 14px; border-radius:10px; }
  h2 { color:var(--gold); margin:24px 0 4px; font-size:1.3rem; text-align:left; }
  .ep { cursor:pointer; }
  .ep b { color:var(--gold); }
  .ep small { display:block; color:var(--muted); margin-top:4px; }
  .ep.done { opacity:.55; }
  .ep.done b::after { content:"  ✅"; }
  .ep .del { float:right; color:var(--bad); cursor:pointer; padding-left:8px; }
  .small-in { font-size:1rem !important; letter-spacing:0 !important; padding:10px !important; margin-top:8px; }

  #tv { position:fixed; inset:0; background:#000; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:9; padding:16px; }
  #screen { position:relative; width:100%; max-width:720px; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:linear-gradient(#2c1a5c,#120a24); border:2px solid var(--gold); }
  #stage { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:space-around; padding-bottom:12%; font-size:clamp(2rem,9vw,4.5rem); }
  #caption { position:absolute; left:0; right:0; top:0; padding:14px 18px; font-size:clamp(.9rem,3.5vw,1.25rem); text-align:center; background:#0008; min-height:3em; }
  #ground { position:absolute; left:0; right:0; bottom:0; height:12%; background:#0e0820; }
  .actor { position:relative; z-index:1; display:inline-block; }
  .hop { animation:hop .6s infinite alternate; }
  .hit { animation:hit .5s infinite; }
  .enter-l { animation:enterL 1s both; } .enter-r { animation:enterR 1s both; }
  .spin { animation:spin 1s linear infinite; }
  @keyframes hop { to { transform:translateY(-25%); } }
  @keyframes hit { 50% { transform:translateX(30%) rotate(15deg); } }
  @keyframes enterL { from { transform:translateX(-300%); } } @keyframes enterR { from { transform:translateX(300%); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  .flash { animation:flash .3s 3; } @keyframes flash { 50% { filter:brightness(3); } }
  .title-card { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; }
  .title-card h3 { color:var(--gold); font-size:clamp(1.4rem,6vw,2.6rem); margin:8px 0; }
  #tvbar { display:flex; gap:8px; width:100%; max-width:720px; margin-top:12px; }
  #tvbar button { margin:0; padding:10px; font-size:1rem; }
  .ep .play { color:var(--gold); }
  #stage { display:block; padding:0; } #stage canvas { width:100%; height:100%; display:block; }
  #ground { display:none; }
  .title-card { background:#0007; z-index:2; } #caption { z-index:2; }
</style>
</head>
<body>
  <div class="card" id="lock">
    <h1>👑 SUPREME</h1>
    <p>Enter the group code to join</p>
    <input id="code" type="password" inputmode="numeric" maxlength="4" autofocus>
    <button id="go">Join</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="inside">
    <h1>👑 SUPREME</h1>
    <p>Welcome to the group!</p>
    <ul id="members"></ul>
    <input id="name" type="text" placeholder="Your name" style="font-size:1.1rem;letter-spacing:0">
    <button id="add">Add me</button>
    <h2>🎬 Episodes</h2>
    <ul id="episodes"></ul>
    <input id="epTitle" class="small-in" type="text" placeholder="Episode title">
    <input id="epDesc" class="small-in" type="text" placeholder="What happens? (optional)">
    <button id="addEp">Add episode</button>
    <button id="leave" style="background:#3a2a66;color:var(--text)">Lock</button>
  </div>

<div id="tv">
    <div id="screen"><div id="ground"></div><div id="stage"></div><div id="caption"></div></div>
    <div id="tvbar">
      <button id="tvPrev">⏮</button><button id="tvPause">⏸</button><button id="tvNext">⏭</button>
      <button id="tvMark">✅ Watched</button><button id="tvClose" style="background:#3a2a66;color:var(--text)">✖ Close</button>
    </div>
  </div>

<script>
  const CODE = "3149";
  const $ = id => document.getElementById(id);
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} }
  };
  let members = JSON.parse(store.get("supreme-members") || "[]");

  function render(){
    $("members").innerHTML = members.length
      ? members.map(m => `<li>⭐ ${m.replace(/</g,"&lt;")}</li>`).join("")
      : "<li>No members yet — be the first!</li>";
  }
  let episodes = JSON.parse(store.get("supreme-episodes-v4") || "null") || [
    { title:"Rise of the Supreme", desc:"Four friends find a glowing crown in an old dojo and become the Supreme ninja.", done:false },
    { title:"The Elemental Trial", desc:"Each ninja must unlock their power: Storm, Magma, Frost and Stone.", done:false },
    { title:"Shadow Over the City", desc:"A masked warrior called Night Fang steals the first Golden Scroll.", done:false },
    { title:"Spinjump Training", desc:"Master Oru teaches the team the Cyclone Spin, but nobody can land it.", done:false },
    { title:"The Lost Temple", desc:"The ninja go into the jungle to find the second Scroll before Night Fang does.", done:false },
    { title:"Skeleton Army", desc:"Night Fang wakes an army of bone warriors from under the mountains.", done:false },
    { title:"The Dragon Egg", desc:"Storm finds a giant egg that hatches into a baby lightning dragon called Zip.", done:false },
    { title:"Betrayal", desc:"A new ninja joins the team, but is she secretly working for Night Fang?", done:false },
    { title:"Battle on the Sky Ship", desc:"The team fights on board Night Fang's flying ship above the clouds.", done:false },
    { title:"The Frozen Peak", desc:"Frost has to climb an ice mountain alone to face his fears.", done:false },
    { title:"Snake Tribes", desc:"Four snake tribes come out of hiding and fight over the Scrolls.", done:false },
    { title:"Magma's Secret", desc:"Magma learns his dad was a famous ninja who disappeared long ago.", done:false },
    { title:"The Tournament of Shadows", desc:"The ninja enter a secret tournament where losing means losing your power.", done:false },
    { title:"Zip Grows Up", desc:"Zip the dragon is now big enough to ride into battle.", done:false },
    { title:"The Stone Golem", desc:"Stone has to stop a giant golem without breaking the city.", done:false },
    { title:"Night Fang Unmasked", desc:"The team finally finds out who is behind the mask.", done:false },
    { title:"The Last Scroll", desc:"Everyone races to the fire volcano to find the final Golden Scroll.", done:false },
    { title:"The Supreme Code", desc:"The four ninja combine their powers and unlock the Supreme Code.", done:false },
    { title:"The Great War", desc:"Skeletons, snakes and sky pirates attack the city all at once.", done:false },
    { title:"Rise of the Crown", desc:"The final battle. The Supreme ninja save the world, but a new evil is waking up...", done:false },
    { season:2, title:"The Waking Evil", desc:"Deep under the ocean, the ancient Void Queen opens her eyes.", done:false },
    { season:2, title:"A New Ninja", desc:"A kid named Wren shows up with a power nobody has seen before: Light.", done:false },
    { season:2, title:"The Void Storm", desc:"Purple storms swallow whole villages, and the ninja's powers start to fade.", done:false },
    { season:2, title:"Underwater Dojo", desc:"The team builds bubble suits to explore the drowned city of Mareth.", done:false },
    { season:2, title:"Zip's Family", desc:"Zip hears a call from far away and flies off to find other lightning dragons.", done:false },
    { season:2, title:"Crown of Shadows", desc:"The Void Queen wants the Supreme crown so she can turn it dark.", done:false },
    { season:2, title:"Night Fang Returns", desc:"Their old enemy comes back, but this time he asks the ninja for help.", done:false },
    { season:2, title:"The Mirror Ninja", desc:"Evil copies of the four ninja attack the city.", done:false },
    { season:2, title:"Frost and Fire", desc:"Frost and Magma have a huge fight and the team splits up.", done:false },
    { season:2, title:"Wren's Choice", desc:"The Void Queen offers Wren unlimited power if he joins her.", done:false },
    { season:2, title:"The Sky Pirates' Deal", desc:"The ninja have to team up with sky pirates to cross the Void Sea.", done:false },
    { season:2, title:"Master Oru's Past", desc:"The team learns Master Oru once fought the Void Queen and lost.", done:false },
    { season:2, title:"Mech Battle", desc:"The ninja build giant robot suits to fight the Void titans.", done:false },
    { season:2, title:"The Broken Crown", desc:"The crown cracks in half, and the ninja lose their elements.", done:false },
    { season:2, title:"Powerless", desc:"With no powers, the ninja must win using only teamwork and clever tricks.", done:false },
    { season:2, title:"The Dragon Council", desc:"Zip comes back with an army of lightning dragons.", done:false },
    { season:2, title:"Stone Stands Alone", desc:"Stone holds the city gate by himself for one long night.", done:false },
    { season:2, title:"Into the Void", desc:"The ninja jump through the portal into the Void Queen's world.", done:false },
    { season:2, title:"The Fifth Element", desc:"Wren's Light power fixes the crown and gives everyone a new upgraded power.", done:false },
    { season:2, title:"Dawn of Season 3", desc:"The Void Queen is defeated, but a strange time crack opens in the sky...", done:false },
    { season:3, title:"Cracks in Time", desc:"The time crack spits out a dinosaur, a knight and a robot into the city.", done:false },
    { season:3, title:"The Clockmaker", desc:"A villain called the Clockmaker wants to rewind the world to before the ninja existed.", done:false },
    { season:3, title:"Back to the Dojo", desc:"The ninja fall into the past and meet a young Master Oru.", done:false },
    { season:3, title:"Future Ninja", desc:"Storm is pulled 100 years into the future and sees a ruined city.", done:false },
    { season:3, title:"The Time Blades", desc:"Four ancient blades can control time. The race to find them begins.", done:false },
    { season:3, title:"Frozen in a Second", desc:"The Clockmaker freezes everyone except Frost and Wren.", done:false },
    { season:3, title:"Dino Valley", desc:"The team rides dinosaurs to grab the first Time Blade.", done:false },
    { season:3, title:"Old Magma", desc:"Magma meets his older self, who warns him about a terrible choice.", done:false },
    { season:3, title:"The Clock Tower", desc:"The ninja break into the Clockmaker's giant tower in the middle of time.", done:false },
    { season:3, title:"Zip vs. the Iron Dragon", desc:"Zip battles a robot dragon built from the future.", done:false },
    { season:3, title:"Night Fang's Sacrifice", desc:"Night Fang gives up his freedom so the ninja can escape.", done:false },
    { season:3, title:"Loop", desc:"Stone keeps reliving the same day and has to find a way to break the loop.", done:false },
    { season:3, title:"The Missing Ninja", desc:"Wren disappears from every photo. Someone has erased him from history.", done:false },
    { season:3, title:"Pirates of Yesterday", desc:"The sky pirates help the team sail through the River of Time.", done:false },
    { season:3, title:"The Clockmaker's Story", desc:"The ninja learn why the Clockmaker turned evil, and feel sorry for him.", done:false },
    { season:3, title:"All Four Blades", desc:"The team finally holds every Time Blade, but using them could break the world.", done:false },
    { season:3, title:"Two Teams", desc:"The present ninja and future ninja must fight side by side.", done:false },
    { season:3, title:"Midnight", desc:"The Clockmaker sets every clock to midnight. The world starts to stop.", done:false },
    { season:3, title:"Time Spin", desc:"The ninja combine the Cyclone Spin with time power to fix history.", done:false },
    { season:3, title:"The Return of the Crown", desc:"Time is fixed, Night Fang is saved, but a giant shadow appears on the moon...", done:false }
  ];
  const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  function saveEps(){ store.set("supreme-episodes-v4", JSON.stringify(episodes)); }
  function renderEps(){
    if (!episodes.length) { $("episodes").innerHTML = "<li>No episodes yet — add one!</li>"; return; }
    let html = "", season = 0, n = 0;
    episodes.forEach((e,i) => {
      const se = e.season || 1;
      if (se !== season) { season = se; n = 0; html += `<h2>Season ${se}</h2>`; }
      n++;
      html += `<li class="ep${e.done?" done":""}" data-i="${i}"><span class="del" data-del="${i}">✖</span><b><span class="play">▶</span> Episode ${n}: ${esc(e.title)}</b>${e.desc?`<small>${esc(e.desc)}</small>`:""}</li>`;
    });
    $("episodes").innerHTML = html;
  }
  $("episodes").onclick = ev => {
    const d = ev.target.dataset.del;
    if (d !== undefined) { if (confirm("Delete this episode?")) episodes.splice(+d,1); }
    else { const li = ev.target.closest(".ep"); if (!li) return; watch(+li.dataset.i); return; }
    saveEps(); renderEps();
  };
  $("addEp").onclick = () => {
    const t = $("epTitle").value.trim(); if (!t) return;
    episodes.push({ season:Math.max(1,...episodes.map(e=>e.season||1)), title:t, desc:$("epDesc").value.trim(), done:false });
    saveEps(); renderEps(); $("epTitle").value = $("epDesc").value = "";
  };
  function open(){ renderEps(); $("lock").style.display="none"; $("inside").style.display="block"; render(); }

  function tryCode(){
    if ($("code").value === CODE) { open(); }
    else {
      $("msg").textContent = "Wrong code!";
      $("lock").classList.remove("shake"); void $("lock").offsetWidth; $("lock").classList.add("shake");
      $("code").value = "";
    }
  }
  $("go").onclick = tryCode;
  $("code").addEventListener("keydown", e => { if (e.key === "Enter") tryCode(); });
  $("add").onclick = () => {
    const n = $("name").value.trim();
    if (n && !members.includes(n)) { members.push(n); store.set("supreme-members", JSON.stringify(members)); render(); }
    $("name").value = "";
  };
  $("leave").onclick = () => { $("inside").style.display="none"; $("lock").style.display="block"; $("code").value=""; $("msg").textContent=""; };

  // ---------- 3D Episode player ----------
  const HERO_COLOR = { Storm:0x3fa9ff, Magma:0xff5a1f, Frost:0xcff4ff, Stone:0x8d7b68, Wren:0xfff27a };
  const VILLAINS = { 1:{ name:"Night Fang", color:0x1b1b1b, eyes:0xff2020, top:"horns" },
                     2:{ name:"the Void Queen", color:0x5b2a86, eyes:0xd06bff, top:"crown" },
                     3:{ name:"the Clockmaker", color:0x7a5a2a, eyes:0x7cf7ff, top:"hat" } };
  const SETS = [
    { sky:0x2a1650, ground:0x5a3d22, props:"dojo" },   { sky:0x3a0d0d, ground:0x2a1a14, props:"volcano" },
    { sky:0x8fb8de, ground:0xe8f4ff, props:"peaks" },  { sky:0x0b3a5c, ground:0x1d6fa3, props:"ocean" },
    { sky:0x14142e, ground:0x333344, props:"city" },   { sky:0x3f7d58, ground:0x2f6b2a, props:"jungle" },
    { sky:0x9ad0ff, ground:0xffffff, props:"clouds" }, { sky:0x2b2340, ground:0x4a4a4a, props:"castle" } ];
  let tv = { i:0, scene:0, scenes:[], timer:null, paused:false };
  let R=null, scene3, cam, clock, world, heroes3=[], villain3=null, dragon3=null, sparks=[], mode="title", modeT=0, shake=0, landed=false;

  const mats = {};
  const mat = (c, glow) => mats[c+"|"+!!glow] || (mats[c+"|"+!!glow] = glow
      ? new THREE.MeshBasicMaterial({ color:c })
      : new THREE.MeshStandardMaterial({ color:c, flatShading:true, roughness:.7 }));
  function mesh(geo, c, x=0, y=0, z=0, glow){ const m = new THREE.Mesh(geo, mat(c, glow)); m.position.set(x,y,z); return m; }
  function rng(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }

  function makeNinja(c, eyes=0xffffff){
    const g = new THREE.Group();
    g.add(mesh(new THREE.BoxGeometry(.7,.8,.45), c, 0,1.05,0));
    g.add(mesh(new THREE.BoxGeometry(.72,.12,.47), 0x222222, 0,.78,0));
    g.add(mesh(new THREE.SphereGeometry(.34,12,10), c, 0,1.75,0));
    g.add(mesh(new THREE.BoxGeometry(.52,.14,.12), 0x111111, 0,1.78,.27));
    g.add(mesh(new THREE.SphereGeometry(.05,6,6), eyes, -.11,1.79,.34, true));
    g.add(mesh(new THREE.SphereGeometry(.05,6,6), eyes, .11,1.79,.34, true));
    const sword = mesh(new THREE.BoxGeometry(.06,1.1,.04), 0xcccccc, .15,1.3,-.28); sword.rotation.z = .6; g.add(sword);
    const limb = (x, y, h, w) => { const piv = new THREE.Group(); piv.position.set(x,y,0);
      piv.add(mesh(new THREE.BoxGeometry(w,h,w), c, 0,-h/2,0)); g.add(piv); return piv; };
    g.userData = { legL:limb(-.18,.72,.7,.24), legR:limb(.18,.72,.7,.24), armL:limb(-.47,1.4,.65,.18), armR:limb(.47,1.4,.65,.18) };
    return g;
  }
  function makeVillain(v){
    const g = makeNinja(v.color, v.eyes); g.scale.setScalar(1.55);
    if (v.top === "horns") [-1,1].forEach(s => { const h = mesh(new THREE.ConeGeometry(.08,.4,6), 0xaa0000, s*.22,2.1,0); h.rotation.z = -s*.4; g.add(h); });
    if (v.top === "crown") for (let k=0;k<5;k++){ const a=k/5*Math.PI*2; g.add(mesh(new THREE.ConeGeometry(.07,.3,5), 0xd06bff, Math.cos(a)*.25,2.15,Math.sin(a)*.25, true)); }
    if (v.top === "hat") { g.add(mesh(new THREE.CylinderGeometry(.42,.42,.05,16), 0x222222, 0,2.05,0)); g.add(mesh(new THREE.CylinderGeometry(.25,.25,.45,16), 0x222222, 0,2.3,0));
      const clockFace = mesh(new THREE.CylinderGeometry(.22,.22,.05,16), 0xffe9a8, 0,1.1,.25, true); clockFace.rotation.x = Math.PI/2; g.add(clockFace); }
    return g;
  }
  function makeDragon(){
    const g = new THREE.Group();
    for (let k=0;k<6;k++) g.add(mesh(new THREE.SphereGeometry(.35-k*.04,8,8), 0xffd21f, 0,0,-k*.45));
    g.add(mesh(new THREE.BoxGeometry(.45,.35,.6), 0xffd21f, 0,.1,.45));
    g.add(mesh(new THREE.SphereGeometry(.06,6,6), 0x00e0ff, -.15,.2,.7, true)); g.add(mesh(new THREE.SphereGeometry(.06,6,6), 0x00e0ff, .15,.2,.7, true));
    const wing = s => { const piv = new THREE.Group(); piv.position.set(s*.25,.15,-.4); piv.add(mesh(new THREE.BoxGeometry(1.4,.04,.7), 0x3fa9ff, s*.7,0,0)); g.add(piv); return piv; };
    g.userData = { wL:wing(-1), wR:wing(1) };
    return g;
  }
  function buildSet(set, seed){
    const g = new THREE.Group(), r = rng(seed+7);
    const ground = mesh(new THREE.CircleGeometry(40,32), set.ground, 0,0,0); ground.rotation.x = -Math.PI/2; g.add(ground);
    const spot = () => { let x, z; do { x = (r()-.5)*40; z = -4 - r()*22; } while (Math.abs(x) < 3 && z > -7); return [x, z]; };
    for (let k=0;k<14;k++){
      const [x,z] = spot(), s = .7 + r()*1.3;
      if (set.props==="dojo"){ if(k<3){ const bx=k*7-7; g.add(mesh(new THREE.BoxGeometry(4,2.5,3),0xb03a2e,bx,1.25,-10)); const roof=mesh(new THREE.ConeGeometry(3.3,1.6,4),0x222222,bx,3.3,-10); roof.rotation.y=Math.PI/4; g.add(roof);} else g.add(mesh(new THREE.SphereGeometry(.8*s,8,8),0xff9ad5,x,2*s,z)); }
      if (set.props==="volcano"){ if(k===0){ g.add(mesh(new THREE.ConeGeometry(9,10,12),0x3a2a22,0,5,-22)); g.add(mesh(new THREE.ConeGeometry(2.2,2,12),0xff4d00,0,9.2,-22,true)); } else g.add(mesh(new THREE.DodecahedronGeometry(.6*s),0x2a1a14,x,.4*s,z)); }
      if (set.props==="peaks"){ g.add(mesh(new THREE.ConeGeometry(3*s,7*s,6),0xdfefff,x,3.5*s,z-6)); }
      if (set.props==="ocean"){ g.add(mesh(new THREE.ConeGeometry(.3,3*s,5),0x2fd3a0,x,1.5*s,z)); if(k<4) g.add(mesh(new THREE.SphereGeometry(.4,8,8),0xbff6ff,x+1,2+r()*3,z,true)); }
      if (set.props==="city"){ const h=3+r()*9; g.add(mesh(new THREE.BoxGeometry(2,h,2),0x2c2c54,x,h/2,z-4)); g.add(mesh(new THREE.BoxGeometry(2.05,.2,2.05),0xffe066,x,h*.7,z-4,true)); }
      if (set.props==="jungle"){ g.add(mesh(new THREE.CylinderGeometry(.15,.2,3*s,6),0x6b4423,x,1.5*s,z)); g.add(mesh(new THREE.ConeGeometry(1.4*s,2*s,7),0x1f8a3a,x,3.4*s,z)); }
      if (set.props==="clouds"){ g.add(mesh(new THREE.SphereGeometry(1.5*s,10,8),0xffffff,x,r()*5,z)); }
      if (set.props==="castle"){ if(k<4){ const bx=k*5-7.5; g.add(mesh(new THREE.BoxGeometry(3,5,3),0x6d6d7a,bx,2.5,-14)); g.add(mesh(new THREE.ConeGeometry(2.2,2.5,4),0x3a2a66,bx,6.25,-14)); } else g.add(mesh(new THREE.DodecahedronGeometry(.5*s),0x55555f,x,.3,z)); }
    }
    return g;
  }

  function initThree(){
    if (R) return true; if (!window.THREE) return false;
    R = new THREE.WebGLRenderer({ antialias:true }); R.setPixelRatio(Math.min(devicePixelRatio, 2));
    $("stage").appendChild(R.domElement);
    scene3 = new THREE.Scene(); cam = new THREE.PerspectiveCamera(50, 16/9, .1, 200);
    scene3.add(new THREE.HemisphereLight(0xffffff, 0x443366, .85));
    const sun = new THREE.DirectionalLight(0xffffff, .8); sun.position.set(5,10,6); scene3.add(sun);
    clock = new THREE.Clock(); R.setAnimationLoop(tick); return true;
  }
  function setupWorld(i, heroNames, se, dragon){
    if (world) scene3.remove(world);
    world = new THREE.Group(); scene3.add(world);
    const set = SETS[(i*3) % SETS.length], sky = new THREE.Color(set.sky);
    if (se === 2) sky.lerp(new THREE.Color(0x2a0a3a), .45);
    if (se === 3) sky.lerp(new THREE.Color(0x3a2a0a), .3);
    scene3.background = sky; scene3.fog = new THREE.Fog(sky, 18, 45);
    world.add(buildSet(set, i+1));
    heroes3 = heroNames.map(n => { const h = makeNinja(HERO_COLOR[n]); world.add(h); return h; });
    villain3 = makeVillain(VILLAINS[se] || VILLAINS[1]); world.add(villain3);
    dragon3 = dragon ? makeDragon() : null; if (dragon3) world.add(dragon3);
    sparks = [];
  }
  function spark(x, y, z, c){
    for (let k=0;k<8;k++){ const m = mesh(new THREE.SphereGeometry(.08,5,5), c, x,y,z, true);
      m.userData = { v:new THREE.Vector3((Math.random()-.5)*6, Math.random()*5, (Math.random()-.5)*6), life:.7 };
      world.add(m); sparks.push(m); }
  }
  const ease = p => 1 - Math.pow(1-p, 3);
  function tick(){
    if (!R || $("tv").style.display !== "flex" || !world) return;
    const dt = Math.min(clock.getDelta(), .05), T = clock.elapsedTime; if (!tv.paused) modeT += dt; const t = modeT;
    const w = $("screen").clientWidth, h = $("screen").clientHeight;
    if (R.domElement.width !== Math.floor(w*R.getPixelRatio())) { R.setSize(w, h, false); cam.aspect = w/h; cam.updateProjectionMatrix(); }
    const n = heroes3.length, vx = 4.5;
    heroes3.forEach((hh, k) => {
      const home = -1.4*(n-1) + k*1.4 - 1, u = hh.userData; let x = home, y = 0, ry = 0, walk = 0, spin = false;
      if (mode === "enter"){ const p = Math.min(1, Math.max(0, t - k*.15)/1.6); x = -16 + (home+16)*ease(p); ry = p < 1 ? Math.PI/2 : 0; walk = p < 1 ? 1 : 0; }
      else if (mode === "villain") ry = Math.PI/2*.7;
      else if (mode === "fight"){ const p = (t*.7 + k/n) % 1, a = Math.sin(p*Math.PI);
        x = home + (vx-1.3-home)*a; y = a*2.2; ry = Math.PI/2; spin = y > .4; walk = .5;
        if (p > .48 && p < .52 && !u.hitNow){ u.hitNow = true; spark(vx-.8, 1.6+Math.random(), 0, HERO_COLOR[Object.keys(HERO_COLOR)[k%5]]); shake = .25; } if (p > .6) u.hitNow = false; }
      else if (mode === "team"){ y = Math.abs(Math.sin(T*5 + k*.3))*.8; }
      else if (mode === "title" || mode === "end"){ y = Math.abs(Math.sin(T*2 + k))*.08; }
      hh.position.set(x, y, 0);
      hh.rotation.y = spin ? T*14 : ry;
      const sw = Math.sin(T*12)*.8*walk;
      u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw; u.armR.rotation.x = sw;
      u.armR.rotation.z = mode === "team" || mode === "end" ? 2.6 + Math.sin(T*8)*.3 : 0;
    });
    const vOn = mode === "villain" || mode === "fight" || mode === "team"; villain3.visible = vOn;
    if (vOn){ let y = 0, x = vx, rz = 0;
      if (mode === "villain"){ y = Math.max(0, 12 - t*16); if (y === 0 && !landed){ landed = true; shake = .8; spark(vx, .2, 0, 0x888888); } }
      if (mode === "fight") x = vx + Math.sin(T*25)*.06;
      if (mode === "team"){ const p = Math.min(1, t/1.2); x = vx + p*3; rz = -p*1.45; }
      villain3.position.set(x, y, 0); villain3.rotation.set(0, -Math.PI/2*.8, rz);
      const vu = villain3.userData, a = mode === "villain" ? Math.sin(T*3)*.5 : Math.sin(T*10)*.6; vu.armL.rotation.x = a; vu.armR.rotation.x = -a; }
    if (dragon3){ dragon3.visible = mode === "fight" || mode === "team" || mode === "end";
      const a = T*.9; dragon3.position.set(Math.cos(a)*7, 4.5 + Math.sin(T*2)*.6, Math.sin(a)*4 - 2); dragon3.rotation.y = -a;
      dragon3.userData.wL.rotation.z = Math.sin(T*9)*.6; dragon3.userData.wR.rotation.z = -Math.sin(T*9)*.6; }
    sparks = sparks.filter(m => { const d = m.userData; d.life -= dt; d.v.y -= 9*dt; m.position.addScaledVector(d.v, dt); m.scale.setScalar(Math.max(.01, d.life/.7)); if (d.life <= 0){ world.remove(m); return false; } return true; });
    const look = new THREE.Vector3(0, 1.2, 0);
    if (mode === "title"){ cam.position.set(Math.sin(T*.3)*10, 3, Math.cos(T*.3)*10); }
    else if (mode === "enter"){ cam.position.set(-3 + t*.6, 2.2, 8.5); }
    else if (mode === "villain"){ cam.position.set(1, 1.6, 7.5); look.set(3.5, 2, 0); }
    else if (mode === "fight"){ const a = T*.35; cam.position.set(1 + Math.sin(a)*8, 2.8, Math.cos(a)*8); look.set(1, 1.5, 0); }
    else if (mode === "team"){ cam.position.set(-1, 1.8, 7); look.set(-1, 1.3, 0); }
    else { cam.position.set(0, 2.5 + t*1.2, 9 + t*1.5); }
    if (shake > .01){ cam.position.x += (Math.random()-.5)*shake; cam.position.y += (Math.random()-.5)*shake; shake *= .88; }
    cam.lookAt(look);
    R.render(scene3, cam);
  }

  function heroesFor(e){
    const all = ["Storm","Magma","Frost","Stone"].concat((e.season||1) >= 2 ? ["Wren"] : []);
    const named = all.filter(n => e.title.includes(n) || e.desc.includes(n));
    return named.length ? named.concat(all.filter(n => !named.includes(n)).slice(0,1)) : all;
  }
  function epNumber(i){ const se = episodes[i].season||1; return episodes.slice(0,i+1).filter(e => (e.season||1) === se).length; }
  function buildScenes(i){
    const e = episodes[i], se = e.season||1, v = VILLAINS[se] || VILLAINS[1], heroes = heroesFor(e);
    const last = i === episodes.length-1;
    return { heroes, se, dragon:/Zip|dragon/i.test(e.title+e.desc), list:[
      { mode:"title", title:`<div class="title-card"><div>👑 SUPREME NINJA</div><div>Season ${se} · Episode ${epNumber(i)}</div><h3>${esc(e.title)}</h3></div>`, say:`Season ${se}, episode ${epNumber(i)}. ${e.title}.` },
      { mode:"enter", cap:esc(e.desc), say:e.desc },
      { mode:"villain", cap:`But ${v.name} is watching...`, say:`But ${v.name} is watching.` },
      { mode:"fight", cap:"Ninja, GO! 🌀", say:"Ninja, go!" },
      { mode:"team", cap:`${heroes.join(", ")} fight together as one team!`, say:`${heroes.join(", ")} fight together as one team!` },
      { mode:"end", title:`<div class="title-card"><h3>${last ? "THE END?" : "To be continued..."}</h3><div>${last ? "" : "Next: "+esc(episodes[i+1].title)}</div></div>`, say: last ? "The end, for now." : `To be continued. Next time: ${episodes[i+1].title}.` } ]};
  }
  function speak(t){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = 1.05; speechSynthesis.speak(u); } catch {} }
  function showScene(){
    const sc = tv.scenes[tv.scene];
    mode = sc.mode; modeT = 0; landed = false;
    $("screen").querySelectorAll(".title-card").forEach(x => x.remove());
    if (sc.title) $("screen").insertAdjacentHTML("beforeend", sc.title);
    $("caption").style.display = sc.cap ? "block" : "none"; $("caption").innerHTML = sc.cap || "";
    if (!R) $("caption").style.display = "block";
    speak(sc.say); schedule();
  }
  function schedule(){
    clearTimeout(tv.timer); if (tv.paused) return;
    tv.timer = setTimeout(() => {
      if (tv.scene < tv.scenes.length-1) { tv.scene++; showScene(); }
      else { episodes[tv.i].done = true; saveEps(); renderEps(); if (tv.i < episodes.length-1) watch(tv.i+1); }
    }, Math.max(mode === "fight" ? 6000 : 4000, tv.scenes[tv.scene].say.length * 75));
  }
  function watch(i){
    $("tv").style.display = "flex";
    const b = buildScenes(i);
    tv.i = i; tv.scene = 0; tv.scenes = b.list; tv.paused = false; $("tvPause").textContent = "⏸";
    if (initThree()) setupWorld(i, b.heroes, b.se, b.dragon);
    showScene();
  }
  $("tvNext").onclick = () => { if (tv.i < episodes.length-1) watch(tv.i+1); };
  $("tvPrev").onclick = () => { if (tv.i > 0) watch(tv.i-1); };
  $("tvPause").onclick = () => { tv.paused = !tv.paused; $("tvPause").textContent = tv.paused ? "▶" : "⏸";
    try { tv.paused ? speechSynthesis.pause() : speechSynthesis.resume(); } catch {} schedule(); };
  $("tvMark").onclick = () => { episodes[tv.i].done ^= true; saveEps(); renderEps(); };
  $("tvClose").onclick = () => { clearTimeout(tv.timer); try { speechSynthesis.cancel(); } catch {} $("tv").style.display = "none"; };
</script>
</body>
