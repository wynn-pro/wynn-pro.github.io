<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buccaneer Bay</title>
<style>
:root{--bg:#0a1a24;--panel:#12303f;--panel2:#194558;--line:#2c6a85;--txt:#eaf6fb;--dim:#8fb4c5;--acc:#ffd166;--red:#e5534b;--blue:#6ec6ff;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
button,select,input{font:inherit;color:inherit}
.scr{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 15%,#1d5b78,#081a24 75%)}
.scr.on{display:flex}
h1{margin:0;font-family:Impact,"Arial Black",sans-serif;letter-spacing:4px;font-size:clamp(34px,9vw,64px);color:var(--acc);text-shadow:0 3px 0 #7a4a10,0 0 24px #ffb84a44;text-align:center}
h2{margin:0;font-size:22px;color:var(--acc)}
.sub{color:var(--dim);margin:0;text-align:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 18px;cursor:pointer;min-width:210px;font-weight:700;transition:.15s}
.btn:hover:not(:disabled){background:#23607a;border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:linear-gradient(#e0a02c,#a8680f);border-color:#ffd166;color:#fff}
.btn.sm{min-width:0;padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
input,select{background:#0a2230;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(560px,100%)}
.msg{min-height:20px;color:var(--gold);text-align:center}
.code{font-family:Impact,monospace;font-size:38px;letter-spacing:8px;color:var(--gold)}
.pl{display:flex;justify-content:space-between;padding:6px 10px;background:#0a2230;border-radius:8px;margin:4px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
#sGame{padding:0;gap:0;justify-content:flex-start;align-items:stretch;background:#06141c}
#hud{display:flex;gap:12px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;font-weight:700;font-size:14px}
#hud .grow{flex:1;min-width:10px;color:var(--gold);text-align:center}
#wrap{flex:1;min-height:0;position:relative;overflow:hidden}
#wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#bar{background:var(--panel);border-top:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:6px}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tb{flex:0 0 auto;min-width:66px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:4px 6px;cursor:pointer;text-align:center;line-height:1.15}
.tb .i{font-size:21px;display:block}.tb .n{font-size:10px;color:var(--dim);display:block;white-space:nowrap}.tb .c{font-size:12px;color:var(--gold);font-weight:700}
.tb.sel{border-color:var(--acc);background:#3b5a2a}.tb.no{opacity:.45}
.tb.snd{border-color:#8a3a3a}
.tb .cd{font-size:11px;color:var(--blue);font-weight:700}
#info{min-height:22px;font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#info b{color:var(--txt)}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:10px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .25s;z-index:20;text-align:center;max-width:90%}
#toast.on{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.sk{background:#0a2230;border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.sk.eq{border-color:var(--acc)}
.sw{height:26px;border-radius:6px;margin-bottom:6px}
.q{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1f4a5f;font-size:14px}
.bar{height:6px;background:#0a2230;border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--acc)}
#modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal.on{display:flex}
#modal .card{max-height:90%;overflow:auto;line-height:1.5}
#modal li{margin:5px 0}
.lbr{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid #1f4a5f;font-size:14px}.lbr b{color:var(--gold)}
</style>
</head>
<body>

<div id="sMenu" class="scr on">
  <h1>BUCCANEER BAY</h1>
  <p class="sub" data-i="sub"></p>
  <div class="row"><input id="inName" maxlength="12" style="width:170px"><select id="selLang"></select></div>
  <div class="row"><span data-i="diff"></span><select id="selBot"></select></div>
  <div class="col">
    <button class="btn pri" id="bPlay" data-i="play"></button>
    <button class="btn" id="bOnline" data-i="online"></button>
    <button class="btn" id="bArm" data-i="armory"></button>
    <button class="btn" id="bHow" data-i="how"></button>
  </div>
  <p class="sub" id="mStat"></p>
</div>

<div id="sLobby" class="scr">
  <h2 data-i="online"></h2>
  <div class="card col">
    <button class="btn pri" id="bCreate" data-i="create"></button>
    <div class="row"><input id="joinCode" maxlength="5" placeholder="ABCDE" style="width:120px;text-transform:uppercase;text-align:center;letter-spacing:4px"><button class="btn sm" id="bJoin" data-i="join"></button></div>
    <div class="msg" id="lobMsg"></div>
  </div>
  <button class="btn" id="bLobBack" data-i="back"></button>
</div>

<div id="sRoom" class="scr">
  <h2 data-i="code"></h2>
  <div class="code" id="roomCode"></div>
  <button class="btn sm" id="bCopy" data-i="copy"></button>
  <div class="card"><div id="plist"></div></div>
  <div class="msg" id="roomMsg"></div>
  <div class="row"><button class="btn pri" id="bStart" data-i="start"></button><button class="btn" id="bRoomBack" data-i="back"></button></div>
</div>

<div id="sGame" class="scr">
  <div id="hud">
    <span>⚓ <span id="hLives"></span></span>
    <span>🏴‍☠️ <span id="hOpp"></span></span>
    <span>💰 <span id="hGold"></span> <small id="hInc" style="color:var(--dim)"></small></span>
    <span class="grow" id="hMsg"></span>
    <button class="btn sm" id="bMute">🔊</button>
    <button class="btn sm" id="bQuit">✕</button>
  </div>
  <div id="wrap"><div id="toast"></div></div>
  <div id="bar"><div class="tools" id="tools"></div><div class="tools" id="sends"></div><div id="info"></div></div>
</div>

<div id="sEnd" class="scr">
  <h1 id="eTitle"></h1>
  <div class="card col" id="eBody"></div>
  <div class="row"><button class="btn pri" id="bAgain" data-i="again"></button><button class="btn" id="bEndMenu" data-i="menu"></button></div>
</div>

<div id="sArm" class="scr" style="justify-content:flex-start">
  <h2>🏴‍☠️ <span data-i="armory"></span> · 💰 <span id="aCoins"></span></h2>
  <div class="card"><h2 data-i="quests" style="font-size:16px"></h2><div id="aQuests"></div></div>
  <div class="card"><h2 data-i="skins" style="font-size:16px;margin-bottom:8px"></h2><div class="grid" id="aSkins"></div></div>
  <div class="card"><h2 data-i="record" style="font-size:16px;margin-bottom:6px"></h2><div id="aLb"></div></div>
  <button class="btn" id="bArmBack" data-i="back"></button>
</div>

<div id="modal"><div class="card"><h2 data-i="how"></h2><div id="howTxt"></div><div class="row" style="margin-top:10px"><button class="btn" id="bHowClose" data-i="back"></button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

 play(n){if(!this.on||!this.ctx)return;const now=performance.now();if(now-(this.last[n]||0)<(n==='shot'?70:n==='boom'?100:0))return;this.last[n]=now;

const CS=40,COLS=18,ROWS=11,W=COLS*CS,H=ROWS*CS;
const PATHC=[[-1,1],[4,1],[4,8],[9,8],[9,3],[13,3],[13,9],[17,9]];
const BASE=PATHC[PATHC.length-1];
const SEG=[],PD={};let PL=0;
(function(){let cum=0;const pts=PATHC.map(p=>[(p[0]+.5)*CS,(p[1]+.5)*CS]);
 for(let i=0;i<pts.length-1;i++){const[x0,y0]=pts[i],[x1,y1]=pts[i+1],len=Math.hypot(x1-x0,y1-y0);
  SEG.push({x0,y0,x1,y1,len,cum,a:Math.atan2(y1-y0,x1-x0)});
  const ax=PATHC[i][0],ay=PATHC[i][1],bx=PATHC[i+1][0],by=PATHC[i+1][1],sx=Math.sign(bx-ax),sy=Math.sign(by-ay),n=Math.max(Math.abs(bx-ax),Math.abs(by-ay));
  for(let k=0;k<=n;k++){const cx=ax+sx*k,cy=ay+sy*k;if(cx>=0&&cy>=0&&cx<COLS&&cy<ROWS){const key=cx+','+cy;if(!(key in PD))PD[key]=cum+k*CS}}
  cum+=len}
 PL=cum})();
function posAt(d){for(let i=0;i<SEG.length;i++){const s=SEG[i];if(d<=s.cum+s.len||i===SEG.length-1){const f=clamp((d-s.cum)/s.len,0,1);return{x:s.x0+(s.x1-s.x0)*f,y:s.y0+(s.y1-s.y0)*f,a:s.a}}}}
const BX=(BASE[0]+.5)*CS,BY=(BASE[1]+.5)*CS;

function tstat(o){const d=TT[o.ty],l=o.lvl-1;return{dm:(d.d||0)*(1+.38*l),r:(d.r||0)*(1+.08*l)*(o.rb?1.2:1),f:(d.f||0)*(1+.12*l),sp:(d.sp||0)*(1+.1*l)}}
function validCell(T,ty,gx,gy){
 if(!TT[ty]||!Number.isInteger(gx)||!Number.isInteger(gy)||gx<0||gy<0||gx>=COLS||gy>=ROWS)return false;
 if(!!TT[ty].path!==((gx+','+gy) in PD))return false;
 if(gx===BASE[0]&&gy===BASE[1])return false;
 for(const o of T)if(o.gx===gx&&o.gy===gy)return false;
 return true}

let cb=null; // board currently being simulated / commanded
function mkBoard(skin,im){return{T:[],E:[],PR:[],fx:[],ev:[],lives:25,gold:320,inc:0,im:im||1,cd:{sto:0,bar:0,rep:0},frz:0,q:[],sq:[],sp:0,k:0,b:0,sent:0,skin,bt:3,opp:25,w:0,wcd:20}}
function newGame(pl,diff,bot){
 G={P:pl,B:[mkBoard(pl[0].s,1),mkBoard(pl[1].s,bot?BOT.im[diff]:1)],w:0,wcd:20,idc:1,over:false,diff,bot,multi:false,sendT:0,time:0};V=null}
function buildWave(w){
 const q=[],a=(ty,n)=>{for(let i=0;i<n;i++)q.push(ty)};
 a('row',Math.round(4+w));if(w>=2)a('sloop',Math.round(w*.8));if(w>=4)a('board',Math.round((w-2)*.5));
 if(w>=5)a('fire',Math.round((w-3)*.4));if(w>=6)a('gal',Math.round((w-4)*.35));if(w>=10)a('iron',Math.round((w-8)*.25));
 q.sort(()=>Math.random()-.5);return q}
function addFx(f){cb.fx.push(f);if(G.multi)cb.ev.push(Object.assign({},f))}
function spawnEnemy(ty){
 const b=cb,d=ET[ty],hm=1+.07*G.w;const p=posAt(0);
 b.E.push({id:G.idc++,ty,d:0,x:p.x,y:p.y,a:p.a,hp:d.hp*hm,mhp:d.hp*hm,s:d.s,atk:0,slow:0,dead:false})}
function pay(e){const b=cb;b.gold+=Math.round(ET[e.ty].rw*(1+.03*G.w));b.k++}
function hurt(e,dm){if(e.dead)return;e.hp-=dm;if(e.hp<=0){e.dead=true;pay(e);addFx({k:'ex',x:e.x,y:e.y,r:e.ty==='iron'||e.ty==='gal'?30:14,t:.4})}}
function area(x,y,r,dm){for(const e of cb.E){if(e.dead)continue;if(Math.hypot(e.x-x,e.y-y)<=r+ET[e.ty].r)hurt(e,dm)}}
function boom(x,y,r,dm){addFx({k:'ex',x,y,r,t:.45});area(x,y,r,dm)}
function stepBoard(b,i,dt){
 cb=b;const g=G;
 for(const k in b.cd)b.cd[k]=Math.max(0,b.cd[k]-dt);b.frz=Math.max(0,b.frz-dt);
 b.gold+=(3+b.inc)*dt*(g.bot&&i===1?BOT.im[g.diff]:1);
 b.opp=g.B[1-i].lives;b.w=g.w;b.wcd=g.wcd;
 if(g.bot&&i===1)botAct(b,i,dt);
 if((b.sq.length||b.q.length)&&(b.sp-=dt)<=0){spawnEnemy(b.sq.length?b.sq.shift():b.q.shift());b.sp=b.sq.length?.45:Math.max(.35,.7-g.w*.01)}
 const lh=b.T.filter(o=>o.ty==='light');
 for(const o of b.T){o.rb=false;if(TT[o.ty].r)for(const l of lh)if(Math.hypot(l.x-o.x,l.y-o.y)<=TT.light.rd){o.rb=true;break}}
 const blk=b.T.filter(o=>TT[o.ty].blk&&!o.dead);
 for(const e of b.E){if(e.dead)continue;const d=ET[e.ty],sp=e.s*(b.frz>0?.35:1);e.slow=b.frz>0;
  let wl=null;if(!d.jump)for(const w of blk){if(w.dead)continue;const df=PD[w.gx+','+w.gy]-e.d;if(df>=-6&&df<=d.r+12){wl=w;break}}
  if(wl){if(d.fire){e.dead=true;addFx({k:'ex',x:e.x,y:e.y,r:48,t:.5});for(const o of b.T)if(o.ty!=='mine'&&Math.hypot(o.x-e.x,o.y-e.y)<60){o.hp-=140;if(o.hp<=0)o.dead=true}continue}
   wl.hp-=d.wd*dt;if(wl.hp<=0)wl.dead=true}
  else{e.d+=sp*dt;const p=posAt(e.d);e.x=p.x;e.y=p.y;e.a=p.a;if(e.d>=PL){leak(e,i);continue}}
  if(d.rng){e.atk-=dt;if(e.atk<=0){let bt=null,bd=d.rng;for(const o of b.T){if(o.ty==='mine'||o.dead)continue;const dd=Math.hypot(o.x-e.x,o.y-e.y);if(dd<bd){bd=dd;bt=o}}
   if(bt){bt.hp-=d.dps*.5;if(bt.hp<=0)bt.dead=true;addFx({k:'tr',x1:e.x,y1:e.y,x2:bt.x,y2:bt.y,c:'#ff6a4a',ti:0,t:.1})}e.atk=.5}}}
 for(const m of b.T){if(m.ty!=='mine'||m.dead)continue;for(const e of b.E){if(!e.dead&&Math.hypot(e.x-m.x,e.y-m.y)<ET[e.ty].r+14){m.dead=true;boom(m.x,m.y,58,150+g.w*9);break}}}
 for(const o of b.T){const d=TT[o.ty];if(o.dead||!d.d)continue;o.cd-=dt;if(o.cd>0)continue;
  const st=tstat(o);let bt=null,bs=-1;
  for(const e of b.E){if(e.dead)continue;const dist=Math.hypot(e.x-o.x,e.y-o.y);if(dist>st.r)continue;if(d.min&&dist<d.min)continue;
   const sc=o.ty==='harpoon'?e.hp:e.d;if(sc>bs){bs=sc;bt=e}}
  if(!bt)continue;
  o.cd=1/st.f;o.ang=Math.atan2(bt.y-o.y,bt.x-o.x);

 peer.on('error',e=>{if(!opened)lobMsg(e&&e.type==='peer-unavailable'?'notFound':'connErr')});
 const c=peer.connect('buccbay-'+code,{reliable:true});Net.conn=c;
 c.on('open',()=>{opened=true;R.online=true;R.host=false;R.code=code;Net.last=Date.now();
  c.send({t:'hello',name:myName(),skin:prof.skin});
  Net.hb=setInterval(()=>Net.send(c,{t:'ping'}),3000);
  Net.wd=setInterval(()=>{if(Date.now()-Net.last>15000)hostGone()},2000)});
 c.on('data',guestData);c.on('close',()=>{if(opened)hostGone()});c.on('error',()=>{});
 setTimeout(()=>{if(!opened&&Net.peer===peer){lobMsg('notFound');Net.close()}},12000)}
function hostGone(){if(!Net.peer)return;Net.close();toast(t('hostLeft'),3000);V=null;G=null;R.online=false;R.host=true;show('sMenu')}
$('#bJoin').onclick=()=>{Snd.init();Snd.play('click');prof.name=myName();save();joinRoom($('#joinCode').value)};
$('#bCopy').onclick=async()=>{const url=location.origin+location.pathname+'?room='+R.code;try{await navigator.clipboard.writeText(url);toast(t('copied'))}catch(e){$('#roomMsg').textContent=url}};
function guestData(m){
 if(!m||typeof m!=='object')return;Net.last=Date.now();
 switch(m.t){
  case'room':R.pl=(m.pl||[]).slice(0,2).map(p=>({n:String(p.n).slice(0,12),s:clamp(p.s|0,0,SK.length-1)}));if(scr!=='sGame'&&scr!=='sEnd'){renderRoom();show('sRoom')}break;
  case'full':Net.close();lobMsg('full');show('sLobby');break;
  case'start':{if(!Array.isArray(m.pl)||m.pl.length!==2)break;G=null;me=1;
   V={skin:clamp(m.pl[1].s|0,0,SK.length-1),T:[],E:[],Em:new Map(),PR:[],fx:[],w:0,wcd:20,lives:25,opp:25,gold:320,inc:0,cd:{sto:0,bar:0,rep:0},frz:0,en:0};
   enterGame();break}
  case's':if(V&&Array.isArray(m.T)&&Array.isArray(m.E))applySnap(m);break;
  case'end':if(V&&!V.over){V.over=true;setTimeout(()=>showEnd(m),900)}break;
  case'lobby':if(scr==='sEnd'||scr==='sGame'){V=null;renderRoom();show('sRoom')}break;
  case'err':if(typeof m.k==='string'&&D[m.k])uiErr(m.k);break;
  case'bye':hostGone();break}}

/* ================= boot ================= */
applyLang();menuStat();
window.__bb={G:()=>G,step,doCmd,newGame,botAct};
requestAnimationFrame(frame);
(function(){const q=new URLSearchParams(location.search).get('room');if(q){show('sLobby');$('#joinCode').value=q.toUpperCase().slice(0,5);setTimeout(()=>joinRoom(q),150)}})();
</script>
