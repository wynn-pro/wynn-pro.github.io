<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battleship Bay</title>
<style>
:root{
  --ink:#12365e; --sun:#ffd23f; --coral:#ff6b5e; --grass:#5fd16a; --sky:#6fd0ff; --blue:#3b8cff;
  --w1:#3bb4f2; --w2:#33a9ea; --cs:34px;
  --c0:#8fa3b8; --c1:#4cc36a; --c2:#3b8cff; --c3:#a85cff; --c4:#ffb020;
  --font: ui-rounded,"Arial Rounded MT Bold","Trebuchet MS","Hiragino Maru Gothic ProN","Noto Sans Thai","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);min-height:100vh;
  background:
   radial-gradient(ellipse 120px 40px at 12% 14%,#fff 60%,transparent 62%),
   radial-gradient(ellipse 160px 50px at 78% 9%,#fff 60%,transparent 62%),
   radial-gradient(ellipse 100px 34px at 55% 22%,#ffffffcc 60%,transparent 62%),
   linear-gradient(#bdeeff,#7dd6ff 45%,#38aef0 100%);
  background-attachment:fixed}
button,select{font-family:inherit}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#fff;border-bottom:4px solid var(--ink);position:sticky;top:0;z-index:20}
#bar h1{margin:0;font-size:1.2rem;flex:1;min-width:120px;letter-spacing:.5px}
.pill{background:#fff6cc;border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:800}
.btn{background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:9px 16px;font-weight:800;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.blue{background:#8cc8ff}.btn.green{background:#8ff08f}.btn.red{background:#ff9d92}.btn.white{background:#fff}
.btn.sm{padding:5px 11px;font-size:.85rem;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn.lg{padding:14px 26px;font-size:1.25rem}
select{border:3px solid var(--ink);border-radius:10px;padding:4px 6px;font-weight:700;background:#fff;color:var(--ink)}
.screen{display:none;max-width:1100px;margin:0 auto;padding:14px 12px 40px}
.screen.on{display:block}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px}
h2{margin:6px 0 12px;font-size:1.5rem}
.muted{opacity:.7;font-size:.9rem}
/* menu */
.hero{text-align:center;padding:10px 0 4px}
.hero h2{font-size:clamp(2rem,7vw,3.4rem);margin:4px 0;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:1px}
.hero p{font-weight:800;font-size:1.1rem;margin:0 0 8px;background:#ffffffb0;display:inline-block;padding:4px 14px;border-radius:999px}
.menu{display:grid;gap:12px;max-width:380px;margin:14px auto}
.menu .btn{font-size:1.2rem;padding:14px}
.badge-dot{display:inline-block;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:.75rem;padding:0 7px;margin-left:6px}
.wave{height:40px;background:radial-gradient(circle at 20px 0,transparent 18px,#fff 19px,#fff 22px,transparent 23px) 0 0/40px 40px repeat-x;opacity:.7;margin-top:10px}
/* setup */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:10px 0}
.lbl{font-weight:800;min-width:110px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sg{border:3px solid var(--ink);background:#fff;border-radius:11px;padding:6px 12px;font-weight:800;cursor:pointer;color:var(--ink)}
.sg.on{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.err{color:#c0281a;font-weight:800;min-height:1.4em}
/* ships */
.mini{display:grid;gap:2px;justify-content:center;align-content:center}
.mini i{display:block;width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);background:var(--c)}
.mini u{display:block;width:14px;height:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sc{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.sc .pv{background:#d9f3ff;border-radius:10px;border:2px dashed #9ccbe6;height:78px;display:flex;align-items:center;justify-content:center}
.sc .nm{font-weight:900}
.sc .rb{position:absolute;top:8px;right:8px;font-size:.7rem;font-weight:900;color:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;background:var(--c)}
.sc .pw{font-size:.82rem;min-height:3.3em}
.sc .ft{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;flex-wrap:wrap}
.sc.r4{background:linear-gradient(#fff,#fff0c4)}
.sc.owned{background:#eaffea}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px;font-weight:800}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0 4px}
.slot{height:84px;border:3px dashed #7aa9cc;border-radius:12px;background:#ffffffa8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;cursor:pointer;text-align:center;overflow:hidden;padding:2px}
.slot.f{border-style:solid;border-color:var(--ink);background:#fff}
/* goals */
.mi{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:2px dashed #cfe6f5}
.bar{flex:1;min-width:120px;height:14px;border:2px solid var(--ink);border-radius:99px;background:#e6f4fb;overflow:hidden}
.bar b{display:block;height:100%;background:var(--grass)}
.meds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.med{border:3px solid var(--ink);border-radius:12px;padding:8px;background:#f2f2f2;opacity:.65;display:flex;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.med.on{background:#fff3b8;opacity:1}
.med span{font-size:1.6rem}
.stt{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.stt div{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;text-align:center}
.stt b{display:block;font-size:1.6rem}
/* boards */
.boards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.bwrap{text-align:center}
.bwrap h3{margin:4px 0 6px}
.board{display:grid;background:#1d83c8;border:4px solid var(--ink);border-radius:14px;padding:6px;box-shadow:0 5px 0 var(--ink);width:max-content;margin:0 auto;user-select:none;touch-action:manipulation;position:relative}
.board.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,2px)}}
.lab{font-size:calc(var(--cs)*.34);font-weight:900;color:#d8f3ff;display:flex;align-items:center;justify-content:center;height:calc(var(--cs)*.55)}
.lab.v{height:var(--cs)}
.cell{width:var(--cs);height:var(--cs);position:relative;border:1px solid rgba(255,255,255,.28);background:var(--w1)}
.cell.a{background:var(--w2)}
.cell .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.58);line-height:1;pointer-events:none;z-index:2}
.cell.s{background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 62%,#000));border-style:solid;border-color:var(--ink)}
.cell.s::after{content:'';position:absolute;left:18%;right:18%;top:20%;height:18%;background:#ffffff55;border-radius:99px}
.cell.d{filter:saturate(.7) brightness(.85)}
.cell.k{background:linear-gradient(#5b6b7a,#2a3744);border-color:#0b1c2e;animation:sinkA 1s}
.cell.k::after{display:none}
@keyframes sinkA{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(5px) rotate(4deg)}100%{transform:none}}
.cell.m::before{content:'';position:absolute;left:50%;top:50%;width:26%;height:26%;margin:-13%;border-radius:50%;background:#fff;opacity:.85}
.cell.bl{background:#9fd6ff}
.cell.rd{background:#42d68b;animation:blip 1.2s infinite}
@keyframes blip{50%{filter:brightness(1.35)}}
.cell.pvo{outline:3px solid #7cff7c;outline-offset:-3px;background:#7cff7c88}
.cell.pvb{outline:3px solid #ff5a4d;outline-offset:-3px;background:#ff5a4d88}
.cell.last{box-shadow:inset 0 0 0 3px #fff}
.board.tgt .cell.w:not(.m):not(.x):hover,.board.tgt .cell.bl:hover{background:#ffffff88;cursor:crosshair}
.fx{position:absolute;left:-40%;top:-40%;width:180%;height:180%;pointer-events:none;z-index:6}
.fx.splash::before,.fx.splash::after{content:'';position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15%;border:3px solid #fff;border-radius:50%;animation:ring .7s ease-out forwards}
.fx.splash::after{animation-delay:.15s}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(2.6);opacity:0}}
.fx.splash b{position:absolute;left:50%;top:50%;width:9%;height:9%;margin:-4.5%;background:#fff;border-radius:50%;animation:drop .6s ease-out forwards}
.fx.splash b:nth-child(1){--dx:-30px;--dy:-34px}.fx.splash b:nth-child(2){--dx:30px;--dy:-34px}
.fx.splash b:nth-child(3){--dx:-18px;--dy:-48px}.fx.splash b:nth-child(4){--dx:18px;--dy:-48px}
@keyframes drop{from{transform:translate(0,0)}60%{opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
.fx.boom{background:radial-gradient(circle,#fff 0,#ffe45e 22%,#ff8a3d 42%,#ff4b3a 56%,transparent 68%);animation:boom .75s ease-out forwards}
@keyframes boom{from{transform:scale(.2);opacity:1}55%{opacity:1}to{transform:scale(1.5);opacity:0}}
.fx.sink b{position:absolute;bottom:35%;width:14%;height:14%;border:2px solid #fff;border-radius:50%;background:#ffffff55;animation:bub 1s ease-in forwards}
.fx.sink b:nth-child(1){left:30%}.fx.sink b:nth-child(2){left:52%;animation-delay:.2s}.fx.sink b:nth-child(3){left:42%;animation-delay:.4s}.fx.sink b:nth-child(4){display:none}
@keyframes bub{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
/* battle ui */
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;margin-bottom:10px}
#turnTxt{font-weight:900;font-size:1.15rem;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 16px}
#tbar{width:min(260px,60vw);height:14px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;display:none}
#tbar b{display:block;height:100%;background:var(--coral);width:100%}
.fleetrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:8px;min-height:26px}
.fleetrow .mini i,.fleetrow .mini u{width:8px;height:8px;border-width:1px;border-radius:2px}
.fleetrow .mini{gap:1px;padding:3px;background:#fff;border-radius:6px;border:2px solid var(--ink)}
.fleetrow .mini.dead{opacity:.35;filter:grayscale(1)}
#flash{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:60;pointer-events:none;font-size:clamp(1.6rem,6vw,2.6rem);font-weight:900;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);opacity:0;text-align:center;width:90vw}
#flash.go{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:0;transform:translateX(-50%) scale(.5)}15%{opacity:1;transform:translateX(-50%) scale(1.15)}30%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:6px;pointer-events:none}
.toast{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:800;box-shadow:0 4px 0 var(--ink);animation:tin .25s}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
.tray{display:flex;flex-direction:column;gap:6px;min-width:200px;max-width:260px}
.ts{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:5px 8px;cursor:pointer;font-weight:800;font-size:.85rem;text-align:left;color:var(--ink)}
.ts.sel{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.ts.done{opacity:.55}
.ts .mini{width:56px}
.ts .mini i,.ts .mini u{width:9px;height:9px;border-width:1.5px;border-radius:3px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
#modal{position:fixed;inset:0;background:rgba(10,40,80,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.on{display:flex}
#modal .box{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:20px;max-width:430px;width:100%;text-align:center;box-shadow:0 8px 0 var(--ink);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
#modal h3{margin:0 0 8px;font-size:1.7rem}
#modal .bt{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.rw{display:flex;justify-content:space-between;gap:20px;font-weight:800;padding:3px 0;border-bottom:2px dashed #cfe6f5}
@media (max-width:640px){.lbl{min-width:100%}.tray{max-width:none;width:100%;flex-direction:row;flex-wrap:wrap}.ts{flex:1 1 140px}}
</style>
</head>
<body>
<div id="bar">
  <button class="btn sm white" id="btnHome" title="Menu">🏠</button>
  <h1 data-i="app">Battleship Bay</h1>
  <span class="pill" id="coins">🪙 0</span>
  <button class="btn sm white" id="btnSnd" title="Sound">🔊</button>
  <select id="langSel" aria-label="Language">
    <option value="en">English</option><option value="th">ไทย</option><option value="ja">日本語</option><option value="zh">中文</option>
  </select>
  <a class="btn sm blue" href="../index.html" data-i="back_site">← Wynn's Games</a>
</div>

<section class="screen" id="scr-menu">
  <div class="hero">
    <svg viewBox="0 0 320 120" width="320" style="max-width:80%">
      <path d="M0 96 Q40 80 80 96 T160 96 T240 96 T320 96 V120 H0Z" fill="#2aa0e4" stroke="#12365e" stroke-width="4"/>
      <path d="M60 80 L250 80 L228 100 L84 100Z" fill="#ff6b5e" stroke="#12365e" stroke-width="4" stroke-linejoin="round"/>

      <rect x="130" y="32" width="46" height="24" rx="6" fill="#fff" stroke="#12365e" stroke-width="4"/>
      <rect x="146" y="12" width="14" height="20" rx="3" fill="#ffd23f" stroke="#12365e" stroke-width="4"/>
      <circle cx="114" cy="68" r="4" fill="#12365e"/><circle cx="132" cy="68" r="4" fill="#12365e"/><circle cx="150" cy="68" r="4" fill="#12365e"/><circle cx="168" cy="68" r="4" fill="#12365e"/><circle cx="186" cy="68" r="4" fill="#12365e"/>
      <rect x="208" y="64" width="40" height="8" rx="4" fill="#5b6b7a" stroke="#12365e" stroke-width="3"/>
    </svg>
    <h2 data-i="app">Battleship Bay</h2>
    <p data-i="tag">Build your fleet. Sink the enemy!</p>
  </div>
  <div class="menu">
    <button class="btn green" id="mBattle" data-i="m_battle">Battle!</button>
    <button class="btn blue" id="mFleet" data-i="m_fleet">My Fleet</button>
    <button class="btn" id="mShop" data-i="m_shop">Ship Shop</button>
    <button class="btn red" id="mGoals"><span data-i="m_goals">Missions &amp; Medals</span><span class="badge-dot" id="goalDot" style="display:none">!</span></button>
    <button class="btn white" id="mStats" data-i="m_stats">Stats</button>
  </div>
  <div class="wave"></div>
</section>

<section class="screen" id="scr-setup"><h2 data-i="setup_title">Battle Setup</h2><div class="card" id="setupBox"></div></section>
<section class="screen" id="scr-shop"><h2 data-i="shop_title">Ship Shop</h2><div class="filters" id="shopF"></div><div class="grid" id="shopG"></div><div class="pager" id="shopP"></div></section>
<section class="screen" id="scr-fleet"><h2 data-i="fleet_title">My Fleet</h2><div class="card"><div id="fleetInfo" style="font-weight:800"></div><div class="slots" id="slots"></div></div><div class="grid" id="fleetG" style="margin-top:14px"></div></section>
<section class="screen" id="scr-goals"><h2 data-i="goals_title">Missions &amp; Medals</h2><div id="goalsBox"></div></section>
<section class="screen" id="scr-stats"><h2 data-i="stats_title">Stats</h2><div class="stt" id="statsBox"></div></section>

<section class="screen" id="scr-place">
  <h2 id="placeTitle"></h2>
  <p class="muted" data-i="p_hint">Pick a ship, then tap the sea to place it. Tap a placed ship to pick it up.</p>
  <div class="boards"><div class="bwrap"><div class="board" id="placeBoard"></div></div><div class="tray" id="tray"></div></div>
  <div class="acts">
    <button class="btn blue" id="pRot" data-i="p_rotate">Rotate (R)</button>
    <button class="btn" id="pRand" data-i="p_random">Randomize</button>
    <button class="btn white" id="pClear" data-i="p_clear">Clear</button>
    <button class="btn green" id="pReady" data-i="p_ready">Ready!</button>
  </div>
  <div class="err" id="placeErr" style="text-align:center"></div>
</section>

<section class="screen" id="scr-battle">
  <div class="status"><span id="turnTxt"></span><div id="tbar"><b></b></div><span class="pill" id="turnNo"></span><button class="btn sm red" id="bQuit" data-i="quit">Quit</button></div>
  <div class="boards">
    <div class="bwrap"><h3 data-i="enemy_waters">Enemy waters</h3><div class="board tgt" id="enemyBoard"></div><div class="fleetrow" id="enemyRow"></div><div class="muted" id="enemyLeft"></div></div>
    <div class="bwrap"><h3 id="ownTitle"></h3><div class="board" id="ownBoard"></div><div class="fleetrow" id="ownRow"></div>
      <div class="acts" style="margin-top:8px"><button class="btn sm blue" id="peekBtn" style="display:none" data-i="peek">Hold to peek at your fleet</button></div></div>
  </div>
</section>

<div id="flash"></div><div id="toasts"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

const SHC={};
function shapeCells(key,rot){
  const ck=key+rot; if(SHC[ck]) return SHC[ck];
  let c=SHAPES[key].map(p=>p.slice());
  for(let i=0;i<rot;i++) c=c.map(([x,y])=>[-y,x]);
  const mx=Math.min(...c.map(p=>p[0])), my=Math.min(...c.map(p=>p[1]));
  return SHC[ck]=c.map(([x,y])=>[x-mx,y-my]);
}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

 {id:'c2',name:'Destroyer',shape:'i2',r:0,price:0,power:null}];
function buildCatalog(){
  const R=rng(20261108);
  const quota=[32,26,20,14,8];
  const pool=[['dot','i2','i2','i3','l3','i3'],['l3','i3','l4','t4','sq4','z4','i4'],['l4','t4','z4','i5','l5','p5','sq4','i4'],['t5','plus5','u5','w5','p5','l5','i5'],['i6','r6','l6','t6','plus5','w5','u5']];
  const range=[[50,100],[150,300],[400,800],[1200,2400],[3000,5000]];
  const pchance=[.25,.5,.75,.95,1], pnames=Object.keys(POWERS);
  const list=[];
  quota.forEach((q,r)=>{for(let k=0;k<q;k++){
    const shape=pool[r][Math.floor(R()*pool[r].length)];
    let price=range[r][0]+R()*(range[r][1]-range[r][0]); const step=price>=500?50:10; price=Math.round(price/step)*step;
    const power=R()<pchance[r]?pnames[Math.floor(R()*pnames.length)]:null;
    list.push({shape,r,price,power});
  }});
  list.sort((a,b)=>a.r-b.r||a.price-b.price);
  const ADJ=['Brave','Sneaky','Salty','Swift','Jolly','Mighty','Lucky','Crimson','Golden','Silver','Stormy','Sunny','Rusty','Shiny','Wild','Misty','Cosmic','Thunder','Coral','Frosty','Royal','Pirate','Turbo','Jade','Ember'];
  const NOUN={1:['Buoy','Dinghy','Raft','Canoe','Kayak'],2:['Skiff','Tug','Sloop','Cutter','Launch'],3:['Corvette','Brig','Schooner','Ketch','Clipper'],4:['Frigate','Galleon','Barque','Lugger','Gunboat'],5:['Cruiser','Monitor','Warship','Trawler','Man-o-War'],6:['Dreadnought','Leviathan','Flagship','Titan','Behemoth']};
  const used=new Set();
  return list.map((s,i)=>{
    const size=SHAPES[s.shape].length; let nm;
    do{nm=ADJ[Math.floor(R()*ADJ.length)]+' '+NOUN[size][Math.floor(R()*5)]}while(used.has(nm)); used.add(nm);
    return Object.assign({id:'sh'+(i+1),name:nm},s);
  });
}

function tone(f,d,type,vol,to,delay){if(!S.settings.sound)return;const a=ac();if(!a)return;const t0=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.02)}
function noise(d,f1,f2,vol,delay){if(!S.settings.sound)return;const a=ac();if(!a)return;const t0=a.currentTime+(delay||0),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(f1,t0);fl.frequency.exponentialRampToValueAtTime(f2,t0+d);const g=a.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(fl).connect(g).connect(a.destination);s.start(t0)}

/* ================= board DOM ================= */
function makeBoard(el,N){
  el.innerHTML='';el._N=N;el._cells=[];
  el.style.gridTemplateColumns=`calc(var(--cs)*.55) repeat(${N},var(--cs))`;
  el.appendChild(Object.assign(document.createElement('div'),{className:'lab'}));
  for(let x=0;x<N;x++){const l=document.createElement('div');l.className='lab';l.textContent=String.fromCharCode(65+x);el.appendChild(l)}
  for(let y=0;y<N;y++){
    const l=document.createElement('div');l.className='lab v';l.textContent=y+1;el.appendChild(l);
    for(let x=0;x<N;x++){const c=document.createElement('div');c.className='cell '+((x+y)%2?'a':'b');c.dataset.i=y*N+x;c._p=(x+y)%2?'a':'b';c._ic=document.createElement('span');c._ic.className='ic';c.appendChild(c._ic);el.appendChild(c);el._cells.push(c)}
  }
}
const EMPTY=new Set();
function shipStyle(i,set,N,col){
  const x=i%N,y=(i/N)|0,u=y>0&&set.has(i-N),d=y<N-1&&set.has(i+N),l=x>0&&set.has(i-1),r=x<N-1&&set.has(i+1),R='calc(var(--cs)*.32)';
  return `--c:${col};border-width:${u?0:3}px ${r?0:3}px ${d?0:3}px ${l?0:3}px;border-radius:${!u&&!l?R:0} ${!u&&!r?R:0} ${!d&&!r?R:0} ${!d&&!l?R:0}`;
}
/* mode 'own' = truth about P's ships; 'enemy' = what an attacker knows */
function paintBoard(el,P,mode,radar,hold,lastIdx){
  const N=P.N,cells=el._cells;hold=hold||EMPTY;
  const info=new Map();
  P.ships.forEach(sh=>{
    if(!sh.cells)return;
    const held=sh.cells.some(c=>hold.has(c));
    if(mode==='own'||(sh.sunk&&!held)){const set=new Set(sh.cells);sh.cells.forEach((c,k)=>info.set(c,{sh,set,first:k===0,held}))}
  });
  for(let i=0;i<N*N;i++){
    const c=cells[i];let cls='w',ic='',st='';const si=info.get(i),seen=hold.has(i)?0:P.seen[i];
    if(si){
      const sh=si.sh;cls='s';st=shipStyle(i,si.set,N,RC[sh.def.r]);
      if(sh.sunk&&!si.held){cls+=' k';if(si.first)ic='☠️'}
      else if(mode==='own'&&sh.hit.has(i)&&!hold.has(i)){cls+=' d';ic='🔥'}
      else if(mode==='own'&&seen===3)ic='🛡️';
      else if(mode==='own'&&si.first&&sh.def.power)ic=POWERS[sh.def.power];
    }else{
      if(seen===1)cls='w m';
      else if(seen===2){cls='w x';ic='💥'}
      else if(seen===3){cls='w bl';ic='🛡️'}
      else if(mode==='enemy'&&radar&&radar.has(i)){cls='w rd';ic='📡'}
      else if(mode==='own'&&P.decoyAt.has(i)){cls='w dc';ic='🎭'}
    }
    if(i===lastIdx)cls+=' last';
    c.className='cell '+c._p+' '+cls;c._ic.textContent=ic;c.style.cssText=st;
  }
}
function fx(el,idx,kind){

/* ================= game setup ================= */
function mkPlayer(name,human,defs,N){
  return{name,human,N,seen:new Uint8Array(N*N),radar:new Set(),decoyAt:new Set(),occ:new Array(N*N).fill(null),shots:0,hits:0,sunkCount:0,lost:0,
   ships:defs.map(([def,lvl])=>({def,level:lvl,cells:null,rot:0,ax:0,ay:0,hit:new Set(),sunk:false,cnt:0,absorb:def.power==='armor'?PV.armor(lvl):0}))};
}
function rebuildOcc(P){P.occ.fill(null);P.ships.forEach(s=>{if(s.cells)s.cells.forEach(c=>P.occ[c]=s)})}
function offsetsOf(sh,rot){return shapeCells(sh.def.shape,rot)}
function cellsAt(P,sh,rot,ax,ay){return offsetsOf(sh,rot).map(([x,y])=>(ay+y)*P.N+ax+x)}
function canPlace(P,sh,rot,ax,ay,strict){
  const o=offsetsOf(sh,rot),[w,h]=dims(o);if(ax<0||ay<0||ax+w>P.N||ay+h>P.N)return false;
  return cellsAt(P,sh,rot,ax,ay).every(c=>{const q=P.occ[c];return(!q||q===sh)&&(!strict||(P.seen[c]===0&&!P.decoyAt.has(c)))});

function setPlace(P,sh,rot,ax,ay){sh.rot=rot;sh.ax=ax;sh.ay=ay;sh.cells=cellsAt(P,sh,rot,ax,ay);rebuildOcc(P)}
function randPlace(P,sh,strict){
  for(let k=0;k<300;k++){const rot=rnd(4),[w,h]=dims(offsetsOf(sh,rot)),ax=rnd(P.N-w+1),ay=rnd(P.N-h+1);
    if(canPlace(P,sh,rot,ax,ay,strict)){setPlace(P,sh,rot,ax,ay);return true}}
  return false;
}
function randomFleet(P){
  for(let t2=0;t2<200;t2++){
    P.ships.forEach(s=>s.cells=null);rebuildOcc(P);
    const order=P.ships.slice().sort((a,b)=>sizeOf(b.def)-sizeOf(a.def));
    if(order.every(s=>randPlace(P,s)))return true;
  }
  return false;
}
function aiFleet(diff,N,playerCells,count){
  const W={easy:[60,30,10,0,0],medium:[30,30,25,12,3],hard:[10,20,30,25,15]}[diff];
  const cap=Math.min(budget(N),Math.max(playerCells,12)+4),pool=CLASSIC.concat(SHOP);
  const out=[];let cells=0;const total=W.reduce((a,b)=>a+b,0);
  for(let tries=0;tries<600&&out.length<count;tries++){
    const x=rnd(total);let acc=0,r=0;for(;r<5;r++){acc+=W[r];if(x<acc)break}if(r>4)r=4;
    const left=count-out.length-1;
    const cand=pool.filter(d=>d.r===r&&cells+sizeOf(d)+left<=cap);
    if(!cand.length)continue;const d=pick(cand);
    out.push([d,d.power?({easy:1,medium:1+rnd(2),hard:2+rnd(3)}[diff]):1]);cells+=sizeOf(d);
  }
  while(out.length<3){const d=pick(CLASSIC);out.push([d,1])}
  return out;
}
function newGame(){

}

/* ================= battle core ================= */
const other=P=>G.players[0]===P?G.players[1]:G.players[0];
const viewer=()=>G.mode==='ai'?G.players[0]:G.players[G.cur];
const alive=P=>P.ships.filter(s=>!s.sunk);
const allSunk=P=>P.ships.every(s=>s.sunk);
const enemyEl=$('#enemyBoard'), ownEl=$('#ownBoard');
function holdOf(P){let h=G.hold.get(P);if(!h){h=new Set();G.hold.set(P,h)}return h}

function placeDecoys(P){
  P.ships.forEach(s=>{
    if(s.def.power!=='decoy')return;
    for(let k=0;k<PV.decoy(s.level);k++){
      for(let tries=0;tries<200;tries++){const c=rnd(P.N*P.N);if(!P.occ[c]&&!P.decoyAt.has(c)){P.decoyAt.add(c);break}}
    }
  });
}
function startBattle(){
  G.players.forEach(P=>{rebuildOcc(P);placeDecoys(P)});
  G.phase='battle';G.cur=0;G.turn=1;
  makeBoard(enemyEl,G.N);makeBoard(ownEl,G.N);
  $('#peekBtn').style.display=G.mode==='pvp'?'inline-block':'none';
  show('battle');fit();
  beginTurn();

/* resolve a single shot (no animation) */
function shoot(a,d,idx,bonus){
  a.shots++;let r,ship=null;
  if(d.decoyAt.has(idx)){d.seen[idx]=2;r='decoy'}
  else{
    const sh=d.occ[idx];
    if(!sh){d.seen[idx]=1;r='miss'}
    else if(sh.absorb>0){sh.absorb--;d.seen[idx]=3;r='block';ship=sh}
    else{
      sh.hit.add(idx);d.seen[idx]=2;a.hits++;r='hit';ship=sh;
      if(sh.hit.size===sh.cells.length){sh.sunk=true;sh.cells.forEach(c=>{d.seen[c]=4;a.radar.delete(c)});a.sunkCount++;d.lost++;r='sunk'}
    }
  }
  a.radar.delete(idx);
  return{t:'shot',idx,r,bonus:!!bonus,ship,att:a,def:d};
}
function neighbors(N,i){const x=i%N,y=(i/N)|0,o=[];if(y>0)o.push(i-N);if(y<N-1)o.push(i+N);if(x>0)o.push(i-1);if(x<N-1)o.push(i+1);return o}
function doShot(a,d,idx){
  const evs=[shoot(a,d,idx,false)];
  // Bomb ships: bonus shell next to the main shot
  alive(a).filter(s=>s.def.power==='multi').forEach(s=>{
    s.cnt++;
    if(s.cnt>=PV.multi(s.level)&&!allSunk(d)){
      const nb=neighbors(d.N,idx).filter(c=>d.seen[c]===0);
      if(nb.length){s.cnt=0;const e=shoot(a,d,pick(nb),true);evs.push(e);const h=holdOf(d);if(e.r==='sunk')e.ship.cells.forEach(c=>h.add(c));else h.add(e.idx);}
    }
  });
  // Evasive ships slip away
  if(!allSunk(d))alive(d).filter(s=>s.def.power==='evade'&&s.cells.every(c=>d.seen[c]===0)).forEach(s=>{
    s.cnt++;
    if(s.cnt>=PV.evade(s.level)){
      s.cnt=0;const old=s.cells.slice();
      for(let k=0;k<300;k++){const rot=rnd(4),[w,h]=dims(offsetsOf(s,rot)),ax=rnd(d.N-w+1),ay=rnd(d.N-h+1);
        if(canPlace(d,s,rot,ax,ay,true)){setPlace(d,s,rot,ax,ay);old.forEach(c=>a.radar.delete(c));evs.push({t:'evade',def:d});break}}
    }
  });
  return evs;
}
function turnStart(P){
  const evs=[],foe=other(P);
  alive(P).forEach(s=>{
    if(s.def.power==='repair'&&s.hit.size>0){
      s.cnt++;if(s.cnt>=PV.repair(s.level)){s.cnt=0;const c=pick([...s.hit]);s.hit.delete(c);P.seen[c]=0;evs.push({t:'repair'})}
    }else if(s.def.power==='radar'){
      s.cnt++;if(s.cnt>=PV.radar(s.level)){
        const cand=[];alive(foe).forEach(f=>f.cells.forEach(c=>{if(foe.seen[c]===0&&!P.radar.has(c))cand.push(c)}));
        if(cand.length){s.cnt=0;P.radar.add(pick(cand));evs.push({t:'radar'})}
      }
    }
  });
  return evs;
}
/* ---- AI ---- */
function aiPick(me,foe,diff){
  const N=foe.N,seen=foe.seen,c0=[],c3=[];
  for(let i=0;i<N*N;i++){if(seen[i]===0)c0.push(i);else if(seen[i]===3)c3.push(i)}
  if(diff==='easy'||!c0.length&&!c3.length)return pick(c0.length?c0:c3);
  if(c3.length&&Math.random()<(diff==='hard'?1:.7))return pick(c3);
  const blips=[...me.radar].filter(i=>seen[i]===0);
  if(blips.length&&(diff==='hard'||Math.random()<.7))return pick(blips);
  if(diff==='medium'){
    const near=[];for(let i=0;i<N*N;i++)if(seen[i]===2)neighbors(N,i).forEach(n=>{if(seen[n]===0)near.push(n)});
    if(near.length)return pick(near);
    const par=c0.filter(i=>((i%N)+((i/N)|0))%2===0);return pick(par.length?par:c0);
  }
  const dens=new Float32Array(N*N);
  alive(foe).forEach(sh=>{
    for(let rot=0;rot<4;rot++){
      const o=shapeCells(sh.def.shape,rot),[w,h]=dims(o);
      for(let ay=0;ay<=N-h;ay++)for(let ax=0;ax<=N-w;ax++){
        const cs=o.map(([x,y])=>(ay+y)*N+ax+x);
        if(!cs.every(c=>seen[c]===0||seen[c]===2||seen[c]===3))continue;
        let wt=1;cs.forEach(c=>{if(seen[c]===2)wt*=8;else if(seen[c]===3)wt*=12;else if(me.radar.has(c))wt*=4});
        cs.forEach(c=>{if(seen[c]===0)dens[c]+=wt});
      }
    }
  });
  let best=0,top=[];
  c0.forEach(i=>{if(dens[i]>best){best=dens[i];top=[i]}else if(dens[i]===best&&best>0)top.push(i)});
  return top.length?pick(top):pick(c0);
}

/* ================= battle flow ================= */
function flash(msg){const f=$('#flash');f.textContent=msg;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function boardFor(P){return P===viewer()?ownEl:enemyEl}
function renderBattle(){
  if(!G||G.phase==='place')return;
  const v=viewer(),f=other(v),showOwn=G.mode==='ai'||G.peek;
  paintBoard(enemyEl,f,'enemy',v.radar,holdOf(f),G.last.get(f));
  paintBoard(ownEl,v,showOwn?'own':'enemy',null,holdOf(v),G.last.get(v));
  $('#ownTitle').textContent=G.mode==='ai'?t('your_fleet'):t('fleet_of',{name:v.name});
  $('#turnNo').textContent=t('turnn',{n:G.turn});
  const cp=G.players[G.cur];
  $('#turnTxt').textContent=G.phase==='over'?'':(cp.human?(G.mode==='ai'?t('your_turn'):t('turn_of',{name:cp.name})):t('ai_think'));
  enemyEl.classList.toggle('tgt',cp===v&&cp.human&&!G.busy&&G.phase==='battle');
  $('#ownRow').innerHTML=v.ships.map(s=>miniHTML(s.def.shape,RC[s.def.r],0,s.sunk?'dead':'')).join('');
  $('#enemyRow').innerHTML=f.ships.filter(s=>s.sunk).map(s=>miniHTML(s.def.shape,RC[s.def.r],0,'dead')).join('');
  $('#enemyLeft').textContent=t('left',{n:alive(f).length,m:f.ships.length});
}
function say(ev,viewerIsAtt){
  const nm=ev.ship?ev.ship.def.name:'';
  if(ev.bonus)toast('💣 '+t('bonus'));
  if(viewerIsAtt){
    flash(ev.r==='miss'?'💦 '+t('miss'):ev.r==='block'?'🛡️ '+t('blocked'):ev.r==='sunk'?'☠️ '+t('sunk',{name:nm}):'💥 '+t('hit'));
  }else{
    flash(ev.r==='miss'?'💦 '+t('e_miss'):ev.r==='sunk'?'☠️ '+t('e_sunk',{name:nm}):ev.r==='block'?'🛡️ '+t('blocked'):'💥 '+t('e_hit'));
  }
}
async function playEvents(evs){
  const gid=G.id;
  for(const ev of evs){
    if(G.dead||G.id!==gid)return;
    if(ev.t==='shot'){
      const d=ev.def,bd=boardFor(d),viewerIsAtt=ev.att===viewer();
      sfx.fire();await sleep(ev.bonus?160:240);if(G.dead||G.id!==gid)return;
      const h=holdOf(d);if(ev.r==='sunk')ev.ship.cells.forEach(c=>h.delete(c));else h.delete(ev.idx);
      G.last.set(d,ev.idx);renderBattle();
      if(ev.r==='miss'){sfx.splash();fx(bd,ev.idx,'splash')}
      else if(ev.r==='block'){sfx.block();fx(bd,ev.idx,'splash')}
      else{sfx.hit();fx(bd,ev.idx,'boom');bd.classList.remove('shake');void bd.offsetWidth;bd.classList.add('shake')}
      say(ev,viewerIsAtt);
      if(ev.r==='sunk'){sfx.sink();ev.ship.cells.forEach((c,k)=>setTimeout(()=>fx(bd,c,'sink'),k*90));await sleep(1000)}else await sleep(ev.bonus?450:560);
    }else if(ev.t==='evade'){
      sfx.radar();flash('🌀 '+t('evaded'));renderBattle();await sleep(650);
    }else if(ev.t==='repair'){
      sfx.good();flash('🔧 '+t('repaired'));renderBattle();await sleep(650);
    }else if(ev.t==='radar'){
      sfx.radar();flash('📡 '+t('radar'));renderBattle();await sleep(650);
    }
  }
}
async function beginTurn(){
  if(G.dead)return;
  const gid=G.id,a=G.players[G.cur];
  G.busy=true;
  if(G.mode==='pvp'){
    renderBattleHidden();
    await modal(`<h3>${t('cover',{name:a.name})}</h3>`,[[t('tap_start'),true,'green']]);
    if(G.dead||G.id!==gid)return;
  }
  renderBattle();
  const evs=turnStart(a);
  await playEvents(evs);
  if(G.dead||G.id!==gid)return;
  renderBattle();
  if(a.human){G.busy=false;renderBattle();startTimer()}
  else{await sleep(650);if(!G.dead&&G.id===gid)aiMove()}
}
function renderBattleHidden(){
  [enemyEl,ownEl].forEach(el=>el._cells.forEach(c=>{c.className='cell '+c._p+' w';c._ic.textContent='';c.style.cssText=''}));
}
async function aiMove(){
  if(G.dead)return;
  const a=G.players[G.cur],d=other(a);
  await takeShot(aiPick(a,d,G.diff));
}
async function takeShot(idx){
  if(G.dead||G.phase!=='battle')return;
  const gid=G.id,a=G.players[G.cur],d=other(a);
  G.busy=true;stopTimer();renderBattle();
  const evs=doShot(a,d,idx);
  await playEvents(evs);
  if(G.dead||G.id!==gid)return;
  G.hold.forEach(h=>h.clear());renderBattle();
  if(allSunk(d)){endBattle(a);return}
  if(G.rule==='again'&&evs[0].r!=='miss'){
    if(a.human){G.busy=false;renderBattle();startTimer()}else{await sleep(450);if(!G.dead&&G.id===gid)aiMove()}
    return;
  }
  G.cur=1-G.cur;G.turn++;
  beginTurn();
}
enemyEl.addEventListener('click',e=>{
  const c=e.target.closest('.cell');if(!c||!G||G.phase!=='battle'||G.busy)return;
  const a=G.players[G.cur];if(!a.human||a!==viewer())return;
  const i=+c.dataset.i,s=other(a).seen[i];
  if(s===0||s===3)takeShot(i);
});
function startTimer(){
  stopTimer();const T=S.settings.timer,bar=$('#tbar');
  if(!T){bar.style.display='none';return}
  bar.style.display='block';G.tLeft=T;bar.firstElementChild.style.width='100%';
  G.ptimer=setInterval(()=>{
    G.tLeft-=.1;bar.firstElementChild.style.width=Math.max(0,100*G.tLeft/T)+'%';
    if(G.tLeft<=0){stopTimer();if(!G.busy&&G.phase==='battle'){const d=other(G.players[G.cur]),c=[];for(let i=0;i<d.N*d.N;i++)if(d.seen[i]===0)c.push(i);takeShot(pick(c))}}
  },100);
}
function stopTimer(){if(G&&G.ptimer){clearInterval(G.ptimer);G.ptimer=null}}
function quitBattle(){if(G){G.dead=true;stopTimer()}show('menu')}
$('#bQuit').onclick=async()=>{sfx.click();if(await modal(`<h3>${t('quit_q')}</h3>`,[[t('yes'),true,'red'],[t('no'),false]]))quitBattle()};
const peek=on=>{if(!G||G.mode!=='pvp'||G.phase!=='battle')return;G.peek=on;renderBattle()};
$('#peekBtn').addEventListener('pointerdown',()=>peek(true));
['pointerup','pointerleave','pointercancel'].forEach(ev=>$('#peekBtn').addEventListener(ev,()=>peek(false)));

/* ================= end of battle ================= */
async function endBattle(winner){
  const gid=G.id;G.phase='over';stopTimer();G.hold.forEach(h=>h.clear());renderBattle();
  const me=G.players[0],ai=G.mode==='ai',won=winner===me;
  let coins,rows='';
  const st=S.stats;st.games++;st.shots+=me.shots+(ai?0:G.players[1].shots);st.hits+=me.hits+(ai?0:G.players[1].hits);
  if(ai){
    const bonus=won?{easy:60,medium:100,hard:160}[G.diff]:20;
    coins=me.hits*3+me.sunkCount*15+bonus;
    st.sunk+=me.sunkCount;st.lost+=me.lost;
    if(won){st.wins++;st.streak++;st.best=Math.max(st.best,st.streak);if(me.lost===0)st.flawless++;if(G.diff==='hard')st.hardWins++;if(G.N===12)st.bigWins++}
    else{st.losses++;st.streak=0}
    mprog('play',1);mprog('sink',me.sunkCount);mprog('hit',me.hits);
    if(won){mprog('win',1);if(me.lost===0)mprog('flawless',1);if(G.diff!=='easy')mprog('winmed',1)}
    rows=`<div class="rw"><span>${t('rw_hits')}</span><span>${me.hits} × 3</span></div><div class="rw"><span>${t('rw_sunk')}</span><span>${me.sunkCount} × 15</span></div><div class="rw"><span>${t('rw_win')}</span><span>+${bonus}</span></div>`;
  }else{
    coins=40;st.pvp++;mprog('play',1);
    rows=`<div class="rw"><span>${t('rw_hits')}</span><span>${me.hits} / ${G.players[1].hits}</span></div>`;
  }
  S.coins+=coins;st.earned+=coins;checkAch();save();
  (won||!ai)?sfx.win():sfx.lose();
  const title=ai?(won?'🏆 '+t('win_t'):'🌊 '+t('lose_t')):'🏆 '+t('pvp_win',{name:winner.name});
  await sleep(500);
  const r=await modal(`<h3>${title}</h3>${rows}<div class="rw" style="font-size:1.2rem"><span>${t('rw_total')}</span><span>🪙 +${coins}</span></div>`,[[t('again'),'again','green'],[t('to_menu'),'menu']]);
  if(r==='again')newGame();else show('menu');
}

/* ================= init ================= */
$('#langSel').value=LANG;
ensureDaily();save();refresh();show('menu');
</script>
