<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The World's Last Dawn</title>
<style>
:root{--ac:#ff9a3c;--ac2:#ffd27a;--red:#e0483c;--ok:#52d273;--tx:#f1e8dc;--pn:rgba(14,16,26,.86)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--tx);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;background:#000;display:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;overflow:auto;padding:16px;

.scr.on{display:flex}
.card{background:var(--pn);border:1px solid #ffffff22;border-radius:16px;padding:22px 24px;max-width:760px;width:100%;box-shadow:0 12px 50px #000a}

.tag{text-align:center;opacity:.85;margin:8px 0 16px;font-size:15px}
h2{font-size:18px;margin-bottom:8px;color:var(--ac2)}
label{font-size:12px;opacity:.75;display:block;margin:8px 0 3px}
input,select{width:100%;padding:9px 11px;border-radius:9px;border:1px solid #ffffff33;background:#0b0d16;color:var(--tx);font:inherit;user-select:text}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
button.b{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;color:#201000;background:linear-gradient(#ffc766,#ff9a3c);box-shadow:0 3px 0 #8a4a10;transition:transform .08s}
button.b:hover{transform:translateY(-1px)}button.b:active{transform:translateY(2px);box-shadow:0 1px 0 #8a4a10}
button.b.g{background:linear-gradient(#58606e,#3a4150);color:#fff;box-shadow:0 3px 0 #1c212b}
button.b:disabled{opacity:.45;cursor:not-allowed}
.sw{display:flex;gap:7px;margin-top:4px}.sw i{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw i.on{border-color:#fff}
.help{font-size:13px;line-height:1.55;opacity:.9;margin-top:14px;padding:10px 12px;background:#0007;border-radius:10px}
.msg{min-height:20px;margin-top:10px;text-align:center;color:#ff8f7a;font-size:14px}
.code{font-family:Impact,sans-serif;font-size:54px;letter-spacing:10px;text-align:center;color:var(--ac2);margin:6px 0}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.plist div{background:#0b0d16;border-radius:9px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:14px}.plist i{width:14px;height:14px;border-radius:50%;flex:none}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud *{pointer-events:none}
.pn{background:var(--pn);border:1px solid #ffffff22;border-radius:10px;padding:7px 11px}
#topL{position:absolute;left:12px;top:12px;min-width:190px}
#phase{font-weight:800;font-size:17px;color:var(--ac2)}#tmr{font-size:26px;font-weight:800;line-height:1.1}#zl{font-size:13px;opacity:.85}
#topC{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center;font-size:14px}
#svb{height:8px;width:170px;background:#0008;border-radius:5px;margin-top:4px;overflow:hidden}#svb i{display:block;height:100%;background:#3fd0c0;width:100%;transition:width .2s}
#mm{position:absolute;right:12px;top:12px;border:2px solid #ffffff44;border-radius:8px;background:#000a;width:144px;height:144px}
#feed{position:absolute;right:12px;top:166px;width:250px;text-align:right;font-size:13px;text-shadow:0 1px 3px #000}
#feed div{margin-bottom:3px;padding:2px 6px;background:#0007;border-radius:6px;display:inline-block}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;opacity:.85}
#cross:before{left:10px;top:0;width:2px;height:22px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%)}
#cross:after{top:10px;left:0;height:2px;width:22px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,65% 0,100% 0,100% 100%,65% 100%)}
#hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;border:2px solid #ff4a3a;border-radius:50%}
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:Impact,sans-serif;font-size:clamp(30px,6vw,64px);letter-spacing:4px;color:var(--ac2);text-shadow:0 4px 0 #6a2010,0 0 30px #000;opacity:0;transition:opacity .5s}
#banner small{display:block;font-family:"Trebuchet MS",sans-serif;font-size:.32em;letter-spacing:1px;color:#fff;margin-top:6px}
#botL{position:absolute;left:12px;bottom:12px;width:240px}
.bar{position:relative;height:24px;background:#000a;border-radius:7px;overflow:hidden;border:1px solid #fff3}.bar i{display:block;height:100%;background:linear-gradient(#ee5a4a,#a52a22);width:100%;transition:width .12s}
.bar span{position:absolute;inset:0;text-align:center;line-height:24px;font-weight:700;font-size:14px;text-shadow:0 1px 2px #000}
#coins{margin-top:6px;font-size:20px;font-weight:800;color:#ffd24a}
#wbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px}
#wbar div{width:74px;height:50px;border-radius:9px;background:#000a;border:2px solid #fff2;text-align:center;font-size:11px;padding-top:4px;opacity:.4}
#wbar div b{display:block;font-size:15px}#wbar div.own{opacity:.9}#wbar div.sel{border-color:var(--ac);background:#4a2a0a99;opacity:1}
#bmenu{position:absolute;right:12px;bottom:12px;width:270px;font-size:14px}
#bmenu div{padding:4px 8px;border-radius:6px}#bmenu div.sel{background:#2d6a3a;font-weight:700}#bmenu div.no{opacity:.45}
#hint{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:13px;opacity:.9;text-shadow:0 1px 3px #000}
#dead{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#6a000055;font-family:Impact,sans-serif;font-size:clamp(26px,5vw,52px);text-align:center;letter-spacing:2px}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,0,0,.75) 100%);opacity:0}
#resume{position:absolute;left:50%;top:62%;transform:translateX(-50%);display:none;font-size:20px;font-weight:800}
/* overlays */
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:5;overflow:auto}.ov.on{display:flex}
.ov .card{max-width:820px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0b0d16;border:1px solid #ffffff22;border-radius:10px;padding:9px 11px;cursor:pointer;font-size:14px}
.it:hover{border-color:var(--ac)}.it.dis{opacity:.4;cursor:not-allowed}.it b{color:#ffd24a;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #ffffff18}th{color:var(--ac2)}tr.me td{background:#ff9a3c22}

</head>

</div></div>

const defaultServer=()=>(location.protocol==='https:'?'wss://':'ws://')+(location.hostname||'localhost')+':8787';
function connect(){
  return new Promise((res,rej)=>{
    if(Net.open)return res();
    let url=($('#inServer').value||'').trim()||defaultServer();if(!/^wss?:\/\//.test(url))url='ws://'+url;
    let done=false,ws;try{ws=new WebSocket(url)}catch(e){return rej(e)}
    const to=setTimeout(()=>{if(!done){done=true;try{ws.close()}catch(e){}rej(new Error('timeout'))}},5000);
    ws.onopen=()=>{done=true;clearTimeout(to);Net.ws=ws;Net.open=true;LS.set('server',url);res()};
    ws.onerror=()=>{if(!done){done=true;clearTimeout(to);rej(new Error('err'))}};
    ws.onclose=()=>{const was=Net.open&&Net.ws===ws;if(was){Net.open=false;onClose()}};
    ws.onmessage=e=>{try{onNet(JSON.parse(e.data))}catch(err){console.error(err)}};
  });
}

function update(dt){

  for(const e of PL.values()){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}
  for(const e of ZB.values()){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}
  for(const e of SV.values()){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}
  const uo=uiOpen();
  if(Me.al&&!uo&&!G.over){
    const f=(keys.KeyW?1:0)-(keys.KeyS?1:0)+(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
    if(keys.ArrowLeft)Me.a-=2.4*dt;if(keys.ArrowRight)Me.a+=2.4*dt;
    if(f||s){const m=Math.hypot(f,s),sp=(keys.ShiftLeft||keys.ShiftRight)?6:4.2,ca=Math.cos(Me.a),sa=Math.sin(Me.a);
      const dx=(ca*f/m-sa*s/m)*sp*dt,dy=(sa*f/m+ca*s/m)*sp*dt;

  }
  inT+=dt;if(inT>=.05){inT=0;const fh=mouseDown&&locked&&!uo&&!bm&&Me.al&&!G.over;Net.send({t:'in',x:+Me.x.toFixed(3),y:+Me.y.toFixed(3),a:+Me.a.toFixed(3),f:fh?1:0,w:selW})}
  if(Me.a>6.2832)Me.a-=6.2832;if(Me.a<0)Me.a+=6.2832;
  recoil=Math.max(0,recoil-dt*6);flash=Math.max(0,flash-dt*14);hurtT=Math.max(0,hurtT-dt);hitT=Math.max(0,hitT-dt);shake=Math.max(0,shake-dt*1.6);
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('#banner').style.opacity=0}
  for(const f of feed)f.l-=dt;feed=feed.filter(f=>f.l>0);
  for(const f of fx){f.l-=dt;if(f.k==='dot'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.z+=f.vz*dt;if(f.g)f.vz-=7*dt;if(f.z<0){f.z=0;f.vz=0;f.vx*=.5;f.vy*=.5}}}

  hudT-=dt;if(hudT<=0){hudT=.08;updHud();if($('#shop').classList.contains('on'))renderShop();if($('#score').classList.contains('on'))renderScore()}
  drawMinimap();
}

function drawWalls(px,py,ca,sa){
  const plX=-sa*FOVK,plY=ca*FOVK,nf=nightF,half=RH/2;

function drawSprites(px,py,ca,sa){

function gunPoly(x,y,len,w0,w1,c1,c2){ctx.fillStyle=c1;ctx.beginPath();ctx.moveTo(x-w0/2,y);ctx.lineTo(x+w0/2,y);ctx.lineTo(x+w1/2,y-len);ctx.lineTo(x-w1/2,y-len);ctx.fill();ctx.fillStyle=c2;ctx.beginPath();ctx.moveTo(x-w0*.1,y);ctx.lineTo(x+w0*.25,y);ctx.lineTo(x+w1*.25,y-len);ctx.lineTo(x-w1*.1,y-len);ctx.fill()}
