<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Empire of the Dying Sun</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#120c08;color:#f3e9dc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Noto Sans SC","Noto Sans JP","Noto Sans KR",sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;overflow:auto;background:radial-gradient(ellipse at 50% 12%,#6b3410 0%,#2a1409 48%,#0d0705 100%);z-index:5}
.scr.on{display:flex}
.scr.clear{background:rgba(10,6,4,.78)}
h1{margin:0;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(30px,7.5vw,62px);letter-spacing:4px;color:#ffe2b8;text-shadow:0 3px 0 #7a3b0c,0 0 28px rgba(255,150,50,.45);text-align:center;line-height:1.05}
h1 b{color:#ff9a3c}
h1 small{display:block;font-size:.5em;letter-spacing:10px;color:#ffc27a}
h2{margin:0;font-size:24px;letter-spacing:2px;text-transform:uppercase;text-align:center}
.sub{color:#cdb79d;font-size:15px;text-align:center;max-width:480px}
.btn{background:linear-gradient(#e07a1f,#a24b0c);border:2px solid #ffb868;color:#fff;font-weight:800;padding:12px 24px;border-radius:10px;font-size:17px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;min-width:200px;font-family:inherit}
.btn.sec{background:linear-gradient(#4d4339,#2c251f);border-color:#8d7d6c;min-width:0}
.btn.sm{min-width:0;padding:8px 14px;font-size:14px}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
input[type=text],select{background:#241811;border:2px solid #7a604a;color:#fff;border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit;text-align:center;user-select:text;-webkit-user-select:text}
#joinCode{text-transform:uppercase;width:120px;letter-spacing:4px;font-weight:800}
.msg{min-height:20px;color:#ffb74d;font-weight:700;text-align:center}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.seg button{background:#2e231a;color:#e8d8c6;border:2px solid #7a604a;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer;font-family:inherit}
.seg button.on{background:#c2661a;border-color:#ffc27a;color:#fff}.seg button[disabled]{opacity:.5}
.list{display:flex;flex-direction:column;gap:4px;min-width:260px;max-width:360px;width:100%;max-height:34vh;overflow:auto}
.li{display:flex;align-items:center;gap:8px;background:rgba(30,20,14,.88);border:1px solid #5d4636;border-radius:8px;padding:5px 10px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.li small{margin-left:auto;color:#bba58f;font-weight:600}
.codeBox{background:#1a100a;border:2px dashed #ff9a3c;border-radius:10px;padding:6px 14px;text-align:center}
.codeBox b{font-size:30px;letter-spacing:6px;color:#ff9a3c}
#xpBar{width:min(340px,80vw);height:14px;background:#26180f;border-radius:7px;overflow:hidden;border:1px solid #7a604a}
#xpBar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff6a2b);width:0}
#skinGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:400px;width:100%}
.sk{background:#2a1d14;border:2px solid #7a604a;border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;font-weight:800;cursor:pointer}
.sk i{display:block;width:34px;height:34px;border-radius:8px;margin:0 auto 4px;border:2px solid rgba(255,255,255,.35)}
.sk.on{border-color:#ff9a3c;background:#3d2814}.sk.lock{opacity:.4}
#mapGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-width:380px;width:100%}
.mp{background:#2a1d14;border:2px solid #7a604a;border-radius:10px;padding:6px;text-align:center;font-size:13px;font-weight:800;cursor:pointer}
.mp small{display:block;color:#bba58f;font-weight:600;font-size:11px}
.mp.on{border-color:#ff9a3c;background:#3d2814}.mp.lock{opacity:.6}
.how{white-space:pre-line;max-width:540px;line-height:1.55;font-size:15px;background:rgba(30,20,14,.88);border:1px solid #5d4636;border-radius:10px;padding:14px 18px}
table{border-collapse:collapse;min-width:280px;max-width:520px;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid #4a372a;text-align:center;font-size:14px}
td:nth-child(2){text-align:left}tr.me td{color:#ffd54f;font-weight:800}
#endTitle{font-family:Impact,sans-serif;font-size:clamp(40px,9vw,72px);letter-spacing:4px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:3}
#hud.on{display:block}
#hud>*{pointer-events:auto}
#top{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none;flex-wrap:wrap}
#top>*{pointer-events:auto}
.pill{background:rgba(22,14,9,.82);border:1px solid #6d5238;border-radius:8px;padding:4px 10px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.pill small{font-weight:600;color:#bba58f;margin-left:4px}
.pill.gold{color:#ffd54f}.pill.red{color:#ff8b6b;border-color:#a33}
.ib{background:rgba(22,14,9,.82);border:1px solid #6d5238;border-radius:8px;width:34px;height:30px;color:#fff;font-size:15px;cursor:pointer;padding:0}
.sp{flex:1}
#plist{position:absolute;left:8px;top:calc(46px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:3px;width:150px;max-height:40vh;overflow:auto}
.pc{display:flex;align-items:center;gap:5px;background:rgba(22,14,9,.78);border:2px solid transparent;border-radius:8px;padding:2px 6px;font-size:12px;font-weight:700;cursor:pointer;height:24px}
.pc.tg{border-color:#ff9a3c}.pc.dead{opacity:.38;text-decoration:line-through}.pc.me{background:rgba(90,50,20,.85)}
.pc .nm{flex:0 1 52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .hp{flex:1;height:6px;background:#222;border-radius:3px;overflow:hidden;min-width:20px}.pc .hp i{display:block;height:100%;background:#7ed957}
#panel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(10,6,4,.95) 24%);padding:16px 8px calc(8px + env(safe-area-inset-bottom))}
#tabs{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto}
.tab{background:#2e231a;color:#e8d8c6;border:2px solid #6d5238;border-radius:8px;padding:5px 12px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{background:#c2661a;border-color:#ffc27a;color:#fff}
#cards{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.card{flex:0 0 auto;min-width:88px;background:rgba(48,34,24,.96);border:2px solid #7d5f45;border-radius:10px;padding:4px 8px;text-align:center;cursor:pointer}
.card.on{border-color:#ffb347;background:rgba(95,55,20,.96)}
.card .ic{font-size:24px;line-height:1.15}.card .nm{font-size:11px;font-weight:800;white-space:nowrap}.card .co{font-size:12px;color:#ffd54f;font-weight:800}.card .sb{font-size:10px;color:#bba58f;min-height:12px}
.card.dis{opacity:.45}
#info{position:absolute;right:8px;bottom:calc(112px + env(safe-area-inset-bottom));background:rgba(22,14,9,.92);border:2px solid #ff9a3c;border-radius:10px;padding:8px 10px;display:none;flex-direction:column;gap:5px;min-width:150px;font-weight:800;font-size:13px}
#info.on{display:flex}
#info .btn{min-width:0;padding:6px 10px;font-size:12px}
#toast{position:absolute;left:50%;top:34%;transform:translateX(-50%);background:rgba(0,0,0,.78);padding:8px 16px;border-radius:10px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:86vw}
#toast.on{opacity:1}
#banner{position:absolute;left:0;right:0;top:18%;text-align:center;font-family:Impact,sans-serif;font-size:clamp(24px,5.5vw,46px);letter-spacing:3px;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .35s;pointer-events:none;padding:0 12px}
#banner.on{opacity:1}
#tut{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));background:rgba(255,154,60,.95);color:#1a0d04;font-weight:800;padding:8px 14px;border-radius:10px;max-width:88vw;text-align:center;display:none;pointer-events:none}
#joy{position:absolute;left:18px;bottom:calc(140px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);touch-action:none;display:none}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,154,60,.75)}
#fireB{position:absolute;right:18px;bottom:calc(160px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;background:rgba(220,70,30,.7);border:3px solid #ffb868;font-size:30px;touch-action:none;display:none}
#hud.touch #joy,#hud.touch #fireB{display:block}
#flash{position:fixed;inset:0;background:#f33;opacity:0;pointer-events:none;z-index:4;transition:opacity .5s}
@media (max-width:640px){#plist{width:118px}.pill{font-size:13px;padding:3px 7px}.card{min-width:78px}}
@media (max-height:520px){.scr{justify-content:flex-start}h1{font-size:34px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="flash"></div>

<div id="sMenu" class="scr on">
  <h1>EMPIRE <small>OF THE</small><b>DYING SUN</b></h1>
  <div class="sub" data-i="sub"></div>
  <input id="inName" type="text" maxlength="12" data-ph="name">
  <button class="btn" id="bPlay" data-i="play"></button>
  <button class="btn" id="bOnline" data-i="online"></button>
  <div class="row">
    <button class="btn sec sm" id="bProfile" data-i="army"></button>
    <button class="btn sec sm" id="bHow" data-i="how"></button>
  </div>
  <div class="row">
    <select id="selLang"></select>
    <select id="selGfx"></select>
    <button class="btn sec sm" id="bMute">🔊</button>
    <button class="btn sec sm" id="bMus">🎵</button>
  </div>
</div>

<div id="sLobby" class="scr">
  <h2 data-i="online"></h2>
  <button class="btn" id="bCreate" data-i="create"></button>
  <div class="row"><input id="joinCode" type="text" maxlength="5" data-ph="code"><button class="btn sm" id="bJoin" data-i="join"></button></div>
  <div class="msg" id="lobMsg"></div>
  <button class="btn sec sm" id="bLobBack" data-i="back"></button>
</div>

<div id="sRoom" class="scr">
  <h2 data-i="players"></h2>
  <div class="codeBox" id="codeBox" hidden><span data-i="code"></span><br><b id="roomCode"></b><br><button class="btn sec sm" id="bCopy" data-i="copy"></button></div>
  <div class="list" id="roomList"></div>
  <div class="row"><span data-i="mode"></span><div class="seg" id="segMode"><button data-v="0" data-i="coop"></button><button data-v="1" data-i="pvp"></button></div></div>
  <div class="sub" id="modeHint"></div>
  <div id="mapGrid"></div>
  <div class="row"><span data-i="diff"></span><div class="seg" id="segDiff"><button data-v="0" data-i="easy"></button><button data-v="1" data-i="normal"></button><button data-v="2" data-i="hard"></button><button data-v="3" data-i="nightmare"></button></div></div>
  <div class="row" id="botRow"><span data-i="bots"></span><button class="btn sec sm" id="botM">−</button><b id="botCount">0</b><button class="btn sec sm" id="botP">+</button></div>
  <div class="msg" id="roomMsg"></div>
  <div class="row"><button class="btn" id="bStart" data-i="start"></button><button class="btn sec" id="bRoomBack" data-i="back"></button></div>
</div>

<div id="sProfile" class="scr">
  <h2 id="profRank"></h2>
  <div id="xpBar"><i></i></div><div class="sub" id="xpTxt"></div>
  <div class="sub" id="coinTxt" style="color:#ffd54f;font-weight:800"></div>
  <div class="sub" data-i="skin"></div>
  <div id="skinGrid"></div>
  <button class="btn sec" id="bProfBack" data-i="back"></button>
</div>

<div id="sHow" class="scr">
  <h2 data-i="how"></h2>
  <div class="how" id="howTxt"></div>
  <button class="btn sec" id="bHowBack" data-i="back"></button>
</div>

<div id="sEnd" class="scr clear">
  <div id="endTitle"></div>
  <div class="sub" id="endWave"></div>
  <table id="endTable"></table>
  <div class="sub" id="endXp"></div>
  <div class="sub" id="endUnlock" style="color:#ffd54f;font-weight:800"></div>
  <div class="row"><button class="btn" id="bAgain" data-i="again"></button><button class="btn sec" id="bEndMenu" data-i="menu"></button></div>
</div>

<div id="hud">
  <div id="top">
    <div class="pill gold">💰 <span id="sMoney">0</span><small id="sInc"></small></div>
    <div class="pill red">🏛 <span id="sHq"></span></div>
    <div class="pill">🌊 <span id="sWave"></span><small id="sCd"></small></div>
    <div class="pill">🪖 <span id="sHp"></span></div>
    <div class="sp"></div>
    <button class="ib" id="bNext">⏭</button><button class="ib" id="bView">🗺</button><button class="ib" id="bCamL">⟲</button><button class="ib" id="bCamR">⟳</button><button class="ib" id="bSnd">🔊</button><button class="ib" id="bQuit">✖</button>
  </div>
  <div id="plist"></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="tut"></div>
  <div id="info"></div>
  <div id="panel"><div id="tabs"></div><div id="cards"></div></div>
  <div id="joy"><i></i></div>
  <button id="fireB">🔥</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function mkPath(pts){const seg=[];let L=0;for(let i=0;i<pts.length-1;i++){const[ax,az]=pts[i],[bx,bz]=pts[i+1],l=Math.hypot(bx-ax,bz-az);seg.push({ax,az,bx,bz,l,s:L,dx:(bx-ax)/l,dz:(bz-az)/l});L+=l}return{seg,L}}
function pathAt(P,d){d=clamp(d,0,P.L);for(const s of P.seg)if(d<=s.s+s.l){const u=d-s.s;return[s.ax+s.dx*u,s.az+s.dz*u,s.dx,s.dz]}const s=P.seg[P.seg.length-1];return[s.bx,s.bz,s.dx,s.dz]}
function distPath(P,x,z){let m=1e9;for(const s of P.seg){const px=x-s.ax,pz=z-s.az,u=clamp(px*s.dx+pz*s.dz,0,s.l),d=Math.hypot(px-s.dx*u,pz-s.dz*u);if(d<m)m=d}return m}
const MI=[];
function mapInfo(i){

 const mp=MAPS[i],P=mkPath(mp.path),hq=mp.path[mp.path.length-1],sp=mp.path[0],rnd=mulberry(i*7919+13),blocked=new Set(),ob=[];let tr=0;
 while(ob.length<16&&tr++<500){const ci=Math.floor(rnd()*24),cj=Math.floor(rnd()*24),x=cenOf(ci),z=cenOf(cj),k=ci*24+cj;
  if(distPath(P,x,z)<3.6||Math.hypot(x-hq[0],z-hq[1])<6||blocked.has(k))continue;blocked.add(k);ob.push({x,z,k:Math.floor(rnd()*3),s:.8+rnd()*.7,r:rnd()*6})}

let G=null;const STEP=.05;
function mkSector(i){const cash=[600,450,350,300][G.diff];return{id:i,alive:1,hq:100,hqm:100,cash,queue:[],sp:0,en:[],tw:[],occ:new Set(),tech:[0,0,0,0,0,0],ev:[],nid:1,pl:[],inc:0,bonus:0,sendQ:[],sendT:0,place:0,timers:[]}}
function launch(){
 if(!R.host)return;
 const guests=R.online?Net.conns.filter(x=>x.ready):[];
 const pl=[{name:myName(),skin:prof.skin,rank:rankOf(prof.xp),ctrl:'me'}];
 guests.forEach(x=>pl.push({name:x.name,skin:x.skin,rank:x.rank,ctrl:'net',conn:x.c}));
 const bots=R.mode===1?clamp(R.bots,0,16-pl.length):0;
 for(let i=0;i<bots;i++)pl.push({name:BOTN[i%16],skin:rand(5),rank:5,ctrl:'bot'});
 if(R.mode===1&&pl.length<2)return;
 if(G)clearInterval(G.timer);
 if(!initRenderer()){toast('WebGL / three.js not available',3000);return}
 newGame(pl,R.mode,R.map,R.diff);
 const info=G.P.map(p=>({name:p.name,skin:p.skin,sec:p.sec,b:p.ctrl==='bot'?1:0}));
 G.P.forEach((p,i)=>{if(p.ctrl==='net')Net.send(p.conn,{t:'start',mode:G.mode,map:G.map,diff:G.diff,pl:info,you:i})});
 startView({mode:G.mode,map:G.map,diff:G.diff,pl:info,you:0});
 G.last=performance.now();G.timer=setInterval(tick,50)}
function newGame(pl,mode,map,diff){
 G={mode,map,diff,P:[],S:[],t:0,w:0,wt:0,wlen:40,over:false,acc:0,last:0,timer:0,snapT:0,skip:false,rwm:[1.2,1,.9,.85][diff]};
 const mi=mapInfo(map);
 if(mode===0)G.S.push(mkSector(0));else pl.forEach((p,i)=>G.S.push(mkSector(i)));
 pl.forEach((p,i)=>{const sec=mode===0?0:i;
  const P={i,name:p.name,skin:p.skin,rank:p.rank,ctrl:p.ctrl,conn:p.conn,sec,x:mi.hq[0]+3,z:mi.hq[1]-3,ang:0,hp:100,lives:3,alive:true,respT:0,inp:{mx:0,mz:0,aim:0,fire:0},fireT:0,pw:[0,0,0,0],kills:0,tg:-1,bot:p.ctrl==='bot'?{t:3,st:20}:null,place:0};
  G.P.push(P);G.S[sec].pl.push(P)})}
function tick(){
 if(!G||G.over)return;
 const now=performance.now();G.acc+=Math.min(.25,(now-G.last)/1000);G.last=now;
 let n=0;while(G.acc>=STEP&&n<5){step(STEP);G.acc-=STEP;n++;if(G.over)break}
 G.snapT+=n*STEP;if(G.snapT>=.1){G.snapT=0;broadcastSnap()}}
function step(dt){
 G.t+=dt;waveLogic(dt);
 G.S.forEach(s=>{if(s.alive)simSector(s,dt)});
 G.P.forEach(p=>simPlayer(p,dt));checkEnd()}
function buildWave(w){
 const dm=[.8,1,1.2,1.5][G.diff],q=[],add=(ty,n)=>{for(let i=0;i<n;i++)q.push(ty)};
 add('inf',Math.round((5+w*1.4)*dm));
 if(w>=3)add('jeep',Math.round((1+(w-2)*.8)*dm));
 if(w>=6)add('tank',Math.round((.5+(w-5)*.5)*dm));
 if(w>=8)add('heli',Math.round((1+(w-8)*.4)*dm));
 if(w>=14)add('jet',Math.round((1+(w-13)*.35)*dm));
 for(let i=q.length-1;i>0;i--){const j=rand(i+1);[q[i],q[j]]=[q[j],q[i]]}
 if(w%10===0)add('boss',Math.max(1,w/10));
 return q}
const hpMul=w=>(1+w*.09+w*w*.0035)*[.75,1,1.35,1.8][G.diff];
function waveLogic(dt){
 G.wt+=dt;
 const clear=G.S.every(s=>!s.alive||(s.queue.length===0&&s.en.length===0));
 if(G.w<WAVES&&(G.skip||G.wt>=(G.w===0?22:G.wlen)||(clear&&G.wt>7&&G.w>0))){
  G.w++;G.wt=0;G.skip=false;
  G.S.forEach(s=>{if(!s.alive)return;if(G.w>1)s.cash+=40+G.w*6;s.queue=buildWave(G.w);s.sp=0});
  G.gap=clamp(26/(G.S[0].queue.length||1),.2,1.5)}}
function spawnEnemy(s,ty,sent){
 const mi=mapInfo(G.map),d=ED[ty],hm=hpMul(Math.max(1,G.w));
 s.en.push({id:s.nid++,ty,hp:d.hp*hm,mhp:d.hp*hm,d:0,x:mi.sp[0],z:mi.sp[1],ang:0,ef:0,len:d.air?mi.La:mi.P.L,sent:sent?1:0})}
function hurt(s,e,dm,ap,pl){
 if(e.hp<=0)return;const ar=(ED[e.ty].arm||0)*(ap?.4:1);e.hp-=dm*(1-ar);
 if(e.hp<=0){s.cash+=ED[e.ty].rw*G.rwm*(1+G.w*.015)*(e.sent?.5:1);if(pl)pl.kills++;s.ev.push(['x',r1(e.x),r1(e.z),ED[e.ty].air?1:0])}}
function area(s,x,z,r,dm,g,a,ap,pl){for(const e of s.en){if(e.hp<=0)continue;const air=ED[e.ty].air;if(air?!a:!g)continue;if(Math.hypot(e.x-x,e.z-z)<=r+ED[e.ty].r*.5)hurt(s,e,dm,ap,pl)}}
function simSector(s,dt){
 const mi=mapInfo(G.map),tk=s.tech;
 if(s.queue.length){s.sp-=dt;while(s.sp<=0&&s.queue.length){spawnEnemy(s,s.queue.shift());s.sp+=G.gap}}
 if(s.sendQ.length){s.sendT-=dt;if(s.sendT<=0){spawnEnemy(s,s.sendQ.shift(),1);s.sendT=.45}}
 let inc=s.bonus;for(const w of s.tw)if(w.ty==='gen')inc+=genRate(w);s.inc=inc*(1+.15*tk[3]);s.cash+=s.inc*dt;
 for(let i=s.timers.length-1;i>=0;i--){const m=s.timers[i];m.t-=dt;if(m.t<=0){s.timers.splice(i,1);
  area(s,m.x,m.z,7,260*(1+.1*tk[0]),1,1,1,m.pl);s.ev.push(['a',m.x,m.z])}}
 for(const e of s.en){
  if(e.hp<=0)continue;const d=ED[e.ty];
  if(e.ef>0){e.ef-=dt;continue}
  e.d+=d.sp*dt;
  if(d.air){const u=Math.min(1,e.d/mi.La);e.x=mi.sp[0]+(mi.hq[0]-mi.sp[0])*u;e.z=mi.sp[1]+(mi.hq[1]-mi.sp[1])*u;e.ang=Math.atan2(mi.hq[0]-mi.sp[0],mi.hq[1]-mi.sp[1])}
  else{const p=pathAt(mi.P,e.d);e.x=p[0];e.z=p[1];e.ang=Math.atan2(p[2],p[3])}
  if(e.d>=e.len){e.hp=0;e.dead=1;const dmg=d.hd*(1-.12*tk[4]);s.hq-=dmg;s.ev.push(['hq',r1(e.x),r1(e.z)]);continue}
  if(d.atk>0){let best=null,bd=d.ar;for(const p of s.pl){if(!p.alive||p.ctrl==='bot')continue;const dd=Math.hypot(p.x-e.x,p.z-e.z);if(dd<bd){bd=dd;best=p}}
   if(best)best.hp-=d.atk*dt*(G.diff*.25+.75)}}
 for(const w of s.tw)twStep(s,w,dt);
 s.en=s.en.filter(e=>!e.dead&&e.hp>0);
 s.tw=s.tw.filter(w=>!w.gone);
 if(s.hq<=0&&s.alive){s.hq=0;s.alive=0;s.en=[];s.queue=[];s.place=G.S.filter(x=>x.alive).length+1;
  s.pl.forEach(p=>{p.place=s.place;if(G.mode===1){if(p.ctrl==='me')showOut();else if(p.ctrl==='net')Net.send(p.conn,{t:'out'})}})}}
function twStep(s,w,dt){
 const def=TDEF[w.ty];if(w.ty==='gen')return;
 if(w.ty==='mn'){for(const e of s.en){if(e.hp<=0||ED[e.ty].air)continue;if(Math.hypot(e.x-w.x,e.z-w.z)<1.5){area(s,w.x,w.z,4,def.dm*(1+.1*s.tech[0]),1,0,1);s.ev.push(['mi',w.x,w.z]);w.gone=1;break}}return}
 w.cd-=dt;const st=twStat(w,s.tech);let best=null,bp=-1;
 for(const e of s.en){if(e.hp<=0)continue;const air=ED[e.ty].air;if(air?!def.air:!def.gnd)continue;const dx=e.x-w.x,dz=e.z-w.z;if(dx*dx+dz*dz>st.rg*st.rg)continue;const pg=e.d/e.len;if(pg>bp){bp=pg;best=e}}
 if(!best)return;
 w.ang=Math.atan2(best.x-w.x,best.z-w.z);if(w.cd>0)return;w.cd=st.cd;
 const air=ED[best.ty].air?1:0,ex=r1(best.x),ez=r1(best.z);
 switch(w.ty){
  case'mg':hurt(s,best,st.dm,0);if(Math.random()<.6)s.ev.push(['g',w.x,w.z,ex,ez,air]);break;
  case'cn':area(s,best.x,best.z,3,st.dm,1,0,1);s.ev.push(['c',w.x,w.z,ex,ez]);break;

  if(f.k===0){const s=f.w*(1-u);f.m.scale.x=f.m.scale.y=Math.max(.01,s)}else if(f.k===1)f.m.scale.setScalar(f.r*(.2+.8*Math.sqrt(u)));

 if(my.alive&&!V.over){const n=Math.hypot(INP.mx,INP.mz);if(n>.01){const l=Math.min(1,n);my.x=clamp(my.x+INP.mx/n*l*7*dt,-23,23);my.z=clamp(my.z+INP.mz/n*l*7*dt,-23,23)}}

 for(const o of V.tw.values()){if(o.pop<1){o.pop=Math.min(1,o.pop+dt*5);o.m.scale.setScalar(.1+.9*o.pop)}const tp=o.m.userData.top;if(tp&&o.ty!=='gen'&&o.ty!=='mn'){o.ang=angLerp(o.ang,o.tang,Math.min(1,dt*10));tp.rotation.y=o.ang}}
 for(const o of V.pl.values()){o.x+=(o.tx-o.x)*k;o.z+=(o.tz-o.z)*k;o.ang=angLerp(o.ang,o.tang,k);o.m.position.set(o.x,0,o.z);o.m.rotation.y=o.ang}

  if(ty==='mn'){const mi=mapInfo(V.map);let bd=1e9,bq=null;for(const s of mi.P.seg){const px=gx-s.ax,pz=gz-s.az,u=clamp(px*s.dx+pz*s.dz,0,s.l),qx=s.ax+s.dx*u,qz=s.az+s.dz*u,d=Math.hypot(gx-qx,gz-qz);if(d<bd){bd=d;bq=[qx,qz]}}if(bq){gx=bq[0];gz=bq[1]}}
  else{gx=cenOf(cellOf(gx));gz=cenOf(cellOf(gz))}
  gh.visible=true;gh.position.set(gx,.15,gz);gh.material.color.set(ok&&V.cash>=TDEF[ty].c?0x44ff66:0xff4444);RN.ring.visible=TDEF[ty].rg>0;RN.ring.position.set(gx,.2,gz);RN.ring.scale.setScalar(Math.max(.5,TDEF[ty].rg*(1+.08*V.tk[1])));RN.ring.material.color.set(ok?0xffffff:0xff6666)}}
 else if(TOOL&&TOOL.k==='pw'&&!MOBILE){groundPoint();if(MOUSE.g){RN.ring.visible=true;RN.ring.position.set(MOUSE.g.x,.2,MOUSE.g.z);RN.ring.scale.setScalar(7);RN.ring.material.color.set(0xff5533)}}
 else if(SEL===null)RN.ring.visible=false;
 const cam=RN.cam,asp=innerWidth/innerHeight;let px,py,pz,lx,ly,lz;

 else{const D_=CAM.dist,y=CAM.yaw;px=my.x+Math.sin(y)*D_;pz=my.z+Math.cos(y)*D_;py=D_*.72+1.5;lx=my.x;ly=1.5;lz=my.z}
 const ck=1-Math.exp(-dt*6);CAM.px+=(px-CAM.px)*ck;CAM.py+=(py-CAM.py)*ck;CAM.pz+=(pz-CAM.pz)*ck;CAM.cx+=(lx-CAM.cx)*ck;CAM.cz+=(lz-CAM.cz)*ck;CAM.cy+=(ly-CAM.cy)*ck;

const Net={peer:null,role:'',conns:[],conn:null,hb:null,wd:null,last:0,
 send(c,m){try{if(c&&c.open)c.send(m)}catch(e){}},
 close(){clearInterval(this.hb);clearInterval(this.wd);try{this.conns.forEach(x=>x.c.close())}catch(e){}try{this.conn&&this.conn.close()}catch(e){}try{this.peer&&this.peer.destroy()}catch(e){}this.peer=null;this.role='';this.conns=[];this.conn=null}};
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

const lobMsg=k=>$('#lobMsg').textContent=k?t(k):'';
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[rand(a.length)];return s};
$('#bOnline').onclick=()=>{Snd.init();Snd.play('click');Net.close();lobMsg();show('sLobby')};

$('#bCreate').onclick=async()=>{
 Snd.play('click');lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let code,peer;
 for(let q=0;q<5;q++){code=genCode();try{peer=await openPeer('edsun-'+code);break}catch(e){if(!(e&&e.type==='unavailable-id')){lobMsg('connErr');return}}}
 if(!peer){lobMsg('connErr');return}
 Net.peer=peer;Net.role='host';R.online=true;R.host=true;R.code=code;
 peer.on('connection',c=>{
  const x={c,ready:false,name:'',skin:0,rank:1};
  const reg=()=>{c.on('data',m=>hostData(x,m));c.on('close',()=>guestGone(x));c.on('error',()=>{})};
  if(c.open)reg();else c.on('open',reg)});
 peer.on('error',()=>{});

function guestGone(x){
 const i=Net.conns.indexOf(x);if(i<0)return;Net.conns.splice(i,1);
 if(G&&!G.over){const p=G.P.find(q=>q.conn===x.c);if(p){p.conn=null;if(G.mode===1){p.ctrl='bot';p.bot={t:2,st:20}}else{p.ctrl='gone';p.lives=0;p.alive=false}}}
 else if(screen==='sRoom'||screen==='sEnd'){roomBroadcast();if(screen==='sRoom')renderRoom()}}
function refuse(x){Net.send(x.c,{t:'full'});setTimeout(()=>{try{x.c.close()}catch(e){}},300)}
function hostData(x,m){
 if(!m||typeof m!=='object')return;
 if(m.t==='hello'){
  if((G&&!G.over)||screen==='sGame'||x.ready)return refuse(x);
  const cnt=Net.conns.filter(y=>y.ready).length+1;
  if(cnt+R.bots>=16){if(R.bots>0)R.bots--;else return refuse(x)}
  x.name=String(m.name||'Hero').slice(0,12);x.skin=clamp(m.skin|0,0,4);x.rank=clamp(m.rank|0,1,30);
  x.ready=true;Net.conns.push(x);roomBroadcast();renderRoom();return}
 if(!x.ready||!G||G.over)return;
 const pi=G.P.findIndex(p=>p.conn===x.c);if(pi<0)return;
 if(m.t==='in'){const i=G.P[pi].inp;i.mx=clamp(+m.mx||0,-1,1);i.mz=clamp(+m.mz||0,-1,1);i.aim=clamp(+m.aim||0,-7,7);i.fire=m.fire?1:0}
 else if(m.t==='cmd'&&typeof m.k==='string'&&m.k.length<3)doCmd(pi,m)}
async function joinRoom(code){
 code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){lobMsg('notFound');return}lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let peer;try{peer=await openPeer()}catch(e){lobMsg('connErr');return}
 Net.peer=peer;Net.role='guest';let opened=false;
 peer.on('error',e=>{if(!opened)lobMsg(e&&e.type==='peer-unavailable'?'notFound':'connErr')});
 const c=peer.connect('edsun-'+code,{reliable:true});Net.conn=c;
 c.on('open',()=>{opened=true;R.online=true;R.host=false;R.code=code;Net.last=Date.now();
  c.send({t:'hello',name:myName(),skin:prof.skin,rank:rankOf(prof.xp)});
  Net.hb=setInterval(()=>Net.send(c,{t:'ping'}),3000);
  Net.wd=setInterval(()=>{if(Date.now()-Net.last>15000)hostGone()},2000)});
 c.on('data',guestData);c.on('close',()=>{if(opened)hostGone()});c.on('error',()=>{});
 setTimeout(()=>{if(!opened&&Net.peer===peer){lobMsg('notFound');Net.close()}},12000)}
function hostGone(){
 if(!Net.peer)return;Net.close();toast(t('hostLeft'),3000);
 V=null;G=null;if(RN)RN.run=false;R.online=false;R.host=true;show('sMenu')}

function guestData(m){
 if(!m||typeof m!=='object')return;Net.last=Date.now();
 switch(m.t){
  case'room':
   R.pl=(m.pl||[]).slice(0,16).map(p=>({n:String(p.n).slice(0,12),s:p.s|0,k:clamp(p.k|0,1,30)}));R.mode=m.mode?1:0;R.map=clamp(m.map|0,0,MAPS.length-1);R.diff=clamp(m.diff|0,0,3);R.bots=clamp(m.bots|0,0,16);R.you=m.you|0;
   if(screen!=='sGame'&&screen!=='sEnd'){renderRoom();show('sRoom')}break;
  case'full':Net.close();lobMsg('full');show('sLobby');break;
  case'start':
   if(!Array.isArray(m.pl)||m.pl.length<1||m.pl.length>16||!initRenderer())break;
   G=null;startView({mode:m.mode?1:0,map:clamp(m.map|0,0,MAPS.length-1),diff:clamp(m.diff|0,0,3),pl:m.pl.map(p=>({name:String(p.name).slice(0,12),skin:clamp(p.skin|0,0,4),sec:p.sec|0,b:p.b?1:0})),you:clamp(m.you|0,0,m.pl.length-1)});break;
  case's':if(V&&!V.over&&!G)applySnap(m);break;
  case'end':if(V&&!V.over&&Array.isArray(m.res))showEnd(m);break;
  case'out':showOut();break;
  case'chat':chatIn(m);break;
  case'lobby':if(screen==='sEnd'||screen==='sGame'){V=null;if(RN)RN.run=false;renderRoom();show('sRoom')}break;
  case'err':if(typeof m.k==='string')uiErr(m.k);break;
  case'bye':hostGone();break}}

R.pl=[{n:myName(),s:prof.skin,k:rankOf(prof.xp)}];
applyLang();renderMute();
if(typeof THREE==='undefined'){$('#bPlay').disabled=$('#bOnline').disabled=true;$('.sub').textContent='3D engine failed to load — check your connection'}
