#topL{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:6px}

function seedRng(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}h=h||1;return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}

const Snd={ctx:null,mu:null,started:false,last:{},
 init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.mu=this.ctx.createGain();this.mu.gain.value=SV.snd?1:0;this.mu.connect(this.ctx.destination)}catch(e){}},
 resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();if(!this.started&&this.ctx){this.started=true;this.music()}},
 tone(f,d,type,v,slide){if(!this.ctx||!SV.snd)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),c.currentTime+d);g.gain.value=v||.1;g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(this.mu);o.start();o.stop(c.currentTime+d+.02)},
 noise(d,v,fr){if(!this.ctx||!SV.snd)return;const c=this.ctx,n=c.sampleRate*d|0,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=fr||800;const g=c.createGain();g.gain.value=v||.15;s.connect(f);f.connect(g);g.connect(this.mu);s.start()},
 play(k){if(!this.ctx||!SV.snd)return;const now=performance.now();if(this.last[k]&&now-this.last[k]<(k==='hit'?70:25))return;this.last[k]=now;
  switch(k){case'click':this.tone(520,.08,'square',.05);break;
   case'hit':this.tone(180+Math.random()*60,.1,'sawtooth',.05,90);break;
   case'shoot':this.tone(700,.1,'triangle',.04,1100);break;
   case'sum':this.tone(220,.35,'sawtooth',.09,660);this.noise(.3,.1,1200);break;
   case'roar':this.tone(90,.6,'sawtooth',.12,40);this.noise(.5,.2,500);break;
   case'die':this.noise(.4,.2,600);this.tone(260,.4,'square',.06,60);break;
   case'lvl':[523,659,784].forEach((f,i)=>setTimeout(()=>this.tone(f,.2,'triangle',.08),i*90));break;
   case'win':[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,.3,'triangle',.1),i*140));break;
   case'lose':[330,262,196].forEach((f,i)=>setTimeout(()=>this.tone(f,.35,'sawtooth',.07),i*180));break;
   case'err':this.tone(120,.15,'square',.06);break}},
 music(){const sc=[110,130.8,146.8,164.8,196,220,261.6];let i=0;setInterval(()=>{if(!this.ctx||!SV.snd||document.hidden)return;
   if(i%8===0)this.tone(55,3.8,'sine',.06);
   if(Math.random()<.7)this.tone(sc[Math.floor(Math.random()*sc.length)]*(Math.random()<.3?2:1),1.6,'triangle',.025);i++},550)}};

const DMGK=.17,ARENA=46,ZR0=42,SD=1/30,MAXP=16,SLOTMAX=12;
const BTYPES={wolf:{e:'🐺',cost:40,hp:45,dmg:5,sp:9,rng:1.8,cd:.6,cap:1},
 bear:{e:'🐻',cost:80,hp:150,dmg:9,sp:5.5,rng:2.4,cd:1,cap:2},

let G=null,V=null,META=[],ME=0,R={online:false,host:true,code:'',pl:[],diff:1},speed=1,acc=0,mode='menu',curScr='sMenu';
const rnd=(a,b)=>a+Math.random()*(b-a);

function newGame(meta,diff){
 const g={t:0,diff,P:[],E:new Map(),M:[],J:[],ev:[],evNet:[],nid:100,over:false,zr:ZR0,alive:meta.length,warned:false};
 const N=meta.length,off=Math.random()*6.28,order=[...Array(N).keys()].sort(()=>Math.random()-.5);
 meta.forEach((m,i)=>{
  const ang=off+order[i]/N*6.2832,x=Math.cos(ang)*(ZR0-3),z=Math.sin(ang)*(ZR0-3),up=m.up||{};
  const bm=m.b?[.85,1,1.1][diff]:1,mh=Math.round((260+15*(up.vit|0))*bm);
  const p={i,h:true,o:i,n:m.n,b:!!m.b,x,z,dx:x,dz:z,hp:mh,mh,al:true,lv:1,xp:0,gold:50+15*(up.mine|0),kills:0,place:0,focus:-1,cd:0,face:Math.atan2(-x,-z),dmg:(5+(up.pow|0))*(m.b?[.8,1,1.1][diff]:1),sp:7,bt:Math.random(),tgt:-1,zt:0,sl:0,mv:0};
  g.P.push(p);g.E.set(i,p)});
 return g}

function fx(k,x,z,a,b){const e=[k,r2(x),r2(z),a,b];G.ev.push(e);if(Net.role==='host')G.evNet.push(e)}
function valid(e){return !!e&&e.hp>0&&(!e.h||e.al)}
function nearestEnemy(x,z,o,range){let best=null,bd=range*range;
 for(const p of G.P){if(!p.al||p.o===o)continue;const d=(p.x-x)**2+(p.z-z)**2;if(d<bd){bd=d;best=p}}
 for(const m of G.M){if(m.hp<=0||m.o===o)continue;const d=(m.x-x)**2+(m.z-z)**2;if(d<bd){bd=d;best=m}}
 return best}
function gainXp(p,n){p.xp+=n;const lv=Math.min(8,1+Math.floor(p.xp/4));if(lv>p.lv){p.lv=lv;p.mh+=15;p.hp=Math.min(p.mh,p.hp+25);p.dmg+=1;fx('lvl',p.x,p.z,p.o)}}
function hurt(tg,amt,o){if(!valid(tg))return;tg.hp-=o>=0?amt*DMGK:amt;fx('hit',tg.x,tg.z,o);if(tg.hp<=0)kill(tg,o)}
function kill(tg,o){
 const killer=G.P[o];
 if(tg.h){tg.al=false;tg.hp=0;tg.place=G.alive;G.alive--;
  for(const m of G.M)if(m.o===tg.i&&m.hp>0){m.hp=0;fx('die',m.x,m.z,0)}
  fx('die',tg.x,tg.z,1);
  if(killer&&killer!==tg&&killer.al){killer.kills++;killer.gold+=35;gainXp(killer,3)}
  fx('kill',0,0,o,tg.i);
  if(G.alive<=1)finish()}
 else{tg.hp=0;fx('die',tg.x,tg.z,0);if(killer&&killer.al){killer.gold+=6;gainXp(killer,1)}}}
function finish(){G.over=true;for(const p of G.P)if(p.al)p.place=1}
function proj(x,z,tg,o,dmg,c,sp){G.J.push({x,z,tg:tg.h?tg.i:tg.id,o,dmg,c,sp:sp||20,life:3})}
function moveToward(e,tx,tz,sp,dt){const dx=tx-e.x,dz=tz-e.z,d=Math.hypot(dx,dz);if(d>.15){const s=Math.min(sp*dt,d);e.x+=dx/d*s;e.z+=dz/d*s;e.face=Math.atan2(dx,dz);e.mv=1}else e.mv=0}

function summon(idx,ty){const p=G.P[idx],T=BTYPES[ty];if(!p||!p.al||!T)return 0;
 if(p.gold<T.cost)return -1;if(p.sl+T.cap>SLOTMAX)return -2;
 p.gold-=T.cost;p.sl+=T.cap;const a=Math.random()*6.28,r=2.6;
 const m={id:G.nid++,o:idx,ty,x:p.x+Math.cos(a)*r,z:p.z+Math.sin(a)*r,hp:T.hp,mh:T.hp,cd:0,face:p.face,tg:-1,rt:0,mv:0,fly:!!T.rg,zt:0};
 G.M.push(m);G.E.set(m.id,m);fx('sum',m.x,m.z,TYL.indexOf(ty),idx);return 1}

function applyCmd(idx,c){const p=G.P[idx];if(!p||!p.al||G.over||!c)return;
 switch(c.k){
  case'mv':{const x=+c.x,z=+c.z;if(isFinite(x)&&isFinite(z)){const r=Math.hypot(x,z),m=ARENA-1.5;p.dx=r>m?x/r*m:x;p.dz=r>m?z/r*m:z}break}
  case'fo':{const e=G.E.get(c.id|0);p.focus=(valid(e)&&e.o!==idx)?(e.h?e.i:e.id):-1;break}
  case'gd':p.focus=-1;break;
  case'su':summon(idx,c.ty);break}}

function botThink(p,dt){
 const D=G.diff;p.bt-=dt;
 if(p.bt<=0){p.bt=[1.6,.9,.45][D]*(.7+Math.random()*.6);
  let best=null,bs=1e9;for(const q of G.P){if(!q.al||q===p)continue;const d=Math.hypot(q.x-p.x,q.z-p.z),s=d-(D>=1?(1-q.hp/q.mh)*12:0);if(d<[9,11,13][D]&&s<bs){bs=s;best=q}}
  p.tgt=best?best.i:-1;
  const af=TYL.filter(k=>p.gold>=BTYPES[k].cost+(D===0?30:0)&&p.sl+BTYPES[k].cap<=SLOTMAX);
  if(af.length&&(D>0||Math.random()<.6)){let pick;
   if(D===0)pick=af.filter(k=>k==='wolf'||k==='bear');
   else if(D===1)pick=af.length>1&&Math.random()<.6?af.slice(-2):af;
   else pick=[af[af.length-1]];
   if(pick.length)summon(p.i,pick[Math.floor(Math.random()*pick.length)])}
  if(best&&p.sl>0&&Math.random()<[.5,.8,1][D]&&Math.hypot(best.x-p.x,best.z-p.z)<34)p.focus=best.i;else if(!best||Math.random()<.2)p.focus=-1}
 const r=Math.hypot(p.x,p.z),zr=G.zr;let tx=p.dx,tz=p.dz;
 const t=G.E.get(p.tgt);
 if(r>zr-4){tx=p.x/r*(zr-9);tz=p.z/r*(zr-9)}
 else if(valid(t)){const dx=t.x-p.x,dz=t.z-p.z,d=Math.hypot(dx,dz)||1,want=D===2?9:8;
  if(D>=1&&p.hp<p.mh*.3&&d<16){tx=p.x-dx/d*10;tz=p.z-dz/d*10}
  else if(d>want+3){tx=p.x+dx/d*(d-want);tz=p.z+dz/d*(d-want)}
  else if(d<want-3){tx=p.x-dx/d*4;tz=p.z-dz/d*4}
  else if(D>=1){const s=(Math.floor(G.t/2.5+p.i)%2?1:-1);tx=p.x-dz/d*5*s;tz=p.z+dx/d*5*s}}
 else if(Math.hypot(p.dx-p.x,p.dz-p.z)<1){const a=Math.random()*6.28,rr=Math.random()*(zr-10);tx=Math.cos(a)*rr;tz=Math.sin(a)*rr}
 const rr=Math.hypot(tx,tz),mm=Math.max(4,zr-3);if(rr>mm){tx*=mm/rr;tz*=mm/rr}
 p.dx=tx;p.dz=tz}

function simStep(dt){
 const g=G;if(g.over)return;
 g.t+=dt;g.zr=g.t<75?ZR0:Math.max(3,ZR0-(g.t-75)*.07);
 if(!g.warned&&g.t>=75){g.warned=true;fx('storm',0,0,0,0)}
 for(const p of g.P){if(!p.al)continue;
  if(p.focus>=0&&!valid(g.E.get(p.focus)))p.focus=-1;
  if(p.b)botThink(p,dt);
  p.gold+=dt*(1.3+(p.b?[.3,.6,1][g.diff]:0));
  p.hp=Math.min(p.mh,p.hp+dt*.8);
  moveToward(p,p.dx,p.dz,p.sp*(p.b&&g.diff===2?1.08:1),dt);
  p.cd-=dt;
  let tg=g.E.get(p.focus);if(!(valid(tg)&&tg.o!==p.o&&(tg.x-p.x)**2+(tg.z-p.z)**2<15*15))tg=nearestEnemy(p.x,p.z,p.o,13);
  if(tg&&p.cd<=0){p.cd=.9;p.face=Math.atan2(tg.x-p.x,tg.z-p.z);proj(p.x,p.z,tg,p.o,p.dmg,p.o,22);fx('shoot',p.x,p.z,0,0)}
  const r=Math.hypot(p.x,p.z);if(r>g.zr){p.zt+=dt;if(p.zt>=.5){p.zt=0;hurt(p,(5+g.t/60)*.5,-1)}}
  if(r>ARENA){p.x*=ARENA/r;p.z*=ARENA/r}}
 for(const m of g.M){if(m.hp<=0)continue;const T=BTYPES[m.ty],ow=g.P[m.o];
  if(!ow.al){m.hp=0;continue}
  m.cd-=dt;m.rt-=dt;
  let tg=g.E.get(m.tg);
  const cmd=g.E.get(ow.focus);
  if(valid(cmd)&&cmd.o!==m.o)tg=cmd;
  else if(!valid(tg)||tg.o===m.o||m.rt<=0){m.rt=.35;tg=nearestEnemy(m.x,m.z,m.o,7)}
  m.tg=tg?(tg.h?tg.i:tg.id):-1;
  if(valid(tg)){const dx=tg.x-m.x,dz=tg.z-m.z,d=Math.hypot(dx,dz);
   if(d>T.rng*.9)moveToward(m,tg.x,tg.z,T.sp,dt);else{m.mv=0;m.face=Math.atan2(dx,dz)}
   if(d<=T.rng+.5&&m.cd<=0){m.cd=T.cd;if(T.rg){proj(m.x,m.z,tg,m.o,T.dmg,m.ty==='dragon'?0xff6a1a:0x7aff6a,16);fx('shoot',m.x,m.z,0,0)}else{hurt(tg,T.dmg,m.o)}}}
  else{const d=Math.hypot(ow.x-m.x,ow.z-m.z);if(d>4.5)moveToward(m,ow.x,ow.z,T.sp,dt);else m.mv=0}
  const r=Math.hypot(m.x,m.z);if(r>g.zr){m.zt+=dt;if(m.zt>=.5){m.zt=0;hurt(m,(8+g.t/40)*.5,-1)}}
  if(r>ARENA){m.x*=ARENA/r;m.z*=ARENA/r}}
 for(const j of g.J){const tg=g.E.get(j.tg);j.life-=dt;
  if(!valid(tg)){j.life=0;continue}
  const dx=tg.x-j.x,dz=tg.z-j.z,d=Math.hypot(dx,dz),s=j.sp*dt;
  if(d<=s+.7){hurt(tg,j.dmg,j.o);j.life=0}else{j.x+=dx/d*s;j.z+=dz/d*s}}
 g.J=g.J.filter(j=>j.life>0);
 if(g.M.some(m=>m.hp<=0)){for(const m of g.M)if(m.hp<=0){g.E.delete(m.id);const o=g.P[m.o];if(o)o.sl=Math.max(0,o.sl-BTYPES[m.ty].cap)}g.M=g.M.filter(m=>m.hp>0)}
 const all=g.P.filter(p=>p.al).concat(g.M);
 for(let a=0;a<all.length;a++){const A=all[a];for(let b=a+1;b<all.length;b++){const B=all[b];if(!!A.fly!==!!B.fly)continue;
   const dx=B.x-A.x,dz=B.z-A.z,d2=dx*dx+dz*dz,rr=1.3;if(d2<rr*rr&&d2>.0001){const d=Math.sqrt(d2),push=(rr-d)*.35;A.x-=dx/d*push;A.z-=dz/d*push;B.x+=dx/d*push;B.z+=dz/d*push}}}
}

function snapshot(){const g=G;
 return{tm:r2(g.t),zr:r2(g.zr),ov:g.over?1:0,al:g.alive,
  h:g.P.map(p=>[r2(p.x),r2(p.z),Math.ceil(p.hp),p.mh,p.al?1:0,p.lv,p.gold|0,p.kills,p.place,r2(p.face),p.focus,p.sl,p.mv]),
  m:g.M.map(m=>[m.id,m.o,TYL.indexOf(m.ty),r2(m.x),r2(m.z),Math.ceil(m.hp),m.mh,r2(m.face),m.mv]),
  j:g.J.map(j=>[r2(j.x),r2(j.z),j.c])}}

 addEventListener('resize',resize);resize();bindPointer()}
function resize(){if(!renderer)return;const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}

const stdMat=(c,e,ei)=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.85,emissive:e||0,emissiveIntensity:ei||0});
const dark=(c,f)=>new THREE.Color(c).multiplyScalar(f).getHex();
function nameSprite(txt,col){const c=document.createElement('canvas');c.width=256;c.height=56;const x=c.getContext('2d');x.font='bold 30px Trebuchet MS,Noto Sans Thai,sans-serif';x.textAlign='center';x.lineWidth=6;x.strokeStyle='#000c';x.strokeText(txt,128,38);x.fillStyle=col;x.fillText(txt,128,38);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(4.4,.96,1);return s}
const barBg=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.7,depthWrite:false});
function mkBar(w,col){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.PlaneGeometry(w+.1,.22),barBg));
 const fg=new THREE.Mesh(new THREE.PlaneGeometry(w,.14).translate(w/2,0,0),new THREE.MeshBasicMaterial({color:col,depthWrite:false}));fg.position.set(-w/2,0,.01);g.add(fg);g.userData.fg=fg;return g}
function ringMesh(r,col){const m=new THREE.Mesh(new THREE.RingGeometry(r*.85,r,24),new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:.85}));m.rotation.x=-Math.PI/2;m.position.y=.06;return m}

function makeHeroView(i,m){
 const pc=PCOL[i%16],robe=SKINS[m.sk||0].c,g=new THREE.Group(),body=new THREE.Group();g.add(body);
 const b=new THREE.Mesh(new THREE.ConeGeometry(.65,1.7,7),stdMat(robe));b.position.y=.85;b.castShadow=true;body.add(b);
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),stdMat(0xe3c3a0));hd.position.y=1.85;body.add(hd);
 const hat=new THREE.Mesh(new THREE.ConeGeometry(.42,.95,7),stdMat(dark(robe,.6)));hat.position.set(0,2.4,0);hat.rotation.z=.15;hat.castShadow=true;body.add(hat);
 const br=new THREE.Mesh(new THREE.CylinderGeometry(.56,.56,.06,10),stdMat(dark(robe,.5)));br.position.y=2.0;body.add(br);
 const st=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,2.3,5),stdMat(0x5a3a1a));st.position.set(.75,1.15,.1);body.add(st);
 const orb=new THREE.Mesh(new THREE.SphereGeometry(.17,8,6),new THREE.MeshBasicMaterial({color:pc}));orb.position.set(.75,2.35,.1);body.add(orb);
 g.add(ringMesh(1.15,pc));
 const bar=mkBar(2.2,i===ME?0x5be37d:0xff5a5a);bar.position.y=3.4;g.add(bar);
 const nm=nameSprite((i===ME?'★ ':'')+m.n,i===ME?'#ffe27a':'#ffffff');nm.position.y=3.95;g.add(nm);
 g.userData={body,bar,face:0,first:true};scene.add(g);heroViews[i]=g}
const BEAST={wolf:{c:0x6b7079,s:1,fly:0,bh:2.2,bw:1.3},bear:{c:0x6a4328,s:1.45,fly:0,bh:3.3,bw:1.8},drake:{c:0x2f8a74,s:1.1,fly:1,bh:4,bw:1.6},dragon:{c:0x8a1f22,s:2,fly:1,bh:5.6,bw:2.6}};
function mkBeast(ty,pc,own){
 const g=new THREE.Group(),body=new THREE.Group();g.add(body);
 const P=BEAST[TYL[ty]],eye=new THREE.MeshBasicMaterial({color:pc});
 if(!P.fly){
  const bd=new THREE.Mesh(new THREE.BoxGeometry(.75,.65,1.4),stdMat(P.c));bd.position.y=.8;bd.castShadow=true;body.add(bd);
  const hd=new THREE.Mesh(new THREE.BoxGeometry(.55,.5,.6),stdMat(P.c));hd.position.set(0,1.05,.95);body.add(hd);
  const sn=new THREE.Mesh(new THREE.BoxGeometry(.3,.25,.3),stdMat(dark(P.c,.7)));sn.position.set(0,.95,1.3);body.add(sn);
  for(const sx of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.06,5,4),eye);e.position.set(sx*.18,1.15,1.22);body.add(e);
   const ear=new THREE.Mesh(new THREE.ConeGeometry(.12,.3,4),stdMat(P.c));ear.position.set(sx*.2,1.42,.85);body.add(ear)}
  const tl=new THREE.Mesh(new THREE.ConeGeometry(.12,.8,4),stdMat(P.c));tl.rotation.x=-1.1;tl.position.set(0,.95,-.95);body.add(tl);
  for(const sx of[-1,1])for(const sz of[-1,1]){const l=new THREE.Mesh(new THREE.BoxGeometry(.2,.5,.2),stdMat(dark(P.c,.75)));l.position.set(sx*.28,.25,sz*.5);body.add(l)}
 }else{
  const bd=new THREE.Mesh(new THREE.SphereGeometry(.6,8,6).scale(1,.8,1.6),stdMat(P.c,ty===3?0x551100:0,.6));bd.castShadow=true;body.add(bd);
  const nk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.3,.9,6),stdMat(P.c));nk.position.set(0,.45,.95);nk.rotation.x=.8;body.add(nk);
  const hd=new THREE.Mesh(new THREE.BoxGeometry(.5,.4,.7),stdMat(P.c));hd.position.set(0,.85,1.35);body.add(hd);
  for(const sx of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.07,5,4),eye);e.position.set(sx*.2,.98,1.55);body.add(e);
   const hn=new THREE.Mesh(new THREE.ConeGeometry(.07,.45,4),stdMat(0xd8d0c0));hn.position.set(sx*.22,1.2,1.1);hn.rotation.x=-.5;body.add(hn)}
  const tl=new THREE.Mesh(new THREE.ConeGeometry(.28,1.8,5),stdMat(P.c));tl.rotation.x=-Math.PI/2;tl.position.set(0,-.1,-1.6);body.add(tl);
  const wm=new THREE.MeshStandardMaterial({color:dark(P.c,.55),side:THREE.DoubleSide,flatShading:true,emissive:ty===3?0x330800:0,emissiveIntensity:.5});
  const wgeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,.5),new THREE.Vector3(2.4,.2,-.9),new THREE.Vector3(0,0,-.7),new THREE.Vector3(2.4,.2,-.9),new THREE.Vector3(1.5,.1,.3),new THREE.Vector3(0,0,.5)]);wgeo.computeVertexNormals();
  g.userData.wings=[];
  for(const sx of[1,-1]){const pv=new THREE.Group();pv.position.set(sx*.4,.3,0);const w=new THREE.Mesh(wgeo,wm);w.scale.x=sx;pv.add(w);body.add(pv);g.userData.wings.push([pv,sx])}
  body.position.y=ty===3?1.7:1.9}
 g.scale.setScalar(P.s);
 g.add(ringMesh(.9,pc));
 const bar=mkBar(P.bw,own?0x5be37d:0xff5a5a);bar.scale.setScalar(1/P.s);bar.position.y=P.bh/P.s;g.add(bar);
 g.userData.body=body;g.userData.bar=bar;g.userData.fly=P.fly;g.userData.first=true;g.userData.bodyY=ty===3?1.7:1.9;
 return g}
function clearView(){if(!scene)return;heroViews.forEach(g=>g&&scene.remove(g));heroViews=[];minViews.forEach(g=>scene.remove(g));minViews.clear();projPool.forEach(m=>m.visible=false);partPool.forEach(m=>m.userData.life=0)}

function spawnParts(x,y,z,col,n,spd,up){let k=0;for(const m of partPool){if(m.userData.life>0)continue;m.userData.life=.5+Math.random()*.5;m.position.set(x,y,z);m.material.color.setHex(col);m.material.opacity=1;m.visible=true;
  const a=Math.random()*6.28,s=Math.random()*spd;m.userData.vx=Math.cos(a)*s;m.userData.vz=Math.sin(a)*s;m.userData.vy=Math.random()*spd*.8+(up||0);if(++k>=n)break}}
function addFeed(a,b){const f=$('#feed');const d=document.createElement('div');d.innerHTML=`<b style="color:${hx(a)}">${a>=0&&META[a]?esc(META[a].n):'☠'}</b> ⚔ <b style="color:${hx(b)}">${META[b]?esc(META[b].n):'?'}</b>`;f.appendChild(d);while(f.children.length>4)f.removeChild(f.firstChild);setTimeout(()=>d.remove(),6000)}
function procEvents(list){if(mode!=='game'&&mode!=='result')return;
 for(const e of list){const k=e[0],x=e[1],z=e[2];
  const me=V&&V.h[ME],near=me?Math.hypot(x-me[0],z-me[1])<30:true;
  if(k==='hit'){spawnParts(x,1.3,z,e[3]>=0?PCOL[e[3]%16]:0xaa44ff,3,4,1);if(near)Snd.play('hit')}
  else if(k==='die'){spawnParts(x,1,z,0xffffff,e[3]?24:10,7,3);if(near)Snd.play('die')}
  else if(k==='sum'){const o=e[4];spawnParts(x,.3,z,PCOL[o%16],14,5,5);if(near){Snd.play('sum');if(e[3]>=2)Snd.play('roar')}
   if(o===ME){matchStats.sum++;if(e[3]===3)matchStats.dragon++;if(e[3]===1)matchStats.bear++}}
  else if(k==='lvl'){spawnParts(x,2,z,0xffd23f,16,5,5);if(e[3]===ME){toast('⭐ '+t('lvlUp'),1200);Snd.play('lvl')}}
  else if(k==='kill'){addFeed(e[3],e[4])}
  else if(k==='shoot'){if(near)Snd.play('shoot')}
  else if(k==='storm'){toast('🌪️ '+t('stormWarn'),2600)}}}

function bindPointer(){
 const cv=$('#gl');let down=false;
 const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),v3=new THREE.Vector3(),v2=new THREE.Vector2();
 function ground(ev){v2.set(ev.clientX/innerWidth*2-1,-(ev.clientY/innerHeight)*2+1);raycaster.setFromCamera(v2,camera);return raycaster.ray.intersectPlane(plane,v3)?{x:v3.x,z:v3.z}:null}
 function pickEnemy(ev){if(!V)return null;let best=null,bd=46*46;const w=innerWidth,h=innerHeight,v=new THREE.Vector3();
  const test=(id,x,z,y)=>{v.set(x,y,z).project(camera);if(v.z>1)return;const sx=(v.x+1)/2*w,sy=(1-v.y)/2*h,d=(sx-ev.clientX)**2+(sy-ev.clientY)**2;if(d<bd){bd=d;best=id}};
  V.h.forEach((q,i)=>{if(i!==ME&&q[4])test(i,q[0],q[1],1.2)});
  for(const m of V.m)if(m[1]!==ME)test(m[0],m[3],m[4],m[2]>=2?2:1);
  return best}
 cv.addEventListener('pointerdown',ev=>{if(mode!=='game'||!V||!V.h[ME]||!V.h[ME][4])return;down=true;
  const en=pickEnemy(ev);if(en!=null){sendCmd({k:'fo',id:en});Snd.play('click');return}
  const g=ground(ev);if(g){sendCmd({k:'mv',x:g.x,z:g.z});moveMk.position.x=g.x;moveMk.position.z=g.z;moveMk.visible=true;mkT=.6}});
 cv.addEventListener('pointermove',ev=>{if(!down||mode!=='game')return;const g=ground(ev);if(g)sendCmd({k:'mv',x:g.x,z:g.z})});
 addEventListener('pointerup',()=>down=false);
 cv.addEventListener('wheel',ev=>{camZoom=clamp(camZoom+Math.sign(ev.deltaY)*.1,.55,1.7)},{passive:true});
 cv.addEventListener('contextmenu',e=>e.preventDefault())}

function specStep(d){if(!V)return;const n=V.h.length;for(let k=1;k<=n;k++){const j=(spec+d*k+n*4)%n;if(V.h[j][4]){spec=j;return}}}
function renderFrame(dt,time){
 if(!renderer||!V)return;
 const me=V.h[ME];
 if(Math.abs(zoneR-V.zr)>.15){zoneR=V.zr;zoneWall.scale.set(zoneR,1,zoneR);
  if(zoneRing){scene.remove(zoneRing);zoneRing.geometry.dispose();zoneRing.material.dispose()}
  zoneRing=new THREE.Mesh(new THREE.RingGeometry(zoneR,90,64),new THREE.MeshBasicMaterial({color:0x7a1030,transparent:true,opacity:.42,side:THREE.DoubleSide,depthWrite:false}));zoneRing.rotation.x=-Math.PI/2;zoneRing.position.y=.12;scene.add(zoneRing)}
 zoneWall.material.opacity=.22+Math.sin(time*2)*.06;
 const k=Math.min(1,dt*13);
 V.h.forEach((h,i)=>{const gv=heroViews[i];if(!gv)return;const u=gv.userData;
  gv.visible=!!h[4];if(!h[4])return;
  if(u.first){gv.position.set(h[0],0,h[1]);u.first=false}
  gv.position.x+=(h[0]-gv.position.x)*k;gv.position.z+=(h[1]-gv.position.z)*k;
  let da=h[9]-u.face;da=Math.atan2(Math.sin(da),Math.cos(da));u.face+=da*Math.min(1,dt*10);u.body.rotation.y=u.face;
  u.body.position.y=h[12]?Math.abs(Math.sin(time*11+i))*.18:Math.sin(time*2+i)*.05;
  u.bar.userData.fg.scale.x=Math.max(.001,h[2]/h[3]);u.bar.quaternion.copy(camera.quaternion)});
 const seen=new Set();
 for(const m of V.m){seen.add(m[0]);let gv=minViews.get(m[0]);
  if(!gv){gv=mkBeast(m[2],PCOL[m[1]%16],m[1]===ME);gv.position.set(m[3],0,m[4]);scene.add(gv);minViews.set(m[0],gv);gv.userData.f=m[7]}
  const u=gv.userData;gv.position.x+=(m[3]-gv.position.x)*k;gv.position.z+=(m[4]-gv.position.z)*k;
  let da=m[7]-u.f;da=Math.atan2(Math.sin(da),Math.cos(da));u.f+=da*Math.min(1,dt*9);u.body.rotation.y=u.f;
  if(u.fly){u.body.position.y=u.bodyY+Math.sin(time*3+m[0])*.2;for(const w of u.wings)w[0].rotation.z=w[1]*Math.sin(time*(m[8]?11:6)+m[0])*.55}
  else u.body.position.y=m[8]?Math.abs(Math.sin(time*13+m[0]))*.15:0;
  u.bar.userData.fg.scale.x=Math.max(.001,m[5]/m[6]);u.bar.quaternion.copy(camera.quaternion)}
 minViews.forEach((gv,id)=>{if(!seen.has(id)){scene.remove(gv);minViews.delete(id)}});
 projPool.forEach((p,i)=>{const j=V.j[i];if(j){p.visible=true;p.position.set(j[0],1.6,j[1]);p.material.color.setHex(j[2]<16?PCOL[j[2]]:j[2])}else p.visible=false});
 for(const p of partPool){const u=p.userData;if(u.life<=0){p.visible=false;continue}u.life-=dt;p.position.x+=u.vx*dt;p.position.z+=u.vz*dt;p.position.y+=u.vy*dt;u.vy-=9*dt;p.material.opacity=Math.max(0,u.life*2);p.rotation.x+=dt*5;if(p.position.y<0)p.position.y=0}
 const fo=me&&me[10]>=0?me[10]:-1;marker.visible=false;
 if(fo>=0){let tx=null;if(fo<16){const h=V.h[fo];if(h&&h[4])tx=[h[0],h[1],2.2]}else{const m=V.m.find(q=>q[0]===fo);if(m)tx=[m[3],m[4],m[2]===3?3:m[2]===1?1.9:1.4]}
  if(tx){marker.visible=true;marker.position.set(tx[0],.3,tx[1]);marker.scale.setScalar(tx[2]*(1+Math.sin(time*6)*.08));marker.rotation.z=time*2}}
 if(mkT>0){mkT-=dt;moveMk.scale.setScalar(1+(.6-mkT)*1.2);moveMk.material.opacity=Math.max(0,mkT*1.4);if(mkT<=0)moveMk.visible=false}
 flames.forEach(f=>{f.scale.y=.8+Math.sin(time*9+f.userData.fl)*.3});
 const ep=embers.geometry.attributes.position;for(let i=0;i<ep.count;i++){let y=ep.getY(i)+dt*(.6+(i%5)*.15);if(y>14)y=0;ep.setY(i,y);ep.setX(i,ep.getX(i)+Math.sin(time+i)*dt*.4)}ep.needsUpdate=true;
 let fx2=camX,fz2=camZ;
 if(me&&me[4]){fx2=me[0];fz2=me[1]}
 else if(V.h[spec]&&V.h[spec][4]){fx2=V.h[spec][0];fz2=V.h[spec][1]}
 else{let b=-1,bk=-1;V.h.forEach((h,i)=>{if(h[4]&&h[7]>bk){bk=h[7];b=i}});if(b>=0)spec=b}
 camX+=(fx2-camX)*Math.min(1,dt*5);camZ+=(fz2-camZ)*Math.min(1,dt*5);
 const ar=innerWidth/innerHeight,zz=camZoom*(ar<1?1.5:1);
 camera.position.set(camX,26*zz,camZ+19*zz);camera.lookAt(camX,0,camZ+1);
 renderer.render(scene,camera)}

/* ================= HUD ================= */
let hudT=0,miniCtx=null;
function updateHud(dt){hudT-=dt;if(hudT>0||!V)return;hudT=.15;
 const me=V.h[ME];if(!me)return;
 $('#hAlive').textContent='🧙 '+t('alive')+': '+V.al;
 $('#hStorm').textContent=V.tm<75?'🌪️ '+t('stormIn')+' '+Math.ceil(75-V.tm)+'s':'🌪️ '+t('storm')+' '+V.zr.toFixed(0);
 $('#hpb').style.width=Math.max(0,me[2]/me[3]*100)+'%';
 $('#hGold').textContent=Math.floor(me[6]);$('#hLv').textContent=me[5];$('#hSl').textContent='🐾 '+me[11]+'/'+SLOTMAX;
 $$('#sumbar [data-ty]').forEach(b=>{const T=BTYPES[b.dataset.ty];b.classList.toggle('no',me[6]<T.cost||me[11]+T.cap>SLOTMAX)});
 $('#sName').textContent=META[spec]?META[spec].n:'';
 const c=$('#mini');if(!miniCtx)miniCtx=c.getContext('2d');const x=miniCtx,S=c.width,sc=S/2/(ARENA+3);
 x.clearRect(0,0,S,S);x.fillStyle='#14182299';x.beginPath();x.arc(S/2,S/2,S/2-1,0,6.3);x.fill();
 x.strokeStyle='#b06aff';x.lineWidth=2;x.beginPath();x.arc(S/2,S/2,V.zr*sc,0,6.3);x.stroke();
 for(const m of V.m){x.fillStyle=hx(m[1]);x.fillRect(S/2+m[3]*sc-1,S/2+m[4]*sc-1,2,2)}
 V.h.forEach((h,i)=>{if(!h[4])return;x.fillStyle=hx(i);x.beginPath();x.arc(S/2+h[0]*sc,S/2+h[1]*sc,i===ME?4:3,0,6.3);x.fill();if(i===ME){x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke()}});
 if(!me[4]&&!diedShown&&mode==='game'&&!V.ov){diedShown=true;awardIfNeeded();Snd.play('lose');
  $('#dPlace').textContent=t('place')+' #'+(me[8]||'?');$('#dead').classList.add('on')}
 if(V.ov&&mode==='game')showResult()}

/* ================= main loop ================= */
let last=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.06,(ts-last)/1000||.016);last=ts;const time=ts/1000;
 if(mode==='game'){
  if(G&&(R.host||!R.online)){acc+=dt*speed;let n=0;while(acc>=SD&&n<14){simStep(SD);acc-=SD;n++}if(acc>SD*14)acc=0;
   V=snapshot();if(G.ev.length){procEvents(G.ev);G.ev=[]}}
  renderFrame(dt,time);updateHud(dt)}
 else if(mode==='result'&&renderer&&V){renderFrame(dt,time)}}
function init(){
 if(!SV.skins.includes(SV.skin))SV.skin=0;
 bindUI();applyLang();renderMenu();
 if(!window.THREE)toast('three.js: '+t('connErr'),4000);
 requestAnimationFrame(frame)}
init();
</script></body></html>
