<!DOCTYPE html>
<html lang="en" data-theme="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sea Strike</title>
<style>
:root{--bg:#06182c;--bg2:#0b2a4a;--panel:#0f3258;--ink:#e8f3ff;--muted:#8fb0d0;--water:#12507f;--line:#2a6a9f;--ship:#8da2b5;--hit:#ff5a36;--miss:#cfe9ff;--sunk:#7a1210;--accent:#ffcf3f;--good:#38d27a;--bad:#ff4d5e;--btn:#1b6fb5;--btnink:#fff}
[data-theme=neon]{--bg:#0a0414;--bg2:#14082a;--panel:#1c0d3a;--ink:#f3e9ff;--muted:#a58bd0;--water:#1a0f3d;--line:#6a2cff;--ship:#00e5ff;--hit:#ff2d95;--miss:#a38bff;--sunk:#7a0040;--accent:#f6ff3a;--btn:#7a2cff}
[data-theme=light]{--bg:#eaf3fb;--bg2:#ffffff;--panel:#ffffff;--ink:#10263d;--muted:#5b7894;--water:#a9d4f2;--line:#6fa8d1;--ship:#52657a;--miss:#ffffff;--hit:#e8431f;--sunk:#8c1d18;--accent:#d98c00;--btn:#1f7ac4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:linear-gradient(var(--bg),var(--bg2));color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Noto Sans JP","Noto Sans SC","Noto Sans KR",sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none}
.app{max-width:620px;margin:0 auto;padding:10px 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;padding:4px 0 8px}
.top h1{font-size:1.25rem;margin:0;flex:1;text-align:center}
.top a{color:var(--muted);text-decoration:none;font-size:.9rem;min-width:64px}
.tools{display:flex;gap:6px;align-items:center}
.tools button,.tools select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1rem;padding:0 8px}
.screen{display:none}.screen.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h2{margin:0 0 8px;font-size:1rem;color:var(--accent)}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--btn);color:var(--btnink);font-size:1.05rem;font-weight:700;padding:10px 14px;cursor:pointer;touch-action:manipulation;margin:8px 0}
.btn.alt{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.fire{background:var(--hit);font-size:1.25rem;letter-spacing:.06em}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.stats{display:flex;gap:8px}.stats div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.8rem;color:var(--muted)}
.stats b{display:block;font-size:1.4rem;color:var(--ink)}
.lbl{font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:.95rem;cursor:pointer;touch-action:manipulation}
.seg button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn);font-weight:700}
.desc{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.warn{color:var(--bad);font-size:.85rem;margin:6px 0 0}
.fleetrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.fleetrow .nm{flex:1}.fleetrow .len{color:var(--muted);font-size:.8rem}
.fleetrow button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:1.2rem;cursor:pointer}
.fleetrow .ct{width:22px;text-align:center;font-weight:700}
/* boards */
.board{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;background:var(--line);padding:2px;border-radius:10px;width:100%;max-width:560px;margin:0 auto}
.board.lab{grid-template-columns:16px repeat(var(--n),1fr);background:transparent;padding:0}
.board.lab .lab{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.board.lab .cell{border-radius:3px}
.cell{aspect-ratio:1;background:var(--water);position:relative;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:.8rem;font-weight:700;touch-action:manipulation}
.cell::before{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0}
.cell.miss::after{content:'';width:28%;height:28%;border-radius:50%;background:var(--miss)}
.cell.hit::after{content:'✕';color:var(--hit);font-size:1.15em;font-weight:900;text-shadow:0 0 6px var(--hit)}
.cell.hull{background:var(--ship)}
.cell.hull.hit{background:var(--ship)}.cell.hull.hit::after{color:#fff;text-shadow:0 0 4px #000}
.cell.hull.rev,.cell.sunkc{background:var(--sunk)}
.cell.sunkc::after,.cell.rev.hit::after{content:'✕';color:#fff;font-weight:900}
.cell.hh.a{border-radius:14px 3px 3px 14px}.cell.hh.z{border-radius:3px 14px 14px 3px}
.cell.hv.a{border-radius:14px 14px 3px 3px}.cell.hv.z{border-radius:3px 3px 14px 14px}
.cell.solo{border-radius:50%}
.cell.rad{color:var(--accent);background:color-mix(in srgb,var(--water) 70%,var(--accent))}
.cell.aoe{outline:2px dashed var(--accent);outline-offset:-2px}
.cell.sel{outline:3px solid var(--accent);outline-offset:-3px;animation:pulse .8s infinite alternate}
.cell.sel::after{content:'⌖';color:var(--accent);font-size:1.3em;width:auto;height:auto;background:none;border-radius:0}
.cell.pvok{outline:3px solid var(--good);outline-offset:-3px;background:color-mix(in srgb,var(--water) 60%,var(--good))}
.cell.pvbad{outline:3px solid var(--bad);outline-offset:-3px}
@keyframes pulse{to{filter:brightness(1.5)}}
.cell.splash::before{border:2px solid var(--miss);animation:ring .7s ease-out}
@keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.cell.boom{animation:boom .6s ease-out;z-index:2}
@keyframes boom{0%{filter:brightness(4)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.cell.boom2{z-index:3}
.cell.boom2::before{background:radial-gradient(circle,#fff,#ffb703 35%,#ff4d00 60%,transparent 72%);animation:blast .95s ease-out}
@keyframes blast{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.6);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.placing .cell.hull{touch-action:none;cursor:grab}
/* tray */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:44px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;touch-action:none;cursor:grab;font-size:.8rem}
.chip.sel{border-color:var(--accent)}.chip.done{opacity:.35}
.chip i{display:flex;gap:2px}.chip i b{width:14px;height:14px;background:var(--ship);border-radius:3px}
.ghost{position:fixed;z-index:50;pointer-events:none;display:flex;opacity:.75;transform:translate(-50%,-50%)}
.ghost b{display:block;background:var(--ship);border:1px solid #000;border-radius:4px}
/* battle */
.status{display:flex;align-items:center;gap:8px;font-weight:700;min-height:36px}
.status span{flex:1}
.tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 8px}.tbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .2s linear}
.weap{display:flex;gap:6px;margin:10px 0 4px}
.weap button{flex:1;position:relative;min-height:54px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:.78rem;cursor:pointer;touch-action:manipulation}
.weap button.on{border-color:var(--accent);background:color-mix(in srgb,var(--panel) 70%,var(--accent))}
.weap button:disabled{opacity:.35}
.weap em{position:absolute;top:2px;right:6px;font-style:normal;color:var(--accent);font-weight:700}
.tinfo{text-align:center;color:var(--muted);font-size:.85rem;min-height:20px}
.low{display:flex;gap:12px;margin-top:10px;align-items:flex-start}
.mini{width:42%;max-width:190px}.mini .board{max-width:none}
.side{flex:1;font-size:.8rem}
.fl{display:flex;align-items:center;gap:6px;margin:3px 0}.fl i{display:flex;gap:2px}.fl i b{width:9px;height:9px;background:var(--ship);border-radius:2px}
.fl.sunk{opacity:.4;text-decoration:line-through}.fl.sunk i b{background:var(--sunk)}
.log{margin-top:8px;color:var(--muted);min-height:2.6em}.log div:first-child{color:var(--ink)}
.coach{position:sticky;top:0;z-index:20;background:var(--accent);color:#1a1200;border-radius:12px;padding:10px;margin:6px 0;display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem}
.coach span{flex:1}.coach button{border:0;border-radius:8px;padding:8px 10px;font-weight:700;background:#1a1200;color:#fff;cursor:pointer}
.coach button.s{background:transparent;color:#1a1200;text-decoration:underline}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay[hidden],.coach[hidden],[hidden]{display:none!important}
.modal{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:20px;max-width:360px;width:100%;text-align:center}
.modal h2{font-size:2rem;margin:0}.modal p{color:var(--muted)}
.banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:1.7rem;font-weight:900;color:#fff;text-shadow:0 2px 12px #000,0 0 20px var(--hit);pointer-events:none;opacity:0;z-index:40;padding:0 20px}
.banner.show{animation:bn 1.8s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.05)}80%{opacity:1}100%{opacity:0}}
.code{font-size:2.4rem;letter-spacing:.3em;text-align:center;font-weight:900;color:var(--accent);margin:8px 0}
input[type=text]{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.1rem;padding:0 12px;user-select:text;-webkit-user-select:text}
#chatBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:1.4rem;z-index:30;display:none}
#chatBtn i{position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;font-size:.7rem;font-style:normal;border-radius:10px;padding:1px 6px}
#chatPanel{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:2px solid var(--accent);padding:10px 14px calc(10px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;display:none}
#chatLog{height:110px;overflow:auto;font-size:.85rem;margin-bottom:6px;user-select:text;-webkit-user-select:text}
.emos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.emos button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;padding:6px 10px;font-size:.8rem}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a id="home" href="../index.html" data-i="back"></a>
    <h1>🚢 Sea Strike</h1>
    <div class="tools"><button id="bSnd" title="Sound">🔊</button><button id="bTheme" title="Theme">🎨</button><select id="selLang" aria-label="Language"></select></div>
  </header>

  <div id="coach" class="coach" hidden><span id="coachTxt"></span><button id="coachNext"></button><button id="coachSkip" class="s"></button></div>

  <!-- MENU -->
  <section id="sMenu" class="screen on">
    <p style="text-align:center;color:var(--muted);margin:4px 0 10px" data-i="tag"></p>
    <div class="stats"><div><b id="stW">0</b><span data-i="wins"></span></div><div><b id="stL">0</b><span data-i="losses"></span></div><div><b id="stA">–</b><span data-i="acc"></span></div></div>
    <button class="btn" id="bAI" data-i="vsAI"></button>
    <button class="btn" id="bOnline" data-i="online"></button>
    <button class="btn alt" id="bTut" data-i="tutorial"></button>
    <div class="card">
      <h2 data-i="settings"></h2>
      <div class="lbl" data-i="size"></div><div class="seg" id="gSize"></div>
      <div class="lbl" data-i="rule"></div><div class="seg" id="gRule"></div><p class="desc" id="gRuleD"></p>
      <div class="lbl" data-i="diff"></div><div class="seg" id="gDiff"></div>
      <div class="lbl" data-i="timer"></div><div class="seg" id="gTimer"></div>
      <div class="lbl" data-i="power"></div><div class="seg" id="gPower"></div>
      <div class="lbl" data-i="fleet"></div><div class="seg" id="gPreset"></div>
      <div id="gFleet" style="margin-top:6px"></div>
      <p class="warn" id="gWarn"></p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="sLobby" class="screen">
    <div class="card" id="lobHome">
      <h2 data-i="online"></h2>
      <button class="btn" id="bCreate" data-i="createRoom"></button>
      <div class="lbl" data-i="joinRoom"></div>
      <div class="row"><input type="text" id="joinCode" maxlength="5" autocapitalize="characters" autocomplete="off" data-ph="enterCode"><button class="btn" id="bJoin" style="flex:0 0 110px;margin:0" data-i="join"></button></div>
    </div>
    <div class="card" id="lobWait" hidden>
      <h2 data-i="roomCode"></h2><div class="code" id="roomCode">-----</div>
      <button class="btn alt" id="bCopy" data-i="copyLink"></button>
    </div>
    <p id="lobMsg" style="text-align:center;color:var(--muted)"></p>
    <button class="btn alt" id="bLobBack" data-i="menu"></button>
  </section>

  <!-- PLACEMENT -->
  <section id="sPlace" class="screen">
    <h2 style="margin:6px 0" data-i="placeTitle"></h2>
    <p class="desc" data-i="placeHint"></p>
    <div id="pBoard" class="board lab placing"></div>
    <div class="tray" id="tray"></div>
    <div class="row"><button class="btn alt" id="bRot" data-i="rotate"></button><button class="btn alt" id="bRand" data-i="random"></button><button class="btn alt" id="bClr" data-i="clear"></button></div>
    <button class="btn" id="bReady" data-i="ready"></button>
    <p id="waitOpp" class="desc" style="text-align:center"></p>
    <button class="btn alt" id="bLeave1" data-i="leave"></button>
  </section>

  <!-- BATTLE -->
  <section id="sBattle" class="screen">
    <div class="status"><span id="turnTxt"></span><b id="tleft"></b></div>
    <div class="tbar" id="tbarW" hidden><i id="tbar"></i></div>
    <div id="eBoard" class="board lab"></div>
    <div class="weap" id="weap"></div>
    <div class="tinfo" id="tinfo"></div>
    <button class="btn fire" id="bFire" data-i="fire"></button>
    <div class="low">
      <div class="mini"><div id="mBoard" class="board"></div><div class="desc" style="text-align:center" data-i="yourFleet"></div></div>
      <div class="side"><b data-i="enemyFleet"></b><div id="eFleet"></div><div class="log" id="log"></div></div>
    </div>
    <button class="btn alt" id="bLeave2" data-i="leave"></button>
  </section>
</div>

<button id="chatBtn">💬<i id="chatBadge" hidden>0</i></button>
<div id="chatPanel"><div id="chatLog"></div><div class="emos" id="emos"></div>
  <div class="row"><input type="text" id="chatIn" maxlength="80" autocomplete="off" data-ph="typeMsg"><button class="btn" id="chatSend" style="flex:0 0 90px;margin:0" data-i="send"></button><button class="btn alt" id="chatClose" style="flex:0 0 54px;margin:0">✕</button></div></div>
<div class="overlay" id="overlay" hidden><div class="modal"><h2 id="ovTitle"></h2><p id="ovText"></p><p id="ovStats"></p>
  <button class="btn" id="ovAgain"></button><button class="btn alt" id="ovMenu" data-i="menu"></button></div></div>
<div class="banner" id="banner"></div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rand=n=>Math.floor(Math.random()*n);

/* ================= i18n  (order: en, th, zh, ja, es, ko) ================= */
const LANGS=['en','th','zh','ja','es','ko'],LNAME=['English','ไทย','中文','日本語','Español','한국어'];
const D={};const K=(k,...v)=>{D[k]=v};
K('back','← Home','← หน้าหลัก','← 首页','← ホーム','← Inicio','← 홈');
K('tag','Sink the enemy fleet before they sink yours!','จมกองเรือศัตรูก่อนที่พวกเขาจะจมกองเรือของคุณ!','在敌人击沉你之前，击沉敌方舰队！','敵の艦隊を先に沈めよう！','¡Hunde la flota enemiga antes de que hunda la tuya!','적 함대가 당신을 침몰시키기 전에 먼저 격침하세요!');
K('wins','Wins','ชนะ','胜','勝ち','Victorias','승');K('losses','Losses','แพ้','负','負け','Derrotas','패');K('acc','Accuracy','ความแม่นยำ','命中率','命中率','Precisión','명중률');
K('vsAI','Play vs Computer','เล่นกับคอมพิวเตอร์','对战电脑','コンピュータと対戦','Jugar vs ordenador','컴퓨터와 대결');
K('online','Play Online (2 phones)','เล่นออนไลน์ (2 เครื่อง)','在线对战（两台手机）','オンライン対戦（2台）','Jugar en línea (2 móviles)','온라인 대결 (폰 2대)');
K('tutorial','How to play (tutorial)','วิธีเล่น (สอนเล่น)','玩法教程','遊び方（チュートリアル）','Cómo jugar (tutorial)','게임 방법 (튜토리얼)');
K('settings','Game settings','ตั้งค่าเกม','游戏设置','ゲーム設定','Ajustes','게임 설정');
K('size','Board size','ขนาดกระดาน','棋盘大小','盤面サイズ','Tamaño del tablero','보드 크기');
K('fleet','Fleet','กองเรือ','舰队','艦隊','Flota','함대');
K('rule','Rule','กติกา','规则','ルール','Regla','규칙');
K('ruleClassic','Classic','คลาสสิก','经典','クラシック','Clásico','클래식');K('ruleAgain','Hit = again','โดน = ยิงอีก','命中再射','命中で連射','Acierto = otra vez','명중 = 한 번 더');K('ruleSalvo','Salvo','ระดมยิง','齐射','一斉射撃','Salvo','일제 사격');
K('ruleClassicD','Turns alternate, one shot each.','ผลัดกันยิงทีละนัด','轮流各射一发。','交互に1発ずつ撃ちます。','Turnos alternos, un disparo cada uno.','번갈아 한 발씩 쏩니다.');
K('ruleAgainD','A hit gives you another shot.','ยิงโดนได้ยิงต่ออีกนัด','命中后可再射一发。','命中するともう1発撃てます。','Un acierto te da otro disparo.','명중하면 한 번 더 쏩니다.');
K('ruleSalvoD','Shots per turn = ships you have left.','จำนวนนัดต่อตา = จำนวนเรือที่เหลือ','每回合射击数 = 剩余舰船数。','1ターンの弾数 = 残りの船の数。','Disparos por turno = barcos que te quedan.','턴당 발수 = 남은 배의 수.');
K('diff','Computer level','ระดับคอมพิวเตอร์','电脑难度','コンピュータの強さ','Nivel del ordenador','컴퓨터 난이도');
K('easy','Easy','ง่าย','简单','かんたん','Fácil','쉬움');K('medium','Medium','กลาง','中等','ふつう','Medio','보통');K('hard','Hard','ยาก','困难','むずかしい','Difícil','어려움');
K('timer','Turn timer','จับเวลาต่อตา','回合计时','ターンタイマー','Temporizador','턴 타이머');K('off','Off','ปิด','关','オフ','No','끔');K('on','On','เปิด','开','オン','Sí','켬');

  const w=$('#weap');w.innerHTML='';w.hidden=!G.cfg.power;
  [['shot','🎯','wShot'],['radar','📡','wRadar'],['bomb','💣','wBomb'],['air','✈️','wAir']].forEach(([k,ic,nm])=>{const b=document.createElement('button');b.type='button';
    const cnt=k==='shot'?null:(G.powers[k]||0);b.innerHTML=ic+'<br>'+t(nm)+(cnt!==null?'<em>'+cnt+'</em>':'');
    b.disabled=!mine||(cnt!==null&&cnt<=0);if(G.weapon===k)b.className='on';
    b.onclick=()=>{Snd.play('click');G.weapon=k;G.sel=G.sel.slice(0,1);renderBattle()};w.appendChild(b)});
  const sa=shotsAllowed();let info=t('pickTarget');if(G.weapon==='shot'&&sa>1)info=t('salvoInfo',{n:sa})+' ('+G.sel.length+'/'+sa+')';
  if(G.sel.length&&!(G.weapon==='shot'&&sa>1))info=t('target')+': '+coord(G.sel[0],n);
  $('#tinfo').textContent=mine?info:'';
  const bf=$('#bFire');bf.disabled=!mine||!G.sel.length;bf.textContent=t('fire')+(G.sel.length>1?' ('+G.sel.length+')':'')}
$('#bFire').onclick=()=>myFire();
function myFire(){if(!G||G.turn!=='me'||G.busy||!G.sel.length)return;const kind=G.weapon,n=G.cfg.size;let cells;
  if(kind==='shot')cells=G.sel.slice();else if(kind==='radar')cells=[G.sel[0]];else cells=area(kind,G.sel[0],n).filter(i=>!G.known[i]);
  if(!cells.length)return;if(kind!=='shot')G.powers[kind]--;G.busy=true;G.sel=[];G.deadline=0;$('#tbarW').hidden=true;renderBattle();tutEvent('fired');
  const msg={t:'shot',kind,cells};
  if(G.mode==='online')Net.send(msg);else{const g=G;setTimeout(()=>{if(G===g)handleMyResult(resolve(G.ai.board,msg,G.cfg.rule))},450)}}
function handleMyResult(res){if(!G||G.over)return;const n=G.cfg.size;
  if(res.kind==='radar'){G.busy=false;G.radar[res.i]=res.n;Snd.play('radar');say(t('radarRes',{c:coord(res.i,n),n:res.n}));tutEvent('radar');
    if(G.cfg.timer){G.deadline=Date.now()+G.cfg.timer*1000;$('#tbarW').hidden=false}renderBattle();return}
  let h=0,m=0,sunkName=null;
  res.results.forEach((r,idx)=>{G.shots++;const el=G.cells[r.i];
    if(r.res==='miss'){m++;G.known[r.i]=1;fx(el,'splash',800,idx*90)}
    else{h++;G.hits++;G.known[r.i]=2;fx(el,'boom',700,idx*90);
      if(r.res==='sunk'){sunkName=t('ship_'+r.k);const sl=G.enemyLeft.find(s=>s.k===r.k&&!s.sunk);if(sl)sl.sunk=true;
        r.cells.forEach(c=>G.known[c]=3);hullParts(r.cells).forEach(([c,p])=>G.rev[c]=['hull','rev',...p]);r.cells.forEach((c,j)=>fx(G.cells[c],'boom2',1000,j*120))}}});
  Snd.play(sunkName?'sink':h?'hit':'miss');
  if(sunkName){banner(t('youSank',{s:sunkName}));say(t('youSank',{s:sunkName}))}
  else if(res.results.length===1)say(t(h?'youHit':'youMiss',{c:coord(res.results[0].i,n)}));else say(t('youVolley',{h,m}));
  renderBattle();
  if(res.over){if(res.fleet)res.fleet.forEach(f=>f.cells&&hullParts(f.cells).forEach(([c,p])=>{if(!G.rev[c])G.rev[c]=['hull',...p]}));renderBattle();finish(true);return}
  {const g=G;setTimeout(()=>{if(G===g&&!G.over)setTurn(res.keep?'me':'opp')},sunkName?1100:600)}}
function handleOppShot(res){if(!G||G.over)return;const n=G.cfg.size;
  if(res.kind==='radar'){Snd.play('radar');say(t('oppRadar'));renderBattle();return}
  let h=0,m=0,sunkName=null;
  res.results.forEach((r,idx)=>{const el=G.mcells[r.i];if(r.res==='miss'){m++;fx(el,'splash',800,idx*90)}else{h++;fx(el,'boom',700,idx*90);if(r.res==='sunk'){sunkName=t('ship_'+r.k);r.cells.forEach((c,j)=>fx(G.mcells[c],'boom2',1000,j*120))}}});
  Snd.play(sunkName?'sink':h?'hit':'miss');renderBattle();
  if(sunkName){banner(t('oppSank',{s:sunkName}));say(t('oppSank',{s:sunkName}))}
  else if(res.results.length===1)say(t(h?'oppHit':'oppMiss',{c:coord(res.results[0].i,n)}));else say(t('oppVolley',{h,m}));
  if(res.over){finish(false);return}
  {const g=G;setTimeout(()=>{if(G===g&&!G.over)setTurn(res.keep?'opp':'me')},sunkName?1100:600)}}

/* ================= AI ================= */
function aiBlocked(ai,n){const bl=new Array(n*n).fill(false);ai.known.forEach((v,i)=>{if(v!==3)return;const r=Math.floor(i/n),c=i%n;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<n&&cc<n&&!ai.known[rr*n+cc])bl[rr*n+cc]=true}});return bl}
function probMap(ai,n,bl,taken){const sc=new Array(n*n).fill(0),hits=[];ai.known.forEach((v,i)=>{if(v===2)hits.push(i)});
  const run=onlyHit=>{for(const L of ai.left)for(const h of(L===1?[true]:[true,false]))for(let r=0;r<n;r++)for(let c=0;c<n;c++){const cells=[];let ok=true,hc=0;
    for(let j=0;j<L;j++){const rr=h?r:r+j,cc=h?c+j:c;if(rr>=n||cc>=n){ok=false;break}const i=rr*n+cc,k=ai.known[i];if(k===1||k===3||bl[i]||taken.has(i)){ok=false;break}if(k===2)hc++;cells.push(i)}
    if(!ok||(onlyHit&&!hc))continue;const w=hc?30*hc*hc:1;cells.forEach(i=>{if(!ai.known[i])sc[i]+=w})}};
  run(hits.length>0);if(hits.length&&!sc.some(x=>x>0))run(false);return sc}
function aiPickOne(ai,n,taken){const diff=G.cfg.diff,unk=[];ai.known.forEach((v,i)=>{if(!v&&!taken.has(i))unk.push(i)});if(!unk.length)return -1;
  if(diff==='easy')return unk[rand(unk.length)];
  const bl=aiBlocked(ai,n),free=unk.filter(i=>!bl[i]),pool=free.length?free:unk;
  if(diff==='hard'){const sc=probMap(ai,n,bl,taken);let best=-1,cand=[];pool.forEach(i=>{if(sc[i]>best){best=sc[i];cand=[i]}else if(sc[i]===best)cand.push(i)});return cand[rand(cand.length)]}
  const hits=[];ai.known.forEach((v,i)=>{if(v===2)hits.push(i)});
  if(hits.length){const nb=new Set(),line=[];const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
    hits.forEach(i=>{const r=Math.floor(i/n),c=i%n;dirs.forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=n||cc>=n)return;const j=rr*n+cc;if(!pool.includes(j))return;nb.add(j);
      const pr=r-dr,pc=c-dc;if(pr>=0&&pc>=0&&pr<n&&pc<n&&ai.known[pr*n+pc]===2)line.push(j)})});
    if(line.length)return line[rand(line.length)];if(nb.size){const a=[...nb];return a[rand(a.length)]}}
  const par=pool.filter(i=>(Math.floor(i/n)+i%n)%2===0);const p=par.length?par:pool;return p[rand(p.length)]}
function aiTurn(){if(!G||G.over||G.turn!=='opp'||G.mode==='online')return;const ai=G.ai,n=G.cfg.size;ai.turns++;let msg;
  if(G.cfg.power&&G.cfg.diff!=='easy'){const hard=G.cfg.diff==='hard';
    if(!ai.used.bomb&&ai.turns>=(hard?4:7)){const c=aiPickOne(ai,n,new Set());if(c>=0){ai.used.bomb=1;msg={kind:'bomb',cells:area('bomb',c,n).filter(i=>!ai.known[i])}}}
    else if(!ai.used.air&&ai.turns>=(hard?8:12)){let best=-1,row=0;for(let r=0;r<n;r++){let u=0;for(let c=0;c<n;c++)if(!ai.known[r*n+c])u++;if(u>best){best=u;row=r}}ai.used.air=1;msg={kind:'air',cells:area('air',row*n,n).filter(i=>!ai.known[i])}}}
  if(!msg||!msg.cells.length){const cnt=Math.min(G.cfg.rule==='salvo'?ai.board.alive():1,ai.known.filter(v=>!v).length),taken=new Set();for(let q=0;q<cnt;q++){const c=aiPickOne(ai,n,taken);if(c>=0)taken.add(c)}msg={kind:'shot',cells:[...taken]}}
  const res=resolve(G.my,msg,G.cfg.rule);
  res.results.forEach(r=>{ai.known[r.i]=r.res==='miss'?1:2;if(r.res==='sunk'){r.cells.forEach(c=>ai.known[c]=3);const x=ai.left.indexOf(LEN[r.k]);if(x>=0)ai.left.splice(x,1)}});
  handleOppShot(res)}

/* ================= end of game ================= */
function finish(win,leftMsg){if(!G||G.over)return;G.over=true;G.deadline=0;stopTimers();renderBattle();
  if(!G.counted&&!tut){G.counted=true;if(win)stats.w++;else stats.l++;stats.s+=G.shots;stats.h+=G.hits;LS.set('ss_stats',JSON.stringify(stats))}
  Snd.play(win?'win':'lose');
  const g0=G;setTimeout(()=>{if(G!==g0)return;$('#ovTitle').textContent=t(win?'win':'lose');$('#ovText').textContent=leftMsg?t('winLeft'):t(win?'winD':'loseD');
    $('#ovStats').textContent=t('shotsStat',{s:G.shots,h:G.hits,a:G.shots?Math.round(G.hits/G.shots*100):0});
    $('#ovAgain').textContent=t(G.mode==='online'?'rematch':'again');$('#ovAgain').disabled=!!leftMsg&&G.mode==='online';$('#overlay').hidden=false;showStats()},1400)}
$('#ovAgain').onclick=()=>{Snd.play('click');if(G.mode==='online'){G.myRematch=true;$('#ovAgain').disabled=true;$('#ovAgain').textContent=t('rematchWait');Net.send({t:'rematch'});maybeRematch()}
  else{const c=G.cfg;$('#overlay').hidden=true;startPlacement(c,'ai')}};
$('#ovMenu').onclick=()=>toMenu();
function maybeRematch(){if(G&&G.myRematch&&G.oppRematch&&Net.role==='host'){Net.send({t:'cfg',cfg:G.cfg});startPlacement(G.cfg,'online');startWatch()}}
function toMenu(){stopTimers();Net.close();G=null;tut=null;$('#overlay').hidden=true;$('#chatPanel').style.display='none';show('sMenu');renderMenu()}
function leave(){if(!confirm(t('askLeave')))return;toMenu()}
$('#bLeave1').onclick=$('#bLeave2').onclick=leave;

/* ================= tutorial ================= */
const TUT_AT={placed:1,rotated:2,battle:3,aimed:4,fired:5,radar:7};
function tutEvent(ev){if(!tut)return;const s=TUT_AT[ev];if(s!==undefined&&s>tut.step){tut.step=s;renderCoach()}}
function renderCoach(){const c=$('#coach');const on=!!tut&&(screen==='sPlace'||screen==='sBattle');c.hidden=!on;if(!on)return;
  $('#coachTxt').textContent=t('tut'+(tut.step+1));$('#coachNext').textContent=t(tut.step>=7?'ready':'next');$('#coachSkip').textContent=t('skip')}
$('#coachNext').onclick=()=>{if(tut.step>=7)tut=null;else tut.step++;renderCoach()};
$('#coachSkip').onclick=()=>{tut=null;renderCoach()};
$('#bTut').onclick=()=>{Snd.play('click');tut={step:0};startPlacement({size:8,fleet:{cruiser:1,destroyer:1},rule:'classic',diff:'easy',timer:0,power:true},'ai')};
$('#bAI').onclick=()=>{Snd.play('click');tut=null;startPlacement({...cfg,fleet:{...cfg.fleet}},'ai')};

/* ================= online ================= */
const Net={peer:null,conn:null,role:null,last:0,hb:null,wd:null,cd:null,
  send(o){try{if(this.conn&&this.conn.open)this.conn.send(o)}catch(e){}},
  close(){try{if(this.conn&&this.conn.open)this.conn.send({t:'bye'})}catch(e){}try{this.conn&&this.conn.close()}catch(e){}try{this.peer&&this.peer.destroy()}catch(e){}this.conn=this.peer=this.role=null;clearInterval(this.hb);clearInterval(this.wd);clearInterval(this.cd);this.cd=null}};
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function openPeer(id){return new Promise((res,rej)=>{const p=id?new Peer(id):new Peer();p.on('open',()=>res(p));p.on('error',rej);setTimeout(()=>rej({type:'timeout'}),12000)})}
const lobMsg=k=>$('#lobMsg').textContent=k?t(k):'';
function openLobby(){Net.close();$('#lobHome').hidden=false;$('#lobWait').hidden=true;lobMsg();show('sLobby')}
$('#bOnline').onclick=()=>{Snd.play('click');openLobby()};
$('#bLobBack').onclick=()=>{Net.close();show('sMenu')};
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[rand(a.length)];return s};
async function hostRoom(){lobMsg('connecting');try{await loadPeer()}catch(e){lobMsg('loadErr');return}
  let code,peer;for(let q=0;q<5;q++){code=genCode();try{peer=await openPeer('seastrike-'+code);break}catch(e){if(!(e&&e.type==='unavailable-id')){lobMsg('connErr');return}}}
  if(!peer){lobMsg('connErr');return}
  Net.peer=peer;Net.role='host';$('#roomCode').textContent=code;$('#lobHome').hidden=true;$('#lobWait').hidden=false;lobMsg('waitGuest');
  const c0={...cfg,fleet:{...cfg.fleet}};
  peer.on('connection',c=>{if(Net.conn){c.close();return}Net.conn=c;const go=()=>{wire(c);Net.send({t:'cfg',cfg:c0});startPlacement(c0,'online');startWatch()};if(c.open)go();else c.on('open',go)});
  peer.on('error',()=>{if(!Net.conn)lobMsg('connErr')})}
async function joinRoom(code){code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){lobMsg('notFound');return}lobMsg('connecting');
  try{await loadPeer()}catch(e){lobMsg('loadErr');return}
  let peer;try{peer=await openPeer()}catch(e){lobMsg('connErr');return}
  Net.peer=peer;Net.role='guest';let opened=false;
  peer.on('error',e=>{if(!opened)lobMsg(e&&e.type==='peer-unavailable'?'notFound':'connErr')});
  const c=peer.connect('seastrike-'+code,{reliable:true});Net.conn=c;
  c.on('open',()=>{opened=true;wire(c);startWatch();lobMsg('waitOpp')});
  setTimeout(()=>{if(!opened&&Net.peer===peer){lobMsg('notFound');Net.close()}},12000)}
$('#bCreate').onclick=()=>{Snd.play('click');if(!fleetFits(cfg.size,cfg.fleet)){lobMsg('tooBig');return}hostRoom()};
$('#bJoin').onclick=()=>{Snd.play('click');joinRoom($('#joinCode').value)};
$('#bCopy').onclick=async()=>{const url=location.origin+location.pathname+'?room='+$('#roomCode').textContent;try{await navigator.clipboard.writeText(url);lobMsg('copied')}catch(e){$('#lobMsg').textContent=url}};
function wire(c){c.on('data',onData);c.on('close',()=>{if(Net.conn===c)oppGone(true)});c.on('error',()=>{})}
function startWatch(){Net.last=Date.now();clearInterval(Net.hb);clearInterval(Net.wd);
  Net.hb=setInterval(()=>Net.send({t:'ping'}),4000);Net.wd=setInterval(()=>{if(G&&G.mode==='online'&&!G.over&&Date.now()-Net.last>14000)oppGone(false)},2000)}
function ensureGrids(){if(!G.cells){G.cells=makeGrid($('#eBoard'),G.cfg.size,true);G.mcells=makeGrid($('#mBoard'),G.cfg.size,false)}}
function oppGone(hard){if(!G||G.mode!=='online'||G.over||Net.cd)return;let n=30;
  const upd=()=>{const s=t('oppGone',{n});$('#turnTxt').textContent=s;if(screen==='sPlace')$('#waitOpp').textContent=s};upd();
  Net.cd=setInterval(()=>{if(!hard&&Date.now()-Net.last<8000){clearInterval(Net.cd);Net.cd=null;if(G&&G.cells)renderBattle();return}n--;upd();
    if(n<=0){clearInterval(Net.cd);Net.cd=null;if(G&&!G.over){ensureGrids();if(screen!=='sBattle')show('sBattle');finish(true,true)}}},1000)}
const okIdx=(v,n)=>Number.isInteger(v)&&v>=0&&v<n*n;
function onData(m){if(!m||typeof m!=='object')return;Net.last=Date.now();
  switch(m.t){
    case'cfg':{if(Net.role!=='guest'||!m.cfg)break;const c=m.cfg,f={};let tot=0;
      SHIPS.forEach(([k])=>{const v=Number(c.fleet&&c.fleet[k])||0;f[k]=Math.max(0,Math.min(3,Math.floor(v)));tot+=f[k]});
      const size=[8,10,12].includes(c.size)?c.size:10;if(!tot||tot>10)break;
      startPlacement({size,fleet:f,rule:['classic','again','salvo'].includes(c.rule)?c.rule:'classic',diff:'medium',timer:[0,15,30,60].includes(c.timer)?c.timer:0,power:!!c.power},'online');startWatch();break}
    case'ready':if(G&&G.mode==='online'){G.oppReady=true;maybeStartOnline()}break;
    case'start':if(G&&G.mode==='online'&&Net.role==='guest'&&!G.turn)startBattle(m.first==='guest');break;
    case'shot':{if(!G||G.mode!=='online'||G.over||G.turn!=='opp'||!G.cells)break;const n=G.cfg.size;
      if(!Array.isArray(m.cells)||!m.cells.length||m.cells.length>14||!m.cells.every(i=>okIdx(i,n))||!['shot','radar','bomb','air'].includes(m.kind))break;
      const res=resolve(G.my,{kind:m.kind,cells:[...new Set(m.cells)]},G.cfg.rule);Net.send({t:'res',res});handleOppShot(res);break}
    case'res':{if(!G||G.mode!=='online'||!G.busy||!m.res)break;const r=m.res,n=G.cfg.size;
      if(r.kind==='radar'){if(!okIdx(r.i,n)||!Number.isInteger(r.n))break;handleMyResult({kind:'radar',i:r.i,n:Math.max(0,Math.min(9,r.n))});break}
      if(!Array.isArray(r.results))break;const results=[];
      for(const x of r.results){if(!x||!okIdx(x.i,n)||!['miss','hit','sunk'].includes(x.res))continue;
        if(x.res==='sunk'){if(!Array.isArray(x.cells)||!x.cells.every(i=>okIdx(i,n))||!LEN[x.k])continue;results.push({i:x.i,res:'sunk',k:x.k,cells:x.cells})}else results.push({i:x.i,res:x.res})}
      let fleet;if(r.over&&Array.isArray(r.fleet))fleet=r.fleet.filter(f=>f&&Array.isArray(f.cells)&&f.cells.every(i=>okIdx(i,n)));
      handleMyResult({kind:r.kind,results,over:!!r.over,keep:!!r.keep,fleet});break}
    case'chat':{let txt='';if(typeof m.e==='string'&&D['e_'+m.e])txt=t('e_'+m.e);else if(typeof m.text==='string')txt=m.text.slice(0,80);if(txt)addChat('opp',txt);break}
    case'rematch':if(G){G.oppRematch=true;maybeRematch()}break;
    case'bye':if(G&&G.mode==='online'&&!G.over){ensureGrids();show('sBattle');finish(true,true)}break}}
/* chat */
let unread=0;
['gg','nice','oops','luck'].forEach(e=>{const b=document.createElement('button');b.type='button';b.dataset.e=e;b.onclick=()=>{Net.send({t:'chat',e});addChat('me',t('e_'+e))};$('#emos').appendChild(b)});
function refreshEmos(){$$('#emos button').forEach(b=>b.textContent=t('e_'+b.dataset.e))}
function addChat(who,txt){const d=document.createElement('div');d.textContent=t(who==='me'?'you':'opp')+': '+txt;$('#chatLog').appendChild(d);$('#chatLog').scrollTop=1e5;
  if(who==='opp'&&$('#chatPanel').style.display!=='block'){unread++;$('#chatBadge').textContent=unread;$('#chatBadge').hidden=false;Snd.play('click')}}
$('#chatBtn').onclick=()=>{$('#chatPanel').style.display='block';unread=0;$('#chatBadge').hidden=true};
$('#chatClose').onclick=()=>$('#chatPanel').style.display='none';
const sendChat=()=>{const v=$('#chatIn').value.trim().slice(0,80);if(!v)return;Net.send({t:'chat',text:v});addChat('me',v);$('#chatIn').value=''};
$('#chatSend').onclick=sendChat;$('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
window.addEventListener('pagehide',()=>Net.close());

/* ================= toolbar / init ================= */
function applyLang(){document.documentElement.lang=LANGS[LI];$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  refreshEmos();renderMenu();renderCoach();if(G&&G.cells&&screen==='sBattle')renderBattle();if(G&&screen==='sPlace')renderPlace()}
$('#selLang').innerHTML=LNAME.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');$('#selLang').value=LI;
$('#selLang').onchange=e=>{LI=+e.target.value;LS.set('ss_lang',LANGS[LI]);applyLang()};
const THEMES=['navy','neon','light'];
function setTheme(n){document.documentElement.dataset.theme=n;LS.set('ss_theme',n);$('#bTheme').title=t('th_'+n)}
$('#bTheme').onclick=()=>{const cur=document.documentElement.dataset.theme,nx=THEMES[(THEMES.indexOf(cur)+1)%3];setTheme(nx);Snd.play('click');banner(t('th_'+nx))};
setTheme(THEMES.includes(LS.get('ss_theme','navy'))?LS.get('ss_theme','navy'):'navy');
const syncSnd=()=>$('#bSnd').textContent=Snd.mute?'🔇':'🔊';
$('#bSnd').onclick=()=>{Snd.mute=!Snd.mute;LS.set('ss_mute',Snd.mute?'1':'0');syncSnd();Snd.play('click')};
syncSnd();applyLang();
(function(){const q=new URLSearchParams(location.search).get('room');if(q){openLobby();$('#joinCode').value=q.toUpperCase().slice(0,5);joinRoom(q)}})();
