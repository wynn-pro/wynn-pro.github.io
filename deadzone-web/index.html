<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dead Zone Defence</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0d0b;color:#e6ece0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Noto Sans SC","Noto Sans JP","Noto Sans KR",sans-serif}
#cv{position:fixed;display:none;touch-action:none;background:#000}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;overflow:auto;background:radial-gradient(ellipse at 50% 20%,#2c3a26 0%,#141b13 60%,#0a0d0b 100%)}
.scr.on{display:flex}
h1{margin:0;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(42px,11vw,82px);letter-spacing:5px;color:#d9e6c4;text-shadow:0 3px 0 #4a1a14,0 0 26px rgba(190,60,40,.45);text-align:center}
h1 b{color:#e5483a}
h2{margin:0;font-size:24px;letter-spacing:2px;text-transform:uppercase;text-align:center}
.sub{color:#a9bba0;font-size:15px;text-align:center;max-width:480px}
.btn{background:linear-gradient(#a8352a,#6e1d17);border:2px solid #e57a6c;color:#fff;font-weight:800;padding:12px 24px;border-radius:10px;font-size:17px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;min-width:200px;font-family:inherit}
.btn.sec{background:linear-gradient(#41505b,#27313a);border-color:#7b8d9a}
.btn.sm{min-width:0;padding:8px 14px;font-size:14px}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
input[type=text],select{background:#192218;border:2px solid #53684b;color:#fff;border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit;text-align:center;user-select:text;-webkit-user-select:text}
#joinCode{text-transform:uppercase;width:120px;letter-spacing:4px;font-weight:800}
.msg{min-height:20px;color:#ffb74d;font-weight:700;text-align:center}
.seg{display:flex;gap:4px}.seg button{background:#202c1f;color:#cdd;border:2px solid #53684b;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer;font-family:inherit}
.seg button.on{background:#a8352a;border-color:#f09a8d;color:#fff}.seg button[disabled]{opacity:.5}
.list{display:flex;flex-direction:column;gap:5px;min-width:260px;max-width:340px;width:100%}
.li{display:flex;align-items:center;gap:8px;background:rgba(20,28,20,.85);border:1px solid #44583d;border-radius:8px;padding:6px 10px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.codeBox{background:#10170f;border:2px dashed #e5483a;border-radius:10px;padding:6px 14px;text-align:center}
.codeBox b{font-size:30px;letter-spacing:6px;color:#ffb300}
.how{white-space:pre-line;max-width:520px;background:rgba(10,14,10,.7);border:1px solid #44583d;border-radius:10px;padding:14px;line-height:1.5;font-size:15px}
#mapGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;width:min(640px,96vw);max-height:56vh;overflow:auto;padding:4px}
.mp{background:#1d2a1c;border:2px solid #53684b;border-radius:8px;padding:6px 2px;text-align:center;font-weight:800;cursor:pointer;color:#fff;font-family:inherit;font-size:15px;line-height:1.2}
.mp small{display:block;font-size:11px;color:#ffc94a;letter-spacing:1px;min-height:13px}
.mp.lock{opacity:.35;pointer-events:none}.mp.on{border-color:#ffb300;background:#3a3a1a}
#techGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:min(660px,96vw);max-height:60vh;overflow:auto;padding:4px}
.tn{background:#1d2a1c;border:2px solid #53684b;border-radius:10px;padding:8px;font-weight:700;font-size:13px;text-align:center}
.tn b{display:block;font-size:14px;margin-bottom:4px}.tn .lv{color:#ffc94a;margin-bottom:6px;min-height:16px}
.tn.un{border-color:#e5483a}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}#hud.on{display:block}
#top{position:absolute;left:0;right:0;top:0;height:44px;display:flex;gap:8px;align-items:center;padding:0 8px;background:rgba(14,20,13,.94);border-bottom:1px solid #3a4b34;pointer-events:auto;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden}
#top .sp{flex:1}
.tb{background:#2b3a28;border:1px solid #6b8460;color:#fff;border-radius:7px;padding:5px 9px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.tb[disabled]{opacity:.45}
#bot{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;gap:5px;align-items:center;padding:5px 6px;background:rgba(14,20,13,.95);border-top:1px solid #3a4b34;pointer-events:auto;overflow-x:auto;overflow-y:hidden}
.tw{position:relative;flex:0 0 66px;height:66px;background:#1d2a1c;border:2px solid #53684b;border-radius:9px;color:#fff;font-family:inherit;font-weight:700;font-size:10px;padding:2px 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tw canvas{width:36px;height:36px}.tw span{white-space:pre;text-align:center}
.tw em{position:absolute;left:3px;top:1px;font-style:normal;font-size:9px;color:#9fb;opacity:.8}
.tw.on{border-color:#ffb300;background:#3a3a1a}.tw.poor{opacity:.55}.tw.lock{opacity:.3}
#plist{position:absolute;left:6px;top:50px;display:flex;flex-direction:column;gap:3px;pointer-events:auto;font-size:12px;font-weight:800}
.pl{display:flex;align-items:center;gap:5px;background:rgba(10,14,10,.72);border-radius:7px;padding:3px 7px}
.pl button{background:#2b3a28;border:1px solid #6b8460;color:#ffd54a;border-radius:5px;font-size:11px;font-weight:800;cursor:pointer;padding:1px 5px;font-family:inherit}
#pw{position:absolute;right:6px;top:50px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.pw{position:relative;width:54px;height:54px;border-radius:10px;border:2px solid #6b8460;background:#22301f;color:#fff;font-size:22px;cursor:pointer;overflow:hidden;font-family:inherit}
.pw small{position:absolute;left:3px;bottom:1px;font-size:9px;font-weight:800;color:#bda}
.pw i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);height:0}
.pw.arm{border-color:#ffb300;background:#4a3a14}
#sel{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;background:rgba(14,20,13,.95);border:2px solid #ffb300;border-radius:10px;padding:8px 12px;display:none;pointer-events:auto;text-align:center;font-weight:800;font-size:13px;gap:6px;flex-direction:column;align-items:center}
#sel.on{display:flex}
#hint{position:absolute;left:50%;top:50px;transform:translateX(-50%);background:rgba(10,14,10,.78);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;color:#cfe;max-width:60vw;text-align:center;pointer-events:none;display:none}
#joy{position:absolute;left:14px;bottom:92px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none;display:none}
#joy i{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.35)}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 16px;border-radius:10px;font-weight:700;z-index:20;display:none;pointer-events:none}
</style>
</head>

<canvas id="cv"></canvas>

  <button class="btn sec" id="bHow" data-i="how"></button>

<div id="sMaps" class="scr">

  <div class="seg dseg"></div>
  <div id="mapGrid"></div>
  <button class="btn sec" id="bMapsBack" data-i="back"></button>
</div>

<div id="sTech" class="scr">
  <h2><span data-i="tech"></span></h2>
  <div style="font-weight:800;color:#ffc94a"><span data-i="rp"></span>: <span id="rpTech"></span></div>
  <div id="techGrid"></div>
  <button class="btn sec" data-back="sMenu" data-i="back"></button>
</div>

<div id="sLobby" class="scr">
  <h2 data-i="online"></h2>
  <button class="btn" id="bCreate" data-i="create"></button>
  <div class="row"><input type="text" id="joinCode" maxlength="5" placeholder="CODE"><button class="btn sm" id="bJoin" data-i="join"></button></div>
  <div class="msg" id="lobMsg"></div>
  <button class="btn sec" id="bLobBack" data-i="back"></button>
</div>

<div id="sRoom" class="scr">
  <h2 data-i="online"></h2>
  <div class="codeBox" id="codeBox"><span data-i="code"></span><br><b id="roomCode"></b><br><button class="btn sec sm" id="bCopy" data-i="copy"></button></div>
  <div class="list" id="roomList"></div>
  <div class="row"><span style="font-weight:800"><span data-i="map"></span> <b id="roomMap">1</b></span><button class="btn sec sm" id="bRoomMap" data-i="pickMap"></button></div>
  <div class="seg dseg"></div>
  <div class="msg" id="roomMsg"></div>
  <div class="row"><button class="btn" id="bStart" data-i="start"></button><button class="btn sec" id="bRoomBack" data-i="back"></button></div>
</div>

<div id="sEnd" class="scr">
  <h1 id="endT" style="font-size:clamp(36px,9vw,64px)"></h1>
  <div id="endStars" style="font-size:44px;letter-spacing:6px"></div>
  <div id="endInfo" style="font-weight:800;color:#ffc94a;text-align:center"></div>
  <div class="row"><button class="btn" id="bEndNext"></button><button class="btn sec" id="bEndMenu" data-i="menu"></button></div>
</div>

<div id="hud">
  <div id="top">
    <span id="hLives"></span><span id="hWave"></span><span id="hMap"></span>
    <button class="tb" id="hNext"></button><button class="tb" id="hSpd">x1</button>
    <span class="sp"></span><span id="hCash" style="color:#ffd54a"></span>
    <button class="tb" id="hMute">🔊</button><button class="tb" id="hQuit">✕</button>
  </div>
  <div id="plist"></div>
  <div id="pw"></div>
  <div id="hint"></div>
  <div id="sel"></div>
  <div id="joy"><i></i></div>
  <div id="bot"></div>
</div>
<div id="toast"></div>

 init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},

/* ================= map ================= */
function genMap(n){
 const rng=mulberry(n*7919+13),bi=Math.floor((n-1)/10)%10,B=BIOMES[bi];
 let x=0,y=2+Math.floor(rng()*(GH-4));const cells=[[0,y]],smin=n<20?3:2;
 while(x<GW-1){
  const nx=Math.min(GW-1,x+smin+Math.floor(rng()*3));cells.push([nx,y]);x=nx;
  if(x<GW-1){let ny,tr=0;do{ny=1+Math.floor(rng()*(GH-2));tr++}while(Math.abs(ny-y)<3&&tr<30);if(Math.abs(ny-y)<3)ny=y<GH/2?y+3:y-3;cells.push([x,ny]);y=ny}}
 const grid=new Uint8Array(GW*GH);
 for(let i=1;i<cells.length;i++){const a=cells[i-1],b=cells[i],dx=Math.sign(b[0]-a[0]),dy=Math.sign(b[1]-a[1]);let cx=a[0],cy=a[1];grid[cy*GW+cx]=1;while(cx!==b[0]||cy!==b[1]){cx+=dx;cy+=dy;grid[cy*GW+cx]=1}}
 grid[cells[0][1]*GW]=1;
 const pts=[[-TS*.5,(cells[0][1]+.5)*TS]];
 cells.forEach(c=>pts.push([(c[0]+.5)*TS,(c[1]+.5)*TS]));
 const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
 const deco=[];
 for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++)if(!grid[gy*GW+gx]&&rng()<.12){grid[gy*GW+gx]=2;deco.push({x:(gx+.5)*TS+(rng()-.5)*8,y:(gy+.5)*TS+(rng()-.5)*8,s:.8+rng()*.5,c:rng()<.5?0:1})}
 const M={n,bi,B,cells:grid,pts,cum,len:cum[cum.length-1],deco,bx:pts[pts.length-1][0],by:pts[pts.length-1][1]};
 M.terrain=renderTerrain(M,mulberry(n*31+5));return M}
function pathAt(M,d){const c=M.cum,p=M.pts;let i=1;while(i<c.length-1&&c[i]<d)i++;const d0=c[i-1],seg=c[i]-d0||1,f=clamp((d-d0)/seg,0,1),a=p[i-1],b=p[i];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,Math.atan2(b[1]-a[1],b[0]-a[0])]}
function renderTerrain(M,rng){
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d'),B=M.B;
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){g.fillStyle=B.g[(x+y)&1];g.fillRect(x*TS,y*TS,TS,TS)}
 for(let i=0;i<7000;i++){g.fillStyle=rng()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.07)';g.fillRect(rng()*W,rng()*H,1+rng()*3,1+rng()*3)}
 const poly=()=>{g.beginPath();M.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]))};
 g.lineCap='round';g.lineJoin='round';
 poly();g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=TS+8;g.stroke();
 poly();g.strokeStyle=B.edge;g.lineWidth=TS+2;g.stroke();
 poly();g.strokeStyle=B.road;g.lineWidth=TS-6;g.stroke();
 for(let i=0;i<4500;i++){const gx=rng()*GW|0,gy=rng()*GH|0;if(M.cells[gy*GW+gx]!==1)continue;g.fillStyle=rng()<.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.12)';g.fillRect(gx*TS+rng()*TS,gy*TS+rng()*TS,1+rng()*2,1+rng()*2)}
 if(B.line){poly();g.strokeStyle=B.line;g.globalAlpha=.7;g.lineWidth=2;g.setLineDash([10,12]);g.stroke();g.setLineDash([]);g.globalAlpha=1}
 for(const d of M.deco){const s=d.s,col=B.dc[d.c];g.save();g.translate(d.x,d.y);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(4,6,14*s,10*s,0,0,TAU);g.fill();
  switch(B.deco){
   case'tree':case'ptree':{const gr=g.createRadialGradient(-4,-4,2,0,0,16*s);gr.addColorStop(0,B.deco==='ptree'?'#ffffff':col);gr.addColorStop(1,B.deco==='ptree'?col:'#10240f');g.fillStyle=gr;g.beginPath();g.arc(0,0,15*s,0,TAU);g.fill();g.fillStyle='rgba(0,0,0,.15)';for(let i=0;i<5;i++){g.beginPath();g.arc((rng()-.5)*16*s,(rng()-.5)*16*s,3*s,0,TAU);g.fill()}break}
   case'cactus':g.fillStyle=col;rrect(g,-4*s,-12*s,8*s,24*s,4);g.fill();rrect(g,-12*s,-4*s,8*s,5*s,2);g.fill();rrect(g,4*s,-8*s,8*s,5*s,2);g.fill();break;
   case'crate':g.fillStyle=col;g.fillRect(-11*s,-11*s,22*s,22*s);g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=2;g.strokeRect(-11*s,-11*s,22*s,22*s);g.beginPath();g.moveTo(-11*s,-11*s);g.lineTo(11*s,11*s);g.moveTo(11*s,-11*s);g.lineTo(-11*s,11*s);g.stroke();break;
   case'tomb':g.fillStyle=col;rrect(g,-8*s,-12*s,16*s,24*s,6);g.fill();g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-1.5,-8*s,3,12*s);g.fillRect(-5*s,-4*s,10*s,3);break;
   default:g.fillStyle=col;g.beginPath();for(let i=0;i<7;i++){const a=i/7*TAU,r=(10+rng()*6)*s;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.arc(-3,-3,5*s,0,TAU);g.fill()}
  g.restore()}
 const sy=M.pts[0][1];g.fillStyle='rgba(120,0,0,.3)';g.fillRect(0,sy-TS/2,TS,TS);g.fillStyle='rgba(255,60,40,.5)';for(let i=0;i<4;i++){g.beginPath();g.moveTo(6,sy-14+i*7);g.lineTo(16,sy-10+i*7);g.lineTo(6,sy-6+i*7);g.fill()}
 const vg=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=vg;g.fillRect(0,0,W,H);
 return cv}

function mkPlayer(name,tech,conn,i,M){const te=cleanTech(tech),hm=Math.round(150*(1+.1*te.hero));return{name,tech:te,conn:conn||null,cash:0,hx:M.bx-45-i*10,hy:M.by+(i-1.5)*12,hhp:hm,hmax:hm,hdmg:14*(1+.1*te.hero),dead:0,cd:[0,0,0],kills:0,mvx:0,mvy:0,ang:0,hc:0,left:0}}
function newGame(map,diff,pls){
 const M=genMap(map),D_=DIFF[diff];
 const G={map,M,diff,Z:[],T:[],P:[],sh:[],st:[],base:0,baseMax:0,wave:0,phase:0,timer:20,queue:[],qt:0,zid:1,tid:1,ev:[],evOut:[],t:0,od:0,speed:1,over:false,win:false,stars:0,hpMul:1,sent:false};
 G.P=pls.map((p,i)=>{const o=mkPlayer(p.name,p.tech,p.conn,i,M);o.cash=D_.cash;return o});
 const bt=Math.max(...G.P.map(p=>p.tech.base));G.baseMax=G.base=Math.round(D_.lives*(1+.1*bt));
 return G}
function newView(map,names,you){const M=genMap(map);return{map,M,Z:[],T:[],P:names.map(n=>({name:n,cash:0,hx:M.bx-45,hy:M.by,tx:M.bx-45,ty:M.by,hhp:100,hmax:100,dead:0,cd:[0,0,0],kills:0,ang:0,left:0,tech:null})),base:0,baseMax:1,wave:0,phase:0,timer:0,speed:1,od:0,over:false,zm:new Map(),ev:[],isView:true,you}}

function canBuild(S,gx,gy,i){if(gx<0||gy<0||gx>=GW||gy>=GH)return false;const c=S.M.cells[gy*GW+gx];if(TW[i].k==='mine'?c!==1:c!==0)return false;return!S.T.some(t=>t.gx===gx&&t.gy===gy)}
const upCost=t=>Math.ceil(TW[t.i].c*.6*t.lvl);
function tStat(G,t){const T=TW[t.i],p=G.P[t.o],te=p&&p.tech?p.tech:null,L=t.lvl-1;return{dmg:T.dmg*(1+.55*L)*(1+.06*(te?te.dmg:0))*t.bd,rate:T.rate*(1+.12*L)*(1+.05*(te?te.rate:0))*t.br*(G.od>0?1.4:1),range:T.r*(1+.07*L)*(1+.04*(te?te.range:0))}}

function doCmd(G,pi,m){
 const p=G.P[pi];if(!p||G.over||p.left)return;
 switch(m.k){
  case'b':{const i=m.i|0,gx=m.gx|0,gy=m.gy|0;if(!(i>=0&&i<TW.length)||!hasT(p.tech,i)||!canBuild(G,gx,gy,i)||p.cash<TW[i].c)return;p.cash-=TW[i].c;
   const x=(gx+.5)*TS,y=(gy+.5)*TS;G.T.push({id:G.tid++,i,lvl:1,gx,gy,x,y,o:pi,ang:-Math.PI/2,cd:.4,jam:0,inv:TW[i].c,bd:1,br:1,rg:TW[i].r});G.ev.push(['b',x,y]);break}
  case'u':{const tw=G.T.find(x=>x.id===(m.id|0));if(!tw||tw.lvl>=4)return;const c=upCost(tw);if(p.cash<c)return;p.cash-=c;tw.lvl++;tw.inv+=c;G.ev.push(['b',tw.x,tw.y]);break}
  case's':{const k=G.T.findIndex(x=>x.id===(m.id|0));if(k<0)return;const tw=G.T[k];if(tw.o!==pi)return;p.cash+=Math.floor(tw.inv*(.6+.05*p.tech.ref));G.T.splice(k,1);G.ev.push(['b',tw.x,tw.y]);break}
  case'p':{const i=m.i|0;if(!(i>=0&&i<3)||p.cd[i]>0)return;p.cd[i]=PWCD[i]*(1-.06*p.tech.cd);const x=clamp(+m.x||0,0,W),y=clamp(+m.y||0,0,H);
   if(i===0)G.st.push({x,y,n:7,t:0,o:pi,dmg:160*(1+.06*p.tech.dmg)});else if(i===1){for(const z of G.Z)z.frz=Math.max(z.frz,4)}else{G.od=8;G.base=Math.min(G.baseMax,G.base+4)}
   G.ev.push(['pw',i,x,y]);break}
  case'g':{const to=m.to|0,a=clamp(m.a|0,0,1000),q=G.P[to];if(!q||to===pi||q.left||a<=0||p.cash<a)return;p.cash-=a;q.cash+=a;G.ev.push(['gf',to,a]);break}
  case'n':if(pi===0&&G.phase===0)G.timer=Math.min(G.timer,.01);break;
  case'v':if(pi===0)G.speed=m.v===2?2:1;break}}

function genWave(map,w){
 const L=(map-1)*10+w,out=[];let tm=0,B=5+w*2.6+map*.8,cnt=0;
 const pool=[['walk',1,0],['run',1.3,3],['spit',2,8],['brute',6,10],['expl',2.5,14],['arm',4,18],['heal',3,22]].filter(p=>L>=p[2]);
 while(B>0&&cnt<140){const P2=Math.random()<.35?pool[0]:pool[rand(pool.length)];const n=Math.max(1,Math.min(Math.floor(B/P2[1]),3+rand(7)));const gap=P2[0]==='run'?.45:P2[0]==='brute'?1.6:.75;
  for(let i=0;i<n;i++){out.push({ty:P2[0],at:tm});tm+=gap}B-=n*P2[1];cnt+=n;tm+=1.2}
 if(w===WAVES){if(map%10===0){const bt=['b1','b2','b3'][(map/10-1)%3],bn=1+Math.floor((map-1)/40);for(let i=0;i<bn;i++){out.push({ty:bt,at:tm});tm+=4}}else{const n=2+Math.floor(map/12);for(let i=0;i<n;i++){out.push({ty:L>=18?'arm':'brute',at:tm});tm+=2}}}
 return out}
function startWave(G){G.wave++;G.phase=1;G.hpMul=DIFF[G.diff].hp*(1+.06*(G.map-1))*(1+.1*(G.wave-1));G.queue=genWave(G.map,G.wave);G.qt=0;G.ev.push(['h'])}
function endWave(G){
 for(const p of G.P){p.cash+=Math.round((35+G.wave*6+G.map*.5)*(1+.08*p.tech.econ))}G.ev.push(['c']);
 if(G.wave>=WAVES){const r=G.base/G.baseMax;G.over=true;G.win=true;G.phase=2;G.stars=r>.85?3:r>.5?2:1;G.ev.push(['w',1])}
 else{G.phase=0;G.timer=14}}
function spawnZ(G,ty,d0){const T=ZT[ty],m=G.hpMul,[x,y,a]=pathAt(G.M,d0);G.Z.push({id:G.zid++,ty,r:T.r,d:d0,x,y,ang:a,hp:T.hp*m,mhp:T.hp*m,sp:T.sp*DIFF[G.diff].sp*(1+.003*(G.map-1)),arm:(T.arm||0)*(1+.03*G.map),slowT:0,slowF:1,frz:0,burn:0,burnT:0,pois:0,poisT:0,bo:-1,po:-1,last:-1,ht:.5,st:3+Math.random()*2,dead:false})}
function dmgZ(G,z,d,o,dot){if(z.dead)return;if(!dot&&z.arm)d=Math.max(d*.25,d-z.arm);z.hp-=d;if(o>=0)z.last=o;if(z.hp<=0)killZ(G,z)}
function killZ(G,z){z.dead=true;const T=ZT[z.ty],p=G.P[z.last];if(p){p.cash+=Math.round(T.b*(1+.08*p.tech.econ)*DIFF[G.diff].b);p.kills++}
 G.ev.push(['k',z.x,z.y,z.r]);
 if(z.ty==='expl'){for(const t of G.T)if(Math.hypot(t.x-z.x,t.y-z.y)<60)t.jam=Math.max(t.jam,4);G.ev.push(['x',z.x,z.y,60,0])}}
function splash(G,x,y,r,dmg,o){for(const z of G.Z){if(z.dead)continue;const d=Math.hypot(z.x-x,z.y-y);if(d<=r+z.r*.5)dmgZ(G,z,dmg*(1-.5*d/(r+z.r)),o)}}
function fire(G,t,st,tg){
 const T=TW[t.i],o=t.o,a=t.ang,ca=Math.cos(a),sa=Math.sin(a),mx=t.x+ca*14,my=t.y+sa*14;
 switch(T.k){
  case'gun':dmgZ(G,tg,st.dmg,o);G.ev.push(['s',mx,my,tg.x,tg.y,t.i]);break;
  case'shot':{const cone=G.Z.filter(z=>!z.dead&&dist(z,t)<=st.range&&Math.abs(angd(Math.atan2(z.y-t.y,z.x-t.x),a))<.5),pel=T.pel+t.lvl-1;for(let k=0;k<pel;k++){const z=cone[rand(cone.length)]||tg;dmgZ(G,z,st.dmg,o);if(k<3)G.ev.push(['s',mx,my,z.x,z.y,t.i])}break}
  case'cryo':{for(const z of G.Z)if(!z.dead&&dist(z,t)<=st.range){dmgZ(G,z,st.dmg,o);z.slowT=Math.max(z.slowT,1.6);z.slowF=Math.min(z.slowF,.55-.05*(t.lvl-1))}G.ev.push(['n',t.x,t.y,st.range]);break}
  case'mort':{const tt=dist(tg,t)/260+.35,[px,py]=pathAt(G.M,Math.min(G.M.len,tg.d+(tg.frz>0?0:tg.sp)*tt));G.sh.push({x:px,y:py,t:tt,dmg:st.dmg,rad:T.rad*(1+.08*(t.lvl-1)),o});G.ev.push(['m',t.x,t.y,px,py,tt]);break}
  case'flame':{for(const z of G.Z)if(!z.dead&&dist(z,t)<=st.range&&Math.abs(angd(Math.atan2(z.y-t.y,z.x-t.x),a))<.42){dmgZ(G,z,st.dmg,o);z.burn=Math.max(z.burn,st.dmg*.8);z.burnT=2;z.bo=o}G.ev.push(['f',t.x,t.y,a,st.range]);break}
  case'toxic':{for(const z of G.Z)if(!z.dead&&dist(z,tg)<=T.rad){dmgZ(G,z,st.dmg,o);z.pois=Math.max(z.pois,st.dmg*1.8);z.poisT=4;z.po=o}G.ev.push(['s',mx,my,tg.x,tg.y,t.i]);G.ev.push(['x',tg.x,tg.y,T.rad,1]);break}
  case'tesla':{let cur=tg,d=st.dmg,px=mx,py=my;const seen=new Set([tg]);for(let j=0;j<3+t.lvl&&cur;j++){dmgZ(G,cur,d,o);G.ev.push(['z',px,py,cur.x,cur.y]);px=cur.x;py=cur.y;d*=.85;let nx=null,nd=80;for(const z of G.Z)if(!z.dead&&!seen.has(z)){const dd=dist(z,cur);if(dd<nd){nd=dd;nx=z}}if(nx)seen.add(nx);cur=nx}break}
  case'laser':case'rail':{const wid=T.k==='rail'?12:9,len=st.range+40;for(const z of G.Z){if(z.dead)continue;const rx=z.x-t.x,ry=z.y-t.y,pr=rx*ca+ry*sa;if(pr<0||pr>len)continue;if(Math.abs(-rx*sa+ry*ca)<wid+z.r*.5)dmgZ(G,z,st.dmg,o)}G.ev.push(['l',mx,my,t.x+ca*len,t.y+sa*len,t.i]);break}}}

function step(G,dt){
 G.t+=dt;const M=G.M;if(G.od>0)G.od-=dt;
 if(G.phase===0){G.timer-=dt;if(G.timer<=0)startWave(G)}
 else if(G.phase===1){G.qt+=dt;while(G.queue.length&&G.queue[0].at<=G.qt)spawnZ(G,G.queue.shift().ty,0);if(!G.queue.length&&!G.Z.some(z=>!z.dead))endWave(G)}
 for(const x of G.T){x.bd=1;x.br=1}
 for(const r of G.T)if(TW[r.i].k==='radar'){const rg=tStat(G,r).range;r.rg=rg;for(const x of G.T)if(x!==r&&dist(x,r)<=rg){x.bd=Math.max(x.bd,1.12+.05*(r.lvl-1));x.br=Math.max(x.br,1.1+.04*(r.lvl-1))}}
 // zombies
 for(const z of G.Z){if(z.dead)continue;const T=ZT[z.ty];
  if(z.burnT>0){z.burnT-=dt;dmgZ(G,z,z.burn*dt,z.bo,true)}
  if(z.dead)continue;
  if(z.poisT>0){z.poisT-=dt;dmgZ(G,z,z.pois*dt,z.po,true)}
  if(z.dead)continue;
  if(z.ty==='heal'||z.ty==='b3'){z.ht-=dt;if(z.ht<=0){z.ht=.5;const rg=z.ty==='b3'?90:70,pc=z.ty==='b3'?.03:.02;for(const o of G.Z)if(!o.dead&&o!==z&&dist(o,z)<rg)o.hp=Math.min(o.mhp,o.hp+o.mhp*pc)}}
  if(z.ty==='b1')z.hp=Math.min(z.mhp,z.hp+z.mhp*.008*dt);
  if(z.ty==='b2'){z.st-=dt;if(z.st<=0){z.st=5;if(G.Z.length<160)spawnZ(G,'walk',Math.max(0,z.d-14))}}
  if(z.ty==='spit'){z.st-=dt;if(z.st<=0){z.st=3.5;let bt=null,bd=120;for(const x of G.T)if(x.jam<=0){const d=dist(x,z);if(d<bd){bd=d;bt=x}}if(bt){bt.jam=3;G.ev.push(['sp',z.x,z.y,bt.x,bt.y])}}}
  let v=z.sp;if(z.frz>0){z.frz-=dt;v=0}else if(z.slowT>0){z.slowT-=dt;v*=z.slowF}if(z.slowT<=0)z.slowF=1;
  z.d+=v*dt;
  if(z.d>=M.len){z.dead=true;G.base-=T.leak;G.ev.push(['lk',z.ty,T.leak]);if(G.base<=0&&!G.over){G.base=0;G.over=true;G.win=false;G.phase=2;G.ev.push(['w',0])}continue}
  const q=pathAt(M,z.d);z.x=q[0];z.y=q[1];z.ang=q[2]}
 // towers
 for(const t of G.T){const T=TW[t.i];if(t.jam>0)t.jam-=dt;const st=tStat(G,t);t.rg=st.range;if(T.k==='radar')continue;t.cd-=dt;
  if(T.k==='mine'){if(t.cd<=0&&t.jam<=0){const z=G.Z.find(z=>!z.dead&&dist(z,t)<T.r+z.r*.4);if(z){t.cd=1/st.rate;const r=T.rad*(1+.08*(t.lvl-1));splash(G,t.x,t.y,r,st.dmg,t.o);G.ev.push(['x',t.x,t.y,r,0])}}continue}
  if(t.jam>0)continue;
  let tg=null,bd=-1;for(const z of G.Z){if(z.dead||z.d<=bd)continue;if(dist(z,t)<=st.range){bd=z.d;tg=z}}
  if(tg){t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);if(t.cd<=0){t.cd=1/st.rate;fire(G,t,st,tg)}}}
 for(let i=G.sh.length-1;i>=0;i--){const s=G.sh[i];s.t-=dt;if(s.t<=0){splash(G,s.x,s.y,s.rad,s.dmg,s.o);G.ev.push(['x',s.x,s.y,s.rad,0]);G.sh.splice(i,1)}}
 for(let i=G.st.length-1;i>=0;i--){const s=G.st[i];s.t-=dt;if(s.t<=0){s.t=.28;s.n--;const a=Math.random()*TAU,r=Math.random()*70,x=s.x+Math.cos(a)*r,y=s.y+Math.sin(a)*r;splash(G,x,y,50,s.dmg,s.o);G.ev.push(['x',x,y,50,0]);if(s.n<=0)G.st.splice(i,1)}}
 // heroes
 G.P.forEach((p,pi)=>{for(let k=0;k<3;k++)p.cd[k]=Math.max(0,p.cd[k]-dt);if(p.left)return;
  if(p.dead>0){p.dead-=dt;if(p.dead<=0){p.hhp=p.hmax;p.hx=M.bx-45;p.hy=M.by}return}
  const m=Math.hypot(p.mvx,p.mvy);if(m>.05){const k=115/Math.max(1,m);p.hx=clamp(p.hx+p.mvx*k*dt,8,W-8);p.hy=clamp(p.hy+p.mvy*k*dt,8,H-8)}
  p.hc-=dt;let tg=null,bd=135;for(const z of G.Z)if(!z.dead){const d=Math.hypot(z.x-p.hx,z.y-p.hy);if(d<bd){bd=d;tg=z}}
  if(tg){p.ang=Math.atan2(tg.y-p.hy,tg.x-p.hx);if(p.hc<=0){p.hc=1/3.5;dmgZ(G,tg,p.hdmg,pi);G.ev.push(['s',p.hx+Math.cos(p.ang)*10,p.hy+Math.sin(p.ang)*10,tg.x,tg.y,-1])}}
  let cnt=0;for(const z of G.Z)if(!z.dead&&Math.hypot(z.x-p.hx,z.y-p.hy)<z.r+8)cnt++;
  if(cnt){p.hhp-=Math.min(cnt,4)*9*dt;if(p.hhp<=0){p.dead=12;G.ev.push(['x',p.hx,p.hy,30,0])}}});
 G.Z=G.Z.filter(z=>!z.dead)}

let PT=[],decal=document.createElement('canvas'),dctx=decal.getContext('2d');decal.width=W;decal.height=H;
function spark(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rr(20,sp||90);PT.push({k:'d',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rr(.15,.4),m:.4,c,s:rr(1,2.4)})}}
function blood(x,y,r){dctx.fillStyle='rgba(110,12,12,.35)';for(let i=0;i<3;i++){dctx.beginPath();dctx.ellipse(x+rr(-r,r),y+rr(-r,r),rr(2,r*.8),rr(2,r*.8),Math.random()*3,0,TAU);dctx.fill()}}
function fx(e){
 switch(e[0]){
  case's':{const i=e[5];PT.push({k:'tr',x:e[1],y:e[2],x2:e[3],y2:e[4],l:.07,m:.07,c:i===8?'#9be34a':i===3?'#fff':'#ffe9a6',s:i===3?2.2:1.3});spark(e[1],e[2],'#ffd36b',2,60);spark(e[3],e[4],'#a01818',2,50);Snd.play(i<0?'gun':TSND[i]||'gun');break}
  case'l':{const i=e[5];PT.push({k:'tr',x:e[1],y:e[2],x2:e[3],y2:e[4],l:.12,m:.12,c:i===12?'#8fe0ff':'#ff6a6a',s:i===12?4:2.4});Snd.play(TSND[i]);break}
  case'z':{const pts=[[e[1],e[2]]];const n=4;for(let k=1;k<n;k++){const f=k/n;pts.push([e[1]+(e[3]-e[1])*f+rr(-6,6),e[2]+(e[4]-e[2])*f+rr(-6,6)])}pts.push([e[3],e[4]]);PT.push({k:'zp',pts,l:.14,m:.14});Snd.play('zap');break}
  case'x':{const r=e[3],col=e[4]===1?['#9be34a','#3a6a10']:['#ffb347','#e0541a'];PT.push({k:'ring',x:e[1],y:e[2],R:r,l:.35,m:.35,c:col[0]});PT.push({k:'fl',x:e[1],y:e[2],R:r,l:.25,m:.25,c:col[0]});spark(e[1],e[2],col[0],10,120);if(e[4]!==1){dctx.fillStyle='rgba(0,0,0,.18)';dctx.beginPath();dctx.arc(e[1],e[2],r*.55,0,TAU);dctx.fill();Snd.play('boom')}break}
  case'k':blood(e[1],e[2],e[3]);spark(e[1],e[2],'#7a1010',6,70);Snd.play('pop');break;
  case'n':PT.push({k:'ring',x:e[1],y:e[2],R:e[3],l:.4,m:.4,c:'#9fe0ff'});Snd.play('ice');break;
  case'f':for(let i=0;i<5;i++){const a=e[3]+rr(-.3,.3),v=rr(80,e[4]*3);PT.push({k:'d',x:e[1]+Math.cos(e[3])*12,y:e[2]+Math.sin(e[3])*12,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rr(.2,.4),m:.4,c:Math.random()<.5?'#ff8a1e':'#ffd23a',s:rr(2,4),add:1})}Snd.play('flame');break;
  case'm':PT.push({k:'sh',x:e[1],y:e[2],x2:e[3],y2:e[4],l:e[5],m:e[5]});Snd.play('boom');break;
  case'sp':PT.push({k:'tr',x:e[1],y:e[2],x2:e[3],y2:e[4],l:.25,m:.25,c:'#9be34a',s:2});break;
  case'b':spark(e[1],e[2],'#ddd',6,50);Snd.play('build');break;
  case'h':Snd.play('horn');toast(t('wave')+' '+(S?S.wave:''),1400);break;
  case'c':Snd.play('coin');break;
  case'pw':Snd.play('power');if(e[1]===0){PT.push({k:'ring',x:e[2],y:e[3],R:80,l:.6,m:.6,c:'#ffcf6a'})}else if(e[1]===1){PT.push({k:'frz',l:.8,m:.8})}else PT.push({k:'frz',l:.6,m:.6,c:'255,200,60'});break;
  case'w':Snd.play(e[1]?'win':'lose');break;
  case'gf':Snd.play('coin');break}}
function partStep(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l-=dt;if(p.l<=0){PT.splice(i,1);continue}if(p.k==='d'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.93;p.vy*=.93}}if(PT.length>700)PT.splice(0,PT.length-700)}

const cv=$('#cv'),ctx=cv.getContext('2d');let SC=1;
function layout(){const aw=innerWidth,ah=innerHeight-44-78;SC=Math.min(aw/W,ah/H);const cw=W*SC,ch=H*SC,dpr=Math.min(devicePixelRatio||1,2);cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=(aw-cw)/2+'px';cv.style.top=(44+(ah-ch)/2)+'px';cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);ctx.setTransform(cw*dpr/W,0,0,ch*dpr/H,0,0)}
const LVC=['','#c98a4a','#c9d1d8','#ffd54a','#ffd54a'];

addEventListener('keydown',e=>{

 j.addEventListener('pointerdown',e=>{id=e.pointerId;j.setPointerCapture(id);mv(e)});j.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});
 const up=e=>{if(e.pointerId===id){id=-1;joy={x:0,y:0};kn.style.transform=''}};j.addEventListener('pointerup',up);j.addEventListener('pointercancel',up)})();

/* ================= end / leave ================= */
function finishGame(m){
 if(screen!=='game'||!S)return;playing=false;const win=!!m.win,w=m.w|0,st=clamp(m.st|0,0,3),mapN=S.map;
 const gain=(win?w:Math.max(0,w-1))+(win?st*4:0);SV.rp+=gain;
 if(win){SV.stars[mapN]=Math.max(SV.stars[mapN]|0,st);SV.un=Math.max(SV.un,Math.min(100,mapN+1))}save();
 $('#endT').textContent=win?t('victory'):t('defeat');$('#endStars').textContent=win?'★'.repeat(st)+'☆'.repeat(3-st):'💀';
 $('#endInfo').innerHTML=`${t('map')} ${mapN} · ${t('wave')} ${w}/${WAVES}<br>${t('rpGain')}: +${gain}`;
 const nb=$('#bEndNext');nb.style.display=V?'none':'';nb.textContent=win&&mapN<100?t('nextMap'):t('retry');nb.dataset.win=win?'1':'0';
 show('sEnd')}
function leaveGame(){playing=false;if(R.online)Net.close();R.online=false;R.host=true;G=null;V=null;S=null;show('sMenu');renderMenu()}
function backToRoom(){G=null;S=null;if(R.online){roomBroadcast();Net.conns.forEach(x=>Net.send(x.c,{t:'lobby'}));renderRoom();show('sRoom')}}

$('#bEndMenu').onclick=()=>{Snd.play('click');if(R.online&&!V)backToRoom();else leaveGame()};

/* ================= snapshots (online) ================= */
function snapshot(){return{t:'s',w:G.wave,ph:G.phase,tm:Math.ceil(G.timer),b:G.base,bm:G.baseMax,sp:G.speed,od:G.od>0?1:0,
 P:G.P.map(p=>[p.cash|0,Math.round(p.hx),Math.round(p.hy),Math.round(p.hhp),Math.round(p.hmax),Math.ceil(p.dead),Math.ceil(p.cd[0]),Math.ceil(p.cd[1]),Math.ceil(p.cd[2]),p.kills,+p.ang.toFixed(2),p.left?1:0]),
 Z:G.Z.map(z=>[z.id,ZK.indexOf(z.ty),Math.round(z.x),Math.round(z.y),Math.round(z.hp),Math.round(z.mhp),z.frz>0?2:z.slowT>0?1:0,z.burnT>0?1:0,z.poisT>0?1:0,+z.ang.toFixed(2)]),
 T:G.T.map(x=>[x.id,x.i,x.lvl,x.gx,x.gy,x.o,+x.ang.toFixed(2),x.jam>0?1:0,x.cd<=0?1:0,Math.round(x.rg||0),Math.round(x.inv)]),
 E:G.evOut.splice(0,80)}}
function applySnap(m){
 const v=V;if(!Array.isArray(m.P)||!Array.isArray(m.Z)||!Array.isArray(m.T))return;
 v.wave=m.w|0;v.phase=m.ph|0;v.timer=+m.tm||0;v.base=+m.b||0;v.baseMax=+m.bm||1;v.speed=m.sp===2?2:1;v.od=m.od?1:0;
 m.P.forEach((r,i)=>{const p=v.P[i];if(!p)return;p.cash=r[0];p.tx=r[1];p.ty=r[2];p.hhp=r[3];p.hmax=r[4];p.dead=r[5];p.cd=[r[6],r[7],r[8]];p.kills=r[9];p.ang=r[10];p.left=r[11]});
 const seen=new Set();
 for(const r of m.Z){const ty=ZK[r[1]];if(!ty)continue;seen.add(r[0]);let z=v.zm.get(r[0]);if(!z){z={id:r[0],ty,r:ZT[ty].r,x:r[2],y:r[3],ang:r[9]||0};v.zm.set(r[0],z)}z.tx=r[2];z.ty=r[3];z.hp=r[4];z.mhp=r[5];z.fz=r[6];z.bn=r[7];z.ps=r[8];z.ang=r[9]}
 for(const id of [...v.zm.keys()])if(!seen.has(id))v.zm.delete(id);
 v.Z=[...v.zm.values()];
 v.T=m.T.map(r=>({id:r[0],i:r[1],lvl:r[2],gx:r[3],gy:r[4],x:(r[3]+.5)*TS,y:(r[4]+.5)*TS,o:r[5],ang:r[6],jam:r[7],ar:r[8],rg:r[9],inv:r[10]})).filter(x=>TW[x.i]);
 if(Array.isArray(m.E))for(const e of m.E)if(Array.isArray(e))fx(e)}
function guestFrame(dt){const k=Math.min(1,dt*14);for(const z of V.Z){z.x+=(z.tx-z.x)*k;z.y+=(z.ty-z.y)*k}for(const p of V.P){p.hx+=(p.tx-p.hx)*k;p.hy+=(p.ty-p.hy)*k}}
let inT=0;function sendIn(dt){inT-=dt;const x=clamp(joy.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),-1,1),y=clamp(joy.y+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),-1,1);const key=x.toFixed(2)+','+y.toFixed(2);if((key!==lastIn||inT<=0)&&Net.conn){lastIn=key;inT=.5;Net.send(Net.conn,{t:'in',x,y})}}

/* ================= online ================= */
const Net={peer:null,role:'',conns:[],conn:null,hb:null,wd:null,last:0,
 send(c,m){try{if(c&&c.open)c.send(m)}catch(e){}},
 close(){clearInterval(this.hb);clearInterval(this.wd);try{this.conns.forEach(x=>x.c.close())}catch(e){}try{this.conn&&this.conn.close()}catch(e){}try{this.peer&&this.peer.destroy()}catch(e){}this.peer=null;this.role='';this.conns=[];this.conn=null}};
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function openPeer(id){return new Promise((res,rej)=>{const p=id?new Peer(id):new Peer();p.on('open',()=>res(p));p.on('error',rej);setTimeout(()=>rej({type:'timeout'}),12000)})}
const lobMsg=k=>$('#lobMsg').textContent=k?t(k):'';
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[rand(a.length)];return s};
$('#bOnline').onclick=()=>{Snd.init();Snd.play('click');Net.close();lobMsg();show('sLobby')};
$('#bLobBack').onclick=()=>{Net.close();show('sMenu')};
let cidN=1;
$('#bCreate').onclick=async()=>{
 Snd.play('click');lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let code,peer;
 for(let q=0;q<5;q++){code=genCode();try{peer=await openPeer('deadzone-'+code);break}catch(e){if(!(e&&e.type==='unavailable-id')){lobMsg('connErr');return}}}
 if(!peer){lobMsg('connErr');return}
 Net.peer=peer;Net.role='host';R.online=true;R.host=true;R.code=code;R.map=Math.min(R.map,SV.un);
 peer.on('connection',c=>{const x={c,cid:cidN++,ready:false,name:'',tech:null};const reg=()=>{c.on('data',m=>hostData(x,m));c.on('close',()=>guestGone(x));c.on('error',()=>{})};if(c.open)reg();else c.on('open',reg)});
 peer.on('error',()=>{});
 Net.hb=setInterval(()=>Net.conns.forEach(x=>Net.send(x.c,{t:'hb'})),3000);
 renderRoom();show('sRoom')};
function guestGone(x){const i=Net.conns.indexOf(x);if(i<0)return;Net.conns.splice(i,1);
 if(G&&!G.over){const p=G.P.find(q=>q.conn===x.c);if(p){p.left=1;p.conn=null}}
 else if(screen==='sRoom'||screen==='sEnd'){roomBroadcast();if(screen==='sRoom')renderRoom()}}
function refuse(x){Net.send(x.c,{t:'full'});setTimeout(()=>{try{x.c.close()}catch(e){}},300)}
function hostData(x,m){
 if(!m||typeof m!=='object')return;
 if(m.t==='hello'){if(G&&!G.over||screen==='game'||x.ready)return refuse(x);if(Net.conns.filter(y=>y.ready).length+1>=MAXP)return refuse(x);
  x.name=String(m.name||'Survivor').slice(0,12);x.tech=cleanTech(m.tech);x.ready=true;Net.conns.push(x);roomBroadcast();renderRoom();return}
 if(!x.ready||!G)return;const p=G.P.find(q=>q.conn===x.c);if(!p)return;const pi=G.P.indexOf(p);
 if(m.t==='in'){p.mvx=clamp(+m.x||0,-1,1);p.mvy=clamp(+m.y||0,-1,1)}
 else if(m.t==='cmd'&&!G.over&&['b','u','s','p','g'].includes(m.k))doCmd(G,pi,{k:m.k,i:m.i|0,gx:m.gx|0,gy:m.gy|0,id:m.id|0,x:+m.x||0,y:+m.y||0,to:m.to|0,a:m.a|0})}
function roomBroadcast(){const names=[SV.name,...Net.conns.filter(x=>x.ready).map(x=>x.name)];Net.conns.filter(x=>x.ready).forEach((x,i)=>Net.send(x.c,{t:'room',pl:names,map:R.map,diff:R.diff,you:i+1}))}
async function joinRoom(code){
 code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){lobMsg('notFound');return}lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let peer;try{peer=await openPeer()}catch(e){lobMsg('connErr');return}
 Net.peer=peer;Net.role='guest';let opened=false;
 peer.on('error',e=>{if(!opened)lobMsg(e&&e.type==='peer-unavailable'?'notFound':'connErr')});
 const c=peer.connect('deadzone-'+code,{reliable:true});Net.conn=c;
 c.on('open',()=>{opened=true;R.online=true;R.host=false;R.code=code;Net.last=Date.now();c.send({t:'hello',name:SV.name,tech:SV.tech});
  Net.hb=setInterval(()=>Net.send(c,{t:'ping'}),3000);Net.wd=setInterval(()=>{if(Date.now()-Net.last>15000)hostGone()},2000)});
 c.on('data',guestData);c.on('close',()=>{if(opened)hostGone()});c.on('error',()=>{});
 setTimeout(()=>{if(!opened&&Net.peer===peer){lobMsg('notFound');Net.close()}},12000)}
function hostGone(){if(!Net.peer)return;Net.close();toast(t('hostLeft'),3000);playing=false;V=null;G=null;S=null;R.online=false;R.host=true;show('sMenu')}
$('#bJoin').onclick=()=>{Snd.init();Snd.play('click');joinRoom($('#joinCode').value)};
$('#bCopy').onclick=async()=>{const url=location.origin+location.pathname+'?room='+R.code;try{await navigator.clipboard.writeText(url);toast(t('copied'))}catch(e){$('#roomMsg').textContent=url}};
function guestData(m){
 if(!m||typeof m!=='object')return;Net.last=Date.now();
 switch(m.t){
  case'room':R.pl=(m.pl||[]).slice(0,MAXP).map(n=>String(n).slice(0,12));R.map=clamp(m.map|0,1,100);R.diff=clamp(m.diff|0,0,2);R.you=m.you|0;if(screen!=='game'&&screen!=='sEnd'){renderRoom();show('sRoom')}break;
  case'full':Net.close();lobMsg('full');show('sLobby');break;
  case'start':{if(!Array.isArray(m.pl)||m.pl.length<1||m.pl.length>MAXP)break;V=newView(clamp(m.map|0,1,100),m.pl.map(n=>String(n).slice(0,12)),clamp(m.you|0,0,m.pl.length-1));R.map=V.map;G=null;S=V;me=V.you;beginPlay();break}
  case's':if(V&&!V.over)applySnap(m);break;
  case'end':if(V&&screen==='game'){V.over=true;setTimeout(()=>finishGame(m),1400)}break;
  case'lobby':if(screen==='sEnd'||screen==='game'){playing=false;V=null;S=null;renderRoom();show('sRoom')}break}}

/* ================= menus ================= */
function renderMenu(){$('#rpMenu').textContent=SV.rp+' RP';$('#bMuteM').textContent=SV.mute?'🔇':'🔊'}
function applyLang(){
 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('#howTxt').textContent=t('howTxt');document.documentElement.lang=LANGS[LI];
 renderMenu();renderDiff();renderRoom();if(screen==='sMaps')renderMaps();if(screen==='sTech')renderTech()}
function renderDiff(){$$('.dseg').forEach(s=>{s.innerHTML=[0,1,2].map(i=>`<button data-d="${i}" class="${R.diff===i?'on':''}" ${R.online&&!R.host?'disabled':''}>${t('d'+i)}</button>`).join('')})}

 const bk=e.target.closest('[data-back]');if(bk){Snd.play('click');show(bk.dataset.back);renderMenu()}});
function renderRoom(){

 $('#roomList').innerHTML=names.map((n,i)=>`<div class="li"><span class="dot" style="background:${PCOL[i%4]}"></span>${esc(n)}${i===0?' 👑':''}</div>`).join('');

 const g=$('#mapGrid');g.innerHTML='';
 for(let n=1;n<=100;n++){const b=document.createElement('button'),st=SV.stars[n]|0,B=BIOMES[Math.floor((n-1)/10)%10];b.className='mp'+(n>SV.un?' lock':'')+(n===R.map?' on':'');b.innerHTML=`${B.e}<br>${n}<small>${n>SV.un?'🔒':'★'.repeat(st)}</small>`;b.onclick=()=>{Snd.play('click');pickMap(n)};g.appendChild(b)}

  const b=document.createElement('button');b.className='btn sm';b.disabled=lv>=mx||SV.rp<cost;b.textContent=lv>=mx?t('maxed'):cost+' RP';b.onclick=()=>{if(SV.rp>=cost&&lv<mx){SV.rp-=cost;SV.tech[k]++;save();Snd.play('coin');renderTech()}};d.appendChild(b);g.appendChild(d)}

  const b=document.createElement('button');b.className='btn sm';b.disabled=has||SV.rp<T.u;b.textContent=has?'✓':T.u+' RP';b.onclick=()=>{if(SV.rp>=T.u&&!has){SV.rp-=T.u;SV.tech.un.push(i);save();Snd.play('coin');renderTech()}};d.appendChild(b);g.appendChild(d)})}
