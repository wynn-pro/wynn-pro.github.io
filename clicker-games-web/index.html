<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 Clicker Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="back" href="../index.html">← Home</a>
<h1>🖱️ <span id="count"></span> Clicker Games</h1>
<p style="color:#777">Pick a game. Your progress saves automatically.</p>
<div class="grid" id="grid"></div>
<script src="games.js"></script>
<script>
  const ids = Object.keys(GAMES);
  document.getElementById("count").textContent = ids.length;
  document.getElementById("grid").innerHTML = ids.map((k) =>
    `<a class="tile" href="game.html?g=${k}"><div>${GAMES[k].icon}</div>${GAMES[k].name}</a>`).join("");
</script>
</body>
</html>
