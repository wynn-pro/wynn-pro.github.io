<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Follow the Line</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfeaff; font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #back { position: fixed; top: 10px; left: 10px; background: #fff; color: #5b3ea8; text-decoration: none; font-weight: bold; padding: 6px 12px; border-radius: 20px; border: 3px solid #5b3ea8; z-index: 5; }
  #lang { position: fixed; top: 10px; left: 90px; background: #fff; color: #5b3ea8; font: bold 14px 'Noto Sans Thai', 'Trebuchet MS', sans-serif; padding: 6px 12px; border-radius: 20px; border: 3px solid #5b3ea8; z-index: 5; cursor: pointer; }
</style>
</head>
<body>
<a id="back" href="../index.html">← Home</a>
<button id="lang" type="button">🌐 ไทย</button>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const d = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  // ---------- language ----------
  let lang = 'en';
  try { lang = localStorage.getItem('lang') === 'th' ? 'th' : 'en'; } catch (e) {}
  const TXT = {
    en: { title: 'Follow the Line', stay: 'Stay on the yellow line!', steer: 'Steer with ← → / A D, or move the mouse.', legend: '🪙 coins   🟩 boosts   🚩 checkpoints',
      play: '▶ Play (Space)', again: '↻ Again (Space)', over: 'Game Over!', score: 'Score', best: 'Best', newBest: '🏆 New best score!',
      back: 'Get back on the line!', zoom: 'ZOOM! 🚀', check: 'Checkpoint! 🚩', oops: 'Oops! Back to the line', home: '← Home', toggle: '🌐 ไทย', level: 'Level', menu: '☰ Levels', easy: 'Easy', mid: 'Medium', hard: 'Hard' },
    th: { title: 'ขับตามเส้น', stay: 'อยู่บนเส้นสีเหลืองให้ได้!', steer: 'บังคับด้วย ← → / A D หรือขยับเมาส์', legend: '🪙 เหรียญ   🟩 เร่งความเร็ว   🚩 จุดเช็คพอยต์',
      play: '▶ เล่น (Space)', again: '↻ เล่นอีกครั้ง (Space)', over: 'จบเกม!', score: 'คะแนน', best: 'สูงสุด', newBest: '🏆 คะแนนสูงสุดใหม่!',
      back: 'กลับขึ้นเส้นเร็ว!', zoom: 'พุ่ง! 🚀', check: 'เช็คพอยต์! 🚩', oops: 'อุ๊ปส์! กลับไปที่เส้น', home: '← หน้าแรก', toggle: '🌐 English', level: 'ระดับ', menu: '☰ เลือกระดับ', easy: 'ง่าย', mid: 'กลาง', hard: 'ยาก' }
  };
  const L = () => TXT[lang];
  const FONT = () => lang === 'th' ? "'Noto Sans Thai', 'Thonburi', 'Tahoma', sans-serif" : "'Trebuchet MS', sans-serif";
  const backEl = document.getElementById('back');
  function setLang(l) {
    lang = l; document.documentElement.lang = l; backEl.textContent = L().home;
    document.title = L().title; langBtn.textContent = L().toggle;
    try { localStorage.setItem('lang', l); } catch (e) {}
  }
  const langBtn = document.getElementById('lang');
  langBtn.addEventListener('click', e => { e.stopPropagation(); setLang(lang === 'th' ? 'en' : 'th'); });
  langBtn.addEventListener('pointerdown', e => e.stopPropagation());
  langBtn.addEventListener('keydown', e => e.stopPropagation());

  // ---------- sound ----------
  let ac = null;
  function beep(freq, dur, type = 'sine', vol = 0.12, slide = 0) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, ac.currentTime + dur);
      g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const sCoin = () => { beep(880, 0.08, 'triangle'); setTimeout(() => beep(1320, 0.12, 'triangle'), 60); };
  const sBoost = () => beep(300, 0.4, 'sawtooth', 0.08, 700);
  const sOops = () => beep(300, 0.4, 'square', 0.1, -220);
  const sCheck = () => { beep(660, 0.1); setTimeout(() => beep(880, 0.1), 100); setTimeout(() => beep(1100, 0.18), 200); };
  const sOver = () => { beep(400, 0.3, 'sawtooth', 0.1, -300); setTimeout(() => beep(200, 0.5, 'sawtooth', 0.1, -100), 300); };

  // ---------- high score ----------
  const DIFFS = {
    easy: { name: 'easy', col: '#2ec27e', tol: 44, speed: 115, ramp: 0.10, cap: 70,  curve: 0.032, wig: 0.008, lives: 5, grace: 0.55, coinMul: 1 },
    mid:  { name: 'mid',  col: '#ffb703', tol: 30, speed: 150, ramp: 0.18, cap: 160, curve: 0.050, wig: 0.012, lives: 3, grace: 0.30, coinMul: 1.5 },
    hard: { name: 'hard', col: '#ff5d8f', tol: 20, speed: 185, ramp: 0.28, cap: 210, curve: 0.070, wig: 0.018, lives: 2, grace: 0.18, coinMul: 2 }
  };
  let diff = 'mid';
  try { const d = localStorage.getItem('follow-the-line-diff'); if (DIFFS[d]) diff = d; } catch (e) {}
  const D = () => DIFFS[diff];
  let best = 0;
  function loadBest() { best = 0; try { best = parseInt(localStorage.getItem('follow-the-line-best-' + diff) || '0', 10) || 0; } catch (e) {} }
  function setDiff(d) { diff = d; TOL = D().tol; try { localStorage.setItem('follow-the-line-diff', d); } catch (e) {} loadBest(); }

  // ---------- track generation ----------
  const STEP = 10;           // distance between path points
  let TOL = 30;              // how far from the line is still "on the line"
  const CHECK_EVERY = 160;   // points between checkpoints
  let px, py, ph, coins, boosts, genH, genC, genX, genY;
  function resetTrack() {
    px = [0]; py = [0]; ph = [-Math.PI / 2];
    genX = 0; genY = 0; genH = -Math.PI / 2; genC = 0;
    coins = []; boosts = [];
    extend(120, true);
  }
  function extend(n, straight) {
    for (let i = 0; i < n; i++) {
      if (!straight) {
        genC += (Math.random() - 0.5) * D().wig;
        genC *= 0.985;
        genC = Math.max(-D().curve, Math.min(D().curve, genC));
        genH += genC;
        const lim = 1.25; // keep heading mostly "up"
        const d = genH + Math.PI / 2;
        if (d > lim) { genH = -Math.PI / 2 + lim; genC = -Math.abs(genC); }
        if (d < -lim) { genH = -Math.PI / 2 - lim; genC = Math.abs(genC); }
      }
      genX += Math.cos(genH) * STEP; genY += Math.sin(genH) * STEP;
      px.push(genX); py.push(genY); ph.push(genH);
      const idx = px.length - 1;
      if (!straight && idx > 40) {
        if (idx % 12 === 0 && Math.random() < 0.7) coins.push({ i: idx, got: false });
        if (idx % 90 === 45 && Math.random() < 0.5) boosts.push({ i: idx, used: false });
      }
    }
  }

  // ---------- game state ----------
  let state = 'title'; // title | play | over
  let car, lives, score, nCoins, trackIdx, lastCheck, offTime, invuln, boostT, shake, t = 0, flash = 0, banner = null;
  let particles = [];

  function newGame() {
    resetTrack();
    car = { x: 0, y: 0, a: -Math.PI / 2, speed: 150 };
    lives = D().lives; score = 0; nCoins = 0; trackIdx = 0; lastCheck = 0; offTime = 0; invuln = 1.2; boostT = 0; shake = 0;
    particles = []; banner = null;
    state = 'play';
  }

  // ---------- input ----------
  const keys = {};
  let mouse = { x: W / 2, y: H / 3, active: false, lastMove: 0 };
  let keyLast = 0;
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true; keyLast = performance.now();
    if (state !== 'play' && DIFFS[{ '1': 'easy', '2': 'mid', '3': 'hard' }[e.key]]) setDiff({ '1': 'easy', '2': 'mid', '3': 'hard' }[e.key]);
    if (state === 'over' && e.key.toLowerCase() === 'm') state = 'title';
    else if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') { newGame(); }
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  function ptr(e) { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; mouse.lastMove = performance.now(); }
  window.addEventListener('pointermove', ptr);
  let hits = [];
  window.addEventListener('pointerdown', e => {
    ptr(e);
    if (state === 'play' || e.target.closest('#back')) return;
    for (const h of hits) {
      if (e.clientX >= h.x && e.clientX <= h.x + h.w && e.clientY >= h.y && e.clientY <= h.y + h.h) { h.fn(); return; }
    }
  });

  // ---------- helpers ----------
  function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
  function spawn(x, y, col, n, spd = 90) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = Math.random() * spd;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, col });
    }
  }
  function say(text, col = '#ff5d8f') { banner = { text, col, t: 1.6 }; }

  // ---------- update ----------
  function update(dt) {
    t += dt;
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    if (flash > 0) flash -= dt;
    if (shake > 0) shake -= dt;
    if (state !== 'play') return;

    // steering: keyboard wins if used more recently than the mouse
    const left = keys['arrowleft'] || keys['a'], right = keys['arrowright'] || keys['d'];
    const turnRate = 3.4;
    if ((left || right) && keyLast >= mouse.lastMove) {
      car.a += ((right ? 1 : 0) - (left ? 1 : 0)) * turnRate * dt;
    } else if (mouse.active) {
      const target = Math.atan2(mouse.y - H / 2, mouse.x - W / 2);
      const d = angDiff(car.a, target);
      car.a += Math.max(-turnRate * dt, Math.min(turnRate * dt, d));
    }

    // speed ramps with distance; boost pads add more
    const base = D().speed + Math.min(D().cap, trackIdx * D().ramp);
    if (boostT > 0) boostT -= dt;
    car.speed = base * (boostT > 0 ? 1.6 : 1);
    car.x += Math.cos(car.a) * car.speed * dt;
    car.y += Math.sin(car.a) * car.speed * dt;

    // find nearest point on the line (windowed search)
    let bi = trackIdx, bd = 1e12;
    const lo = Math.max(0, trackIdx - 15), hi = Math.min(px.length - 1, trackIdx + 60);
    for (let i = lo; i <= hi; i++) {
      const dx = px[i] - car.x, dy = py[i] - car.y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; bi = i; }
    }
    if (bi > trackIdx) trackIdx = bi;
    const dist = Math.sqrt(bd);
    if (px.length - trackIdx < 300) extend(150);

    // score = distance
    score = Math.floor((Math.floor(trackIdx / 4) + nCoins * 10) * D().coinMul);

    // off the line?
    if (invuln > 0) invuln -= dt;
    if (dist > TOL && invuln <= 0) {
      offTime += dt;
      if (offTime > D().grace) loseLife();
    } else offTime = Math.max(0, offTime - dt * 2);

    // pickups
    for (const c of coins) {
      if (c.got) continue;
      if (Math.abs(c.i - trackIdx) < 6 && Math.hypot(px[c.i] - car.x, py[c.i] - car.y) < 34) {
        c.got = true; nCoins++; sCoin(); spawn(px[c.i], py[c.i], '#ffd23f', 10);
      }
    }
    for (const b of boosts) {
      if (b.used) continue;
      if (Math.abs(b.i - trackIdx) < 6 && Math.hypot(px[b.i] - car.x, py[b.i] - car.y) < 36) {
        b.used = true; boostT = 1.6; sBoost(); say(L().zoom, '#2ec27e'); spawn(car.x, car.y, '#2ec27e', 16, 140);
      }
    }
    // checkpoints
    const cp = Math.floor(trackIdx / CHECK_EVERY) * CHECK_EVERY;
    if (cp > lastCheck) { lastCheck = cp; sCheck(); say(L().check, '#3a7bff'); }

    if (Math.random() < 0.5) particles.push({ x: car.x - Math.cos(car.a) * 14, y: car.y - Math.sin(car.a) * 14, vx: 0, vy: 0, life: 0.3, col: boostT > 0 ? '#ffb347' : '#ffffff' });
  }

  function loseLife() {
    lives--; sOops(); shake = 0.3; flash = 0.25;
    spawn(car.x, car.y, '#ff5d8f', 20, 160);
    if (lives <= 0) {
      state = 'over'; sOver();
      if (score > best) { best = score; try { localStorage.setItem('follow-the-line-best-' + diff, String(best)); } catch (e) {} }
      return;
    }
    // respawn on the line at the last checkpoint
    car.x = px[lastCheck]; car.y = py[lastCheck]; car.a = ph[lastCheck];
    trackIdx = lastCheck; offTime = 0; invuln = 1.5; boostT = 0;
    say(L().oops, '#ff5d8f');
  }

  // ---------- draw ----------
  function drawCar(x, y, a, blink) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    if (blink) ctx.globalAlpha = 0.55;
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(2, 4, 19, 12, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#222';
    for (const sx of [-9, 9]) for (const sy of [-11, 11]) { ctx.beginPath(); ctx.roundRect(sx - 5, sy - 3, 10, 6, 2); ctx.fill(); }
    ctx.fillStyle = '#ff5d8f'; ctx.strokeStyle = '#a3265a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(-17, -11, 34, 22, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(6, -5, 4.5, 0, 6.3); ctx.arc(6, 5, 4.5, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(7.5, -5, 2, 0, 6.3); ctx.arc(7.5, 5, 2, 0, 6.3); ctx.fill();
    ctx.strokeStyle = '#a3265a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(-2, 0, 5, -0.9, 0.9); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // kids-style background
    ctx.fillStyle = '#bfeaff'; ctx.fillRect(0, 0, W, H);
    const cx = state === 'title' ? 0 : car.x, cy = state === 'title' ? -((t * 60) % 800) : car.y;
    let ox = W / 2 - cx, oy = H / 2 - cy;
    if (shake > 0) { ox += (Math.random() - 0.5) * 10; oy += (Math.random() - 0.5) * 10; }
    ctx.save(); ctx.translate(ox, oy);

    // polka dots in world space
    const G = 90, x0 = Math.floor((cx - W / 2) / G) - 1, y0 = Math.floor((cy - H / 2) / G) - 1;
    const cols = ['#ffe0f0', '#fff3b0', '#d6f5d6', '#e4d9ff'];
    for (let gx = x0; gx < x0 + W / G + 3; gx++) for (let gy = y0; gy < y0 + H / G + 3; gy++) {
      ctx.fillStyle = cols[Math.abs(gx * 7 + gy * 13) % 4];
      ctx.beginPath(); ctx.arc(gx * G + ((gy & 1) ? 45 : 0), gy * G, 22, 0, 6.3); ctx.fill();
    }

    // the line
    const ti = state === 'title' ? Math.floor(((t * 60) % 800) / STEP) : trackIdx;
    const a = Math.max(0, ti - 50), b = Math.min(px.length - 1, ti + 130);
    function trace() { ctx.beginPath(); ctx.moveTo(px[a], py[a]); for (let i = a + 1; i <= b; i++) ctx.lineTo(px[i], py[i]); }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    trace(); ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = TOL * 2; ctx.stroke();
    trace(); ctx.strokeStyle = '#7a4dd8'; ctx.lineWidth = 14; ctx.stroke();
    trace(); ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 6; ctx.setLineDash([14, 14]); ctx.lineDashOffset = -t * 40; ctx.stroke(); ctx.setLineDash([]);

    // checkpoints
    for (let i = CHECK_EVERY; i < px.length; i += CHECK_EVERY) {
      if (i < a || i > b) continue;
      ctx.save(); ctx.translate(px[i], py[i]); ctx.rotate(ph[i] + Math.PI / 2);
      ctx.fillStyle = i <= lastCheck && state === 'play' ? '#2ec27e' : '#3a7bff';
      ctx.fillRect(-TOL - 6, -4, 2 * TOL + 12, 8);
      for (let k = -TOL; k < TOL; k += 12) { ctx.fillStyle = ((k / 12) & 1) ? '#fff' : '#222'; ctx.fillRect(k, -4, 6, 8); }
      ctx.restore();
    }
    // boost pads
    for (const bp of boosts) {
      if (bp.used || bp.i < a || bp.i > b) continue;
      ctx.save(); ctx.translate(px[bp.i], py[bp.i]); ctx.rotate(ph[bp.i]);
      ctx.fillStyle = '#2ec27e'; ctx.beginPath(); ctx.roundRect(-22, -20, 44, 40, 10); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
      for (const o of [-8, 4]) { ctx.beginPath(); ctx.moveTo(o, -10); ctx.lineTo(o + 10, 0); ctx.lineTo(o, 10); ctx.stroke(); }
      ctx.restore();
    }
    // coins
    for (const c of coins) {
      if (c.got || c.i < a || c.i > b) continue;
      const wob = Math.abs(Math.sin(t * 4 + c.i)) * 0.8 + 0.2;
      ctx.fillStyle = '#ffb703'; ctx.beginPath(); ctx.ellipse(px[c.i], py[c.i], 12 * wob, 12, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(px[c.i], py[c.i], 8 * wob, 8, 0, 0, 6.3); ctx.fill();
    }
    // particles
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 6.3); ctx.fill(); }
    ctx.globalAlpha = 1;
    // car
    if (state !== 'title') drawCar(car.x, car.y, car.a, invuln > 0 && Math.floor(t * 12) % 2 === 0);
    ctx.restore();

    // warning when drifting
    if (state === 'play' && offTime > 0) {
      ctx.fillStyle = `rgba(255,60,100,${Math.min(0.45, offTime * 1.5)})`; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#d81b60'; ctx.font = 'bold 30px ' + FONT(); ctx.textAlign = 'center';
      ctx.fillText(L().back, W / 2, H / 2 - 60);
    }
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 2})`; ctx.fillRect(0, 0, W, H); }

    hud();
  }

  function pill(x, y, w, h, fill, stroke) {
    ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill(); ctx.stroke();
  }
  function hud() {
    ctx.textBaseline = 'middle';
    if (state === 'play' || state === 'over') {
      pill(W - 190, 10, 180, 40, '#fff', '#5b3ea8');
      ctx.fillStyle = '#5b3ea8'; ctx.font = 'bold 20px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText(L().score + ' ' + score, W - 100, 31);
      pill(W / 2 - 95, 10, 190, 40, '#fff', '#ff5d8f');
      ctx.font = '22px sans-serif'; ctx.fillText('❤️'.repeat(Math.max(0, lives)) + '🤍'.repeat(Math.max(0, D().lives - Math.max(0, lives))), W / 2, 31);
      pill(10, 56, 120, 34, '#fff8d6', '#ffb703');
      ctx.fillStyle = '#b07a00'; ctx.font = 'bold 18px Trebuchet MS'; ctx.fillText('🪙 ' + nCoins, 70, 74);
      ctx.fillStyle = '#5b3ea8'; ctx.font = 'bold 14px Trebuchet MS'; ctx.textAlign = 'right';
      ctx.fillText(L().best + ' ' + best, W - 14, 66);
    }
    if (banner) {
      ctx.globalAlpha = Math.min(1, banner.t * 2);
      ctx.fillStyle = banner.col; ctx.font = 'bold 34px ' + FONT(); ctx.textAlign = 'center';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.strokeText(banner.text, W / 2, H * 0.2); ctx.fillText(banner.text, W / 2, H * 0.2);
      ctx.globalAlpha = 1;
    }
    hits = [];
    if (state !== 'play') {
      ctx.fillStyle = 'rgba(91,62,168,0.35)'; ctx.fillRect(0, 0, W, H);
      const bw = Math.min(460, W - 30), bx = W / 2 - bw / 2, by = H / 2 - 180;
      pill(bx, by, bw, 360, '#fff', '#5b3ea8');
      ctx.fillStyle = '#5b3ea8'; ctx.textAlign = 'center';
      if (state === 'title') {
        ctx.font = 'bold 44px ' + FONT(); ctx.fillText(L().title, W / 2, by + 48);
        ctx.font = '52px sans-serif'; ctx.fillText('🚗', W / 2, by + 102);
        ctx.font = '16px ' + FONT(); ctx.fillStyle = '#444';
        ctx.fillText(L().stay, W / 2, by + 150);
        ctx.fillText(L().steer, W / 2, by + 174);
        ctx.fillText(L().legend, W / 2, by + 198);
      } else {
        ctx.font = 'bold 40px ' + FONT(); ctx.fillText(L().over, W / 2, by + 48);
        ctx.font = '22px ' + FONT(); ctx.fillStyle = '#444';
        ctx.fillText(L().score + ': ' + score + '   🪙 ' + nCoins, W / 2, by + 105);
        ctx.fillStyle = score >= best && score > 0 ? '#2ec27e' : '#444';
        ctx.fillText(score >= best && score > 0 ? L().newBest : L().best + ': ' + best, W / 2, by + 142);
        ctx.fillStyle = '#444'; ctx.font = '17px ' + FONT();
        ctx.fillText(L().level + ': ' + L()[diff], W / 2, by + 180);
      }
      // difficulty buttons (title only)
      if (state === 'title') {
        const bwid = (bw - 60) / 3;
        ['easy', 'mid', 'hard'].forEach((k, i) => {
          const x = bx + 20 + i * (bwid + 10), y = by + 215, sel = diff === k;
          pill(x, y, bwid, 44, sel ? DIFFS[k].col : '#f3f0ff', sel ? '#5b3ea8' : '#c9bdf0');
          ctx.fillStyle = sel ? '#fff' : '#5b3ea8'; ctx.font = 'bold 18px ' + FONT();
          ctx.fillText((i + 1) + '. ' + L()[k], x + bwid / 2, y + 23);
          hits.push({ x, y, w: bwid, h: 44, fn: () => setDiff(k) });
        });
      }
      const pulse = 1 + Math.sin(t * 5) * 0.04;
      const py0 = by + (state === 'title' ? 295 : 245);
      ctx.save(); ctx.translate(W / 2, py0); ctx.scale(pulse, pulse);
      pill(-110, -22, 220, 44, '#ff5d8f', '#a3265a');
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px ' + FONT(); ctx.fillText(state === 'title' ? L().play : L().again, 0, 1);
      ctx.restore();
      hits.push({ x: W / 2 - 110, y: py0 - 22, w: 220, h: 44, fn: newGame });
      if (state === 'over') {
        const my = by + 300;
        pill(W / 2 - 90, my - 20, 180, 40, '#f3f0ff', '#5b3ea8');
        ctx.fillStyle = '#5b3ea8'; ctx.font = 'bold 18px ' + FONT(); ctx.fillText(L().menu + ' (M)', W / 2, my + 1);
        hits.push({ x: W / 2 - 90, y: my - 20, w: 180, h: 40, fn: () => { state = 'title'; } });
      }
    }
  }

  setDiff(diff);
  setLang(lang);

  // ---------- main loop ----------
  resetTrack();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
