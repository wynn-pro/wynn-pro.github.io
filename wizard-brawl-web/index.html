<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wizard Brawl</title>
<style>
:root{--ink:#2b1650;--p1:#7c3aed;--p2:#ff5fa2;--yel:#ffd23f;--bg1:#2a1b5e;--bg2:#6a3cc4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg1) 70%);overflow-x:hidden;user-select:none}
[hidden]{display:none!important}
button,select,input{font:inherit}
.scr{max-width:980px;margin:0 auto;padding:14px 16px 30px}
h1{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(36px,8vw,64px);margin:6px 0 0;letter-spacing:2px;color:var(--yel);text-shadow:0 4px 0 #b4400e,0 8px 0 rgba(0,0,0,.25);text-align:center;font-weight:400}
.sub{text-align:center;opacity:.9;margin:4px 0 12px}
.top{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:800;font-size:17px;color:#fff;cursor:pointer;background:linear-gradient(#a06bff,#6d28d9);box-shadow:0 5px 0 #3b0f8c,0 8px 14px rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3b0f8c}
.btn.go{background:linear-gradient(#54e08a,#17a34a);box-shadow:0 5px 0 #0b6b2c,0 8px 14px rgba(0,0,0,.3)}
.btn.pk{background:linear-gradient(#ff8fc2,#e0307f);box-shadow:0 5px 0 #8f1651,0 8px 14px rgba(0,0,0,.3)}
.btn.sm{padding:7px 12px;font-size:15px;border-radius:11px;box-shadow:0 3px 0 #3b0f8c}
.btn.gh{background:rgba(255,255,255,.15);box-shadow:none}
.card{background:rgba(20,8,60,.55);border:3px solid rgba(255,255,255,.18);border-radius:20px;padding:14px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:#ffd9ff}
input[type=text],select{background:#fff;color:var(--ink);border:3px solid #c9b3ff;border-radius:12px;padding:9px 12px;font-weight:700;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cls{flex:1 1 160px;min-width:140px;border-radius:16px;border:4px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);padding:10px;text-align:center;cursor:pointer;position:relative}
.cls.sel{border-color:var(--yel);background:rgba(255,210,63,.18);transform:scale(1.03)}
.cls.lock{opacity:.5;cursor:not-allowed}
.cls .ic{font-size:40px}.cls b{display:block;font-size:17px}.cls small{display:block;opacity:.85;font-size:13px;min-height:32px}
.cls .lk{position:absolute;top:6px;right:8px;font-size:13px;font-weight:800}
.chip{border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;font-weight:800;cursor:pointer;color:#fff;font-size:16px}
.chip.sel{border-color:var(--yel);background:rgba(255,210,63,.25)}
.chip.lock{opacity:.4;cursor:not-allowed}
.xp{height:16px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;border:2px solid rgba(255,255,255,.3);flex:1;min-width:120px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#54e08a,#ffd23f);width:0}
.msg{min-height:22px;color:#ffd23f;font-weight:700;margin-top:6px}
.code{font-family:Impact,sans-serif;font-size:56px;letter-spacing:8px;color:var(--yel);text-align:center;text-shadow:0 4px 0 #b4400e}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pl{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;font-weight:800;display:flex;gap:8px;align-items:center;border-left:8px solid #fff}
.pl.empty{opacity:.45;font-weight:600}
#stage{position:relative;width:100%;max-width:1000px;margin:0 auto;aspect-ratio:1000/640;border-radius:18px;overflow:hidden;border:4px solid #1b0b45;box-shadow:0 10px 30px rgba(0,0,0,.5);background:#000}
#cv{width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;pointer-events:none;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#hTop{top:8px;left:0;right:0;display:flex;justify-content:center;gap:10px;font-size:clamp(14px,2.4vw,22px)}
#hTop span{background:rgba(20,8,60,.65);border-radius:12px;padding:3px 12px}
#banner{top:22%;left:0;right:0;text-align:center;font-family:Impact,sans-serif;font-size:clamp(26px,6vw,56px);color:var(--yel);-webkit-text-stroke:2px #5b1d00;opacity:0;transition:opacity .3s}
#banner.on{opacity:1}
#ghostHint{bottom:90px;left:0;right:0;text-align:center;font-size:clamp(14px,2.4vw,20px);background:rgba(255,255,255,.2);width:max-content;margin:0 auto;padding:4px 14px;border-radius:12px}
#hpBox{left:10px;bottom:10px;width:min(34%,300px)}
#hpBar{height:20px;border-radius:11px;background:rgba(0,0,0,.55);border:3px solid #fff;overflow:hidden;position:relative}
#hpBar i{display:block;height:100%;background:linear-gradient(#7dff9c,#18b04a);width:100%;transition:width .12s}
#shBar{position:absolute;left:0;top:0;height:6px;background:#5ec8ff;width:0}
#coins{font-size:clamp(15px,2.6vw,22px);margin-bottom:3px}
#shop{position:absolute;bottom:8px;left:50%;transform:translateX(26%);display:flex;gap:6px}
.sb{pointer-events:auto;cursor:pointer;border:3px solid #fff;border-radius:12px;background:rgba(20,8,60,.78);color:#fff;padding:3px 7px;font-weight:800;text-align:center;font-size:clamp(11px,1.9vw,15px);min-width:clamp(54px,9vw,86px)}
.sb.ok{background:linear-gradient(#54e08a,#17a34a)}
.sb.max{opacity:.55}
.sb small{display:block;font-size:.8em}
#score{top:44px;right:8px;font-size:clamp(11px,1.8vw,15px);background:rgba(20,8,60,.6);border-radius:12px;padding:5px 9px;min-width:120px}
#score div{display:flex;justify-content:space-between;gap:10px}
#score .dead{opacity:.45;text-decoration:line-through}
#muteB{position:absolute;top:8px;left:8px;pointer-events:auto;cursor:pointer;background:rgba(20,8,60,.7);border:3px solid #fff;border-radius:12px;color:#fff;font-size:20px;padding:0 8px}
#ctrlHint{text-align:center;opacity:.8;font-size:14px;margin-top:8px}
#result{position:fixed;inset:0;background:rgba(10,0,40,.75);display:flex;align-items:center;justify-content:center;z-index:9}
#result .box{background:linear-gradient(#5b2fbf,#2a1b5e);border:5px solid var(--yel);border-radius:26px;padding:22px 26px;max-width:480px;width:92%;text-align:center}
#result h2{font-family:Impact,sans-serif;font-size:42px;margin:0 0 8px;color:var(--yel);font-weight:400;text-shadow:0 3px 0 #b4400e}
#result .tbl{text-align:left;margin:10px 0;font-weight:700}
#result .tbl div{display:flex;justify-content:space-between;padding:3px 8px;border-radius:8px}
#result .tbl div.me{background:rgba(255,210,63,.25)}
</style>
</head>
<body>
<div class="scr" id="sMenu">
  <div class="top">
    <select id="langSel" aria-label="language"></select>
    <button class="btn sm gh" id="muteM" aria-label="mute">🔊</button>
  </div>
  <h1 data-i="title"></h1>
  <p class="sub" data-i="sub"></p>

  <div class="card">
    <div class="row">
      <b>⭐ <span data-i="lvl"></span> <span id="lvNum">1</span></b>
      <div class="xp"><i id="xpBar"></i></div>
      <small id="xpTxt"></small>
    </div>
  </div>

  <div class="card">
    <h3 data-i="name"></h3>
    <input type="text" id="nameIn" maxlength="12">
    <h3 style="margin-top:12px" data-i="cls"></h3>
    <div class="row" id="clsRow"></div>
    <h3 style="margin-top:12px" data-i="hat"></h3>
    <div class="row" id="hatRow"></div>
  </div>

  <div class="card">
    <h3 data-i="map"></h3>
    <div class="row" id="mapRow"></div>
    <h3 style="margin-top:12px" data-i="size"></h3>
    <div class="row" id="sizeRow"></div>
  </div>

  <div class="row" style="justify-content:center;margin-top:8px">
    <button class="btn go" id="bPractice" data-i="practice"></button>
    <button class="btn pk" id="bCreate" data-i="create"></button>
  </div>
  <div class="row" style="justify-content:center;margin-top:14px">
    <input type="text" id="joinCode" maxlength="5" size="7" style="text-transform:uppercase;text-align:center;letter-spacing:4px" data-ph="code">
    <button class="btn" id="bJoin" data-i="join"></button>
  </div>
  <div class="msg" id="menuMsg" style="text-align:center"></div>
  <p id="ctrlHint0" class="sub" style="opacity:.75"></p>
</div>

<div class="scr" id="sLobby" hidden>
  <h1 data-i="title"></h1>
  <p class="sub" data-i="share"></p>
  <div class="code" id="roomCode">-----</div>
  <div class="row" style="justify-content:center;margin:10px 0">
    <button class="btn sm" id="bCopy" data-i="copy"></button>
  </div>
  <div class="card"><div class="plist" id="plist"></div></div>
  <div class="sub" id="lobInfo"></div>
  <div class="row" style="justify-content:center">
    <button class="btn go" id="bStart" data-i="start"></button>
    <button class="btn gh" id="bLobBack" data-i="back"></button>
  </div>
  <div class="msg" id="lobMsg" style="text-align:center"></div>
</div>

<div class="scr" id="sGame" hidden>
  <div id="stage">
    <canvas id="cv" width="1000" height="640"></canvas>
    <button id="muteB">🔊</button>
    <div class="hud" id="hTop"><span id="tTime">4:00</span><span id="tAlive"></span></div>
    <div class="hud" id="banner"></div>
    <div class="hud" id="ghostHint" hidden></div>
    <div class="hud" id="score"></div>
    <div class="hud" id="hpBox"><div id="coins"></div><div id="hpBar"><i id="hpFill"></i><div id="shBar"></div></div></div>
    <div id="shop"></div>
  </div>
  <div id="ctrlHint"></div>
</div>

<div id="result" hidden><div class="box">
  <h2 id="resTitle"></h2>
  <div id="resSub"></div>
  <div class="tbl" id="resTbl"></div>
  <div id="resXp" style="font-weight:800;color:#54e08a"></div>
  <div class="row" style="justify-content:center;margin-top:14px">
    <button class="btn go" id="bAgain"></button>
    <button class="btn gh" id="bMenu" data-i="menu"></button>
  </div>
</div></div>

<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

async function createRoom(){
  Snd.play('click');menuMsg('connecting');
  try{await loadPeer()}catch(e){menuMsg('loadErr');return}
  let code,peer;for(let q=0;q<5;q++){code=genCode();try{peer=await openPeer('wizbrawl-'+code);break}catch(e){if(!(e&&e.type==='unavailable-id')){menuMsg('connErr');return}}}
  if(!peer){menuMsg('connErr');return}
  Net.close();Net.peer=peer;Net.role='host';online=true;menuMsg();
  LB={code,humans:[{id:0,name:cleanName(prof.name),cls:prof.cls,hat:prof.hat,conn:null}],myId:0,size:prof.size,map:prof.map,list:[]};
  me=0;G=null;
  peer.on('connection',c=>{
    c.on('open',()=>{
      if(G&&G.phase!=='lobby'||LB.humans.length>=8){sendTo(c,{t:'full'});setTimeout(()=>c.close(),300);return}
      let id=0;while(LB.humans.some(h=>h.id===id))id++;
      const h={id,name:'Wizard',cls:0,hat:0,conn:c};LB.humans.push(h);Net.conns.push(c);
      sendTo(c,{t:'welcome',id});refreshLobbyHost();
      c.on('data',m=>hostData(h,m));
      c.on('close',()=>dropHuman(h));c.on('error',()=>{});
    });
  });
  peer.on('error',()=>{});
  Net.hb=setInterval(()=>bcast({t:'ping'}),4000);
  show('sLobby');refreshLobbyHost();lobMsg();
}
function dropHuman(h){

}

    sendTo(c,{t:'prof',name:cleanName(prof.name),cls:prof.cls,hat:prof.hat});

}

function hostData(h,m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case'prof':h.name=cleanName(m.name);h.cls=clamp(Math.floor(num(m.cls)),0,CLS.length-1);h.hat=clamp(Math.floor(num(m.hat)),0,HATS.length-1);if(!G)refreshLobbyHost();break;
    case'in':{if(!G||G.phase!=='play')break;const p=G.players[h.id];if(!p||p.bot)break;const i=p.in;
      i.dx=clamp(num(m.dx),-1,1);i.dy=clamp(num(m.dy),-1,1);i.ax=clamp(num(m.ax,p.x),0,W);i.ay=clamp(num(m.ay,p.y),0,H);i.f=!!m.f;if(m.d)i.dash=true;if(m.g)i.gift=true;break}
    case'buy':{if(G&&G.phase==='play'){const p=G.players[h.id];if(p&&p.alive)buy(p,Math.floor(num(m.i,-1)))}break}
  }
}
function guestData(m){
  if(!m||typeof m!=='object')return;Net.last=Date.now();
  switch(m.t){
    case'welcome':me=clamp(Math.floor(num(m.id)),0,7);LB.myId=me;renderLobby();break;
    case'lobby':if(!Array.isArray(m.pl))break;LB.list=m.pl.filter(p=>Array.isArray(p)&&p.length>=4).map(p=>[clamp(p[0]|0,0,7),cleanName(p[1]),clamp(p[2]|0,0,3),clamp(p[3]|0,0,HATS.length-1)]);LB.map=clamp(m.map|0,0,2);LB.size=clamp(m.size|0,4,8);LB.code=String(m.code||'').slice(0,5);if(screen!=='sLobby'){stopGame();$('#result').hidden=true;show('sLobby')}renderLobby();break;
    case'full':Net.close();online=false;show('sMenu');menuMsg('full');break;
    case'start':if(!Array.isArray(m.roster))break;beginView(clamp(m.map|0,0,2),m.roster.slice(0,8).map(r=>({id:clamp(r[0]|0,0,7),name:cleanName(r[1]),cls:clamp(r[2]|0,0,3),hat:clamp(r[3]|0,0,HATS.length-1),bot:!!r[4]})));break;
    case's':applySnap(m);break;
    case'end':onEnd(m);break;
  }
}

/* ============ host simulation ============ */
let G=null,me=0,simTimer=null,lastSim=0;
function newPlayer(id,name,cls,hat,bot){
  const [x,y]=spawnPos(id);const c=CLS[cls];
  return{id,name,cls,hat,bot,x,y,vx:0,vy:0,hp:c.hp,mhp:c.hp,sh:0,alive:true,ghost:false,aim:0,fcd:0,dashCd:0,dashT:0,ddx:0,ddy:0,boost:0,slow:0,kills:0,coins:0,cf:0,gc:0,up:[0,0,0,0],
    in:{dx:0,dy:0,ax:x,ay:y,f:false,dash:false,gift:false}};
}
function startGame(){
  clearInterval(simTimer);
  const humans=LB.humans;const total=Math.max(LB.size,humans.length);
  const used={};humans.forEach(h=>{used[h.id]=h});
  const botNames=BOTN.slice().sort(()=>Math.random()-.5);let cnt=0,have=0;const players=[];
  for(let i=0;i<8;i++){
    if(used[i]){const h=used[i];players[i]=newPlayer(i,h.name,h.cls,h.hat,false);have++}
    else if(have<total){players[i]=newPlayer(i,'🤖 '+botNames[cnt++%8],ri(4),ri(HATS.length),true);have++}
  }
  G={phase:'play',map:LB.map,players,proj:[],pick:[],met:[],tm:GAME_TIME,cd:3.2,nid:1,evT:16,pickT:1,frenzy:0,metLeft:0,metT:0,ev:[],snapT:0,cdShown:4};
  for(let k=0;k<4;k++)spawnPickup();
  const roster=players.filter(Boolean).map(p=>[p.id,p.name,p.cls,p.hat,p.bot?1:0]);
  bcast({t:'start',map:G.map,roster});
  beginView(G.map,roster.map(r=>({id:r[0],name:r[1],cls:r[2],hat:r[3],bot:!!r[4]})));
  lastSim=performance.now();simTimer=setInterval(simTick,16);
}
function stopGame(){clearInterval(simTimer);simTimer=null;G=null;V=null}
function pushEv(...a){if(G)G.ev.push(a)}

function simTick(){
  if(!G||G.phase!=='play')return;
  const now=performance.now();const dt=Math.min(.05,(now-lastSim)/1000);lastSim=now;
  const mp=G.players[me];if(mp&&!mp.bot)localInput(mp);
  if(G.cd>0){G.cd-=dt;const n=Math.max(0,Math.ceil(G.cd));if(n<G.cdShown){G.cdShown=n;pushEv('c',0,0,n)}}
  else{G.tm-=dt;G.evT-=dt;if(G.frenzy>0)G.frenzy-=dt}
  const map=MAPS[G.map];
  for(const p of G.players){if(!p)continue;if(p.bot)botAI(p,dt);movePlayer(p,dt,map)}
  stepProj(dt,map);
  if(G.cd<=0){G.pickT-=dt;if(G.pickT<=0){G.pickT=2.6;if(G.pick.length<9)spawnPickup()}stepEvents(dt)}
  stepPickups(dt);
  for(let i=G.met.length-1;i>=0;i--){const m=G.met[i];m.t-=dt;if(m.t<=0){pushEv('x',m.x,m.y,90);for(const q of G.players){if(q&&q.alive&&Math.hypot(q.x-m.x,q.y-m.y)<90+PR)dmgPlayer(q,32,null)}G.met.splice(i,1)}}
  const alive=G.players.filter(p=>p&&p.alive);const tot=G.players.filter(Boolean).length;
  if(G.cd<=0&&((tot>=2&&alive.length<=1)||G.tm<=0))endRound(alive,G.tm<=0&&alive.length>1);
  else{G.snapT+=dt;if(G.snapT>=.05){G.snapT=0;broadcastSnap()}}
}
function localInput(p){
  const i=p.in;let dx=0,dy=0;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))dx--;if(keys.has('KeyD')||keys.has('ArrowRight'))dx++;
  if(keys.has('KeyW')||keys.has('ArrowUp'))dy--;if(keys.has('KeyS')||keys.has('ArrowDown'))dy++;
  i.dx=dx;i.dy=dy;const w=unproj(mouse.x,mouse.y);i.ax=w.x;i.ay=w.y;i.f=mouse.down;
  if(edge.dash){i.dash=true;edge.dash=false}
  if(edge.gift){i.gift=true;edge.gift=false}
}
function movePlayer(p,dt,map){
  const i=p.in;p.dashCd-=dt;p.fcd-=dt;p.gc-=dt;p.boost-=dt;p.slow-=dt;
  if(p.ghost){
    let dx=i.dx,dy=i.dy;const L=Math.hypot(dx,dy);if(L>1){dx/=L;dy/=L}
    p.vx=dx*280;p.vy=dy*280;p.x=clamp(p.x+p.vx*dt,20,W-20);p.y=clamp(p.y+p.vy*dt,20,H-20);p.aim=Math.atan2(i.ay-p.y,i.ax-p.x);
    if(i.gift&&p.gc<=0&&G.cd<=0){p.gc=5;spawnPickup(clamp(i.ax,40,W-40),clamp(i.ay,40,H-40));pushEv('g',i.ax,i.ay,p.id)}
    i.gift=false;i.dash=false;return}
  let dx=G.cd>0?0:i.dx,dy=G.cd>0?0:i.dy;const L=Math.hypot(dx,dy);if(L>1){dx/=L;dy/=L}
  const c=CLS[p.cls];
  const spd=c.spd*(1+.08*p.up[1])*(p.boost>0?1.4:1)*(p.slow>0?.55:1);

function shoot(p){

function stepProj(dt,map){

    if(b.x<0||b.x>W||b.y<0||b.y>H||b.life<=0)dead=true;

    if(!dead)for(const q of G.players){if(!q||!q.alive||q.id===b.o)continue;if(Math.hypot(b.x-q.x,b.y-q.y)<PR+b.r){hit=q;dead=true;break}}

}

function botAI(p,dt){

    if(p.gc<=0&&G.cd<=0){const al=G.players.filter(q=>q&&q.alive);if(al.length){const q=al[ri(al.length)];i.ax=q.x+rnd(-90,90);i.ay=q.y+rnd(-90,90);i.gift=true}}
    return}
  let tgt=null,bd=1e9;for(const q of G.players){if(!q||q===p||!q.alive)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;tgt=q}}
  if(!tgt)return;const c=CLS[p.cls];
  p.bt=(p.bt||0)-dt;if(p.bt<=0){p.bt=.4+Math.random()*.7;p.bs=Math.random()<.5?1:-1}
  const ux=(tgt.x-p.x)/(bd||1),uy=(tgt.y-p.y)/(bd||1);const pref=c.ps*c.life*.5;
  let mx=0,my=0;if(bd>pref*1.2){mx=ux;my=uy}else if(bd<pref*.55){mx=-ux;my=-uy}
  mx+=-uy*(p.bs||1)*.8;my+=ux*(p.bs||1)*.8;

  if(best&&(bpd<280||(p.hp<50&&best.k===0))){mx=(best.x-p.x)/(bpd||1)*1.6;my=(best.y-p.y)/(bpd||1)*1.6}
  const L=Math.hypot(mx,my)||1;i.dx=mx/L;i.dy=my/L;
  const tt=bd/c.ps*.8;i.ax=tgt.x+tgt.vx*tt+rnd(-34,34);i.ay=tgt.y+tgt.vy*tt+rnd(-34,34);

}

  ctx.lineWidth=6;ctx.strokeStyle=['#2e7d2a','#ff6a2a','#5aa5d6'][V.map];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c2.x,c2.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.stroke();
  for(const h of map.haz){const p=proj(h[0],h[1]);const pul=1+Math.sin(T*3+h[0])*.06;ell(p.x,p.y,h[2]*.67*p.s*pul,h[2]*.56*pul,'#ff4a1a');ell(p.x,p.y,h[2]*.5*p.s*pul,h[2]*.4*pul,'#ffb43f');ell(p.x,p.y,h[2]*.25*p.s,h[2]*.2,'#fff3a0')}
  for(const dc of V.decor){const p=proj(dc[0],dc[1]);if(map.haz.some(h=>Math.hypot(h[0]-dc[0],h[1]-dc[1])<h[2]+10))continue;emoji(dc[2],p.x,p.y,16*p.s*dc[3]*1.3,.8)}
  for(const m of V.m){const p=proj(m[0],m[1]);const pr=1-m[2]/1.3;ctx.lineWidth=4;ctx.strokeStyle='rgba(255,60,40,'+(.4+.4*Math.sin(T*20))+')';ctx.beginPath();ctx.ellipse(p.x,p.y,90*.67*p.s,90*.56,0,0,6.283);ctx.stroke();ell(p.x,p.y,90*.67*p.s*pr,90*.56*pr,'rgba(255,60,40,.25)')}
  const list=[];
  for(const o of map.obs)list.push({y:o[1],f:()=>drawObs(o)});
  for(const id in V.p){const o=V.p[id];list.push({y:o.y,f:()=>drawPlayer(o,T)})}
  for(const u of V.u)list.push({y:u[2],f:()=>drawPick(u,T)});
  const age=Math.min(.12,(performance.now()-V.bt)/1000);
  for(const bl of V.b)list.push({y:bl.y+bl.vy*age,f:()=>drawProj(bl,age)});
  for(const m of V.m)list.push({y:m[1]+999,f:()=>{const p=proj(m[0],m[1]);const fall=Math.max(0,m[2]/1.3);emoji('☄️',p.x+fall*120,p.y-fall*420,50*p.s)}});
  list.sort((a,b)=>a.y-b.y);for(const l of list)l.f();
  for(const q of V.parts){const p=proj(q.x,q.y);const al=clamp(q.life/q.max,0,1);
    if(q.ring){ctx.strokeStyle='rgba(255,200,80,'+al+')';ctx.lineWidth=5*al;ctx.beginPath();ctx.ellipse(p.x,p.y,q.ring*.67*p.s*(1.2-al*.8)*1.3,q.ring*.56*(1.2-al*.8)*1.3,0,0,6.283);ctx.stroke()}
    else{ctx.globalAlpha=al;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(p.x,p.y-q.z*p.s*.7,q.sz*p.s,0,6.283);ctx.fill();ctx.globalAlpha=1}}
  for(const q of V.texts){const p=proj(q.x,q.y);ctx.globalAlpha=clamp(q.life/.5,0,1);ctx.font='900 '+Math.round(20*p.s)+'px Impact,sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(q.txt,p.x,p.y-q.z*p.s);ctx.fillStyle=q.col;ctx.fillText(q.txt,p.x,p.y-q.z*p.s);ctx.globalAlpha=1}
  if(V.fz){ctx.fillStyle='rgba(255,230,60,'+(.06+.04*Math.sin(T*10))+')';ctx.fillRect(0,0,CW,CH)}
  ctx.restore();
  if(!V.over&&(V.cd||V.cdT>0)){const n=V.cd?V.cdNum:0;const s=n>0?String(n):t('go');ctx.font='900 120px Impact,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=10;ctx.strokeStyle='#4a1d00';ctx.globalAlpha=V.cd?1:clamp(V.cdT/.8,0,1);ctx.strokeText(s,CW/2,CH/2-30);ctx.fillStyle='#ffd23f';ctx.fillText(s,CW/2,CH/2-30);ctx.globalAlpha=1}
}
function drawObs(o){
  const p=proj(o[0],o[1]);ell(p.x,p.y+2,o[2]*.75*p.s,o[2]*.3,'#000',.28);
  emoji(o[3],p.x,p.y-o[2]*.62*p.s,o[2]*2.1*.67*p.s*1.5);
}
function drawPick(u,T){
  const p=proj(u[1],u[2]);const bob=Math.sin(T*4+u[0])*4;
  ell(p.x,p.y+3,14*p.s,5,'#000',.25);
  const col=['#ff6b9f','#5ec8ff','#ffd23f','#ffd23f'][u[3]];
  ell(p.x,p.y-12*p.s+bob,20*p.s,20*p.s,col,.35+.15*Math.sin(T*5));
  emoji(['❤️','🛡️','⚡','🪙'][u[3]],p.x,p.y-12*p.s+bob,24*p.s);
}
function drawProj(b,age){
  const x=b.x+b.vx*age,y=b.y+b.vy*age;const p=proj(x,y);const q=proj(x-b.vx*.05,y-b.vy*.05);const lift=14*p.s;
  ell(p.x,p.y+2,8*p.s,3.5,'#000',.25);
  const cols=['#ff9f3f','#8b5a2b','#7fd4ff','#c26bff'][b.k];
  ctx.lineCap='round';
  if(b.k===1){ctx.strokeStyle='#8b5a2b';ctx.lineWidth=3*p.s;ctx.beginPath();ctx.moveTo(q.x,q.y-lift);ctx.lineTo(p.x,p.y-lift);ctx.stroke();ell(p.x,p.y-lift,4*p.s,4*p.s,'#ddd')}
  else{
    ctx.strokeStyle=cols;ctx.globalAlpha=.5;ctx.lineWidth=(b.k===0?14:8)*p.s;ctx.beginPath();ctx.moveTo(q.x,q.y-lift);ctx.lineTo(p.x,p.y-lift);ctx.stroke();ctx.globalAlpha=1;
    ell(p.x,p.y-lift,(b.k===0?11:6)*p.s,(b.k===0?11:6)*p.s,cols);ell(p.x,p.y-lift,(b.k===0?5:3)*p.s,(b.k===0?5:3)*p.s,'#fff')}
}
function drawPlayer(o,T){
  const r=V.roster[o.id];if(!r)return;const p=proj(o.x,o.y);const u=.67*p.s;const R=30*u;
  const alive=o.alive;const col=COLS[o.id];const moving=o.tx!=null&&Math.hypot(o.tx-o.x,o.ty-o.y)>1.5;
  const bob=alive&&moving?Math.abs(Math.sin(T*14+o.id))*5*u:o.ghost?Math.sin(T*3+o.id)*6:0;
  ell(p.x,p.y+3,R*.95,R*.38,'#000',.3);
  if(o.ghost){
    const hy=p.y-R*1.2-bob-14;
    emoji('👻',p.x,hy,R*2.4,.65);if(HATS[r.hat][0])emoji(HATS[r.hat][0],p.x,hy-R*.95,R*1.2,.7);
  }else{
    const cy=p.y-R*1.0-bob;
    if(o.fl&8)ell(p.x-Math.cos(o.aim)*R,cy,R*1.2,R*.7,'#fff',.3);
    ctx.fillStyle=col;ctx.strokeStyle='#2b1650';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.ellipse(p.x,cy,R*.95,R*1.05,0,0,6.283);ctx.fill();ctx.stroke();
    ell(p.x-R*.3,cy-R*.4,R*.28,R*.4,'#fff',.35);
    const ex=Math.cos(o.aim)*R*.14,ey=Math.sin(o.aim)*R*.1;
    for(const sx of[-1,1]){ell(p.x+sx*R*.33,cy-R*.15,R*.28,R*.34,'#fff');ell(p.x+sx*R*.33+ex*1.6,cy-R*.15+ey*1.6,R*.13,R*.17,'#2b1650')}
    ell(p.x,cy+R*.35,R*.18,R*.1,'#2b1650');
    if(HATS[r.hat][0])emoji(HATS[r.hat][0],p.x,cy-R*1.15,R*1.25);
    const wx=p.x+Math.cos(o.aim)*R*1.15,wy=cy+Math.sin(o.aim)*R*.6+R*.15;emoji(CLS[r.cls].icon,wx,wy,R*.9);
    if(o.sh>0){ctx.strokeStyle='rgba(94,200,255,.9)';ctx.lineWidth=4;ctx.fillStyle='rgba(94,200,255,.18)';ctx.beginPath();ctx.ellipse(p.x,cy,R*1.3,R*1.35,0,0,6.283);ctx.fill();ctx.stroke()}
    if(o.fl&4)emoji('❄️',p.x+R,cy-R*.8,R*.7);
    if(o.fl&16)emoji('⚡',p.x-R,cy-R*.8,R*.7);
  }
  const ny=p.y-R*2.7-(o.ghost?6:0);
  ctx.font='800 '+Math.max(11,Math.round(13*p.s))+'px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const label=r.name+(o.id===me?' ★':'');ctx.lineWidth=3.5;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(label,p.x,ny);ctx.fillStyle=o.id===me?'#ffd23f':'#fff';ctx.fillText(label,p.x,ny);
  if(alive){const w=R*2,h=6*p.s+2;const f=clamp(o.hp/o.mhp,0,1);ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(p.x-w/2-1,ny+9,w+2,h+2);ctx.fillStyle=f>.5?'#54e08a':f>.25?'#ffd23f':'#ff5a5a';ctx.fillRect(p.x-w/2,ny+10,w*f,h);if(o.sh>0){ctx.fillStyle='#5ec8ff';ctx.fillRect(p.x-w/2,ny+10,w*clamp(o.sh/60,0,1),2)}}
}

/* ============ HUD ============ */
function buildShop(){
  const sh=$('#shop');sh.innerHTML='';
  for(let i=0;i<4;i++){const b=document.createElement('div');b.className='sb';b.dataset.i=i;b.innerHTML='<span></span><small></small>';b.onclick=()=>doBuy(i);sh.appendChild(b)}
  shopSig='';
}
function hud(){
  const mp=V.p[me];if(!mp)return;
  const m=Math.floor(V.tm/60),s=Math.floor(V.tm%60);$('#tTime').textContent='⏱ '+m+':'+String(s).padStart(2,'0');
  const al=Object.values(V.p).filter(o=>o.alive).length;$('#tAlive').textContent='🧙 '+al+' '+t('alive');
  $('#coins').textContent='🪙 '+mp.coins+'   ⚔ '+mp.kills;
  $('#hpFill').style.width=(100*clamp(mp.hp/mp.mhp,0,1))+'%';$('#shBar').style.width=(100*clamp(mp.sh/60,0,1))+'%';
  const ban=$('#banner');ban.textContent=V.banner;ban.classList.toggle('on',V.bannerT>0);
  const gh=$('#ghostHint');gh.hidden=!(mp.ghost&&!V.over);if(!gh.hidden)gh.textContent=t('ghostHint');
  const sig=mp.coins+'|'+mp.up+'|'+mp.alive+'|'+li;
  if(sig!==shopSig){shopSig=sig;const ns=['up_dmg','up_spd','up_hp','up_rate'],ic=['💥','👟','❤️','🔁'];
    document.querySelectorAll('.sb').forEach(b=>{const i=+b.dataset.i;const l=+mp.up[i]||0;b.children[0].textContent=(i+1)+' '+ic[i]+' '+t(ns[i]);
      b.children[1].textContent=l>=5?'MAX':'🪙'+upCost(l)+'  Lv'+l;b.classList.toggle('ok',l<5&&mp.coins>=upCost(l)&&mp.alive);b.classList.toggle('max',l>=5)})}
  const rows=Object.values(V.p).sort((a,b)=>b.kills-a.kills);const sc=$('#score');sc.innerHTML='';
  rows.forEach(o=>{const d=document.createElement('div');if(!o.alive)d.className='dead';const r=V.roster[o.id];
    const a=document.createElement('span');a.textContent=(o.id===me?'★ ':'')+(r?r.name:'?');a.style.color=COLS[o.id];const b=document.createElement('span');b.textContent=o.kills;d.append(a,b);sc.appendChild(d)});
}

/* ============ results / xp ============ */
function onEnd(m){
  if(!V||V.over)return;V.over=true;V.cd=0;keys.clear();mouse.down=false;
  const winId=num(m.w,-1);const stats={};(m.stats||[]).forEach(s=>stats[s[0]]=s);
  const mine=stats[me]||[me,0,0];const won=winId===me;
  const wr=V.roster[winId];
  $('#resTitle').textContent=won?t('youwin'):t('youlose');
  $('#resSub').textContent=(m.timeup?t('timeup')+' ':'')+(wr?wr.name+' '+t('wins'):'');
  const tb=$('#resTbl');tb.innerHTML='';
  Object.keys(stats).map(k=>stats[k]).sort((a,b)=>b[1]-a[1]||b[2]-a[2]).forEach(s=>{const r=V.roster[s[0]];if(!r)return;const d=document.createElement('div');if(s[0]===me)d.className='me';
    const a=document.createElement('span');a.textContent=(s[0]===winId?'🏆 ':'')+(HATS[r.hat][0]||'')+CLS[r.cls].icon+' '+r.name;const b=document.createElement('span');b.textContent=t('kills')+' '+s[1];d.append(a,b);tb.appendChild(d)});
  const gain=15+mine[1]*10+(won?40:0)+(mine[2]?10:0);const before=myLevel();prof.xp+=gain;saveProf();const after=myLevel();
  $('#resXp').textContent='+'+gain+' XP — '+t('xpGain')+(after>before?'  ·  ⭐ '+t('levelUp')+' ('+t('lvl')+' '+after+')':'');
  const guest=Net.role==='guest';
  $('#bAgain').textContent=online?t('toLobby'):t('again');$('#bAgain').hidden=guest;
  setTimeout(()=>{if(V&&V.over){$('#result').hidden=false;Snd.play(won?'win':'die')}},900);
  buildMenu();
}
$('#bAgain').onclick=()=>{
  $('#result').hidden=true;Snd.play('click');
  if(!online){stopGame();startGame();return}
  stopGame();show('sLobby');refreshLobbyHost();
};
$('#bMenu').onclick=()=>{$('#result').hidden=true;Net.close();online=false;LB.humans=[];stopGame();show('sMenu');menuMsg();buildMenu();Snd.play('click')};

/* ============ init ============ */
applyLang();
const qr=new URLSearchParams(location.search).get('room');
if(qr){$('#joinCode').value=qr.toUpperCase().slice(0,5);}
