<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Iron Front</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1214;color:#e8efe4;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Noto Sans SC","Noto Sans JP","Noto Sans KR",sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;overflow:auto;background:radial-gradient(ellipse at 50% 25%,#34452f 0%,#121a1c 70%);z-index:5}
.scr.on{display:flex}
.scr.clear{background:rgba(8,12,14,.72)}
h1{margin:0;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(44px,11vw,84px);letter-spacing:6px;color:#dfe8cf;text-shadow:0 3px 0 #3d5226,0 0 24px rgba(140,190,80,.35);text-align:center}
h1 b{color:#ffb300}
h2{margin:0;font-size:26px;letter-spacing:2px;text-transform:uppercase}
.sub{color:#a9bba0;font-size:15px;text-align:center;max-width:460px}
.btn{background:linear-gradient(#648640,#3f5527);border:2px solid #9bc062;color:#fff;font-weight:800;padding:12px 24px;border-radius:10px;font-size:17px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;min-width:220px;font-family:inherit}
.btn.sec{background:linear-gradient(#41505b,#27313a);border-color:#7b8d9a}
.btn.sm{min-width:0;padding:8px 14px;font-size:14px}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
input[type=text],select{background:#1a2428;border:2px solid #4c6070;color:#fff;border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit;text-align:center;user-select:text;-webkit-user-select:text}
#joinCode{text-transform:uppercase;width:120px;letter-spacing:4px;font-weight:800}
.msg{min-height:20px;color:#ffb74d;font-weight:700;text-align:center}
.seg{display:flex;gap:4px}.seg button{background:#222d33;color:#cdd;border:2px solid #4c6070;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer;font-family:inherit}
.seg button.on{background:#648640;border-color:#b3d77a;color:#fff}.seg button[disabled]{opacity:.5}
.list{display:flex;flex-direction:column;gap:5px;min-width:260px;max-width:340px;width:100%}
.li{display:flex;align-items:center;gap:8px;background:rgba(20,28,32,.85);border:1px solid #3d4d55;border-radius:8px;padding:6px 10px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.li small{margin-left:auto;color:#9fb3be;font-weight:600}
.codeBox{background:#10181b;border:2px dashed #ffb300;border-radius:10px;padding:6px 14px;text-align:center}
.codeBox b{font-size:30px;letter-spacing:6px;color:#ffb300}
#xpBar{width:min(340px,80vw);height:14px;background:#1c262b;border-radius:7px;overflow:hidden;border:1px solid #4c6070}
#xpBar i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#ffb300);width:0}
#skinGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px;width:100%}
.sk{background:#1d282d;border:2px solid #4c6070;border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;font-weight:800;cursor:pointer}
.sk i{display:block;width:34px;height:34px;border-radius:8px;margin:0 auto 4px;border:2px solid rgba(255,255,255,.35)}
.sk.on{border-color:#ffb300;background:#33311d}.sk.lock{opacity:.4}
.how{white-space:pre-line;max-width:520px;line-height:1.55;font-size:15px;background:rgba(20,28,32,.85);border:1px solid #3d4d55;border-radius:10px;padding:14px 18px}
table{border-collapse:collapse;min-width:280px;max-width:520px;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid #34444c;text-align:center;font-size:14px}
td:nth-child(2){text-align:left}tr.me td{color:#ffd54f;font-weight:800}
#endTitle{font-family:Impact,sans-serif;font-size:clamp(40px,9vw,72px);letter-spacing:4px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:3}
#hud.on{display:block}
#hud>*{pointer-events:auto}
#top{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none;flex-wrap:wrap}
#top>*{pointer-events:auto}
.pill{background:rgba(14,21,24,.8);border:1px solid #435660;border-radius:8px;padding:4px 10px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.pill.gold{color:#ffd54f}.pill.red{color:#ff6b5e;border-color:#a33}
.ib{background:rgba(14,21,24,.8);border:1px solid #435660;border-radius:8px;width:34px;height:30px;color:#fff;font-size:15px;cursor:pointer;padding:0}
.sp{flex:1}
#plist{position:absolute;left:8px;top:calc(46px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:3px;width:148px}
.pc{display:flex;align-items:center;gap:5px;background:rgba(14,21,24,.76);border:2px solid transparent;border-radius:8px;padding:2px 6px;font-size:12px;font-weight:700;cursor:pointer;height:24px}
.pc.tg{border-color:#ffb300}.pc.dead{opacity:.38;text-decoration:line-through}.pc.me{background:rgba(60,70,30,.8)}
.pc .nm{flex:0 1 52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .hp{flex:1;height:6px;background:#222;border-radius:3px;overflow:hidden;min-width:20px}.pc .hp i{display:block;height:100%;background:#7ed957}
#mini{position:absolute;right:8px;top:calc(46px + env(safe-area-inset-top));width:132px;height:132px;border:2px solid #4f6471;border-radius:10px;background:#0a0f12;touch-action:none}
#panel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(7,11,13,.94) 24%);padding:16px 8px calc(8px + env(safe-area-inset-bottom))}
#panel.off{display:none}
#tabs{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto}
.tab{background:#222d33;color:#cfd8dc;border:2px solid #44575f;border-radius:8px;padding:5px 12px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{background:#648640;border-color:#b3d77a;color:#fff}
#cards{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.card{flex:0 0 auto;min-width:88px;background:rgba(34,46,52,.96);border:2px solid #52697a;border-radius:10px;padding:4px 8px;text-align:center;cursor:pointer}
.card .ic{font-size:24px;line-height:1.15}.card .nm{font-size:11px;font-weight:800;white-space:nowrap}.card .co{font-size:12px;color:#ffd54f;font-weight:800}.card .sb{font-size:10px;color:#a8bcc8;min-height:12px}
.card.dis{opacity:.45}.card.lock{opacity:.4;filter:grayscale(1)}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:rgba(0,0,0,.78);padding:8px 16px;border-radius:10px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:86vw}
#toast.on{opacity:1}
#banner{position:absolute;left:0;right:0;top:20%;text-align:center;font-family:Impact,sans-serif;font-size:clamp(22px,5vw,40px);letter-spacing:2px;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s;pointer-events:none;padding:0 12px}
#banner.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity 1.2s}
@media (max-width:640px){#mini{width:100px;height:100px}#plist{width:128px}.pill{font-size:13px;padding:3px 7px}.card{min-width:78px}}
@media (max-height:520px){.scr{justify-content:flex-start}h1{font-size:44px}}
</style>
</head>

<div id="flash"></div>

  <div class="msg" id="lobMsg"></div>
  <button class="btn sec sm" id="bLobBack" data-i="back"></button>
</div>

  <div class="row"><button class="btn" id="bStart" data-i="start"></button><button class="btn sec" id="bRoomBack" data-i="back"></button></div>
</div>

<div id="sProfile" class="scr">
  <h2 id="profRank"></h2>
  <div id="xpBar"><i></i></div><div class="sub" id="xpTxt"></div>
  <div class="sub" data-i="skin"></div>
  <div id="skinGrid"></div>
  <div class="sub" data-i="units"></div>
  <div class="list" id="unitList"></div>
  <button class="btn sec" id="bProfBack" data-i="back"></button>
</div>

<div id="sHow" class="scr">

  <div class="how" id="howTxt"></div>
  <button class="btn sec" id="bHowBack" data-i="back"></button>
</div>

<div id="sEnd" class="scr clear">
  <div id="endTitle"></div>
  <table id="endTable"></table>
  <div class="sub" id="endXp"></div>
  <div class="sub" id="endUnlock" style="color:#ffd54f;font-weight:800"></div>
  <div class="row"><button class="btn" id="bAgain" data-i="again"></button><button class="btn sec" id="bEndMenu" data-i="menu"></button></div>
</div>

<div id="hud">
  <div id="top">
    <div class="pill gold">💰 <span id="sMoney">0</span></div>
    <div class="pill">👥 <span id="sPop">0</span></div>
    <div class="pill" id="pTime">⏱ <span id="sTime">0:00</span></div>
    <div class="sp"></div>
    <button class="ib" id="bCamL">⟲</button><button class="ib" id="bCamR">⟳</button><button class="ib" id="bHome">⌂</button><button class="ib" id="bSnd">🔊</button><button class="ib" id="bMusic">🎵</button><button class="ib" id="bQuit">✖</button>
  </div>
  <div id="plist"></div>
  <canvas id="mini" width="264" height="264"></canvas>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="panel"><div id="tabs"></div><div id="cards"></div></div>
</div>

/* ================= map layout ================= */
function layout(n,a0){
 const hq=[],ore=[];
 for(let i=0;i<n;i++){const a=a0+i*TAU/n;hq.push({x:Math.sin(a)*88,z:Math.cos(a)*88,ang:a});
  for(let j=0;j<3;j++){const b=a+(j-1)*.17;ore.push({x:Math.sin(b)*52,z:Math.cos(b)*52,amt:2000,max:2000,i:ore.length,w:0})}
  const m=a+Math.PI/n;ore.push({x:Math.sin(m)*38,z:Math.cos(m)*38,amt:2600,max:2600,i:ore.length,w:0})}
 for(let j=0;j<5;j++){const b=j*TAU/5;ore.push({x:Math.sin(b)*13,z:Math.cos(b)*13,amt:3500,max:3500,i:ore.length,w:0})}
 return{hq,ore}}

/* ================= simulation (host) ================= */
let G=null,V=null;
const GRID=new Map();
function buildGrid(){GRID.clear();for(const e of G.ents.values()){if(e.hp<=0)continue;const k=((Math.floor(e.x/8)+32)<<6)|(Math.floor(e.z/8)+32);let a=GRID.get(k);if(!a)GRID.set(k,a=[]);a.push(e)}}
function query(x,z,r,fn){const c0=Math.floor((x-r)/8),c1=Math.floor((x+r)/8),d0=Math.floor((z-r)/8),d1=Math.floor((z+r)/8);
 for(let a=c0;a<=c1;a++)for(let b=d0;b<=d1;b++){const l=GRID.get(((a+32)<<6)|(b+32));if(l)for(let i=0;i<l.length;i++)fn(l[i])}}
function emit(f){if(G)G.fx.push(f);if(typeof playFx==='function')playFx(f)}
const later=(s,f)=>G.dl.push({t:s,f});

function mk(type,owner,x,z,extra){
 const T=TY[type],e=Object.assign({id:G.nid++,type,owner,x,z,a:Math.atan2(-x,-z),hp:T.hp,cd:rr(0,.5),tgt:0,scan:rr(0,.3),cons:0},extra||{});
 if(type==='wrk'){e.st=0;e.ore=-1;e.carry=0;e.tm=0}
 if(type==='hq'||type==='bar'||type==='fac'||type==='air'){e.q=[];e.qt=0}
 G.ents.set(e.id,e);return e}

function newGame(plist,diff){
 const n=plist.length,a0=Math.random()*TAU,L=layout(n,a0);
 G={t:0,acc:0,last:performance.now(),ents:new Map(),nid:1,P:[],ore:L.ore,L,a0,seed:rand(1e9),n,fx:[],dl:[],over:false,diff,sd:false,snapT:0,endT:0};
 plist.forEach((p,i)=>{
  const h=L.hq[i];
  const P={i,name:p.name,skin:p.skin,rank:p.rank,ctrl:p.ctrl,conn:p.conn||null,diff:p.diff||0,money:450,alive:true,up:{atk:0,arm:0,eco:0},cd:{air:0,rep:0,nuke:0},target:-1,kills:0,lost:0,pop:3,place:0,slots:new Array(8).fill(0),tslots:new Array(8).fill(0),hq:0,bt:rr(1,3),mult:p.ctrl==='bot'?[.85,1,1.2][p.diff||0]:1,alert:0,tgT:0};
  G.P.push(P);P.hq=mk('hq',i,h.x,h.z).id;
  for(let k=0;k<3;k++)mk('wrk',i,h.x+rr(-6,6)+Math.sin(h.ang+Math.PI)*9,h.z+rr(-6,6)+Math.cos(h.ang+Math.PI)*9)});
 G.P.forEach(P=>{P.target=nearestEnemy(P)});
 V={ents:G.ents,P:G.P,ore:G.ore,me:0,t:0,n,over:false};
 return L}

function nearestEnemy(P){let b=-1,bd=1e9;const h=G.L.hq[P.i];G.P.forEach((q,i)=>{if(i===P.i||!q.alive)return;const o=G.L.hq[i],d=Math.hypot(o.x-h.x,o.z-h.z);if(d<bd){bd=d;b=i}});return b}
function slotPos(pi,k,tur){const h=G.L.hq[pi],ia=Math.atan2(-h.x,-h.z),a=ia+(k-3.5)*(tur?.58:.7),r=tur?27:17;return{x:h.x+Math.sin(a)*r,z:h.z+Math.cos(a)*r}}
function destFor(P){
 if(P.target<0||!G.P[P.target].alive){const h=G.L.hq[P.i],ia=Math.atan2(-h.x,-h.z);return{x:h.x+Math.sin(ia)*30,z:h.z+Math.cos(ia)*30,stop:4}}
 const h=G.L.hq[P.target];return{x:h.x,z:h.z,stop:8}}

function hurt(v,amt,src,wt){
 if(v.hp<=0||v.dead)return;const P=G.P[v.owner];if(!P.alive)return;
 const m=MUL[wt];amt*=m?(m[TY[v.type].cls]??1):1;
 if(src>=0)amt*=1+.15*G.P[src].up.atk;
 amt/=1+.12*P.up.arm;
 v.hp-=amt;
 if(P.ctrl!=='bot'&&P.alert<=0&&TY[v.type].bld&&v.hp<TY[v.type].hp-1){P.alert=10;emit(['al',v.owner])}
 if(v.hp<=0)kill(v,src)}
function kill(v,src){
 if(v.dead)return;v.dead=true;v.hp=0;const T=TY[v.type],P=G.P[v.owner];
 G.ents.delete(v.id);
 if(src>=0&&src!==v.owner)G.P[src].kills++;
 if(!T.bld){P.pop--;P.lost++}
 else{if(v.q)P.pop-=v.q.length;if(v.slot>=0&&v.type!=='hq')(v.type==='tur'?P.tslots:P.slots)[v.slot]=0}
 emit(['b',r1(v.x),r1(v.z),T.bld?T.r*1.5:T.r*2.2+1,T.fly?1:0]);
 if(v.type==='hq')eliminate(v.owner)}
function eliminate(pi){
 const P=G.P[pi];if(!P.alive)return;P.alive=false;
 P.place=G.P.filter(p=>p.alive).length+1;
 emit(['el',pi]);
 for(const e of [...G.ents.values()])if(e.owner===pi){const ee=e;later(rr(.2,2.8),()=>{if(!ee.dead)kill(ee,-1)})}
 checkEnd()}
function splash(x,z,r,dmg,owner,wt,air){
 emit(['b',r1(x),r1(z),r,0]);
 query(x,z,r+8,v=>{if(v.hp<=0||v.owner===owner)return;const V2=TY[v.type];if(V2.cls==='air'&&!air)return;
  const d=Math.max(0,Math.hypot(v.x-x,v.z-z)-V2.r);if(d>r)return;hurt(v,dmg*(1-.6*d/r),owner,wt)})}

function acquire(u,T){
 let best=null,bs=1e9;const R=Math.max(T.rng+3,18);
 query(u.x,u.z,R,v=>{
  if(v.owner===u.owner||v.hp<=0)return;
  const V2=TY[v.type];if(!(V2.cls==='air'?(T.tg&2):(T.tg&1)))return;
  if(!G.P[v.owner].alive)return;
  const d=Math.hypot(v.x-u.x,v.z-u.z)-V2.r;if(d>R)return;
  const s=d+(V2.bld?(v.type==='hq'?4:8):0)-(V2.dmg?3:0);
  if(s<bs){bs=s;best=v}});
 return best}

function fire(u,T,v,d){
 const wt=u.type;
 if(T.splash){
  const fl=T.fly?.7:Math.max(.5,d/26);
  emit(['sh',r1(u.x),r1(u.z),T.fly?11:1.5,r1(v.x),r1(v.z),+fl.toFixed(2),T.fly?1:0]);
  const x=v.x,z=v.z,o=u.owner;later(fl,()=>splash(x,z,T.splash,T.dmg,o,wt,false));
 }else{
  hurt(v,T.dmg,u.owner,wt);
  emit(['s',r1(u.x),r1(u.z),r1(v.x),r1(v.z),TI[wt],TY[v.type].fly?1:0])}}

function go(u,T,tx,tz,dt,stop){
 const dx=tx-u.x,dz=tz-u.z,d=Math.hypot(dx,dz);if(d<=stop)return;
 let vx=dx/d,vz=dz/d,sx=0,sz=0;
 query(u.x,u.z,8,o=>{
  if(o===u||o.hp<=0)return;const OT=TY[o.type];
  if(OT.bld){if(T.fly)return;const ex=u.x-o.x,ez=u.z-o.z,q=Math.hypot(ex,ez),rs=OT.r+T.r+.8;if(q<rs&&q>1e-3){sx+=ex/q*(rs-q)*2;sz+=ez/q*(rs-q)*2}return}
  if(!OT.fly!==!T.fly)return;
  const ex=u.x-o.x,ez=u.z-o.z,q2=ex*ex+ez*ez,rs=(T.r+OT.r)*1.2;
  if(q2<rs*rs&&q2>1e-4){const q=Math.sqrt(q2);sx+=ex/q*(rs-q);sz+=ez/q*(rs-q)}});
 vx+=sx*1.4;vz+=sz*1.4;const l=Math.hypot(vx,vz)||1,step=Math.min(T.sp*dt,Math.max(0,d-stop)+.01);
 u.x=clamp(u.x+vx/l*step,-125,125);u.z=clamp(u.z+vz/l*step,-125,125);u.a=Math.atan2(vx,vz)}

function unitAI(u,T,dt,P){
 u.cd-=dt;u.scan-=dt;
 let tg=u.tgt?G.ents.get(u.tgt):null;if(tg&&(tg.hp<=0||!G.P[tg.owner].alive))tg=null;
 if(u.scan<=0){u.scan=.35+Math.random()*.2;tg=acquire(u,T);u.tgt=tg?tg.id:0}
 if(tg){
  const dx=tg.x-u.x,dz=tg.z-u.z,TT=TY[tg.type],d=Math.hypot(dx,dz)-TT.r;
  if(d<=T.rng){u.a=Math.atan2(dx,dz);if(u.cd<=0){fire(u,T,tg,d);u.cd=T.rof*rr(.9,1.1)}return}
  go(u,T,tg.x,tg.z,dt,T.rng*.85+TT.r);
 }else{const D=destFor(P);go(u,T,D.x,D.z,dt,D.stop)}}
function turretAI(b,T,dt){
 b.cd-=dt;b.scan-=dt;

function doCmd(pi,m){

 const err=(k,a)=>{if(P.ctrl==='me')uiErr(k,a);else if(P.ctrl==='net')Net.send(P.conn,{t:'err',k,a});return 0};
 const k=m.k;
 if(k==='g'){const g=m.g|0;if(g===-1||(g>=0&&g<G.n&&g!==pi&&G.P[g].alive)){P.target=g;return 1}return 0}
 if(k==='b'){
  const ty=m.ty;if(!has(TY,ty)||ty==='hq'||!TY[ty].bld)return err('x');const T=TY[ty];
  const mine=[...G.ents.values()].filter(e=>e.owner===pi);
  if(mine.filter(e=>e.type===ty).length>=T.max)return err('max');
  if(T.req&&!mine.some(e=>e.type===T.req&&!e.cons))return err('req');
  if(P.money<T.cost)return err('money');
  const sl=ty==='tur'?P.tslots:P.slots,si=sl.indexOf(0);if(si<0)return err('max');

  emit(['bt',r1(b.x),r1(b.z)]);return 1}
 if(k==='t'){
  const ty=m.ty;if(!has(TY,ty)||!TY[ty].from)return err('x');const T=TY[ty];
  if(T.unlock&&P.rank<T.unlock)return err('lock',T.unlock);
  const bs=[...G.ents.values()].filter(e=>e.owner===pi&&e.type===T.from&&!e.cons&&e.q.length<5);
  if(!bs.length)return err('nob');if(P.pop>=CAP)return err('pop');if(P.money<T.cost)return err('money');
  bs.sort((a,b)=>a.q.length-b.q.length);bs[0].q.push(ty);P.money-=T.cost;P.pop++;return 1}
 if(k==='u'){
  const u=m.u;if(u!=='atk'&&u!=='arm'&&u!=='eco')return err('x');
  const lv=P.up[u];if(lv>=3)return err('max');const c=UP[u][lv];if(P.money<c)return err('money');
  P.money-=c;P.up[u]++;emit(['up',pi]);return 1}

  const a=m.a;if(a!=='air'&&a!=='rep'&&a!=='nuke')return err('x');const pw=PW[a];
  if(pw.unlock&&P.rank<pw.unlock)return err('lock',pw.unlock);
  if(P.cd[a]>0)return err('cd');if(P.money<pw.cost)return err('money');
  const hq=G.ents.get(P.hq);
  if(a==='rep'){
   P.money-=pw.cost;P.cd[a]=pw.cd;hq.hp=Math.min(TY.hq.hp,hq.hp+500);
   for(const e of G.ents.values())if(e.owner===pi&&e.hp>0){const T=TY[e.type];if(T.bld)e.hp=Math.min(T.hp,e.hp+T.hp*.35);else if(Math.hypot(e.x-hq.x,e.z-hq.z)<30)e.hp=Math.min(T.hp,e.hp+T.hp*.4)}
   emit(['rp',r1(hq.x),r1(hq.z)]);return 1}
  if(P.target<0||!G.P[P.target].alive)return err('tg');
  const h=G.L.hq[P.target];P.money-=pw.cost;P.cd[a]=pw.cd;
  if(a==='air'){
   for(let j=0;j<10;j++)later(j*.35,()=>{const x=h.x+rr(-17,17),z=h.z+rr(-17,17);emit(['sh',r1(x),r1(z),34,r1(x),r1(z),.8,1]);later(.8,()=>splash(x,z,7,110,pi,'pw',false))});

   emit(['nk',r1(h.x),r1(h.z),4]);later(4,()=>splash(h.x,h.z,26,1400,pi,'nuke',true))}

function botThink(P){

 const c={},qd={};mine.forEach(e=>{c[e.type]=(c[e.type]||0)+1;if(e.q)e.q.forEach(x=>qd[x]=(qd[x]||0)+1)});

 const want=[['bar',1],['fac',1],['tur',d>=1?2:0],['air',d>=1?1:0],['bar',2],['tur',d>=2?4:0],['fac',d>=2?2:0],['air',d>=2?2:0],['tur',d>=1?5:1]];

 if(d>=1&&P.cd.air<=0&&P.money>450&&Math.random()<.3)cmd({k:'a',a:'air'});
 const hq=G.ents.get(P.hq);
 if(hq&&hq.hp<TY.hq.hp*.5&&P.cd.rep<=0&&P.money>250)cmd({k:'a',a:'rep'});

/* ----- fx ----- */
const fxMat=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,depthWrite:false});
function addFx(m,life,upd){if(FX.length>240)return;RN.scene.add(m);FX.push({m,life,t:0,upd})}
function fxUpdate(dt){
 for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;
  if(f.t>=f.life){RN.scene.remove(f.m);f.m.material.dispose();FX.splice(i,1);continue}
  f.upd(f,dt)}}
function fxTrace(x1,y1,z1,x2,y2,z2,c,th,life){
 const m=new THREE.Mesh(GEO.box,fxMat(c,1)),L=Math.hypot(x2-x1,y2-y1,z2-z1);
 m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);m.lookAt(x2,y2,z2);m.scale.set(th,th,L);
 addFx(m,life,f=>{f.m.material.opacity=1-f.t/f.life})}
function fxFlash(x,y,z,s){const m=new THREE.Mesh(GEO.sph,fxMat(0xffee88,1));m.position.set(x,y,z);m.scale.setScalar(s);addFx(m,.07,f=>{f.m.material.opacity=1-f.t/f.life})}
function fxPuff(x,y,z,r,life,col){const m=new THREE.Mesh(GEO.sph,fxMat(col||0xb8a88a,.55));m.position.set(x,y,z);addFx(m,life,(f,dt)=>{const p=f.t/f.life;f.m.scale.setScalar(r*(.3+.9*p));f.m.position.y+=dt*1.2;f.m.material.opacity=.55*(1-p)})}
function fxRing(x,z,R,col,life){const m=new THREE.Mesh(GEO.ring,fxMat(col,.9));m.material.side=THREE.DoubleSide;m.rotation.x=-Math.PI/2;m.position.set(x,.3,z);addFx(m,life,f=>{const p=f.t/f.life;f.m.scale.setScalar(1+R*p);f.m.material.opacity=.9*(1-p)})}
function fxBoom(x,z,r,air){
 const y=air?9:Math.min(2,r*.3);
 const fl=new THREE.Mesh(GEO.sph,fxMat(0xffd070,.95));fl.position.set(x,y+r*.25,z);
 addFx(fl,.35+r*.025,f=>{const p=f.t/f.life,s=r*(.35+.75*p);f.m.scale.setScalar(s);f.m.material.opacity=.95*(1-p);f.m.material.color.setHex(p<.35?0xffe08a:0xff7a22)});
 const n=r>=20?9:r>8?4:r>3?3:2;
 for(let i=0;i<n;i++){
  const s=new THREE.Mesh(GEO.sph,fxMat(i%2?0x2a2a2a:0x4a4038,.7)),ox=rr(-r,r)*.45,oz=rr(-r,r)*.45,vy=rr(1.5,4)*(1+r*.04),sz=r*rr(.35,.7);
  s.position.set(x+ox,y,z+oz);
  addFx(s,1.1+r*.06+rr(0,.5),(f,dt)=>{const p=f.t/f.life;f.m.position.y+=vy*dt*(1-p*.6);f.m.scale.setScalar(sz*(.4+.8*p));f.m.material.opacity=.7*(1-p)})}
 if(r>=20){
  fxRing(x,z,r*2.4,0xffffff,1.3);
  const st=new THREE.Mesh(GEO.cyl,fxMat(0x6b5a48,.85));addFx(st,4,f=>{const p=f.t/f.life,h=8+34*p;f.m.scale.set(4+3*p,h,4+3*p);f.m.position.set(x,h/2,z);f.m.material.opacity=.85*(1-p*p)});
  const cp=new THREE.Mesh(GEO.sph,fxMat(0xd08040,.9));addFx(cp,4,f=>{const p=f.t/f.life,h=8+34*p;f.m.scale.set(13+8*p,9+4*p,13+8*p);f.m.position.set(x,h+4,z);f.m.material.opacity=.9*(1-p*p);f.m.material.color.setHex(p<.4?0xffa040:0x7a5a48)});
  const fe=$('#flash');fe.style.transition='none';fe.style.opacity=.9;requestAnimationFrame(()=>{fe.style.transition='opacity 1.4s';fe.style.opacity=0})}}
function fxShell(x1,z1,y1,x2,z2,dur,bomb){

 const arc=y1>5?0:Math.hypot(x2-x1,z2-z1)*.3+3;
 addFx(m,dur,f=>{const p=f.t/f.life;f.m.position.set(x1+(x2-x1)*p,y1*(1-p)+4*arc*p*(1-p),z1+(z2-z1)*p)})}
function fxNukeWarn(x,z,dur){

const vol=(x,z)=>clamp(1.15-Math.hypot(x-CAM.fx,z-CAM.fz)/110,0,1);
function playFx(f){
 if(!RN||!RN.run||!V)return;
 switch(f[0]){
  case's':{
   const x1=f[1],z1=f[2],x2=f[3],z2=f[4],ty=TYL[f[5]],tf=f[6],T=TY[ty]||TY.inf;
   const y1=T.fly?T.fy-.5:ty==='tank'?2.2:ty==='hq'?7:ty==='tur'?3.6:1.5,y2=tf?9:1.3;
   const cfg={inf:[0xfff0a0,.12,.07,'rifle'],snp:[0xffffff,.1,.14,'rifle'],tank:[0xffb040,.35,.1,'cannon'],tur:[0xffb040,.2,.08,'mg'],hq:[0xffb040,.2,.08,'mg'],heli:[0xffe070,.18,.08,'mg']}[ty]||[0xffee99,.12,.08,'rifle'];
   fxTrace(x1,y1,z1,x2,y2,z2,cfg[0],cfg[1],cfg[2]);fxFlash(x1,y1,z1,ty==='tank'?1.2:.6);
   if(ty==='tank')fxPuff(x2,y2,z2,1.4,.3);
   Snd.play(cfg[3],vol(x1,z1));break}
  case'sh':fxShell(f[1],f[2],f[3],f[4],f[5],f[6],f[7]);if(!f[7])Snd.play('cannon',vol(f[1],f[2]));break;
  case'b':fxBoom(f[1],f[2],f[3],f[4]);Snd.play(f[3]>=20?'nuke':'boom',vol(f[1],f[2])*(f[3]>=20?1:Math.min(1,.35+f[3]/10)));break;
  case'nk':fxNukeWarn(f[1],f[2],f[3]);Snd.play('siren',1);banner(t('nukeInc'),'#ff5040',3500);break;
  case'al':if(f[1]===V.me){banner(t('attack'),'#ff8a65',2200);Snd.play('alert',1)}break;
  case'el':{const P=V.P[f[1]];banner(f[1]===V.me?t('youElim'):t('elim').replace('{0}',P?P.name:'?'),f[1]===V.me?'#ff8a65':'#ffd54f',3000);break}
  case'sd':banner(t('sudden'),'#ff5040',4500);Snd.play('siren',1);break;
  case'bt':fxPuff(f[1],1,f[2],5,.7);Snd.play('build',vol(f[1],f[2]));break;
  case'rp':fxRing(f[1],f[2],30,0x66ff99,.9);Snd.play('build',vol(f[1],f[2]));break;
  case'up':if(f[1]===V.me)Snd.play('build',1);break}}

/* ----- camera + input ----- */
function clampCam(){const r=Math.hypot(CAM.tfx,CAM.tfz);if(r>120){CAM.tfx*=120/r;CAM.tfz*=120/r}}
function panBy(dx,dy){
 const k=2*Math.tan(24*Math.PI/180)*CAM.d/innerHeight,ys=k/Math.sin(CAM.pitch),s=Math.sin(CAM.yaw),c=Math.cos(CAM.yaw);
 const mx=-dx*k*c-dy*ys*s,mz=dx*k*s-dy*ys*c;CAM.tfx+=mx;CAM.tfz+=mz;CAM.fx+=mx;CAM.fz+=mz;clampCam()}
function setTarget(g){
 if(!V||V.over)return;const me=V.P[V.me];if(!me||!me.alive)return;
 if(G)doCmd(0,{k:'g',g});else{me.target=g;Net.send(Net.conn,{t:'cmd',k:'g',g})}
 Snd.play('click')}
function tapWorld(cx,cy){
 const ray=new THREE.Raycaster();ray.setFromCamera({x:cx/innerWidth*2-1,y:-(cy/innerHeight)*2+1},RN.cam);
 const p=new THREE.Vector3();if(!ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p))return;
 let bi=-1,bd=16;RN.L.hq.forEach((h,i)=>{if(i===V.me||!V.P[i].alive)return;const d=Math.hypot(h.x-p.x,h.z-p.z);if(d<bd){bd=d;bi=i}});
 if(bi>=0)setTarget(bi)}
function bindInput(){
 const cv=$('#gl'),ptr=new Map();let pinch=0;
 cv.addEventListener('contextmenu',e=>e.preventDefault());
 cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,t0:performance.now(),mv:0});

let lastTs=0;
function frame(ts){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(ts-lastTs)/1000||.016);lastTs=ts;
 if(!RN||!RN.run||!V)return;
 RN.time+=dt;RN.fr++;if(!G)V.t+=dt;
 const sp=CAM.d*.9*dt,s=Math.sin(CAM.yaw),c=Math.cos(CAM.yaw);let kx=0,kz=0;
 if(KEYS.w||KEYS.arrowup)kz-=1;if(KEYS.s||KEYS.arrowdown)kz+=1;if(KEYS.a||KEYS.arrowleft)kx-=1;if(KEYS.d||KEYS.arrowright)kx+=1;
 if(kx||kz){CAM.tfx+=(kx*c+kz*s)*sp;CAM.tfz+=(-kx*s+kz*c)*sp;clampCam()}
 const k=Math.min(1,dt*10);
 CAM.fx+=(CAM.tfx-CAM.fx)*k;CAM.fz+=(CAM.tfz-CAM.fz)*k;CAM.d+=(CAM.td-CAM.d)*k;
 CAM.yaw+=(CAM.tyaw-CAM.yaw)*k;
 const cp=Math.cos(CAM.pitch),sp2=Math.sin(CAM.pitch);
 RN.cam.position.set(CAM.fx+Math.sin(CAM.yaw)*cp*CAM.d,sp2*CAM.d,CAM.fz+Math.cos(CAM.yaw)*cp*CAM.d);
 RN.cam.lookAt(CAM.fx,0,CAM.fz);
 RN.sun.position.set(CAM.fx+60,110,CAM.fz+40);RN.sun.target.position.set(CAM.fx,0,CAM.fz);
 const fr=RN.fr,kk=Math.min(1,dt*12);
 for(const e of V.ents.values()){
  const v=ensure(e),T=TY[e.type];v.seen=fr;
  e.rx+=(e.x-e.rx)*kk;e.rz+=(e.z-e.rz)*kk;
  let da=e.a-e.ra;da=Math.atan2(Math.sin(da),Math.cos(da));e.ra+=da*Math.min(1,dt*10);
  const y=T.fly?T.fy+Math.sin(RN.time*2+e.id)*.45:0;
  v.m.position.set(e.rx,y,e.rz);
  if(T.bld){
   if(v.tu)v.tu.rotation.y=e.ra;
   const g=e.cons?.35+.65*clamp(e.hp/T.hp,0,1):1;v.m.scale.y+=(g-v.m.scale.y)*.2;
   if(!e.cons&&e.hp<T.hp*.45){v.smk-=dt;if(v.smk<=0){v.smk=.35;fxPuff(e.rx+rr(-3,3),T.h*.7,e.rz+rr(-3,3),2.2,1.3,0x3a3a3a)}}
  }else{
   v.m.rotation.y=e.ra;if(T.fly)v.m.rotation.z+=((-da*.6)-v.m.rotation.z)*.1;
   const a=Math.min(1,(RN.time-v.born)*4);v.m.scale.setScalar(a)}
  if(v.rot)v.rot.rotation.y+=dt*28;
  v.disc.position.x=e.rx;v.disc.position.z=e.rz;
  if(v.sh){v.sh.position.x=e.rx;v.sh.position.z=e.rz}
  const ratio=clamp(e.hp/T.hp,0,1),show=ratio<.995||e.type==='hq';
  v.bar.g.visible=show;
  if(show){v.bar.g.position.set(e.rx,y+T.h,e.rz);v.bar.g.quaternion.copy(RN.cam.quaternion);v.bar.fg.scale.x=Math.max(.01,ratio*v.bar.w);v.bar.fg.position.x=(ratio*v.bar.w-v.bar.w)/2;v.bar.fg.material=ratio>.5?BARG:ratio>.25?BARY:BARR}}
 for(const [id,v] of RN.meshes)if(v.seen!==fr){dropMesh(v);RN.meshes.delete(id)}
 V.ore.forEach((o,i)=>{const g=RN.oreM[i];if(!g)return;g.visible=o.amt>0;const sc=.35+.65*clamp(o.amt/o.max,0,1);g.scale.set(sc,sc,sc)});
 const me=V.P[V.me];
 if(me&&me.target>=0&&V.P[me.target]&&V.P[me.target].alive){const h=RN.L.hq[me.target];RN.tring.visible=true;RN.tring.position.set(h.x,.4,h.z);const ps=1+.08*Math.sin(RN.time*5);RN.tring.scale.set(ps,ps,ps)}else RN.tring.visible=false;
 fxUpdate(dt);
 RN.hudT+=dt;if(RN.hudT>.25){RN.hudT=0;hudUpdate()}
 RN.miniT+=dt;if(RN.miniT>.12){RN.miniT=0;drawMini()}
 RN.r.render(RN.scene,RN.cam)}

 const tb=$('#endTable');tb.innerHTML='<tr><th>'+t('place')+'</th><th></th><th>'+t('kills')+'</th><th>☠</th></tr>';
 msg.res.map((x,i)=>({...x,i})).sort((a,b)=>a.p-b.p).forEach(x=>{const tr=document.createElement('tr');if(x.i===me)tr.className='me';
  tr.innerHTML='<td></td><td></td><td></td><td></td>';const c=tr.children;c[0].textContent='#'+x.p;c[1].textContent=(x.b?'🤖 ':'')+x.n;c[2].textContent=x.k;c[3].textContent=x.l;tb.appendChild(tr)});
 const gain=20+r.k*2+Math.round(msg.tm/60)*4+(win?120:r.p===2?70:r.p===3?40:15);
 const before=rankOf(prof.xp);prof.xp+=gain;saveProf();const after=rankOf(prof.xp);
 $('#endXp').textContent=t('xpGain')+': +'+gain+'  ·  '+t('rank')+' '+after;
 const un=[];
 for(let rk=before+1;rk<=after;rk++){SKIN_UNLOCK.forEach((u,i)=>{if(u===rk)un.push('🎨 '+t('s'+i))});[['snp',2],['p_nuke',3],['art',4],['bmb',6]].forEach(([k,u])=>{if(u===rk)un.push('🔓 '+t(k))})}
 $('#endUnlock').textContent=un.length?t('unlocked')+': '+un.join(', '):'';
 Snd.play(win?'win':'lose');
 show('sEnd')}
$('#bAgain').onclick=()=>{
 Snd.play('click');if(G){clearInterval(G.timer);G=null}V=null;if(RN)RN.run=false;
 if(R.online){if(R.host){roomBroadcast();Net.conns.forEach(x=>Net.send(x.c,{t:'lobby'}))}renderRoom();show('sRoom')}
 else{R.online=false;R.host=true;openRoom()}};
$('#bEndMenu').onclick=()=>{Snd.play('click');leaveGame()};

/* ================= online ================= */
const Net={peer:null,role:'',conns:[],conn:null,hb:null,wd:null,last:0,
 send(c,m){try{if(c&&c.open)c.send(m)}catch(e){}},
 close(){clearInterval(this.hb);clearInterval(this.wd);try{this.conns.forEach(x=>x.c.close())}catch(e){}try{this.conn&&this.conn.close()}catch(e){}try{this.peer&&this.peer.destroy()}catch(e){}this.peer=null;this.role='';this.conns=[];this.conn=null}};
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function openPeer(id){return new Promise((res,rej)=>{const p=id?new Peer(id):new Peer();p.on('open',()=>res(p));p.on('error',rej);setTimeout(()=>rej({type:'timeout'}),12000)})}
const lobMsg=k=>$('#lobMsg').textContent=k?t(k):'';
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[rand(a.length)];return s};
$('#bOnline').onclick=()=>{Snd.init();Snd.play('click');Net.close();lobMsg();show('sLobby')};
$('#bLobBack').onclick=()=>{Net.close();show('sMenu')};
let cidN=1;
$('#bCreate').onclick=async()=>{
 Snd.play('click');lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let code,peer;
 for(let q=0;q<5;q++){code=genCode();try{peer=await openPeer('ironfront-'+code);break}catch(e){if(!(e&&e.type==='unavailable-id')){lobMsg('connErr');return}}}
 if(!peer){lobMsg('connErr');return}
 Net.peer=peer;Net.role='host';R.online=true;R.host=true;R.code=code;
 peer.on('connection',c=>{
  const x={c,cid:cidN++,ready:false,name:'',skin:0,rank:1};
  const reg=()=>{c.on('data',m=>hostData(x,m));c.on('close',()=>guestGone(x));c.on('error',()=>{})};
  if(c.open)reg();else c.on('open',reg)});
 peer.on('error',()=>{});
 openRoom()};
function guestGone(x){
 const i=Net.conns.indexOf(x);if(i<0)return;Net.conns.splice(i,1);
 if(G&&!G.over){const pi=G.P.findIndex(p=>p.conn===x.c);if(pi>=0)dropToBot(pi)}
 else if(screen==='sRoom'||screen==='sEnd'){roomBroadcast();if(screen==='sRoom')renderRoom()}}
function refuse(x){Net.send(x.c,{t:'full'});setTimeout(()=>{try{x.c.close()}catch(e){}},300)}
function hostData(x,m){
 if(!m||typeof m!=='object')return;
 if(m.t==='hello'){
  if((G&&!G.over)||screen==='sGame'||x.ready)return refuse(x);
  const cnt=Net.conns.filter(y=>y.ready).length+1;
  if(cnt+R.bots>=8){if(R.bots>0)R.bots--;else return refuse(x)}
  x.name=String(m.name||'Hero').slice(0,12);x.skin=clamp(m.skin|0,0,7);x.rank=clamp(m.rank|0,1,10);
  x.ready=true;Net.conns.push(x);roomBroadcast();renderRoom();return}
 if(!x.ready)return;
 if(m.t==='cmd'&&G&&!G.over){
  const pi=G.P.findIndex(p=>p.conn===x.c);if(pi<0)return;const k=m.k;
  if(k==='b'||k==='t')doCmd(pi,{k,ty:String(m.ty)});else if(k==='u')doCmd(pi,{k,u:String(m.u)});else if(k==='a')doCmd(pi,{k,a:String(m.a)});else if(k==='g')doCmd(pi,{k,g:m.g|0})}}
async function joinRoom(code){
 code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){lobMsg('notFound');return}lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let peer;try{peer=await openPeer()}catch(e){lobMsg('connErr');return}
 Net.peer=peer;Net.role='guest';let opened=false;
 peer.on('error',e=>{if(!opened)lobMsg(e&&e.type==='peer-unavailable'?'notFound':'connErr')});
 const c=peer.connect('ironfront-'+code,{reliable:true});Net.conn=c;
 c.on('open',()=>{opened=true;R.online=true;R.host=false;R.code=code;Net.last=Date.now();
  c.send({t:'hello',name:myName(),skin:prof.skin,rank:rankOf(prof.xp)});
  Net.hb=setInterval(()=>Net.send(c,{t:'ping'}),3000);
  Net.wd=setInterval(()=>{if(Date.now()-Net.last>15000)hostGone()},2000)});
 c.on('data',guestData);c.on('close',()=>{if(opened)hostGone()});c.on('error',()=>{});
 setTimeout(()=>{if(!opened&&Net.peer===peer){lobMsg('notFound');Net.close()}},12000)}
function hostGone(){
 if(!Net.peer)return;Net.close();toast(t('hostLeft'),3000);
 V=null;G=null;if(RN)RN.run=false;R.online=false;R.host=true;show('sMenu')}
$('#bJoin').onclick=()=>{Snd.init();Snd.play('click');joinRoom($('#joinCode').value)};
$('#bCopy').onclick=async()=>{const url=location.origin+location.pathname+'?room='+R.code;try{await navigator.clipboard.writeText(url);toast(t('copied'))}catch(e){$('#roomMsg').textContent=url}};
function guestData(m){
 if(!m||typeof m!=='object')return;Net.last=Date.now();
 switch(m.t){
  case'room':
   R.pl=(m.pl||[]).slice(0,8).map(p=>({n:String(p.n).slice(0,12),s:p.s|0,k:clamp(p.k|0,1,10)}));R.bots=clamp(m.bots|0,0,8);R.diff=clamp(m.diff|0,0,2);R.you=m.you|0;
   if(screen!=='sGame'&&screen!=='sEnd'){renderRoom();show('sRoom')}break;
  case'full':Net.close();lobMsg('full');show('sLobby');break;
  case'start':{
   if(!Number.isInteger(m.n)||m.n<2||m.n>8||!Array.isArray(m.pl)||m.pl.length!==m.n)break;
   if(!initRenderer())break;
   const L=layout(m.n,+m.a0||0);
   V={ents:new Map(),P:m.pl.map((p,i)=>({i,name:String(p.name).slice(0,12),skin:clamp(p.skin|0,0,7),rank:1,alive:true,target:-1,pop:0,money:0,cd:{air:0,rep:0,nuke:0},up:{atk:0,arm:0,eco:0},kills:0})),ore:L.ore,me:clamp(m.you|0,0,m.n-1),t:0,n:m.n,over:false,seen:0};
   G=null;enterGame(L,m.seed|0,V.me);break}
  case's':if(V&&!V.over&&m.p&&m.e&&m.o&&m.f&&!G)applySnap(m);break;
  case'end':if(V&&!V.over&&Array.isArray(m.res))showEnd(m);break;
  case'lobby':if(screen==='sEnd'||screen==='sGame'){V=null;if(RN)RN.run=false;renderRoom();show('sRoom')}break;
  case'err':if(typeof m.k==='string'&&D['e_'+m.k])uiErr(m.k,m.a);break;
  case'bye':hostGone();break}}

/* ================= boot ================= */
R.pl=[{n:myName(),s:prof.skin,k:rankOf(prof.xp)}];
applyLang();
if(typeof THREE==='undefined'){$('#bPlay').disabled=$('#bOnline').disabled=true;$('.sub').textContent='3D engine failed to load — check your connection'}
requestAnimationFrame(frame);
(function(){const q=new URLSearchParams(location.search).get('room');if(q){show('sLobby');$('#joinCode').value=q.toUpperCase().slice(0,5);setTimeout(()=>joinRoom(q),150)}})();
</script>
