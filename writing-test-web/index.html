<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1a1035;
    --night2: #2c1a5a;
    --gold: #f5c542;
    --gold-dark: #b8860b;
    --parch: #f6e7c1;
    --parch-dark: #e3cf9c;
    --ink: #3a2a14;
    --ink-soft: #6b5433;
    --good: #2e8b57;
    --bad: #b5343c;
    --purple: #7b4fd6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: 'Nunito', 'Trebuchet MS', sans-serif;
    font-weight: 500;
    color: var(--ink);
    background:
      radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 9%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 33% 42%, #ffe9a8 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 91% 55%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 58% 28%, #cfc3ff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 6% 72%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 46% 86%, #ffe9a8 50%, transparent 51%),
      linear-gradient(180deg, var(--night) 0%, var(--night2) 60%, #46256f 100%);
    background-attachment: fixed;
  }
  h1, h2, h3, .fancy { font-family: 'MedievalSharp', 'Papyrus', fantasy; font-weight: 400; }
  .hidden { display: none !important; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 12px 16px 40px; }

  /* top bar */
  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    color: #fff; padding: 6px 0 12px;
  }
  .top h1 { font-size: 30px; margin: 0; color: var(--gold); text-shadow: 0 2px 0 #000; flex: 1 1 auto; }
  .pill {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 15px; color: #fff;
  }
  button { font-family: inherit; cursor: pointer; }
  button.pill:hover { background: rgba(255,255,255,.22); }
  .home-link { color: #d9ccff; font-weight: 700; text-decoration: none; font-size: 14px; }

  /* parchment panels */
  .panel {
    background: linear-gradient(180deg, var(--parch), var(--parch-dark));
    border: 3px solid var(--gold-dark); border-radius: 16px;
    box-shadow: 0 8px 0 rgba(0,0,0,.35), inset 0 0 30px rgba(139,101,38,.25);
    padding: 16px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 10px; font-size: 22px; color: #5a3a10; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: -6px 0 10px; }

  .btn {
    border: 2px solid #6b4a12; border-radius: 12px; background: #fff7df; color: var(--ink);
    font-weight: 700; font-size: 16px; padding: 10px 14px; min-height: 44px;
    box-shadow: 0 3px 0 #6b4a12; transition: transform .08s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #6b4a12; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sel { background: var(--gold); border-color: #7a5200; }
  .btn.big {
    width: 100%; font-size: 24px; padding: 14px; background: linear-gradient(180deg, #9a6cf0, #6a3fc4);
    color: #fff; border-color: #2d1463; box-shadow: 0 5px 0 #2d1463;
    font-family: 'MedievalSharp', fantasy; letter-spacing: 1px;
  }
  :focus-visible { outline: 3px solid #3aa0ff; outline-offset: 2px; }

  /* menu */
  .heroes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .hero-card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; }
  .hero-card .em { font-size: 42px; line-height: 1.1; }
  .grades { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .grade-btn { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; }
  .grade-btn small { font-size: 12px; color: var(--ink-soft); font-weight: 700; min-height: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row + .row { margin-top: 12px; }
  .row label.lab { font-weight: 900; min-width: 110px; }
  .shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .shop-item { background: rgba(255,255,255,.45); border: 2px dashed #a98a4b; border-radius: 12px; padding: 10px; }
  .shop-item b { display: block; }
  .shop-item span { font-size: 13px; color: var(--ink-soft); display: block; margin: 2px 0 8px; min-height: 34px; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .badge { border: 2px solid #a98a4b; border-radius: 12px; padding: 8px; background: rgba(255,255,255,.5); font-size: 13px; }
  .badge b { display: block; font-size: 14px; }
  .badge.locked { filter: grayscale(1); opacity: .55; }
  .rankbar { height: 14px; background: #cdb67c; border-radius: 99px; overflow: hidden; border: 2px solid #6b4a12; }
  .rankbar i { display: block; height: 100%; background: linear-gradient(90deg, #7b4fd6, #c59bff); width: 0; }

  /* game */
  .hud { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .timerbar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; margin-bottom: 10px; }
  .timerbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #7ee081, #f5c542); transition: width .1s linear; }
  .timerbar.low i { background: #ff6b6b; }
  .stage {
    position: relative; height: 150px; border-radius: 16px; overflow: hidden; margin-bottom: 12px;
    border: 3px solid #2d1463;
    background: linear-gradient(180deg, #3b2a7a 0%, #6a4bb0 55%, #3f7a45 56%, #2c5a33 100%);
  }
  .stage .moon { position: absolute; top: 10px; left: 50%; font-size: 30px; transform: translateX(-50%); opacity: .9; }
  .fighter { position: absolute; bottom: 14px; text-align: center; color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 2px #000; }
  .fighter .em { font-size: 62px; line-height: 1; display: block; }
  #heroBox { left: 8%; }
  #monBox { right: 8%; }
  #bolt { position: absolute; bottom: 50px; left: 20%; font-size: 34px; opacity: 0; pointer-events: none; }
  #bolt.cast { animation: cast .45s ease-in forwards; }
  @keyframes cast { 0% { left: 20%; opacity: 1; } 100% { left: 74%; opacity: 1; transform: scale(1.5) rotate(360deg); } }
  #monBox.defeated .em { animation: poof .6s ease-in forwards; }
  @keyframes poof { 50% { transform: scale(1.3) rotate(20deg); } 100% { transform: scale(0) rotate(180deg); opacity: 0; } }
  #monBox.escape .em { animation: flee .7s ease-in forwards; }
  @keyframes flee { 30% { transform: translateY(-14px); } 100% { transform: translateX(180px); opacity: 0; } }
  #monBox.enter .em { animation: enter .4s ease-out; }
  @keyframes enter { 0% { transform: translateX(120px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  #heroBox.hop .em { animation: hop .4s; }
  @keyframes hop { 50% { transform: translateY(-16px); } }

  .qtype { display: inline-block; background: #5a3a10; color: #ffe9a8; border-radius: 99px; padding: 3px 12px; font-size: 13px; font-weight: 900; letter-spacing: .5px; }
  .prompt { font-size: 21px; font-weight: 900; margin: 10px 0 6px; line-height: 1.35; }
  .extra { font-size: 17px; margin: 0 0 12px; color: var(--ink-soft); }
  .extra .wrongword {
    display: inline-block; background: #fff; border: 2px dashed var(--bad); border-radius: 10px;
    padding: 4px 12px; color: var(--bad); font-weight: 900; font-size: 22px; margin-top: 6px;
  }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; font-size: 18px; }
  .opt.right { background: #bfeecb; border-color: var(--good); }
  .opt.wrong { background: #f6c1c4; border-color: var(--bad); }
  .opt.gone { visibility: hidden; }
  input.typed, textarea.story {
    width: 100%; font-family: inherit; font-size: 20px; padding: 12px; border-radius: 12px;
    border: 3px solid #6b4a12; background: #fffdf5; color: var(--ink); margin-bottom: 10px;
  }
  textarea.story { min-height: 150px; resize: vertical; font-size: 18px; line-height: 1.5; }
  .checks { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; font-weight: 700; }
  .checks li { color: var(--ink-soft); }
  .checks li.ok { color: var(--good); }
  .bonus span { display: inline-block; background: #fff; border: 2px solid #a98a4b; border-radius: 99px; padding: 2px 10px; margin: 2px 4px 2px 0; font-weight: 700; }
  .bonus span.used { background: #bfeecb; border-color: var(--good); }
  .powers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 2px dashed #a98a4b; }
  .powers .btn { font-size: 14px; padding: 6px 10px; }
  .feedback { border-radius: 12px; padding: 12px; margin-top: 12px; font-weight: 700; font-size: 17px; }
  .feedback.good { background: #d3f3dc; border: 2px solid var(--good); }
  .feedback.bad { background: #fbdcde; border: 2px solid var(--bad); }
  .feedback.info { background: #e6dcff; border: 2px solid var(--purple); }
  .feedback .ans { display: block; font-size: 19px; margin: 4px 0; }
  .feedback .tip { display: block; font-weight: 500; font-size: 15px; margin-top: 4px; }
  .feedback .row { margin-top: 10px; }

  /* results */
  .bigscore { font-size: 54px; color: #5a3a10; margin: 4px 0; text-align: center; }
  .center { text-align: center; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 12px 0; }
  .stats div { background: rgba(255,255,255,.5); border-radius: 12px; padding: 8px; text-align: center; font-size: 13px; font-weight: 700; }
  .stats b { display: block; font-size: 22px; }
  .newbadge { background: #fff3c4; border: 2px solid var(--gold-dark); border-radius: 12px; padding: 8px 12px; margin: 6px 0; font-weight: 700; }
  .linkbtn { background: none; border: none; color: #d9ccff; text-decoration: underline; font-size: 13px; }
  @media (max-width: 520px) {
    .top h1 { font-size: 24px; flex-basis: 100%; }
    .prompt { font-size: 19px; }
    .fighter .em { font-size: 50px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>✒️ Writing Test</h1>
    <span class="pill" id="coinPill">🪙 0</span>
    <span class="pill" id="rankPill">Apprentice Scribe</span>
    <button class="pill" id="sfxBtn" aria-label="Sound effects on or off">🔊</button>
    <button class="pill" id="musBtn" aria-label="Music on or off">🎵</button>
  </div>

  <!-- MENU -->
  <div id="menu">
    <div class="panel">
      <h2>1. Choose your hero</h2>
      <div class="heroes" id="heroes"></div>
    </div>
    <div class="panel">
      <h2>2. Pick your grade</h2>
      <p class="sub">Your best score is saved for every grade.</p>
      <div class="grades" id="grades"></div>
    </div>
    <div class="panel">
      <h2>3. Set up your quest</h2>
      <div class="row">
        <label class="lab">Questions</label>
        <div class="row" id="counts"></div>
      </div>
      <div class="row">
        <label class="lab">Timer</label>
        <button class="btn" id="timerBtn"></button>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn big" id="startBtn">⚔️ Start Quest</button>
      </div>
    </div>
    <div class="panel">
      <h2>🏪 Power-up shop</h2>
      <p class="sub">Spend your gold coins. Each power-up costs 30 🪙.</p>
      <div class="shop" id="shop"></div>
    </div>
    <div class="panel">
      <h2>🏅 Rank &amp; badges</h2>
      <p id="rankText" style="margin:0 0 6px;font-weight:700"></p>
      <div class="rankbar"><i id="rankFill"></i></div>
      <div class="badges" id="badges" style="margin-top:12px"></div>
    </div>
    <div class="center">
      <a class="home-link" href="../index.html">← Back to all games</a> &nbsp;
      <button class="linkbtn" id="resetBtn">Reset my progress</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="hud">
      <span class="pill" id="hudQ"></span>
      <span class="pill" id="hudScore"></span>
      <span class="pill" id="hudStreak"></span>
      <span class="pill" id="hudGrade"></span>
      <button class="pill" id="quitBtn">✖ Quit</button>
    </div>
    <div class="timerbar hidden" id="timerbar"><i id="timerFill"></i></div>
    <div class="stage" aria-hidden="true">
      <div class="moon">🌙</div>
      <div class="fighter" id="heroBox"><span class="em" id="heroEm"></span><span id="heroName"></span></div>
      <div id="bolt">✨</div>
      <div class="fighter" id="monBox"><span class="em" id="monEm"></span><span id="monName"></span></div>
    </div>
    <div class="panel">
      <span class="qtype" id="qtype"></span>
      <p class="prompt" id="prompt"></p>
      <div class="extra" id="extra"></div>
      <div id="answerArea"></div>
      <div id="feedback" aria-live="polite"></div>
      <div class="powers" id="powers"></div>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results" class="hidden">
    <div class="panel">
      <h2 class="center" id="resTitle"></h2>
      <div class="bigscore fancy" id="resScore"></div>
      <p class="center" id="resBest" style="font-weight:700;margin:0"></p>
      <div class="stats" id="resStats"></div>
      <div id="resBadges"></div>
      <p id="resRank" style="font-weight:700"></p>
      <div class="rankbar"><i id="resRankFill"></i></div>
      <div class="row" style="margin-top:16px">
        <button class="btn sel" id="againBtn" style="flex:1">🔁 Play again</button>
        <button class="btn" id="menuBtn" style="flex:1">🏰 Back to menu</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================== QUESTION DATA =====================
   sp: [word, clue, wrong1, wrong2, wrong3]
   gr: [question, right answer, [wrong answers], tip]
   pu: [wrong sentence, correct sentence, tip, [other accepted answers]]
   st: [prompt, [bonus words], sentence starter]                         */
const GRADES = [
{ name: "Prep", target: 5,
  sp: [
    ["cat", "A pet that says meow.", "kat", "cet", "catt"],
    ["dog", "A pet that barks.", "dohg", "dogg", "doog"],
    ["sun", "It shines in the sky.", "sen", "sunn", "zun"],
    ["hat", "You wear it on your head.", "het", "hatt", "haat"],
    ["red", "The colour of a strawberry.", "redd", "wred", "raed"],
    ["big", "Not small.", "bigg", "bihg", "byg"],
    ["mum", "She looks after you.", "mumm", "muhm", "mmu"],
    ["run", "To move fast on your legs.", "runn", "ruhn", "wrun"]],
  gr: [
    ["I ___ a dog.", "have", ["has"], "We say 'I have'."],
    ["The cat ___ big.", "is", ["are"], "One cat 'is'. Two cats 'are'."],
    ["I can ___ fast.", "run", ["runs", "running"], "After 'can' we use the plain word: run."],
    ["She ___ my friend.", "is", ["am", "are"], "We say 'she is'."],
    ["I see two ___.", "cats", ["cat"], "More than one needs an 's'."],
    ["___ am happy.", "I", ["Me", "My"], "We say 'I am'."],
    ["We ___ at school.", "are", ["is", "am"], "We say 'we are'."],
    ["This is ___ apple.", "an", ["a"], "Use 'an' before a, e, i, o, u sounds."]],
  pu: [
    ["i like my dog.", "I like my dog.", "A sentence starts with a capital letter."],
    ["the sun is hot", "The sun is hot.", "Start with a capital and end with a full stop."],
    ["My cat is big", "My cat is big.", "A sentence ends with a full stop."],
    ["Can you run.", "Can you run?", "A question ends with a question mark."],
    ["We play with sam.", "We play with Sam.", "Names start with a capital letter."]],
  st: [
    ["Write about your favourite animal.", ["I", "like", "big", "fun"], "I like..."],
    ["What do you like to eat?", ["yummy", "eat", "like", "food"], "I like to eat..."],
    ["Write about a friendly dragon.", ["dragon", "big", "red", "fly"], "The dragon is..."]]
},
{ name: "Grade 1", target: 8,
  sp: [
    ["they", "A word for a group of people: '___ are my friends.'", "thay", "tehy", "thei"],
    ["said", "'Hello,' ___ the wizard.", "sed", "siad", "sayed"],
    ["play", "What you do with toys and games.", "plai", "pley", "pllay"],
    ["fish", "An animal that swims.", "fich", "fesh", "fissh"],
    ["jump", "To hop up into the air.", "jamp", "jummp", "gump"],
    ["house", "A building you live in.", "howse", "hous", "houze"],
    ["with", "'Come ___ me.'", "wiht", "whith", "wif"],
    ["come", "'Please ___ here.'", "kome", "coem", "comm"]],
  gr: [
    ["The dogs ___ barking.", "are", ["is", "am"], "More than one dog: 'are'."],
    ["He ___ to school every day.", "walks", ["walk", "walking"], "He, she and it add an 's': he walks."],
    ["Yesterday I ___ a cake.", "made", ["maked", "make"], "The past of 'make' is 'made'."],
    ["She gave it to ___.", "me", ["I", "my"], "After 'to' we say 'me'."],
    ["There ___ a frog in the pond.", "is", ["are", "am"], "One frog: 'there is'."],
    ["I ___ eating my lunch.", "am", ["is", "are"], "We say 'I am'."],
    ["Two ___ ran away.", "foxes", ["foxs", "fox"], "Words ending in x add 'es'."],
    ["I have one ___.", "book", ["books", "bookes"], "One thing does not need an 's'."]],
  pu: [
    ["Where is my hat.", "Where is my hat?", "A question ends with a question mark."],
    ["i went to the park.", "I went to the park.", "The word 'I' is always a capital."],
    ["My friend is ben.", "My friend is Ben.", "Names start with a capital letter."],
    ["We love to swim", "We love to swim.", "A sentence ends with a full stop."],
    ["On monday we play.", "On Monday we play.", "Days of the week start with a capital."]],
  st: [
    ["Write about a day at the beach.", ["sand", "swim", "sun", "water"], "At the beach I..."],
    ["Write about a magic pet.", ["magic", "pet", "fly", "friend"], "My magic pet can..."],
    ["What do you do at school?", ["school", "play", "friend", "learn"], "At school I..."]]
},
{ name: "Grade 2", target: 12,
  sp: [
    ["because", "'I am wet ___ it is raining.'", "becuase", "becos", "becauze"],
    ["friend", "Someone you like to play with.", "freind", "frend", "friennd"],
    ["would", "'I ___ like some cake, please.'", "woud", "wuld", "woudl"],
    ["people", "Men, women and children.", "peeple", "poeple", "peopel"],
    ["again", "One more time.", "agen", "agian", "agane"],
    ["school", "Where you go to learn.", "skool", "scool", "shcool"],
    ["night", "When it is dark outside.", "nite", "nihgt", "niht"],
    ["water", "You drink it and swim in it.", "worter", "watter", "wotar"]],
  gr: [
    ["We ___ to the zoo last week.", "went", ["goed", "go"], "The past of 'go' is 'went'."],
    ["She is ___ than her brother.", "taller", ["tallest", "more tall"], "Use '-er' to compare two people."],
    ["The children ___ playing outside.", "were", ["was", "is"], "More than one child: 'were'."],
    ["I saw ___ elephant.", "an", ["a", "and"], "Use 'an' before a vowel sound."],
    ["He ran ___.", "quickly", ["quick", "quicker"], "Words that tell how something is done often end in '-ly'."],
    ["That bag is ___.", "mine", ["my", "me"], "'Mine' shows it belongs to me."],
    ["The bird ___ away when it saw the cat.", "flew", ["flyed", "fly"], "The past of 'fly' is 'flew'."],
    ["I have three ___.", "boxes", ["boxs", "box"], "Words ending in x add 'es'."]],
  pu: [
    ["I like apples bananas and grapes.", "I like apples, bananas and grapes.", "Use commas between things in a list."],
    ["What a big dragon.", "What a big dragon!", "Use an exclamation mark to show surprise."],
    ["my birthday is in june.", "My birthday is in June.", "Months start with a capital letter."],
    ["Do you like ice cream.", "Do you like ice cream?", "A question ends with a question mark."],
    ["we went to sydney on friday.", "We went to Sydney on Friday.", "Places and days start with capitals."]],
  st: [
    ["You find a treasure chest. What is inside?", ["treasure", "gold", "open", "found"], "Inside the chest I found..."],
    ["Write about a wizard's pet.", ["wizard", "magic", "spell", "pet"], "The wizard had a pet..."],
    ["What is your favourite game?", ["game", "play", "fun", "win"], "My favourite game is..."]]
},
{ name: "Grade 3", target: 15,
  sp: [
    ["beautiful", "Very pretty.", "beutiful", "beautifull", "butiful"],
    ["different", "Not the same.", "diffrent", "diferent", "differant"],
    ["favourite", "The one you like best.", "favrite", "favourit", "faverite"],
    ["surprise", "Something you did not expect.", "suprise", "surprize", "serprise"],
    ["caught", "The past of 'catch'.", "cort", "cought", "caugt"],
    ["thought", "The past of 'think'.", "thort", "thougt", "thaught"],
    ["enough", "As much as you need.", "enuff", "enogh", "enouf"],
    ["believe", "To think something is true.", "beleive", "belive", "beleve"]],
  gr: [
    ["___ going to the castle tomorrow.", "They're", ["Their", "There"], "'They're' is short for 'they are'."],
    ["The knight lost ___ sword.", "his", ["he", "him"], "'His' shows the sword belongs to him."],
    ["This is the ___ cake I have ever eaten.", "best", ["goodest", "better"], "Good, better, best."],
    ["She ___ her homework before dinner.", "did", ["done", "doed"], "The past of 'do' is 'did'."],
    ["My sister and I ___ going to the fair.", "are", ["is", "am"], "Two people: 'are'."],
    ["I wore a coat ___ it was cold.", "because", ["so", "but"], "'Because' gives the reason."],
    ["Which word is a noun?", "castle", ["run", "happy", "quickly"], "A noun is a person, place or thing."],

function norm(s) {

  const c = [];
  const add = v => { if (v !== good && !c.includes(v)) c.push(v); };
  const last = good.slice(-1), body = good.slice(0, -1);
  const extras = [];
  if (lowerFirst(good) !== good) extras.push(lowerFirst(good));
  if (/[.?!]/.test(last)) { extras.push(body + (last === "?" ? "." : "?")); extras.push(body); }
  if (good.includes(",")) extras.push(good.replace(/,/g, ""));
  if (/[a-z]'[a-z]/i.test(good)) extras.push(good.replace(/([a-z])'([a-z])/gi, "$1$2"));
  if (good.includes(";")) extras.push(good.replace(/;/g, ","));
  add(bad);
  shuffle(extras).forEach(add);
  return c.slice(0, 3);
}

let S = null;
function buildTest(gi, n) {
  const G = GRADES[gi];
  const nStory = n >= 15 ? 2 : 1;
  const lists = {
    sp: shuffle(G.sp).map(d => ({ type: "sp", d, typed: Math.random() < 0.5 })),
    gr: shuffle(G.gr).map(d => ({ type: "gr", d, typed: false })),
    pu: shuffle(G.pu).map(d => ({ type: "pu", d, typed: gi >= 3 && Math.random() < 0.5 }))
  };
  const qs = [], order = shuffle(["sp", "gr", "pu"]);
  let k = 0;
  while (qs.length < n - nStory) {
    const l = lists[order[k++ % 3]];
    if (l.length) qs.push(l.shift());
    else if (!lists.sp.length && !lists.gr.length && !lists.pu.length) break;
  }
  const stories = shuffle(G.st).slice(0, nStory).map(d => ({ type: "st", d, typed: true }));
  if (nStory === 2) qs.splice(Math.floor(qs.length / 2), 0, stories[1]);
  qs.push(stories[0]);
  return qs;
}

function nextButton(f) {
  const b = el("button", "btn sel", S.i + 1 < S.n ? "Next monster ➜" : "See my results ➜");
  b.id = "nextBtn";
  b.onclick = next;
  const row = el("div", "row"); row.append(b); f.append(row);
  setTimeout(() => b.focus(), 60);
}
function win(btn) {
  const q = S.qs[S.i];
  S.answered = true; stopTimer(); lockInputs();
  S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
  S.correct++; S.stats[q.type][0]++; S.stats[q.type][1]++;
  let pts = 100 + Math.min(S.streak - 1, 5) * 10;
  if (S.timerOn) pts += Math.round(50 * Math.max(0, S.tLeft) / S.tTotal);
  const coins = S.streak >= 3 ? 15 : 10;
  S.score += pts; S.coins += coins; save.monsters++;
  attack(true); sfx("right");
  const f = $("feedback"); f.className = "feedback good"; f.textContent = "";
  f.append(el("span", "", pick(["Correct!", "Brilliant!", "Monster defeated!", "Spot on!", "Magnificent!"]) + "  +" + pts + " points, +" + coins + " 🪙"));
  if (q.type === "pu" && q.typed) f.append(el("span", "ans", q.answer));
  if (q.tip) f.append(el("span", "tip", q.tip));
  nextButton(f); hud(); renderPowers();
}
function lose(timeout, quiet) {
  const q = S.qs[S.i];
  S.answered = true; stopTimer(); lockInputs();
  S.streak = 0; S.stats[q.type][1]++;
  attack(false); if (!quiet) sfx("wrong");
  const f = $("feedback"); f.className = "feedback bad"; f.textContent = "";
  f.append(el("span", "", (timeout ? "⏳ Time's up! " : "Not this time. ") + "The right answer is:"));
  f.append(el("span", "ans", q.answer));
  if (q.tip) f.append(el("span", "tip", q.tip));
  nextButton(f); hud(); renderPowers();
}
function attack(hit) {
  const mb = $("monBox"), hb = $("heroBox"), bolt = $("bolt");
  mb.classList.remove("enter");
  if (hit) {
    hb.classList.remove("hop"); void hb.offsetWidth; hb.classList.add("hop");
    bolt.classList.remove("cast"); void bolt.offsetWidth; bolt.classList.add("cast");
    setTimeout(() => { mb.classList.add("defeated"); bolt.classList.remove("cast"); }, 420);
  } else mb.classList.add("escape");
}
function next() {
  if (!S.answered) return;
  sfx("click");
  S.i++;
  if (S.i >= S.n) finish(); else showQuestion();
}

/* ---------- story writing ---------- */
function storyChecks(q, text) {
  const G = GRADES[S.gi], gi = S.gi, t = text.trim();
  const words = (t.match(/[A-Za-z][A-Za-z'’-]*/g) || []);
  const lower = words.map(w => w.toLowerCase().replace(/’/g, "'"));
  const used = q.d[1].filter(b => lower.includes(b.toLowerCase()));
  const need = gi <= 2 ? 1 : 2;
  const sentences = (t.match(/[^.!?]+[.!?]+/g) || []).length;
  const checks = [
    ["Write at least " + G.target + " words (" + words.length + " so far)", words.length >= G.target],
    ["Start with a capital letter", /^["'“‘(]?[A-Z]/.test(t)],
    ["End with a full stop, ! or ?", /[.!?]["'”’)]?$/.test(t)],
    ["Use " + need + " or more bonus words (" + used.length + " so far)", used.length >= need]
  ];
  if (gi >= 3) { const ns = gi >= 7 ? 3 : 2; checks.push(["Write at least " + ns + " sentences", sentences >= ns]); }
  if (gi >= 5) checks.push(["Use at least one comma", t.includes(",")]);
  if (gi >= 9) checks.push(["Use a linking word (however, although, because...)", lower.some(w => LINKERS.includes(w))]);
  return { checks, used };
}
function storyBox(q) {
  $("prompt").textContent = q.d[0];
  const extra = $("extra"), area = $("answerArea");
  const bonus = el("div", "bonus");
  bonus.append(el("b", "", "Bonus words: "));
  q.d[1].forEach(w => { const s = el("span", "", w); s.dataset.w = w; bonus.append(s); });
  extra.append(bonus);
  const ta = el("textarea", "story");
  ta.id = "storyInput"; ta.placeholder = "Write your story here..."; ta.setAttribute("aria-label", "Write your story");
  const list = el("ul", "checks"); list.id = "storyChecks";
  const b = el("button", "btn sel", "📖 Finish my story");
  b.onclick = () => submitStory(false);
  const update = () => {
    const r = storyChecks(q, ta.value);
    list.textContent = "";
    r.checks.forEach(c => list.append(el("li", c[1] ? "ok" : "", (c[1] ? "✅ " : "⬜ ") + c[0])));
    bonus.querySelectorAll("span").forEach(s => s.classList.toggle("used", r.used.includes(s.dataset.w)));
  };
  ta.addEventListener("input", update);
  area.append(ta, list, b);
  update();
  q.answer = ""; q.tip = ""; q.hint = "Try starting with: " + q.d[2];
  setTimeout(() => ta.focus(), 50);
}
function submitStory(timeout) {
  if (S.answered) return;
  const q = S.qs[S.i], text = $("storyInput").value;
  if (!timeout && !text.trim()) { $("storyInput").focus(); return; }
  const r = storyChecks(q, text);
  const passed = r.checks.filter(c => c[1]).length, total = r.checks.length, ratio = passed / total;
  S.answered = true; stopTimer(); lockInputs();
  const good = ratio >= 0.6;
  S.stats.st[1]++;
  let pts = Math.round(100 * ratio);
  const coins = Math.round(15 * ratio);
  if (good) {
    S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); S.correct++; S.stats.st[0]++; save.monsters++;
    pts += Math.min(S.streak - 1, 5) * 10;
  } else S.streak = 0;
  if (passed === total) S.fullStory = true;
  S.score += pts; S.coins += coins;
  attack(good); sfx(good ? "right" : "wrong");
  const f = $("feedback"); f.className = "feedback " + (good ? "good" : "bad"); f.textContent = "";
  f.append(el("span", "", (timeout ? "⏳ Time's up! " : "") + (passed === total ? "A perfect story! " : good ? "Great writing! " : "Good try! ") +
    "You ticked " + passed + " of " + total + " boxes.  +" + pts + " points, +" + coins + " 🪙"));
  const missed = r.checks.filter(c => !c[1]);
  if (missed.length) f.append(el("span", "tip", "Next time: " + missed.map(c => c[0].replace(/ \(.*\)/, "").toLowerCase()).join("; ") + "."));
  nextButton(f); hud(); renderPowers();
}

/* ---------- power-ups ---------- */
function renderPowers() {
  const p = $("powers"); p.textContent = "";
  const q = S.qs[S.i], live = !S.answered && !S.locked;
  const mk = (pw, enabled, fn) => {
    const b = el("button", "btn", pw.em + " " + pw.name + " × " + save.inv[pw.id]);
    b.disabled = !enabled || save.inv[pw.id] < 1;
    b.onclick = fn; p.append(b);
  };
  mk(POWERS[0], live && !S.hintUsed, () => {
    save.inv.hint--; persist(); S.hintUsed = true; sfx("power");
    const f = $("feedback"); f.className = "feedback info"; f.textContent = "💡 " + q.hint;
    renderPowers();
  });
  const openOpts = [...document.querySelectorAll("#answerArea .opt")].filter(b => !b.classList.contains("gone") && !b.disabled && b.dataset.v !== q.answer);
  mk(POWERS[1], live && !q.typed && openOpts.length >= 2, () => {
    save.inv.fifty--; persist(); sfx("power");
    shuffle(openOpts).slice(0, openOpts.length - 1).forEach(b => { b.classList.add("gone"); b.disabled = true; });
    renderPowers();
  });
  mk(POWERS[2], live, () => {
    save.inv.skip--; persist(); sfx("power");
    S.answered = true; stopTimer(); lockInputs(); S.stats[q.type][1]++;
    $("monBox").classList.add("escape");
    const f = $("feedback"); f.className = "feedback info"; f.textContent = "";
    f.append(el("span", "", "⏭️ Skipped! The monster wandered off."));
    if (q.answer) f.append(el("span", "ans", "Answer: " + q.answer));
    nextButton(f); renderPowers();
  });
  const h = el("span", "pill", "❤️ × " + save.inv.heart);
  h.style.cssText = "background:#fff7df;color:#3a2a14;border-color:#a98a4b";
  h.title = "Extra Hearts are offered when you get an answer wrong.";
  p.append(h);
}

/* ---------- timer ---------- */
function startTimer(secs) {
  stopTimer();
  if (!S.timerOn) return;
  S.tTotal = secs; S.tLeft = secs;
  $("timerbar").classList.remove("low"); $("timerFill").style.width = "100%";
  S.tick = setInterval(() => {
    if (S.locked) return;
    S.tLeft -= 0.1;
    $("timerFill").style.width = Math.max(0, 100 * S.tLeft / S.tTotal) + "%";
    $("timerbar").classList.toggle("low", S.tLeft < S.tTotal * 0.25);
    if (S.tLeft <= 0) { stopTimer(); if (S.qs[S.i].type === "st") submitStory(true); else lose(true); }
  }, 100);
}
function stopTimer() { if (S && S.tick) { clearInterval(S.tick); S.tick = null; } }

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (!S || $("game").classList.contains("hidden")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (!S.answered && !S.locked && /^[1-4]$/.test(e.key)) {
    const b = document.querySelectorAll("#answerArea .opt")[+e.key - 1];
    if (b && !b.disabled) b.click();
  }
});

/* ===================== RESULTS ===================== */
function finish() {
  stopTimer();
  const pct = Math.round(100 * S.correct / S.n);
  const oldRank = rankOf(save.xp);
  save.coins += S.coins; save.coinsEarned += S.coins; save.xp += S.score;
  if (!save.gradesPlayed.includes(S.gi)) save.gradesPlayed.push(S.gi);
  const old = save.best[S.gi];
  const isBest = !old || S.score > old.score;
  if (isBest) save.best[S.gi] = { score: S.score, pct: Math.max(pct, old ? old.pct : 0) };
  else if (pct > old.pct) old.pct = pct;
  const fresh = BADGES.filter(b => !save.badges[b.id] && b.test(S, save));
  fresh.forEach(b => save.badges[b.id] = true);
  persist();
  sfx("win");

  $("resTitle").textContent = pct === 100 ? "👑 Perfect Quest!" : pct >= 70 ? "🎉 Quest Complete!" : "📜 Quest Finished";
  $("resScore").textContent = S.score + " points";
  $("resBest").textContent = isBest ? "⭐ New best score for " + GRADES[S.gi].name + "!" : "Best for " + GRADES[S.gi].name + ": " + save.best[S.gi].score + " points";
  const st = $("resStats"); st.textContent = "";
  const stat = (v, label) => { const d = el("div"); d.append(el("b", "", v), document.createTextNode(label)); st.append(d); };
  stat(S.correct + " / " + S.n, "monsters defeated");
  stat(pct + "%", "correct");
  stat("+" + S.coins + " 🪙", "gold coins");
  stat("🔥 " + S.bestStreak, "best streak");
  [["sp", "spelling"], ["gr", "grammar"], ["pu", "punctuation"], ["st", "story"]].forEach(t => {
    if (S.stats[t[0]][1]) stat(S.stats[t[0]][0] + " / " + S.stats[t[0]][1], t[1]);
  });
  const rb = $("resBadges"); rb.textContent = "";
  fresh.forEach(b => rb.append(el("div", "newbadge", "New badge: " + b.em + " " + b.name + " — " + b.desc)));
  if (rankOf(save.xp) > oldRank) rb.append(el("div", "newbadge", "🏅 Rank up! You are now a " + RANKS[rankOf(save.xp)][1] + "!"));
  rankProgress($("resRank"), $("resRankFill"));
  renderTop();
  show("results");
}

renderMenu();
</script>
