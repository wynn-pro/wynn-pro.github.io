<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Food Fight Heroes</title>
<style>
:root{--bg1:#ffe9b8;--bg2:#ffc57a;--ink:#3a1f0d;--card:#fffaf0;--line:#3a1f0d;--red:#ff4d3d;--green:#2fbf5b;--blue:#2d8cff;--gold:#ffc21a;--purple:#9b5cff;--shadow:0 4px 0 rgba(58,31,13,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:
 repeating-conic-gradient(#ffd89a 0 25%,#ffe9b8 0 50%) 0 0/56px 56px;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;min-height:100%;padding:10px 12px calc(14px + env(safe-area-inset-bottom));position:relative}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.top .l,.top .r{display:flex;gap:6px;align-items:center}
.tbtn{border:3px solid var(--line);background:var(--card);border-radius:12px;padding:5px 10px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:var(--ink);font-size:15px}
.tbtn:active{transform:translateY(3px);box-shadow:none}
select.tbtn{padding:5px 6px}
.screen[hidden]{display:none!important}
h1{margin:4px 0 0;text-align:center;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(30px,8vw,48px);letter-spacing:1px;color:#fff;-webkit-text-stroke:2px var(--line);text-shadow:0 4px 0 var(--line);paint-order:stroke fill}
.sub{text-align:center;font-weight:700;margin:2px 0 8px}
.hero-row{display:flex;justify-content:center;gap:10px;font-size:clamp(44px,12vw,70px);margin:2px 0 6px}
.hero-row span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.hero-row span:nth-child(2n){animation-delay:.3s}.hero-row span:nth-child(3n){animation-delay:.6s}
.coinbar{display:flex;justify-content:center;margin:6px 0}
.coin{background:var(--gold);border:3px solid var(--line);border-radius:999px;padding:4px 16px;font-weight:900;font-size:20px;box-shadow:var(--shadow)}
.panel{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin:10px 0}
.panel h3{margin:0 0 8px}
.menu{display:grid;gap:10px}
.btn{border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:900;font-size:18px;background:var(--blue);color:#fff;box-shadow:var(--shadow);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.gold{background:var(--gold);color:var(--ink);text-shadow:none}.btn.purple{background:var(--purple)}.btn.plain{background:var(--card);color:var(--ink);text-shadow:none}
.btn.sm{padding:6px 10px;font-size:15px;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.diff{display:flex;gap:6px}
.diff button{flex:1;padding:8px 4px;font-size:15px}
.diff button.on{background:var(--gold);color:var(--ink);text-shadow:none;outline:3px solid var(--line)}
.best{text-align:center;font-weight:700;font-size:14px;margin-top:4px}
.howto{font-size:14px;line-height:1.45;font-weight:600}
input[type=text],textarea{border:3px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;width:100%;user-select:text;-webkit-user-select:text}
#joinCode{text-transform:uppercase;letter-spacing:4px;font-weight:900;text-align:center;font-size:20px;flex:1;min-width:0}
.msg{min-height:22px;text-align:center;font-weight:800;margin-top:6px}
.big-code{font-size:42px;font-weight:900;letter-spacing:8px;text-align:center;font-family:Impact,monospace}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:8px 2px;font-size:14px}
.tabs button.on{background:var(--gold);color:var(--ink);text-shadow:none;outline:3px solid var(--line)}
.preview{display:flex;align-items:center;gap:30px;justify-content:center}
.preview .pv{font-size:64px;position:relative;line-height:1}
.preview .pv small{position:absolute;right:-30px;bottom:0;font-size:32px}
.stats{font-weight:800;font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.item.eq{background:#d8ffd0;outline:3px solid var(--green)}
.item .ie{font-size:40px;line-height:1.1}
.item .in{font-weight:800;font-size:14px}
.item .is{font-size:12px;font-weight:700;opacity:.8}
.bhud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bhud .stg{font-weight:900;font-size:18px;background:var(--card);border:3px solid var(--line);border-radius:12px;padding:3px 12px;box-shadow:var(--shadow)}
#arena{position:relative;display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;min-height:300px;margin:8px 0;background:linear-gradient(#bfe8ff 0 38%,#ffd9a0 38% 100%);border:3px solid var(--line);border-radius:18px;padding:10px 4px;box-shadow:var(--shadow);overflow:hidden}
#arena.boss{background:linear-gradient(#ffb0a0 0 38%,#ffcf90 38% 100%)}
#arena.shake{animation:shake .4s}
.side{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}
.vs{font-family:Impact,sans-serif;font-size:20px;text-align:center;color:var(--red);-webkit-text-stroke:1px var(--line)}
.unit{width:100%;max-width:230px;text-align:center;position:relative;padding:2px}
.unit.turn .nm{background:var(--gold)}
.nm{display:inline-block;font-weight:900;font-size:13px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:0 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sprite{position:relative;display:inline-block;font-size:clamp(46px,13vw,72px);line-height:1.15;--dir:1;transition:transform .15s}
.mon .sprite{font-size:clamp(64px,19vw,110px)}
.mon.boss .sprite{font-size:clamp(84px,24vw,140px);filter:drop-shadow(0 0 14px #f00)}
.sprite .em{display:inline-block;animation:bob 1.5s ease-in-out infinite;animation-delay:var(--dl,0s)}
.mon.m1 .em{animation-name:wobble}.mon.m2 .em{animation-name:hop}.mon.m3 .em{animation-name:squish}
.sprite .pet{position:absolute;left:-.55em;bottom:0;font-size:.42em;animation:hop .9s infinite}
.sprite .st{position:absolute;right:-.25em;top:-.1em;font-size:.34em}
.unit.atk .sprite{animation:lunge .4s}
.unit.hit .sprite{animation:ouch .4s}
.unit.pet .pet{animation:petgo .45s}
.unit.faint .sprite{transform:rotate(80deg) scale(.7);opacity:.35;filter:grayscale(1)}
.unit.faint .em{animation:none}
.bar{height:12px;background:#fff;border:2px solid var(--line);border-radius:8px;overflow:hidden;position:relative;margin:3px auto 0;width:92%}
.bar i{display:block;height:100%;background:var(--green);transition:width .35s}
.bar.hp.low i{background:var(--red)}
.bar b{position:absolute;inset:0;font-size:9px;line-height:9px;font-weight:900;text-align:center}
.bar.ult{height:8px}.bar.ult i{background:var(--purple)}
.bar.ult.full i{animation:pulse .6s infinite alternate;background:var(--gold)}
.mp{font-size:11px;letter-spacing:1px;min-height:13px}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;font-weight:900;font-size:26px;color:#fff;-webkit-text-stroke:2px var(--line);paint-order:stroke fill;animation:floatUp 1s ease-out forwards;white-space:nowrap}
.float.crit{font-size:34px;color:var(--gold)}.float.heal{color:#7dff8f}
.part{position:absolute;font-size:22px;animation:part .8s ease-out forwards}
#logBox{min-height:62px;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:6px 10px;font-weight:700;font-size:14px;line-height:1.35;box-shadow:var(--shadow)}
#logBox div{opacity:.7}#logBox div:last-child{opacity:1;font-weight:900}
#turnTxt{text-align:center;font-weight:900;margin:8px 0 6px;font-size:17px;min-height:24px}
#acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#acts .btn{padding:8px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;border-radius:14px}
#acts .btn .ic{font-size:26px;text-shadow:none}
#acts .btn small{font-size:10px;opacity:.9;font-weight:800}
@media(max-width:420px){#acts{grid-template-columns:repeat(3,1fr)}}
#overlay{position:fixed;inset:0;background:rgba(40,20,5,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#overlay[hidden]{display:none}
#overlay .box{background:var(--card);border:4px solid var(--line);border-radius:22px;padding:18px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow)}
#overlay h2{margin:0 0 6px;font-family:Impact,sans-serif;font-size:30px}
#overlay .em{font-size:60px}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:Impact,sans-serif;font-size:clamp(34px,10vw,64px);color:#fff;-webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:0 6px 0 var(--line);pointer-events:none;z-index:30;opacity:0}
#banner.on{animation:banner 1.8s ease-out forwards}
#wheel{font-size:60px;margin:10px 0;min-height:76px;font-weight:900}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes wobble{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-14px) scaleY(1.08)}60%{transform:translateY(0) scaleY(.88)}}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.88)}}
@keyframes lunge{40%{transform:translateX(calc(var(--dir)*36px)) scale(1.15)}}
@keyframes ouch{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-8deg);filter:brightness(2) sepia(1) hue-rotate(-30deg) saturate(6)}60%{transform:translateX(10px) rotate(6deg)}}
@keyframes petgo{40%{transform:translateX(calc(var(--dir)*60px)) scale(1.4)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}
@keyframes floatUp{from{transform:translateY(0) scale(.7);opacity:1}to{transform:translateY(-64px) scale(1.1);opacity:0}}
@keyframes part{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4);opacity:0}}
@keyframes pulse{to{filter:brightness(1.4)}}
@keyframes banner{0%{opacity:0;transform:scale(2.4)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
@media(prefers-reduced-motion:reduce){.sprite .em,.hero-row span,.sprite .pet{animation:none!important}}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div class="l"><a class="tbtn" href="../index.html" title="Home">🏠</a></div>
  <div class="r"><select id="selLang" class="tbtn" aria-label="Language"></select><button class="tbtn" id="bMusic">🎵</button><button class="tbtn" id="bSnd">🔊</button></div>
 </div>

 <section id="sMenu" class="screen">
  <h1>Food Fight Heroes</h1>
  <div class="sub" data-i="tag"></div>
  <div class="hero-row"><span>🧑‍🍳</span><span>⚔️</span><span>🍕</span><span>🥦</span><span>🍔</span></div>
  <div class="coinbar"><div class="coin">🪙 <span id="coinMenu">0</span></div></div>
  <div class="panel">
   <div class="diff" id="diffRow"></div>
   <div class="best" id="bestTxt"></div>
  </div>
  <div class="menu">
   <button class="btn red" id="bSolo" data-i="solo"></button>
   <button class="btn green" id="bCoop" data-i="coop"></button>
   <button class="btn purple" id="bPvp" data-i="pvp"></button>
   <button class="btn gold" id="bShop" data-i="shop"></button>
   <div class="row">
    <button class="btn plain" style="flex:1" id="bSpin"></button>
    <button class="btn plain" style="flex:1" id="bSave" data-i="save"></button>
   </div>
  </div>
  <div class="panel howto"><b data-i="howT"></b><br><span data-i="howX"></span></div>
 </section>

 <section id="sLobby" class="screen" hidden>
  <h1 id="lobTitle"></h1>
  <div class="panel" id="lobHome">
   <div class="menu">
    <button class="btn green" id="bCreate" data-i="create"></button>
    <div class="row" style="flex-wrap:nowrap"><input type="text" id="joinCode" maxlength="5" data-ph="codePh" autocomplete="off"><button class="btn" id="bJoin" data-i="join"></button></div>
   </div>
  </div>
  <div class="panel" id="lobWait" hidden>
   <div class="sub" data-i="roomCode"></div>
   <div class="big-code" id="roomCode">-----</div>
   <div class="menu"><button class="btn gold" id="bCopy" data-i="copyLink"></button></div>
  </div>
  <div class="msg" id="lobMsg"></div>
  <div class="menu"><button class="btn plain" id="bLobBack" data-i="back"></button></div>
 </section>

 <section id="sShop" class="screen" hidden>
  <h1 data-i="shop"></h1>
  <div class="coinbar"><div class="coin">🪙 <span id="coinShop">0</span></div></div>
  <div class="panel preview"><div class="pv"><span id="pvHero">🧑‍🍳</span><small id="pvPet"></small></div><div class="stats" id="pvStats"></div></div>
  <div class="tabs" id="shopTabs"></div>
  <div class="grid" id="shopGrid"></div>
  <div class="menu" style="margin-top:12px"><button class="btn plain" id="bShopBack" data-i="back"></button></div>
 </section>

 <section id="sBattle" class="screen" hidden>
  <div class="bhud"><button class="tbtn" id="bQuit">✖</button><div class="stg" id="stageTxt"></div><div class="coin" style="font-size:16px;padding:2px 12px">🪙 <span id="coinHud">0</span></div></div>
  <div id="arena"><div class="side" id="sideL"></div><div class="vs">VS</div><div class="side" id="sideR"></div><div id="fx"></div></div>
  <div id="logBox"></div>
  <div id="turnTxt"></div>
  <div id="acts"></div>
 </section>
</div>

<div id="overlay" hidden><div class="box" id="ovBox"></div></div>
<div id="banner"></div>

<script>

a_atk:['Attack','โจมตี','攻击','攻撃'],a_def:['Defend','ป้องกัน','防御','防御'],a_heal:['Heal','รักษา','治疗','回復'],a_buff:['Power-up','เพิ่มพลัง','强化','パワーアップ'],a_ult:['ULTIMATE','ท่าไม้ตาย','必杀技','必殺技'],

 d.c=clamp(Math.floor(Number(j.c))||0,0,999999);

 noise(d,v){if(this.mute||!this.ctx)return;try{const c=this.ctx,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),g=c.createGain();g.gain.value=v||.15;s.buffer=b;s.connect(g);g.connect(c.destination);s.start()}catch(e){}},
 play(n){if(this.mute||!this.ctx)return;switch(n){
  case'click':this.tone(520,.07,'square',.05);break;
  case'hit':this.noise(.12,.18);this.tone(220,.12,'square',.08,0,80);break;
  case'crit':this.noise(.2,.25);this.tone(400,.2,'sawtooth',.09,0,90);break;
  case'splat':this.noise(.25,.22);this.tone(160,.25,'sine',.12,0,60);break;
  case'boing':this.tone(200,.25,'sine',.12,0,700);break;
  case'heal':[523,659,784].forEach((f,i)=>this.tone(f,.12,'triangle',.08,i*.08));break;
  case'guard':this.tone(300,.1,'square',.07);this.tone(200,.15,'square',.07,.08);break;
  case'buff':this.tone(300,.3,'sawtooth',.07,0,900);break;

  case'down':this.tone(400,.5,'triangle',.1,0,60);break;

  case'lose':[392,330,262,196].forEach((f,i)=>this.tone(f,.28,'triangle',.09,i*.2));break;

 startMusic(){if(this.tm||!this.ctx)return;const bass=[110,110,165,110,147,147,196,147],mel=[440,523,659,523,587,698,880,698];

/* ================= battle logic (host / solo authoritative) ================= */
let S=null,V=null,myId=0,online=false,monT=0,earnedStage=0;
const foeOf=u=>S.mode==='pvp'?S.units[1-u.id]:S.units[S.units.length-1];
function mkHero(id,team,lo){const s=stats(lo);return{id,team,hero:1,hp:s.hp,max:s.hp,atk:s.atk,def:s.def,pet:s.pet,lo,mp:3,ult:0,guard:0,buff:0,emoji:ITEMS.s[lo.s].e,petE:ITEMS.p[lo.p].e}}
function mkMonster(id,stage,diff,nh,boss,final){
 let hp=(40+stage*22)*({easy:.7,medium:1,hard:1.4}[diff])*(nh>1?1.7:1),atk=(6+stage*2.2)*({easy:.8,medium:1,hard:1.25}[diff]),kind='r';
 if(final){hp*=2.6;atk*=1.4;kind='f'}else if(boss){hp*=2;atk*=1.3;kind='b'}
 const mi=rand(MONS[kind].length);hp=Math.round(hp);
 return{id,team:1,hero:0,hp,max:hp,atk:Math.round(atk*10)/10,def:Math.round(stage*.5),pet:0,mp:0,ult:0,guard:0,buff:0,kind,mi,boss:kind!=='r'?1:0,v:rand(4)}}
function beginBattle(mode,diff,loA,loB){
 clearTimeout(monT);Q=[];animating=false;
 S={mode,diff,stage:1,phase:'play',turn:0,units:[],res:'',winner:-1,ready:[false,false]};
 S.units.push(mkHero(0,0,loA));
 if(mode==='pvp'){S.units.push(mkHero(1,1,loB))}
 else{if(loB)S.units.push(mkHero(1,0,loB));S.units.push(mkMonster(S.units.length,1,diff,S.units.filter(x=>x.hero).length,false,false))}
 myId=0;online=!!loB;V=null;
 S.turn=0;startTurn(S.units[0]);
 enterBattle();publish([{k:'banner',key:mode==='pvp'?'pvpT':'go'}])}
function startStage(){
 S.stage++;const hs=S.units.filter(x=>x.hero);
 hs.forEach(h=>{if(h.lo){const s=stats(h.lo),old=h.max;h.max=s.hp;h.atk=s.atk;h.def=s.def;h.pet=s.pet;h.hp=Math.min(h.max,h.hp+Math.max(0,h.max-old));h.emoji=ITEMS.s[h.lo.s].e;h.petE=ITEMS.p[h.lo.p].e}h.guard=0;h.buff=0});
 const final=S.stage>=MAXST,boss=!final&&S.stage>=3&&Math.random()<.3;
 S.units=hs.concat([mkMonster(hs.length,S.stage,S.diff,hs.length,boss,final)]);
 S.phase='play';S.ready=[false,false];S.turn=hs.findIndex(h=>h.hp>0);startTurn(S.units[S.turn]);
 publish([{k:'banner',key:final?'finalB':boss?'bossEv':'go',boss:final||boss?1:0}])}
function startTurn(u){if(u.hero){u.guard=0;u.mp=Math.min(10,u.mp+1);if(u.buff>0)u.buff--}}
function nextTurn(){let n=S.turn;for(let i=0;i<S.units.length;i++){n=(n+1)%S.units.length;if(S.units[n].hp>0){S.turn=n;startTurn(S.units[n]);return}}}
function calc(a,d,mult,pierce){const x=a.atk*(a.buff>0?1.5:1)*mult;let n=Math.round(x*(.85+Math.random()*.3));if(!pierce)n-=d.def;if(d.guard)n=Math.round(n/2);return Math.max(1,n)}
function hurt(f,to,d,EV,kind){to.hp=Math.max(0,to.hp-d);if(f.hero)f.ult=Math.min(100,f.ult+12);if(to.hero)to.ult=Math.min(100,to.ult+10);
 EV.push({k:'hit',f:f.id,to:to.id,d,hp:to.hp,kind});if(to.hp<=0)EV.push({k:'down',u:to.id})}
function checkEnd(EV){
 if(S.mode==='pvp'){const d=S.units.find(x=>x.hp<=0);if(d){S.phase='end';S.res='pvp';S.winner=1-d.id;EV.push({k:'reward',n:60,to:1-d.id},{k:'reward',n:15,to:d.id});return true}return false}
 const mon=S.units[S.units.length-1],hs=S.units.filter(x=>x.hero);
 if(mon.hp<=0){stageWin(EV,mon);return true}
 if(hs.every(h=>h.hp<=0)){S.phase='end';S.res='fail';return true}
 return false}
function stageWin(EV,mon){
 const m={easy:1,medium:1.5,hard:2}[S.diff];
 EV.push({k:'reward',n:Math.round((15+8*S.stage)*m*(mon.boss?2:1)),stage:S.stage,diff:S.diff});
 if(S.stage>=MAXST){EV.push({k:'reward',n:Math.round(100*m)});S.phase='end';S.res='clear'}
 else{S.phase='inter';S.ready=[false,false];S.units.filter(x=>x.hero).forEach(h=>{h.hp=h.hp<=0?Math.ceil(h.max*.3):Math.min(h.max,h.hp+Math.ceil(h.max*.5));h.guard=0;h.buff=0})}}
function hostAct(uid,a){
 if(!S||S.phase!=='play'||S.turn!==uid)return;const u=S.units[uid];if(!u||!u.hero||u.hp<=0)return;
 if(!['atk','def','heal','buff','ult'].includes(a))return;
 if((a==='heal'&&u.mp<3)||(a==='buff'&&u.mp<2)||(a==='ult'&&u.ult<100))return;
 const EV=[],f=foeOf(u);
 if(a==='atk'||a==='ult'){let mult=1,pierce=false,kind='atk';
  if(a==='ult'){mult=3;pierce=true;kind='ult';u.ult=0}else if(Math.random()<.12){mult=1.5;kind='crit'}
  hurt(u,f,calc(u,f,mult,pierce),EV,kind)}
 else if(a==='def'){u.guard=1;EV.push({k:'guard',u:uid})}
 else if(a==='heal'){u.mp-=3;const h=Math.min(u.max-u.hp,Math.ceil(u.max*.35));u.hp+=h;EV.push({k:'heal',u:uid,n:h,hp:u.hp})}
 else if(a==='buff'){u.mp-=2;u.buff=4;EV.push({k:'buff',u:uid})}
 if(f.hp>0&&u.pet>0){const d=Math.max(1,Math.round(u.pet*(.8+Math.random()*.4))-Math.floor(f.def/2));hurt(u,f,d,EV,'pet')}
 if(!checkEnd(EV))nextTurn();publish(EV)}
function monsterAct(){
 if(!S||S.phase!=='play')return;const m=S.units[S.turn];if(!m||m.hero||m.hp<=0)return;
 const EV=[],hs=S.units.filter(x=>x.hero&&x.hp>0),r=Math.random();
 if(m.boss&&r<.25)hs.forEach(h=>hurt(m,h,calc(m,h,.8),EV,'splat'));
 else{const h=hs[rand(hs.length)],heavy=Math.random()<.3;hurt(m,h,calc(m,h,heavy?1.5:1),EV,heavy?'heavy':'atk')}
 if(!checkEnd(EV))nextTurn();publish(EV)}
function hostReady(id,lo){
 if(!S||S.phase!=='inter'||!S.units[id]||!S.units[id].hero)return;
 if(lo)S.units[id].lo=lo;S.ready[id]=true;
 if(S.units.filter(x=>x.hero).every(h=>S.ready[h.id]))startStage();else publish([])}
function publish(EV){
 const snap=clone(S);pushBatch({S:snap,ev:EV});
 if(online)Net.send({t:'st',S:snap,ev:EV});
 clearTimeout(monT);
 if(S.phase==='play'&&!S.units[S.turn].hero)monT=setTimeout(monsterAct,EV.length*DL+900)}

function setHp(id,hp,max){const el=uEl(id);if(!el)return;const u=V&&V.units[id];max=max||(u&&u.max)||1;const p=clamp(hp/max,0,1);el.querySelector('.hp i').style.width=(p*100)+'%';el.querySelector('.hp b').textContent=Math.max(0,Math.round(hp))+'/'+max;el.querySelector('.hp').classList.toggle('low',p<.3)}

const FOOD=['🍕','🍟','🍔','🍩','🥦','🧀','🍅','💥','✨'];
function doEv(e,s){
 const U=id=>s.units[id];
 switch(e.k){
 case'hit':{const f=U(e.f),to=U(e.to);flash(e.f,e.kind==='pet'?'pet':'atk',480);
  flash(e.to,'hit',420);setHp(e.to,e.hp,to&&to.max);floatAt(e.to,'-'+Number(e.d),e.kind==='crit'||e.kind==='ult'?'crit':'');
  burst(e.to,e.kind==='ult'?['💥','⭐','✨','🔥']:FOOD,e.kind==='ult'?10:5);
  Snd.play(e.kind==='ult'?'ult':e.kind==='crit'?'crit':e.kind==='splat'?'splat':e.kind==='pet'?'boing':'hit');
  if(e.kind==='ult'||e.kind==='crit'||e.kind==='heavy'||e.d>=(to?to.max*.25:99))shakeArena();
  const key={atk:'l_atk',crit:'l_crit',heavy:'l_heavy',splat:'l_splat',ult:'l_ult',pet:'l_pet'}[e.kind]||'l_atk';
  addLog(t(key,{a:uname(f,s),b:uname(to,s),n:Number(e.d)}));break}
 case'heal':setHp(e.u,e.hp,U(e.u)&&U(e.u).max);floatAt(e.u,'+'+Number(e.n),'heal');burst(e.u,['💚','✨'],5);Snd.play('heal');addLog(t('l_heal',{a:uname(U(e.u),s),n:Number(e.n)}));break;
 case'guard':floatAt(e.u,'🛡️');Snd.play('guard');addLog(t('l_def',{a:uname(U(e.u),s)}));break;
 case'buff':floatAt(e.u,'💪');burst(e.u,['⚡','🔥'],5);Snd.play('buff');addLog(t('l_buff',{a:uname(U(e.u),s)}));break;
 case'down':{const el=uEl(e.u);if(el)el.classList.add('faint');Snd.play('down');addLog(t('l_down',{a:uname(U(e.u),s)}));break}
 case'reward':{if(e.to!==undefined&&e.to!==myId)break;const n=clamp(Math.floor(Number(e.n))||0,0,2000);SV.c+=n;earnedStage+=n;
  if(e.stage&&['easy','medium','hard'].includes(e.diff))SV.best[e.diff]=Math.max(SV.best[e.diff],clamp(Math.floor(Number(e.stage))||0,0,MAXST));
  persist();$('#coinHud').textContent=SV.c;Snd.play('coin');addLog(t('l_coin',{n}));break}
 case'banner':earnedStage=0;banner(t(e.key));Snd.play(e.boss?'boss':'click');if(e.boss)shakeArena();break}}

 if(!peer){lobMsg('connErr');return}
 Net.peer=peer;Net.role='host';$('#roomCode').textContent=code;$('#lobHome').hidden=true;$('#lobWait').hidden=false;lobMsg('waitGuest');
 peer.on('connection',c=>{if(Net.conn){c.close();return}Net.conn=c;const go=()=>{wire(c);startWatch()};if(c.open)go();else c.on('open',go)});
 peer.on('error',()=>{if(!Net.conn)lobMsg('connErr')})}
async function joinRoom(code){code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){lobMsg('notFound');return}lobMsg('connecting');
 try{await loadPeer()}catch(e){lobMsg('loadErr');return}
 let peer;try{peer=await openPeer()}catch(e){lobMsg('connErr');return}
 Net.peer=peer;Net.role='guest';let opened=false;
 peer.on('error',e=>{if(!opened)lobMsg(e&&e.type==='peer-unavailable'?'notFound':'connErr')});
 const c=peer.connect('ffheroes-'+code,{reliable:true});Net.conn=c;
 c.on('open',()=>{opened=true;wire(c);startWatch();c.send({t:'hello',lo:myLo()});lobMsg('waitGuest')});
 setTimeout(()=>{if(!opened&&Net.peer===peer){lobMsg('notFound');Net.close()}},12000)}
$('#bCreate').onclick=()=>{Snd.play('click');hostRoom()};
$('#bJoin').onclick=()=>{Snd.play('click');joinRoom($('#joinCode').value)};
$('#bCopy').onclick=async()=>{const url=location.origin+location.pathname+'?room='+$('#roomCode').textContent;try{await navigator.clipboard.writeText(url);lobMsg('copied')}catch(e){$('#lobMsg').textContent=url}};
function wire(c){c.on('data',onData);c.on('close',()=>{if(Net.conn===c)friendGone()});c.on('error',()=>{})}
function startWatch(){Net.last=Date.now();clearInterval(Net.hb);clearInterval(Net.wd);
 Net.hb=setInterval(()=>Net.send({t:'ping'}),4000);Net.wd=setInterval(()=>{if(online&&Date.now()-Net.last>16000)friendGone()},2000)}
function friendGone(){if(!Net.role)return;const inB=screen==='sBattle'&&V&&V.phase!=='end';leaveBattle();
 if(inB)modal('<h2>'+t('left')+'</h2><button class="btn plain" id="mClose">'+t('close')+'</button>',b=>b.querySelector('#mClose').onclick=closeModal)}
function onData(m){if(!m||typeof m!=='object')return;Net.last=Date.now();
 switch(m.t){
  case'hello':if(Net.role==='host'&&!S){const lo=cleanLo(m.lo);if(lo)beginBattle(lobMode,SV.diff,myLo(),lo)}break;
  case'st':if(Net.role==='guest'&&m.S&&Array.isArray(m.S.units)&&m.S.units.length&&Array.isArray(m.ev)){
    if(!online||screen!=='sBattle'){online=true;myId=1;V=null;Q=[];animating=false;enterBattle()}
    pushBatch({S:m.S,ev:m.ev.slice(0,40)})}break;
  case'act':if(Net.role==='host'&&S)hostAct(1,m.a);break;
  case'ready':if(Net.role==='host'&&S){const lo=cleanLo(m.lo);if(lo)hostReady(1,lo)}break;
  case'bye':friendGone();break}}
window.addEventListener('pagehide',()=>Net.close());

/* ================= init ================= */
function applyLang(){document.documentElement.lang=LANGS[LI];$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 renderMenu();if(screen==='sShop')renderShop();if(screen==='sBattle'&&V){domSig='';render()}if(screen==='sLobby')$('#lobTitle').textContent=lobName()}
$('#selLang').innerHTML=LNAME.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');$('#selLang').value=LI;
$('#selLang').onchange=e=>{LI=+e.target.value;LS.set('ffh_lang',LANGS[LI]);applyLang()};
syncSnd();applyLang();
(function(){const q=new URLSearchParams(location.search).get('room');if(q){lobMode='coop';openLobby();$('#joinCode').value=q.toUpperCase().slice(0,5);joinRoom(q)}})();
</script>
